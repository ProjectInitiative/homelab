apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-hdd
provisioner: rancher.io/local-path
parameters:
  nodePath: "/mnt/local-provisioner/hdd"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-hdd-sticky
provisioner: rancher.io/local-path
parameters:
  nodePath: "/mnt/local-provisioner/hdd"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
# Provisioner v0.0.31 supports online expansion; needed for in-place PVC
# size bumps (garage snapshots 20Gi -> 300Gi, 2026-11-11).
allowVolumeExpansion: true
