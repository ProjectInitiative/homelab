apiVersion: batch/v1
kind: Job
metadata:
  name: juicefs-format
  namespace: juicefs-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  # Retry indefinitely through transient metadata/backend failures. The Job
  # still never formats unless status explicitly reports an unformatted DB.
  # Kubernetes applies its normal capped exponential backoff between retries.
  backoffLimit: 2147483647
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: juicefs-format
          image: juicedata/juicefs-csi-driver:v0.31.9
          command:
            - /bin/sh
            - -c
            - |
              # Only format when the metadata engine explicitly reports that
              # the filesystem is unformatted. A metadata timeout or outage
              # must never be treated as an unformatted filesystem.
              if status_output=$(juicefs status "$metaurl" 2>&1); then
                echo "JuiceFS filesystem '$name' is already formatted."
                exit 0
              fi
              if ! printf '%s\n' "$status_output" | grep -qi 'database is not formatted'; then
                echo "JuiceFS metadata status failed; refusing to format '$name'."
                printf '%s\n' "$status_output"
                exit 1
              fi

              echo "Formatting JuiceFS filesystem '$name'..."
              
              # Construct format command
              CMD="juicefs format --storage $storage --bucket $bucket --access-key $access_key --secret-key $secret_key"
              
              if [ -f "/etc/juicefs/private.pem" ]; then
                echo "Using RSA Key for encryption."
                CMD="$CMD --encrypt-rsa-key /etc/juicefs/private.pem"
              elif [ -n "$passphrase" ]; then
                 # Fallback to symmetric if no key file but passphrase exists
                 echo "Using passphrase for encryption (symmetric)."
                 echo "$passphrase" | $CMD --encrypt-key "$metaurl" "$name"
                 exit $?
              fi
              
              # Execute format
              $CMD "$metaurl" "$name"
          volumeMounts:
            - name: rsa-key
              mountPath: "/etc/juicefs"
              readOnly: true
          env:
            - name: JFS_RSA_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: passphrase
                  optional: true
            - name: passphrase
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: passphrase
                  optional: true
            - name: storage
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: storage
            - name: bucket
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: bucket
            - name: access_key
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: access-key
            - name: secret_key
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: secret-key
            - name: metaurl
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: metaurl
            - name: name
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds
                  key: name
      volumes:
        - name: rsa-key
          secret:
            secretName: juicefs-key
            optional: true
            items:
              - key: cert
                path: private.pem
