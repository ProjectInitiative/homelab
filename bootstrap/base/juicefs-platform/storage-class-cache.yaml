apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs-cache-sc
  # Ephemeral-cache tier: subdirs of the `juicefs-mc-cache` JuiceFS volume,
  # whose object storage is garage bucket `juicefs-mc-cache` — separate from
  # the backed-up `juicefs-mc` bucket. Metadata lives in its own postgres DB
  # `juicefs_cache` (same cnpg cluster) so the volumes are fully independent.
provisioner: csi.juicefs.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  # Global secret in juicefs-platform (created alongside
  # bootstrap/base/juicefs-platform/job-format-cache.yaml; NOT in git —
  # same handling as juicefs-creds).
  csi.storage.k8s.io/provisioner-secret-name: juicefs-creds-cache
  csi.storage.k8s.io/provisioner-secret-namespace: juicefs-platform
  csi.storage.k8s.io/node-publish-secret-name: juicefs-creds-cache
  csi.storage.k8s.io/node-publish-secret-namespace: juicefs-platform
  csi.storage.k8s.io/controller-expand-secret-name: juicefs-creds-cache
  csi.storage.k8s.io/controller-expand-secret-namespace: juicefs-platform
