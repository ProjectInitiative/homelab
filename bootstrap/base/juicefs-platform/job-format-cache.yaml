apiVersion: batch/v1
kind: Job
metadata:
  name: juicefs-format-cache
  namespace: juicefs-platform
  labels:
    app.kubernetes.io/part-of: juicefs-platform
    purpose: one-off
spec:
  # Same guardrails as juicefs-format: never treat a metadata outage as an
  # unformatted database.
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: arm64
      # arm64 nodes (the DGX Sparks) carry the dgx-spark-dedicated taint;
      # without this toleration the format pod pends forever.
      tolerations:
        - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: juicefs-format
          # Native arm64 gcache image (has juicefs + bash); pinned digest.
          image: local-registry.registry.svc.cluster.local:5000/homelab/juicefs-gcache-csi:gcache-strict-sharding-arm64@sha256:be6ece264ef6c40e7a8e69e6323df95bc5ba92ac0b9e0522679e858b8cff3440
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Only format when the metadata engine explicitly reports that
              # the filesystem is unformatted. A metadata timeout or outage
              # must never be treated as an unformatted filesystem.
              if status_output=$(juicefs status "$metaurl" 2>&1); then
                echo "JuiceFS filesystem '$name' is already formatted."
                exit 0
              fi
              if ! printf '%s\n' "$status_output" | grep -qi 'database is not formatted'; then
                echo "JuiceFS metadata status failed; refusing to format '$name'."
                printf '%s\n' "$status_output"
                exit 1
              fi

              # FAIL CLOSED ON ENCRYPTION (RISK-0045 lesson): JuiceFS CE has no
              # symmetric encryption — only --encrypt-rsa-key with a
              # PASSPHRASE-PROTECTED pem. A missing pem, an unencrypted pem, or
              # a missing/wrong passphrase must abort the format, never fall
              # through to an unencrypted filesystem (the encryption choice is
              # permanent for the volume's life).
              if [ ! -f /etc/juicefs/private.pem ]; then
                echo "REFUSING to format: RSA pem record (juicefs-key-cache) not mounted." >&2
                exit 1
              fi
              if ! grep -q "ENCRYPTED" /etc/juicefs/private.pem; then
                echo "REFUSING to format: pem is NOT passphrase-protected (no ENCRYPTED header)." >&2
                exit 1
              fi
              if [ -z "${passphrase:-}" ]; then
                echo "REFUSING to format: passphrase key missing from config record." >&2
                exit 1
              fi
              # Prove the passphrase actually unwraps the pem BEFORE formatting:
              if ! openssl rsa -in /etc/juicefs/private.pem -passin "pass:$passphrase" -noout -check >/dev/null 2>&1; then
                echo "REFUSING to format: passphrase does not decrypt the pem." >&2
                exit 1
              fi

              echo "Formatting JuiceFS filesystem '$name' (RSA-encrypted, passphrase-protected pem)..."
              juicefs format \
                --storage "$storage" \
                --bucket "$bucket" \
                --access-key "$access_key" \
                --secret-key "$secret_key" \
                --encrypt-rsa-key /etc/juicefs/private.pem \
                "$metaurl" "$name"
          volumeMounts:
            - name: rsa-key
              mountPath: /etc/juicefs
              readOnly: true
          env:
            # Unwraps the pem at format time; every mount also needs it (CSI
            # passes it as JFS_RSA_PASSPHRASE from the same secret).
            - name: JFS_RSA_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: passphrase
            - name: passphrase
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: passphrase
            - name: storage
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: storage
            - name: bucket
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: bucket
            - name: access_key
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: access-key
            - name: secret_key
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: secret-key
            - name: metaurl
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: metaurl
            - name: name
              valueFrom:
                secretKeyRef:
                  name: juicefs-creds-cache
                  key: name
      volumes:
        - name: rsa-key
          secret:
            secretName: juicefs-key-cache
            # NOT optional: a missing pem record must fail the pod (and the
            # format), not silently produce an unencrypted filesystem.
            items:
              - key: cert
                path: private.pem
