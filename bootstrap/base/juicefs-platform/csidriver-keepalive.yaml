# RISK-0039 keepalive: the CSIDriver object was deleted from the cluster
# (~2026-10-29 21:00, Argo migration window) and nothing re-created it for
# 22h+ because kubelet gives ZERO signal until a NEW pod tries to mount a
# JuiceFS PVC — then it hangs forever in ContainerCreating waiting for a
# VolumeAttachment that the (attacher-less) JuiceFS CSI controller will
# never complete. Existing mounts keep working, so the breakage is silent.
#
# This CronJob re-applies the CSIDriver every 5 minutes. That heals BOTH
# failure modes: deletion, and field drift (e.g. attachRequired flipped
# back to true by a chart upgrade or a stray hand edit). Idempotent, cheap,
# read-mostly. Delete this file if/when a better owner for the object
# (helm chart vs static manifest) is settled — but keep exactly ONE
# declarative owner either way.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csidriver-keepalive
  namespace: juicefs-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: juicefs-csidriver-keepalive
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    resourceNames: ["csi.juicefs.com"]
    verbs: ["get", "patch", "update"]
  # create cannot be constrained by resourceNames
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: juicefs-csidriver-keepalive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: juicefs-csidriver-keepalive
subjects:
  - kind: ServiceAccount
    name: csidriver-keepalive
    namespace: juicefs-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csidriver-keepalive
  namespace: juicefs-platform
data:
  csidriver.yaml: |
    apiVersion: storage.k8s.io/v1
    kind: CSIDriver
    metadata:
      name: csi.juicefs.com
    spec:
      attachRequired: false
      podInfoOnMount: true
  restore.sh: |
    #!/bin/sh
    set -eu
    # Unconditional apply: restores a deleted driver AND heals spec drift.
    kubectl apply -f /manifests/csidriver.yaml
    kubectl get csidriver csi.juicefs.com -o jsonpath='{.spec.attachRequired}{"\n"}'
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: csidriver-keepalive
  namespace: juicefs-platform
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: csidriver-keepalive
        spec:
          serviceAccountName: csidriver-keepalive
          restartPolicy: Never
          containers:
            - name: restore
              image: registry.k8s.io/kubectl:v1.31.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/restore.sh"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: manifests
                  mountPath: /manifests
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: manifests
              configMap:
                name: csidriver-keepalive
                items:
                  - key: csidriver.yaml
                    path: csidriver.yaml
            - name: scripts
              configMap:
                name: csidriver-keepalive
                items:
                  - key: restore.sh
                    path: restore.sh
                    defaultMode: 0555
