---
apiVersion: v1
kind: ConfigMap
metadata:
  name: juicefs-csi-node-config
  labels:
    app.kubernetes.io/component: juicefs-csi-driver
data:
  config.yaml: |
    # These settings are applied to JuiceFS mount pods, rather than to the
    # application pods.  Keep the StorageClass selector on every rule so a
    # different filesystem cannot accidentally inherit node-specific cache settings.
    mountPodPatch:
      # Default: local cache for JuiceFS volumes.
      - pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=102400
          - prefetch=8
          - max-readahead=256M
          - buffer-size=1G
          - max-downloads=200
          - cache-eviction=lru

      # Astrolabe has a larger local cache on its NVMe volume.
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: astrolabe
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=1500000
          - prefetch=8
          - max-readahead=256M
          - buffer-size=1G
          - max-downloads=200
          - cache-eviction=lru

      # Chronometer and Sextant each use an independent local cache of the
      # shared JuiceFS volume. Keep the cache sizes identical for comparison.
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: chronometer
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=550000
          - prefetch=8
          - max-readahead=256M
          - buffer-size=1G
          - max-downloads=200
          - cache-eviction=lru

      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: sextant
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=550000
          - prefetch=8
          - max-readahead=256M
          - buffer-size=1G
          - max-downloads=200
          - cache-eviction=lru

      # Staged distributed cache ring for the labeled model-cache PVC. The
      # separate directory preserves the existing local cache for rollback.
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: chronometer
        pvcSelector:
          matchLabels:
            juicefs-cache-group: dgx-model-cache
        ceMountImage: local-registry.registry.svc.cluster.local:5000/homelab/juicefs-gcache-csi:1a429a0-arm64@sha256:5d1538c57d2d883a0e1aad8a4ef18da6d38ddd5b895a5dbfafec98e6113b6cdd
        mountOptions:
          - cache-dir=/mnt/pool/juicefs-ring
          - cache-size=550000
          - cache-group=dgx-model-cache
          - group-listen=:3910
          - group-advertise=172.16.5.55:3910;172.16.6.55:3910;172.16.7.55:3910;172.16.8.55:3910
          - group-weight=1
          - prefetch=8
          - max-readahead=256M
          - buffer-size=1G
          - max-downloads=200
          - cache-eviction=lru
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: sextant
        pvcSelector:
          matchLabels:
            juicefs-cache-group: dgx-model-cache
        ceMountImage: local-registry.registry.svc.cluster.local:5000/homelab/juicefs-gcache-csi:1a429a0-arm64@sha256:5d1538c57d2d883a0e1aad8a4ef18da6d38ddd5b895a5dbfafec98e6113b6cdd
        mountOptions:
          - cache-dir=/mnt/pool/juicefs-ring
          - cache-size=550000
          - cache-group=dgx-model-cache
          - group-listen=:3910
          - group-advertise=172.16.5.56:3910;172.16.6.56:3910;172.16.9.56:3910;172.16.10.56:3910
          - group-weight=1
          - prefetch=8
          - max-readahead=256M
          - buffer-size=1G
          - max-downloads=200
          - cache-eviction=lru
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: octant
        pvcSelector:
          matchLabels:
            juicefs-cache-group: dgx-model-cache
        ceMountImage: local-registry.registry.svc.cluster.local:5000/homelab/juicefs-gcache-csi:1a429a0-arm64@sha256:5d1538c57d2d883a0e1aad8a4ef18da6d38ddd5b895a5dbfafec98e6113b6cdd
        mountOptions:
          - cache-dir=/mnt/pool/juicefs-ring
          - cache-size=550000
          - cache-group=dgx-model-cache
          - group-listen=:3910
          - group-advertise=172.16.7.57:3910;172.16.8.57:3910;172.16.9.57:3910;172.16.10.57:3910
          - group-weight=1
          - prefetch=8
          - max-readahead=256M
          - buffer-size=1G
          - max-downloads=200
          - cache-eviction=lru
