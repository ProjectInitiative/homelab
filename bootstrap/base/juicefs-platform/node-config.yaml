---
apiVersion: v1
kind: ConfigMap
metadata:
  name: juicefs-csi-node-config
  labels:
    app.kubernetes.io/component: juicefs-csi-driver
data:
  config.yaml: |
    # These settings are applied to JuiceFS mount pods, rather than to the
    # application pods.  Keep the StorageClass selector on every rule so a
    # different filesystem cannot accidentally join the cache group.
    mountPodPatch:
      # Default: local cache on nodes that are not part of a cache group.
      - pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=102400

      # Astrolabe has no fast east-west network, so don't make it a member of
      # the DGX cache group.  Its 1.5 TB NVMe cache remains entirely local.
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: astrolabe
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=1500000

      # Chronometer and Sextant share a distributed cache over the ConnectX
      # fabric.  Both nodes intentionally use the same cache size: JuiceFS'
      # consistent-hash ring assumes homogeneous cache members.
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: chronometer
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=102400
          - cache-group=dgx-spark
          # Add the ConnectX subnet/prefix here once it is known, e.g.
          # - group-ip=10.6.0.0

      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: sextant
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=102400
          - cache-group=dgx-spark
          # Add the ConnectX subnet/prefix here once it is known, e.g.
          # - group-ip=10.6.0.0
