---
apiVersion: v1
kind: ConfigMap
metadata:
  name: juicefs-csi-node-config
  labels:
    app.kubernetes.io/component: juicefs-csi-driver
data:
  config.yaml: |
    # These settings are applied to JuiceFS mount pods, rather than to the
    # application pods.  Keep the StorageClass selector on every rule so a
    # different filesystem cannot accidentally inherit node-specific cache settings.
    mountPodPatch:
      # Default: local cache for JuiceFS volumes.
      - pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=102400

      # Astrolabe has a larger local cache on its NVMe volume.
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: astrolabe
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=1500000

      # Chronometer and Sextant each use an independent local cache of the
      # shared JuiceFS volume. Keep the cache sizes identical for comparison.
      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: chronometer
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=550000

      - nodeSelector:
          matchLabels:
            kubernetes.io/hostname: sextant
        pvcSelector:
          matchStorageClassName: juicefs-sc
        mountOptions:
          - cache-dir=/mnt/pool/juicefs
          - cache-size=550000
