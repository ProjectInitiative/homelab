# Declarative CNPG Database for the dev JuiceFS metadata engine.
# Separate database in the existing postgres-cluster, owned by the dedicated
# dev_juicefs_user role (dev-juicefs-role.yaml, password via OpenBao
# k8s/dev-juicefs/config -> dev-juicefs-postgres-creds). The dev JuiceFS
# filesystem uses this DB as its metadata engine and a separate Garage bucket
# (see docs/dev-juicefs.md for the OpenBao record and manual format steps).
#
# NOTE: CNPG declarative Database CRs require the operator to be >= 1.25.0.
# If the operator is older, comment this out like the ai-juicefs example and
# create the DB manually via `psql -c 'CREATE DATABASE ...'` on the cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dev-juicefs
  namespace: postgres-db
spec:
  cluster:
    name: postgres-cluster
  name: dev-juicefs
  owner: dev_juicefs_user
