apiVersion: batch/v1
kind: Job
metadata:
  name: rdma-fabric-smoke
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rdma-fabric-smoke
spec:
  suspend: true
  completions: 3
  parallelism: 3
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rdma-fabric-smoke
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia-rdma
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rdma-fabric-smoke
      containers:
        - name: validate
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ceu]
          args:
            - |
              inventory=/var/lib/dgx-spark/rdma-fabric.json
              test -s "$inventory"
              grep -q '"schemaVersion":1' "$inventory"
              grep -q '"fabric":"dgx-spark-direct-roce"' "$inventory"
              grep -q '"nodeName":"'"$NODE_NAME"'"' "$inventory"
              test "$(grep -o '"peerNode"' "$inventory" | wc -l)" -eq 4
              test -e /dev/nvidiactl
              test -e /dev/nvidia0
              test -d /dev/infiniband
              test -n "$(find /dev/infiniband -name 'uverbs*' -print -quit)"

              control_if=$(sed -n 's/.*"controlPlane":{"address":"[^"]*","interface":"\([^"]*\)"}.*/\1/p' "$inventory")
              control_ip=$(sed -n 's/.*"controlPlane":{"address":"\([^"]*\)","interface":"[^"]*"}.*/\1/p' "$inventory")
              test -n "$control_if"
              test -n "$control_ip"
              ip -4 addr show dev "$control_if" | grep -q "$control_ip/"

              sed 's/},{/}\n{/g' "$inventory" | while read -r record; do
                case "$record" in
                  *'"peerNode"'*) ;;
                  *) continue ;;
                esac
                link_id=$(printf '%s\n' "$record" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
                iface=$(printf '%s\n' "$record" | sed -n 's/.*"interface":"\([^"]*\)".*/\1/p')
                address=$(printf '%s\n' "$record" | sed -n 's/.*"address":"\([^"]*\)".*/\1/p')
                peer=$(printf '%s\n' "$record" | sed -n 's/.*"peerAddress":"\([^"]*\)".*/\1/p')
                test -n "$link_id"
                test -n "$iface"
                test "$(cat "/sys/class/net/$iface/mtu")" -eq 9000
                test "$(cat "/sys/class/net/$iface/operstate")" = up
                test -n "$(find "/sys/class/net/$iface/device/infiniband" -mindepth 1 -maxdepth 1 -print -quit)"
                ip -4 addr show dev "$iface" | grep -q "${address%/*}/"
                ip neigh show to "$peer" dev "$iface" | grep -qi permanent
                printf 'validated %s via %s to %s\n' "$link_id" "$iface" "$peer"
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              nvidia.com/gpu: 1
              rdma/hca_shared_devices: 1
          volumeMounts:
            - name: fabric-inventory
              mountPath: /var/lib/dgx-spark/rdma-fabric.json
              readOnly: true
      volumes:
        - name: fabric-inventory
          hostPath:
            path: /var/lib/dgx-spark/rdma-fabric.json
            type: File
