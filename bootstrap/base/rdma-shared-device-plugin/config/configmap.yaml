apiVersion: v1
kind: ConfigMap
metadata:
  name: rdma-devices
  namespace: kube-system
data:
  config.json: |
    {
      "periodicUpdateInterval": 60,
      "configList": [
        {
          "resourceName": "hca_shared_devices",
          "resourcePrefix": "rdma",
          "rdmaHcaMax": 1,
          "selectors": {
            "vendors": ["15b3"],
            "drivers": ["mlx5_core"],
            "linkTypes": ["ether"]
          }
        }
      ]
    }
