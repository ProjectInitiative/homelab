---
# OpenBao restore drill — proves the S3 snapshots are actually restorable.
# Monthly CronJob: spins up a throwaway single-node instance, downloads the
# latest snapshot from the openbao-snapshots bucket, restores it, and waits
# for TWO manual verification steps (seal key placement + recovery-share
# generate-root). See docs/openbao-restore-drill.md for the runbook.
#
# The drill uses NO TPM and NO production seal secret — it tests that the
# key material in Bitwarden is sufficient for full recovery on commodity
# hardware, which is the actual disaster scenario.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-restore-drill-script
  namespace: openbao
data:
  drill.sh: |
    #!/bin/sh
    # OpenBao restore drill controller.
    # Stage A (manual): place the production seal key from Bitwarden.
    # Stage B (auto):   init throwaway -> download latest snapshot -> restore -> restart -> unseal.
    # Stage C (manual): mint root with recovery shares, read a secret, clean up.
    set -eu

    DRILL=/drill
    SEAL_KEY_FILE=/tmp/bao_seal_key   # same path the production seal-config uses
    BAO_ADDR=http://127.0.0.1:8200
    export BAO_ADDR
    S3_HOST="garage.garage.svc.cluster.local.:3900"   # trailing dot is load-bearing
    S3_BUCKET="openbao-snapshots"
    S3ARGS="--host=$S3_HOST --host-bucket= --no-ssl --config=/dev/null --access_key=$AWS_ACCESS_KEY_ID --secret_key=$AWS_SECRET_ACCESS_KEY"

    log() { echo "[drill $(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }

    mkdir -p "$DRILL/raft"

    cat > "$DRILL/config.hcl" <<EOF
    ui = false
    listener "tcp" {
      address         = "127.0.0.1:8200"
      cluster_address = "127.0.0.1:8201"
      tls_disable     = true
    }
    cluster_addr = "http://127.0.0.1:8201"
    api_addr      = "http://127.0.0.1:8200"
    storage "raft" {
      path    = "$DRILL/raft"
      node_id = "drill-1"
    }
    seal "static" {
      current_key_id = "tpm-seal-key-1"
      current_key    = "file://$SEAL_KEY_FILE"
    }
    EOF

    log "================================================================"
    log "STAGE A (MANUAL): place the production SEAL KEY from Bitwarden."
    log "  kubectl --context mc -n openbao exec -it $HOSTNAME -- sh"
    log "  then: printf '%s' '<seal-key-value>' > /tmp/bao_seal_key"
    log "Waiting for the key file (job deadline: 48h)..."
    log "================================================================"
    while [ ! -s "$SEAL_KEY_FILE" ]; do sleep 10; done
    log "seal key present ($(wc -c < "$SEAL_KEY_FILE") bytes)"

    log "starting drill server (single-node raft, static seal)..."
    bao server -config="$DRILL/config.hcl" >> "$DRILL/server.log" 2>&1 &
    BAO_PID=$!

    until bao status 2>&1 | grep -q "Seal Type"; do sleep 2; done
    log "server API is up"

    log "initializing throwaway state (recovery shares are DRILL-ONLY, do not save)"
    if ! bao operator init -recovery-shares=5 -recovery-threshold=3 > "$DRILL/init.txt" 2>&1; then
      log "INIT FAILED:"; cat "$DRILL/init.txt"; exit 1
    fi
    until bao status 2>&1 | grep -q "Sealed                   false"; do sleep 2; done
    log "drill server initialized and unsealed"

    log "authenticating restore with the throwaway initial root token"
    BAO_TOKEN=$(sed -n 's/^Initial Root Token: //p' "$DRILL/init.txt")
    [ -n "$BAO_TOKEN" ] || { log "ERROR: could not parse Initial Root Token from init.txt"; exit 1; }
    export BAO_TOKEN

    log "STAGE B: fetching latest snapshot from s3://$S3_BUCKET/"
    LATEST=$(s3cmd $S3ARGS ls "s3://$S3_BUCKET/" | awk '{print $4}' | sort | tail -1)
    [ -n "$LATEST" ] || { log "ERROR: bucket empty"; exit 1; }
    log "latest: $LATEST"
    s3cmd $S3ARGS get "$LATEST" "$DRILL/snapshot.bin" --force

    log "restoring snapshot into the drill server..."
    bao operator raft snapshot restore "$DRILL/snapshot.bin"

    log "restarting drill server to adopt the restored state..."
    kill "$BAO_PID" 2>/dev/null || true
    wait "$BAO_PID" 2>/dev/null || true
    bao server -config="$DRILL/config.hcl" >> "$DRILL/server.log" 2>&1 &
    BAO_PID=$!

    for i in $(seq 1 60); do
      if bao status 2>&1 | grep -q "Sealed                   false"; then
        log "================================================================"
        log "RESTORED CLUSTER IS UNSEALED — snapshot is valid and restorable."
        log "================================================================"
        break
      fi
      sleep 5
      [ "$i" = "60" ] && { log "ERROR: server did not come up unsealed after restore — check $DRILL/server.log"; exit 1; }
    done

    log "================================================================"
    log "STAGE C (MANUAL): verify content + recovery shares."
    log "  kubectl --context mc -n openbao exec -it $HOSTNAME -- sh"
    log "  then run the one-shot helper (prompts for 3 recovery shares):"
    log "     sh /drill-script/stage-c.sh"
    log "  it mints a root token from the shares, proves content with"
    log "  'bao kv get -mount=k8s garage/rpc', and revokes the token."
    log "Full runbook: docs/openbao-restore-drill.md"
    log "Parking until the job deadline (48h) — the pod is safe to delete anytime."
    log "================================================================"
    sleep 2147483647
  stage-c.sh: |
    #!/bin/sh
    # Stage C helper — one-shot recovery-share verification.
    # Prompts for 3 recovery shares, mints a root token on the
    # RESTORED drill cluster, proves content, revokes the token.
    # Cancels any stale root-generation attempt before starting.
    set -eu
    export BAO_ADDR=http://127.0.0.1:8200
    unset BAO_TOKEN || true

    # preflight: restored drill server must be reachable and unsealed
    bao status 2>&1 | grep -q "Sealed                   false" \
      || { echo "ERROR: drill server not reachable/unsealed at $BAO_ADDR"; exit 1; }

    # cancel any previous generate-root attempt (idempotent, harmless if none)
    echo "==> cancelling any stale root-generation attempt"
    bao operator generate-root -cancel >/dev/null 2>&1 || true

    get_share() {
      printf 'Paste recovery share %s: ' "$1" >&2
      IFS= read -r S
      [ -n "$S" ] || { echo "ERROR: empty share" >&2; exit 1; }
      printf '%s' "$S"
    }

    S1=$(get_share 1)
    S2=$(get_share 2)
    S3=$(get_share 3)

    echo "==> generating OTP"
    OTTP=$(bao operator generate-root -generate-otp | awk '{print $NF}')
    [ -n "$OTTP" ] || { echo "ERROR: could not parse OTP"; exit 1; }

    echo "==> initializing root generation"
    INIT=$(bao operator generate-root -init -otp="$OTTP")
    echo "$INIT"
    NONCE=$(printf '%s\n' "$INIT" | grep -i '^nonce' | awk '{print $NF}')
    [ -n "$NONCE" ] || { echo "ERROR: could not parse nonce — run: bao operator generate-root -cancel, then retry"; exit 1; }

    ENCODED=""
    i=1
    for SHARE in "$S1" "$S2" "$S3"; do
      echo "==> submitting share $i/3"
      OUT=$(printf '%s' "$SHARE" | bao operator generate-root -otp="$OTTP" -nonce="$NONCE" - 2>&1) \
        || { echo "$OUT"; echo "ERROR: share $i rejected"; exit 1; }
      echo "$OUT"
      E=$(printf '%s\n' "$OUT" | grep -i 'encoded' | awk '{print $NF}')
      [ -n "$E" ] && ENCODED=$E
      i=$((i+1))
    done
    [ -n "$ENCODED" ] || { echo "ERROR: no encoded root token after 3 shares"; exit 1; }

    echo "==> decoding root token"
    ROOT=$(bao operator generate-root -decode="$ENCODED" -otp="$OTTP" | grep -i '^root token' | awk '{print $NF}')
    [ -n "$ROOT" ] || { echo "ERROR: could not parse decoded root token"; exit 1; }

    echo ""
    echo "================================================================"
    echo "PROOF: reading garage/rpc from the RESTORED cluster"
    echo "================================================================"
    if BAO_TOKEN="$ROOT" bao kv get -mount=k8s garage/rpc; then
      RESULT="PASS"
    else
      echo "!! kv get failed — the token works but that path may not exist; try others manually:"
      echo "   export BAO_TOKEN=$ROOT"
      RESULT="CHECK"
    fi

    echo "==> revoking the drill root token"
    BAO_TOKEN="$ROOT" bao token revoke -self || true
    echo ""
    echo "Stage C complete: $RESULT"
    echo "Cleanup: kubectl --context mc -n openbao delete job openbao-restore-drill-manual"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-restore-drill
  namespace: openbao
spec:
  # Monthly, 06:00 UTC on the 1st — after that morning's 00:00 snapshot run,
  # so the drill always grabs a fresh snapshot.
  schedule: "0 6 1 * *"
  concurrencyPolicy: Forbid
  # 48h to complete both manual stages; then the pod is killed and the next
  # monthly run starts clean.
  activeDeadlineSeconds: 172800
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: openbao-restore-drill
        spec:
          restartPolicy: Never
          containers:
            - name: drill
              image: ghcr.io/openbao/openbao-snapshot-agent:0.3.0
              command: ["sh", "/drill-script/drill.sh"]
              envFrom:
                - secretRef:
                    name: openbao-snapshot-s3
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: script
                  mountPath: /drill-script
                - name: workdir
                  mountPath: /drill
          volumes:
            - name: script
              configMap:
                name: openbao-restore-drill-script
            - name: workdir
              emptyDir:
                sizeLimit: 2Gi
