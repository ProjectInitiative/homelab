---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
    imagePullPolicy: IfNotPresent
  # Keep KubeVirt control-plane and virt-handler components off the arm64
  # DGX Spark pool. KubeVirt remains available on amd64 nodes.
  infra:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
