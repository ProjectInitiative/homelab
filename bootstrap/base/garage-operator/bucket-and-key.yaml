# Bucket + scoped S3 key. Secret `s3-uploader` will contain:
#   access-key-id, secret-access-key, endpoint, host, scheme, region
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: media
  namespace: garage
spec:
  clusterRef:
    name: existing-garage
  globalAlias: media
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: s3-uploader
  namespace: garage
spec:
  clusterRef:
    name: existing-garage
  name: media uploader
  bucketPermissions:
    - bucketRef:
        name: media
      read: true
      write: true
      owner: false
