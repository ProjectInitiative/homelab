apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-lite
  namespace: argo-lite
  labels:
    app: argo-lite
spec:
  # Single writer by design: the home PVC holds a live workspace; Recreate
  # mirrors the forgejo pattern and avoids two pods on the same files.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: argo-lite
  template:
    metadata:
      labels:
        app: argo-lite
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # x86_64 image + nodes are the intended home; the arm64 nodes (octant,
      # sextant, chronometer — DGX Sparks + RockPi) are not tainted today, so
      # pin explicitly via nodeSelector. Also avoids the node-octant registry
      # gap (no insecure-mirror for the nodeport endpoint).
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        # PVC files are owned by uid 1000 (kylepzak) — matches the image user
        # and the astrolabe-side FUSE mount ownership.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Dev container: sshd PID1 on :2222, baked home-manager terminal
        # profile (see dotfiles containers/argo-lite).
        - name: argo-lite
          # In-cluster registry DNS (not the NodePort 172.16.1.50:31872): node
          # octant lacks the insecure-registry mirror config for the nodeport
          # endpoint (TLS handshake timeout on pull); every node reaches the
          # ClusterIP endpoint — proven by the gcache/tensorfold pods.
          image: local-registry.registry.svc.cluster.local:5000/argo-lite:latest
          imagePullPolicy: Always
          ports:
            - name: ssh
              containerPort: 2222
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: home
              mountPath: /home/kylepzak
              # Mount the kylepzak/ subtree, not the FS root — the root is
              # littered with JuiceFS internals (.config-as-file, .stats,
              # .accesslog, .trash) that shadow the seeded HM config.
              subPath: kylepzak
            # Consumer of the shared emptyDir: HostToContainer picks up the
            # FUSE mount the sidecar performs (Bidirectional is on the
            # sidecar's own mount of the same volume).
            - name: jfs-shared
              mountPath: /mnt/jfsdev
              mountPropagation: HostToContainer
        # JuiceFS sidecar: mounts the juicefs-dev filesystem out-of-band (same
        # FS the dev node/laptop mount via FUSE), exposing a shared subtree to
        # both containers. Image matches the CSI mount pods (ce-v1.4.1) so
        # metadata/cache formats agree.
        # Security: privileged IS required here — verified 2026-11-12: juicefs
        # calls mount(2) directly (no fusermount path in the binary), which
        # needs CAP_SYS_ADMIN (PSA privileged level), and Bidirectional mount
        # propagation itself is privileged-only. Scoped: no SA token (pod-level
        # automountServiceAccountToken: false), resource-capped.
        # Creds come from the VSS-synced juicefs-dev-creds secret
        # (k8s/juicefs-dev/config record; passphrase included).
        - name: juicefs-dev
          image: juicedata/mount:ce-v1.4.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /mnt/jfsdev/dev
              chown 1000:100 /mnt/jfsdev/dev || true
              # S3 creds via env: juicefs 1.4.x dropped --access-key/--secret-key
              # flags on `mount` (same pattern as the CSI mount pods).
              exec juicefs mount "${METAURL}" /mnt/jfsdev
          env:
            - name: METAURL
              valueFrom:
                secretKeyRef:
                  name: juicefs-dev-creds
                  key: metaurl
            # JuiceFS reads S3 creds from the standard env names
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: juicefs-dev-creds
                  key: access-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: juicefs-dev-creds
                  key: secret-key
            - name: JFS_RSA_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: juicefs-dev-creds
                  key: passphrase
                  optional: true
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: jfs-shared
              mountPath: /mnt/jfsdev
              # mountPropagation so the FUSE mount is visible in the shared
              # volume for the app container (Bidirectional on the sidecar,
              # HostToContainer on the consumer).
              mountPropagation: Bidirectional
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: argo-lite-home
        - name: jfs-shared
          emptyDir: {}
