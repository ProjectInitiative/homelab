# Dev StorageClass pointing at the juicefs-dev creds secret (same key schema
# as juicefs-creds). Lives in the argo-lite app so the dev FS only becomes
# cluster-consumable when this lands; see homelab docs/juicefs-dev.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs-dev-sc
provisioner: csi.juicefs.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-dev-creds
  csi.storage.k8s.io/provisioner-secret-namespace: argo-lite
  csi.storage.k8s.io/node-publish-secret-name: juicefs-dev-creds
  csi.storage.k8s.io/node-publish-secret-namespace: argo-lite
  csi.storage.k8s.io/controller-expand-secret-name: juicefs-dev-creds
  csi.storage.k8s.io/controller-expand-secret-namespace: argo-lite
mountOptions:
  - debug
