# Tailscale LB placeholder (forgejo pattern): renamed per-cluster in
# clusters/mc.yaml. Exposes the container's sshd (:2222) over the tailnet.
apiVersion: v1
kind: Service
metadata:
  name: argo-lite-ts-placeholder
  namespace: argo-lite
  labels:
    app: argo-lite
  annotations:
    tailscale.com/proxy-group: mc-ingress-proxy
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: ssh
      protocol: TCP
      port: 2222
      targetPort: ssh
  selector:
    app: argo-lite
