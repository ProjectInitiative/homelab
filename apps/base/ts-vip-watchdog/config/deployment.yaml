apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-vip-watchdog
  namespace: tailscale
  labels:
    app: ts-vip-watchdog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ts-vip-watchdog
  template:
    metadata:
      labels:
        app: ts-vip-watchdog
      annotations:
        watchdog-config-sha256: b1f04bdeea98bec770de4d8ca66bc20be47d2de8099c92715fb18ae3cc2c6730
    spec:
      serviceAccountName: ts-vip-watchdog
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: true
      containers:
        - name: watchdog
          # Pin this image by digest before promoting beyond the dev branch.
          image: python:3.12-alpine
          command: ["python3", "/opt/watchdog/watchdog.py"]
          env:
            - name: TAILSCALE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: operator-oauth
                  key: client_id
            - name: TAILSCALE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: operator-oauth
                  key: client_secret
            - name: TAILNET
              value: "-"
            - name: FAILURES_BEFORE_REPAIR
              value: "3"
            - name: RESTART_GRACE
              value: "180"
            - name: COOLDOWN
              value: "1800"
            - name: INTERVAL
              value: "30"
          volumeMounts:
            - name: watchdog
              mountPath: /opt/watchdog
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: watchdog
          configMap:
            name: ts-vip-watchdog
            defaultMode: 0555
