apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-vip-watchdog
  namespace: tailscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-vip-watchdog-proxy
  namespace: tailscale
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["mc-ingress-proxy"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-vip-watchdog-proxy
  namespace: tailscale
subjects:
  - kind: ServiceAccount
    name: mcp-vip-watchdog
    namespace: tailscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-vip-watchdog-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-vip-watchdog-backends
  namespace: mcp-system
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-vip-watchdog-backends
  namespace: mcp-system
subjects:
  - kind: ServiceAccount
    name: mcp-vip-watchdog
    namespace: tailscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-vip-watchdog-backends
