apiVersion: v1
kind: Service
metadata:
  name: ts
  namespace: openbao
  annotations:
    tailscale.com/proxy-group: ingress-proxy
spec:
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8200
  type: LoadBalancer
  loadBalancerClass: tailscale
