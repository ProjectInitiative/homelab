# Tailnet exposure, mirroring the mcp-kubernetes / hermes-memory pattern:
# placeholder name renamed per-cluster (hermes-lb-mc) via cluster patches.
# 8642 = gateway OpenAI-compatible API server + health endpoint.
apiVersion: v1
kind: Service
metadata:
  name: hermes-ts-placeholder
  namespace: hermes
  labels:
    app: hermes-agent
  annotations:
    tailscale.com/proxy-group: ingress-proxy
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: api
      protocol: TCP
      port: 80
      targetPort: 8642
  sessionAffinity: ClientIP
  selector:
    app: hermes-agent
