# Full pinned upstream snapshot download. Start only after the amd64 puller
# image build succeeds and this manifest is updated to its verified digest.
apiVersion: batch/v1
kind: Job
metadata:
  # Distinct from the active out-of-band downloader in llm-test.
  name: campfire-kimi-k31-download-staged
  namespace: llm-test
  labels:
    app.kubernetes.io/part-of: campfire-kimi-k31
    app.kubernetes.io/component: model-download
spec:
  suspend: true
  completions: 1
  parallelism: 1
  backoffLimit: 5
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: campfire-kimi-k31
        app.kubernetes.io/component: model-download
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      priorityClassName: campfire-volunteer
      nodeSelector:
        kubernetes.io/hostname: capstan1
        kubernetes.io/arch: amd64
      containers:
        - name: puller
          # Replace with verified amd64 @sha256 digest before unsuspending.
          image: local-registry.registry.svc.cluster.local:5000/homelab/campfire-model-cache-puller:amd64-82857b1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              root=/models/.cache/huggingface/hub/models--moonshotai--Kimi-K3.1-Pro
              snap="$root/snapshots/80aff651e9b2d2f5b9f70f92a0a7a77054418e16"
              marker=/models/.campfire-kimi-k31.complete
              rm -f "$marker"
              python3 /opt/puller/puller.py
              test -s "$snap/config.json"
              test -s "$snap/model.safetensors.index.json"
              actual_id=$(cat "$snap/config.json" "$snap/model.safetensors.index.json" | sha256sum | awk '{print $1}')
              test "$actual_id" = fd60deec1f24953995872744cf085c3cdae261e73fd203046e5f74f6ee9d9c79
              shard_count=$(find "$snap" -maxdepth 1 -type f -name 'model-*-of-000096.safetensors' | wc -l)
              shard_bytes=$(find "$snap" -maxdepth 1 -type f -name 'model-*-of-000096.safetensors' -printf '%s\n' | awk '{sum += $1} END {printf "%.0f", sum}')
              test "$shard_count" -eq 96
              test "$shard_bytes" = 1561293160568
              rm -f /models/kimi-k31
              ln -s "$snap" /models/kimi-k31
              printf 'revision=%s\nweights_id=%s\nshards=%s\nshard_bytes=%s\n' \
                80aff651e9b2d2f5b9f70f92a0a7a77054418e16 "$actual_id" "$shard_count" "$shard_bytes" > "$marker"
              echo "CAMPFIRE_CHECKPOINT_VERIFIED $marker"
          env:
            - name: HF_HOME
              value: /models/.cache/huggingface
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: PULL_MODELS
              value: moonshotai/Kimi-K3.1-Pro@80aff651e9b2d2f5b9f70f92a0a7a77054418e16
            - name: RATE
              # 85% of a nominal 1 Gbit/s link, in bytes/s. The puller applies
              # this aggregate cap across all files and workers.
              value: "106250000"
            - name: MAX_FILE_WORKERS
              value: "8"
            - name: MAX_REPO_WORKERS
              value: "1"
            - name: PROGRESS_INTERVAL
              value: "30"
            - name: RECEIPT_PATH
              value: /models/.campfire-kimi-k31-download.json
            - name: METRICS_PORT
              value: "0"
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "8"
              memory: 8Gi
              ephemeral-storage: 20Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: campfire-kimi-k31-models
