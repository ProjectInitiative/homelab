apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campfire-kimi-k31-models
  namespace: llm-test
  labels:
    app.kubernetes.io/part-of: campfire-kimi-k31
    app.kubernetes.io/component: model-checkpoint
  annotations:
    # This is a project-specific JuiceFS cache-tier volume; never reuse or
    # delete another project's PVC to reclaim its backend data.
    campfire.kindlingai.dev/reclaim-policy: "manual-after-user-approval"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs-cache-sc
  resources:
    requests:
      storage: 2Ti
