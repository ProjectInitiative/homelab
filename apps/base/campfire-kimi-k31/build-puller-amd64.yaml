apiVersion: v1
kind: ConfigMap
metadata:
  name: campfire-puller-buildkit-config
  namespace: campfire-kimi-k31
immutable: true
data:
  buildkitd.toml: |
    [registry."local-registry.registry.svc.cluster.local:5000"]
      http = true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: campfire-puller-amd64-build
  namespace: campfire-kimi-k31
  labels:
    app.kubernetes.io/part-of: campfire-kimi-k31
    app.kubernetes.io/component: image-build
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: campfire-kimi-k31
        app.kubernetes.io/component: image-build
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: capstan1
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fetch-source
          image: alpine/git:v2.52.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              src=/workspace/src
              mkdir -p "$src"
              git init "$src"
              git -C "$src" remote add origin https://github.com/projectinitiative/homelab.git
              git -C "$src" fetch --depth 1 --no-tags origin 82857b1919288480e928a66ae30512e6c160494a
              git -C "$src" checkout --detach FETCH_HEAD
              test "$(git -C "$src" rev-parse HEAD)" = 82857b1919288480e928a66ae30512e6c160494a
              test -s "$src/llm-test/puller/Dockerfile"
              test -s "$src/llm-test/puller/puller.py"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: buildkit
          image: moby/buildkit:v0.26.2-rootless
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              src=/workspace/src/llm-test/puller
              image=local-registry.registry.svc.cluster.local:5000/homelab/campfire-model-cache-puller:amd64-82857b1
              echo "building $image for native amd64 on capstan1"
              exec buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local "context=$src" \
                --local "dockerfile=$src" \
                --opt filename=Dockerfile \
                --output "type=image,name=$image,push=true,oci-mediatypes=false" \
                --progress=plain
          env:
            - name: BUILDKITD_FLAGS
              value: "--oci-worker-no-process-sandbox --config=/build/buildkitd.toml"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 20Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: buildkit-state
              mountPath: /home/user/.local/share/buildkit
            - name: build-config
              mountPath: /build
              readOnly: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: buildkit-state
          emptyDir:
            sizeLimit: 20Gi
        - name: build-config
          configMap:
            name: campfire-puller-buildkit-config
            defaultMode: 0555
