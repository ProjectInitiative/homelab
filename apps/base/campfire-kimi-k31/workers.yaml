# Staged worker Jobs. Both are suspended, so Kubernetes will create no Pods,
# reserve no GPU/memory, pull no images, and claim no Campfire work.
# Replace :latest with a tested linux/arm64 image digest before unsuspending.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: campfire-kimi-k31-worker-a-arm64
  namespace: llm-test
  labels:
    app.kubernetes.io/name: campfire-kimi-k31-worker
    campfire.kindlingai.dev/worker: a
spec:
  suspend: false
  completions: 1
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campfire-kimi-k31-worker
        campfire.kindlingai.dev/worker: a
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      priorityClassName: campfire-volunteer
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/arch: arm64
        gpu: dgx-spark
        gpu-vendor: nvidia
      tolerations:
        - key: dgx-spark-dedicated
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: encoder
          image: registry.taildeab2.ts.net/homelab/campfire-exlr8-quant:arm64-20261127@sha256:dc46472f1e85cdbd6c604877289457e305eaa67bb806451600a081a24b877743
          imagePullPolicy: IfNotPresent
          args:
            - site
            - --watch
            - --job
            - kimi-k31-pmul1x-f16
            - --key-file
            - /run/campfire/api-key
            - --bf16
            - /models/kimi-k31
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
              ephemeral-storage: 200Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: campfire-key
              mountPath: /run/campfire
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: campfire-kimi-k31-models
            readOnly: true
        - name: campfire-key
          secret:
            secretName: campfire-api
            defaultMode: 0440
            items:
              - key: api-key
                path: api-key
        - name: scratch
          emptyDir:
            sizeLimit: 100Gi
