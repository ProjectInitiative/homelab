---
apiVersion: v1
kind: Service
metadata:
  name: mcp-ts-placeholder
  labels:
    app: mcp-kubernetes
  annotations:
    tailscale.com/proxy-group: ingress-proxy
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: http-sse
      protocol: TCP
      port: 80
      targetPort: 8080
  selector:
    app: mcp-kubernetes
