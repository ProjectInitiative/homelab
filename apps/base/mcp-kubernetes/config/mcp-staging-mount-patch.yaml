apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kubernetes-server
spec:
  template:
    spec:
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: mcp-staging
      containers:
        - name: mcp-server
          volumeMounts:
            - name: staging
              mountPath: /staging
              readOnly: true
