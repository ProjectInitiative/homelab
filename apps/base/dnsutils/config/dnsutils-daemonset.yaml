apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dnsutils-daemonset
  namespace: dnsutils
spec:
  selector:
    matchLabels:
      app: dnsutils
  template:
    metadata:
      labels:
        app: dnsutils
    spec:
      tolerations:
      - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
      containers:
      - name: dnsutils
        image: ghcr.io/projectinitiative/dnsutils:latest
        # image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
        
        imagePullPolicy: Always
      restartPolicy: Always
