# Forgejo server: single replica Deployment (NOT a StatefulSet).
#
# Rationale (differs from the Gemini proposal on purpose):
# - Upstream Forgejo is explicitly NOT HA-ready (forgejo-helm docs: queue/cron/
#   cache lack leader-follower logic; race conditions on multi-replica). A
#   Deployment+StatefulSet split does NOT make it HA - it just splits the same
#   single-writer workload across two controllers sharing one RWO volume.
# - A Deployment with strategy: Recreate on a single RWO PVC gives identical
#   availability (one pod at a time) with simpler semantics and no volumeClaim
#   template lock-in; scale-up later would be a deliberate, config-complete
#   move (valkey + RWX + meilisearch + s3 storage), not a yaml accident.
# - JuiceFS (juicefs-sc) is RWX-capable, but git worktrees + SQLite-adjacent
#   files on a network FUSE mount is a known slow path; we keep the hot data
#   (repos, data/) on local-path-nvme-sticky and only put LFS/attachments/
#   artifacts on Garage S3. If multi-node reschedule latency matters later,
#   move the PVC to juicefs-sc - it is a one-line storageClass change because
#   Retain-reclaim local-path volumes are pinned to their node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  # Never two writers on the same RWO PVC.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Fix ownership for the rootless image's git user (uid/gid 1000).
        - name: data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data || true"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:9.0
          imagePullPolicy: IfNotPresent
          # No container securityContext: this tag is the s6-overlay image —
          # it must start as root and drops to git (uid 1000) internally
          # (runAsUser: 1000 breaks s6: "unable to open .s6-svscan/lock"),
          # and dropping ALL caps would strip SETUID/SETGID. Pod-level
          # fsGroup: 1000 keeps the PVC writable by the git user.
          envFrom:
            - configMapRef:
                name: forgejo-env
          env:
            # Sensitive values injected from the VSO-synced secret.
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_PASSWORD
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: SECRET_KEY
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: INTERNAL_TOKEN
            - name: FORGEJO__server__LFS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: LFS_JWT_SECRET
            - name: FORGEJO__lfs__MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_ACCESS_KEY_ID
            - name: FORGEJO__lfs__MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_SECRET_ACCESS_KEY
            - name: FORGEJO__attachment__MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_ACCESS_KEY_ID
            - name: FORGEJO__attachment__MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_SECRET_ACCESS_KEY
            - name: FORGEJO__storage.actions_log__MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_ACCESS_KEY_ID
            - name: FORGEJO__storage.actions_log__MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_SECRET_ACCESS_KEY
            - name: FORGEJO__storage.artifacts__MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_ACCESS_KEY_ID
            - name: FORGEJO__storage.artifacts__MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: GARAGE_SECRET_ACCESS_KEY
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # First boot initializes DB schema; be patient before restarting.
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: tmp
          emptyDir: {}
