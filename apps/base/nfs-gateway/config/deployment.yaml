---
# Kernel-nfsd NFS server exporting a JuiceFS RWX volume.
# This is the documented way to NFS-export a JuiceFS (FUSE) mount — userspace
# NFS-Ganesha's FSAL VFS returned EIO over FUSE, so we use the kernel nfsd from
# nfs-utils instead. It exports the mounted PVC at fsid=0 (NFSv4 root), so
# clients mount "host:/".
#
# REQUIRES privileged mode (kernel nfsd + mounting). If your cluster refuses
# privileged pods, try adding only SYS_ADMIN + SETPCAP capabilities instead.
# Also requires the `nfsd` kernel module to be available on the node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-gateway
  labels:
    app: nfs-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-gateway
  template:
    metadata:
      labels:
        app: nfs-gateway
    spec:
      containers:
        - name: nfs
          image: itsthenetwork/nfs-server-alpine:latest
          securityContext:
            # Kernel nfsd needs this. If not allowed in your cluster, try
            # capabilities: add: [SYS_ADMIN, SETPCAP] (may not be enough).
            privileged: true
          env:
            - name: SHARED_DIRECTORY
              value: /nfsshare
          # Leave PERMITTED unset => any client that can reach the kube-vip VIP
          # (the 172.16.1.0/24 LAN) may mount. Restrict it to a host/pattern here
          # (e.g. "172.16.1.10") if you want to lock it down.
          # - name: PERMITTED
          #   value: "172.16.1.0/24"
          # async for JuiceFS performance (JuiceFS recommends async over sync);
          # set SYNC=true if you prefer acknowledged writes.
          # - name: SYNC
          #   value: "true"
          ports:
            - containerPort: 2049
              name: nfs
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - name: share
              mountPath: /nfsshare
      volumes:
        - name: share
          persistentVolumeClaim:
            claimName: nfs-share
