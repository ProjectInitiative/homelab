---
# NFS-exported JuiceFS volume. This is a separate dataset from the Samba share
# (samba-share) so the two protocols give you independent "options". If you want
# NFS and SMB to expose the SAME data, point this PVC at the same JuiceFS subdir
# as samba-share instead (see the samba PVC).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-share
  labels:
    app: nfs-gateway
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs-sc
  resources:
    requests:
      storage: 2Ti
