---
# Expose NFS on the LAN via the kube-vip LoadBalancer (full bandwidth).
# Mount from Linux with:
#   sudo mount -t nfs4 <assigned-vip>:/ /mnt/nfs -o vers=4.2,noatime
apiVersion: v1
kind: Service
metadata:
  name: nfs-lb
  labels:
    app: nfs-gateway
spec:
  type: LoadBalancer
  ports:
    - name: nfs
      protocol: TCP
      port: 2049
      targetPort: 2049
  selector:
    app: nfs-gateway
