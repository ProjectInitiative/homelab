# Compute guardrails for the agent playbox. PSA restricted (set by the
# generator from the agent-access catalog entry) handles privilege escape;
# this quota handles runaway compute: GPU is capped at 1 (a sandbox job may
# wait pending if no DGX GPU is free, but can never grab a second one),
# bounded CPU/memory, and hard object counts so a retry loop cannot flood
# the scheduler. Note: PSA restricted blocks hostPath, so ROCm-style
# /dev/dri access (astrolabe) is impossible here — NVIDIA device-plugin
# resources only.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-sandbox-quota
  namespace: agent-sandbox
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi
    nvidia.com/gpu: "1"
    requests.ephemeral-storage: 200Gi
    persistentvolumeclaims: "4"
    count/jobs.batch: "10"
    count/cronjobs.batch: "5"
    count/pods: "20"
    count/services: "10"
    count/configmaps: "20"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agent-sandbox-defaults
  namespace: agent-sandbox
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "8"
        memory: 16Gi
