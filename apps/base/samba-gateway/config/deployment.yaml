---
# Linux-friendly Samba gateway over a JuiceFS RWX volume.
# Uses the k8s-native samba-server container with a fully-controlled smb.conf
# (see samba-config.yaml) so NO Apple/recycle vfs modules are loaded — deletes and
# renames work correctly over JuiceFS for Linux clients.
#
# Password comes from the VSO-created secret `samba-credentials` (key `user`,
# value "kyle;<password>"). An initContainer splits it and writes a users.json
# that sambacc merges with the ConfigMap config. This keeps the password out of
# git and lets the account be re-provisioned on every restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba-gateway
  labels:
    app: samba-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba-gateway
  template:
    metadata:
      labels:
        app: samba-gateway
    spec:
      initContainers:
        # Stage a users.json from the secret, then let sambacc provision it.
        - name: samba-init
          image: quay.io/samba.org/samba-server:latest
          env:
            - name: SAMBACC_VERSION
              value: "0.1"
            - name: SAMBACC_CONFIG
              value: /etc/samba-container-base/config.json:/etc/samba-container/users.json
            - name: SAMBA_CONTAINER_ID
              value: samba-gateway
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ULINE=$(cat /run/secrets/samba/user)     # kyle;<password>
              NAME=${ULINE%%;*}
              PW=${ULINE#*;}
              printf '{"samba-container-config":"v0","users":{"all_entries":[{"name":"%s","password":"%s"}]}}' "$NAME" "$PW" > /etc/samba-container/users.json
              samba-container init
          volumeMounts:
            - name: samba-config
              mountPath: /etc/samba-container-base
              readOnly: true
            - name: samba-users
              mountPath: /etc/samba-container
            - name: samba-state
              mountPath: /var/lib/samba
            - name: samba-credentials
              mountPath: /run/secrets/samba
              readOnly: true
      containers:
        - name: samba
          image: quay.io/samba.org/samba-server:latest
          command: ["samba-container", "run", "smbd"]
          env:
            - name: SAMBACC_VERSION
              value: "0.1"
            - name: SAMBACC_CONFIG
              value: /etc/samba-container-base/config.json:/etc/samba-container/users.json
            - name: SAMBA_CONTAINER_ID
              value: samba-gateway
          ports:
            - containerPort: 445
              name: smb
            - containerPort: 139
              name: netbios
          readinessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - name: samba-config
              mountPath: /etc/samba-container-base
              readOnly: true
            - name: samba-users
              mountPath: /etc/samba-container
            - name: samba-state
              mountPath: /var/lib/samba
            - name: share
              mountPath: /share
      volumes:
        - name: samba-config
          configMap:
            name: samba-gateway-config
        - name: samba-users
          emptyDir: {}
        - name: samba-state
          emptyDir: {}
        - name: samba-credentials
          secret:
            secretName: samba-credentials
            items:
              - key: user
                path: user
        - name: share
          persistentVolumeClaim:
            claimName: samba-share
