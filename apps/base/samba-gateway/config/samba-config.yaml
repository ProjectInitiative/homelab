---
# Full samba-container-config for the gateway. This is a standalone (non-domain)
# server with one share. Critically, we do NOT set `vfs objects`, so Samba uses
# the default (no fruit / streams_xattr / recycle / catia modules that need the
# backing filesystem to support NTFS-style xattrs). This keeps deletes + renames
# working reliably over JuiceFS for Linux clients.
#
# The user/password comes from a generated file (users.json) written by the
# initContainer from the VSO-created `samba-credentials` secret; see deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-gateway-config
  labels:
    app: samba-gateway
data:
  config.json: |
    {
      "samba-container-config": "v0",
      "configs": {
        "samba-gateway": {
          "shares": ["data"],
          "globals": ["default"],
          "instance_name": "SAMBA"
        }
      },
      "globals": {
        "default": {
          "options": {
            "security": "user",
            "server min protocol": "SMB2",
            "server max protocol": "SMB3",
            "load printers": "no",
            "printing": "bsd",
            "printcap name": "/dev/null",
            "disable spoolss": "yes",
            "map to guest": "never"
          }
        }
      },
      "shares": {
        "data": {
          "options": {
            "path": "/share",
            "read only": "no",
            "browseable": "yes",
            "guest ok": "no",
            "valid users": "kyle"
          }
        }
      }
    }
