# Placeholder rendered per-app by the cdk8s generator (vaultSecrets block in
# apps.yaml): a VaultStaticSecret syncing runner uuid/token from OpenBao.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: placeholder-secret
  namespace: forgejo
spec:
  vaultAuthRef: operator-auth
  mount: k8s
  type: kv-v2
  path: placeholder-path
  refreshInterval: 60s
  destination:
    name: placeholder-dest
    create: true
