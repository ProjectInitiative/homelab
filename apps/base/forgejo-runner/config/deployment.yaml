# Forgejo runner (build farm label) for the dotfiles nix build pipeline.
#
# Design notes:
# - label type `host` is NOT used; instead we run the runner inside a pod and
#   let jobs use a nix-capable container image (docker label). Nix does its own
#   sandboxing, so no DinD/privileged is required for `nix build` itself.
# - Two runners: x86_64 (capstan1, this file; pinned via clusters/mc.yaml
#   patch) and aarch64 (apps/base/forgejo-runner-arm, sextant baked in).
#   Distinct config dirs so the two Argo apps never share resource names.
# - Runner credentials (uuid/token) come from OpenBao via VSO
#   (forgejo-runner/credentials) so re-registration is a secret rotate, not a
#   gitops edit. Offline registration flow: forgejo forgejo-cli actions
#   register --secret <40-hex> on the server; first 16 hex = uuid, rest = token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /data /config
              cp /config-src/config.yml /config/config.yml
              chown -R 1000:1000 /data /config
              exec forgejo-runner daemon --config /config/config.yml
          env:
            - name: RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-credentials
                  key: uuid
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-credentials
                  key: token
          volumeMounts:
            - name: config
              mountPath: /config-src
              readOnly: true
            - name: data
              mountPath: /data
            - name: nix-store
              mountPath: /nix
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-cache
        # Persistent nix store: builds reuse prior artifacts across jobs.
        - name: nix-store
          persistentVolumeClaim:
            claimName: forgejo-runner-nix
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-cache
  labels:
    app: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  storageClassName: local-path-nvme-sticky
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-nix
  labels:
    app: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  storageClassName: local-path-nvme-sticky
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi
