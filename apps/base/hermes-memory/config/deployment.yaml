apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-memory
  namespace: hermes
  labels:
    app: hermes-memory
spec:
  # SQLite file storage: never run two writers. Recreate avoids a
  # rolling window with two pods bound to the same DB.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: hermes-memory
  template:
    metadata:
      labels:
        app: hermes-memory
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: hermes-memory
          image: ghcr.io/projectinitiative/hermes-memory:latest
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          env:
            - name: HERMES_MEMORY_DB
              value: /data/memory.db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-memory
