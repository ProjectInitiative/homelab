---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: argo
  labels:
    app: argo
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: argo-root
      spec:
        pvc:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              storage: 32Gi
          storageClassName: juicefs-sc
        source:
          s3:
            # Host's first DNS label IS the SigV4 region CDI signs with
            # (extractRegion falls back to host.split('.')[0]); Garage
            # expects us-east-1, so import via the us-east-1 ExternalName
            # alias in the garage namespace.
            # nixos-estate.qcow2 = full estate image built from
            # dotfiles kubevirtConfigurations.argo (kylepzak user, native
            # fileSystems incl. /data + /nix bind with self-healing store
            # seed). nixos.qcow2 = old minimal bootstrap image (rollback).
            url: "http://us-east-1.garage.svc.cluster.local:3900/iso/nixos-estate.qcow2"
            secretRef: argo-s3-creds
    - metadata:
        name: argo-data
      spec:
        pvc:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              # JuiceFS capacity is soft/elastic: the label is not a
              # prepayment; data lands in garage S3 + local NVMe cache.
              storage: 1Ti
          storageClassName: juicefs-sc
        source:
          blank: {}
  template:
    metadata:
      labels:
        app: argo
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
              dedicatedIOThread: true
            - name: data
              # stable /dev/disk/by-id/virtio-argodata for the guest's
              # fileSystems entry (survives disk reordering) — serial is a
              # Disk-level field in the kubevirt API, not under .disk
              serial: argodata
              disk:
                bus: virtio
              dedicatedIOThread: true
          interfaces:
            - name: default
              masquerade: {}
        ioThreadsPolicy: auto
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: root
          dataVolume:
            name: argo-root
        - name: data
          dataVolume:
            name: argo-data
      # No cloud-init disk: the estate image configures users (kylepzak),
      # ssh keys, hostname, qemu-guest-agent and all storage natively via
      # the dotfiles hosts/argo module. cloud-init stays enabled in the
      # image but has no datasource and is a no-op.
