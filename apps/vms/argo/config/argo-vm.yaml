---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: argo
  labels:
    app: argo
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: argo-root
      spec:
        pvc:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              storage: 32Gi
          storageClassName: juicefs-sc
        source:
          s3:
            # Host's first DNS label IS the SigV4 region CDI signs with
            # (extractRegion falls back to host.split('.')[0]); Garage
            # expects us-east-1, so import via the us-east-1 ExternalName
            # alias in the garage namespace.
            url: "http://us-east-1.garage.svc.cluster.local:3900/iso/nixos.qcow2"
            secretRef: argo-s3-creds
    - metadata:
        name: argo-data
      spec:
        pvc:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              # JuiceFS capacity is soft/elastic: the label is not a
              # prepayment; data lands in garage S3 + local NVMe cache.
              storage: 1Ti
          storageClassName: juicefs-sc
        source:
          blank: {}
  template:
    metadata:
      labels:
        app: argo
    spec:
      evictionStrategy: LiveMigrate
      domain:
        firmware:
          # Pinning a NEW uuid forces a new cloud-init instance-id (kubevirt
          # derives it from firmware uuid) so per-instance modules re-run after
          # the storage setup was added to the existing guest disk.
          uuid: 4cb45ba1-e040-433c-ba83-c585a4b56aed
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
              dedicatedIOThread: true
            - name: data
              # stable /dev/disk/by-id/virtio-argodata for the guest's
              # fileSystems entry (survives disk reordering) — serial is a
              # Disk-level field in the kubevirt API, not under .disk
              serial: argodata
              disk:
                bus: virtio
              dedicatedIOThread: true
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        ioThreadsPolicy: auto
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: root
          dataVolume:
            name: argo-root
        - name: data
          dataVolume:
            name: argo-data
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: argo
              users:
                - name: kyle
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  lock_passwd: false
                  ssh_authorized_keys:
                    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDRiGsoimWWFcrnXlN8+AcdkZba43h1D26D5Ep3KDDYe"
                    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK6b4wiCCBSbEqZv26gzCue1iUYpKHluMSvpAGIq1647"
              ssh_pwauth: true
              ssh_import_id: none
              chpasswd:
                expire: false
                list: |
                  kyle:changeme
              packages:
                - qemu-guest-agent
              # bootcmd = per-boot (PER_ALWAYS): re-runs on every restart,
              # not just first boot. All commands are idempotent.
              # NixOS guest: no /bin/bash and cloud-init's subprocess PATH
              # lacks /run/current-system/sw/bin — use sh -c with absolute paths.
              # The data disk gets a COPY of the nix store BEFORE the bind
              # mount — binding an empty dir over /nix hides the store and
              # bricks the guest (sshd and every unit exec from /nix/store).
              # The bind is deliberately NOT in fstab: at boot fstab would
              # mount it before cloud-init can ensure the copy exists.
              bootcmd:
                - [ /run/current-system/sw/bin/systemctl, enable, --now, qemu-guest-agent ]
                - [ /bin/sh, -c, "set -e; SW=/run/current-system/sw/bin; RW=/run/wrappers/bin; DISK=/dev/disk/by-id/virtio-argodata; if ! $SW/blkid $DISK | $SW/grep -q ext4; then $SW/mkfs.ext4 -L argo-data $DISK; fi; $SW/mkdir -p /data /data/nix /nix; $SW/mountpoint -q /data || $RW/mount $DISK /data; if [ ! -f /data/nix/.store-initialized ]; then $SW/cp -a /nix/. /data/nix/ && $SW/touch /data/nix/.store-initialized; fi; $SW/mountpoint -q /nix || $RW/mount --bind /data/nix /nix; $SW/grep -q virtio-argodata /etc/fstab || echo '/dev/disk/by-id/virtio-argodata /data ext4 defaults,nofail 0 2' >> /etc/fstab; $SW/df -h /data /nix /" ]
