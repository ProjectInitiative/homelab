---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: argo
  labels:
    app: argo
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: argo-root
      spec:
        pvc:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              storage: 32Gi
          storageClassName: juicefs-sc
        source:
          s3:
            # Host's first DNS label IS the SigV4 region CDI signs with
            # (extractRegion falls back to host.split('.')[0]); Garage
            # expects us-east-1, so import via the us-east-1 ExternalName
            # alias in the garage namespace.
            url: "http://us-east-1.garage.svc.cluster.local:3900/iso/nixos.qcow2"
            secretRef: argo-s3-creds
    - metadata:
        name: argo-data
      spec:
        pvc:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              # JuiceFS capacity is soft/elastic: the label is not a
              # prepayment; data lands in garage S3 + local NVMe cache.
              storage: 1Ti
          storageClassName: juicefs-sc
        source:
          blank: {}
  template:
    metadata:
      labels:
        app: argo
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
              dedicatedIOThread: true
            - name: data
              disk:
                bus: virtio
              dedicatedIOThread: true
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        ioThreadsPolicy: auto
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: root
          dataVolume:
            name: argo-root
        - name: data
          dataVolume:
            name: argo-data
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: argo
              users:
                - name: kyle
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  lock_passwd: false
                  ssh_authorized_keys:
                    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDRiGsoimWWFcrnXlN8+AcdkZba43h1D26D5Ep3KDDYe"
                    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK6b4wiCCBSbEqZv26gzCue1iUYpKHluMSvpAGIq1647"
              ssh_pwauth: true
              ssh_import_id: none
              chpasswd:
                expire: false
                list: |
                  kyle:changeme
              packages:
                - qemu-guest-agent
              runcmd:
                - [ systemctl, enable, --now, qemu-guest-agent ]
