---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: argo
  labels:
    app: argo
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: argo-root
      spec:
        pvc:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              # 2026-11-11 single-disk redesign: 256Gi root for /, /nix,
              # /home (heavy nix store builds outgrew the old 32Gi root).
              # The old 1Ti argo-data DV was deleted with the two-disk
              # design; durable state moves to a dedicated JuiceFS mount
              # inside the guest. JuiceFS capacity is soft/elastic: the
              # label is not a prepayment; data lands in garage S3 +
              # local NVMe cache.
              storage: 256Gi
          storageClassName: juicefs-sc
        source:
          s3:
            # Host's first DNS label IS the SigV4 region CDI signs with
            # (extractRegion falls back to host.split('.')[0]); Garage
            # expects us-east-1, so import via the us-east-1 ExternalName
            # alias in the garage namespace.
            # nixos-estate.qcow2 = full estate image built from
            # dotfiles kubevirtConfigurations.argo-image (kylepzak user,
            # 256Gi single-disk layout — 2026-11-11 redesign).
            # nixos.qcow2 = old minimal bootstrap image (rollback).
            url: "http://us-east-1.garage.svc.cluster.local:3900/iso/nixos-estate.qcow2"
            secretRef: argo-s3-creds

  template:
    metadata:
      labels:
        app: argo
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          # 32Gi: nix flake evaluation OOMs at 8Gi; capacity is ample
          # (capstan3 allocatable ~76Gi, big nodes 128Gi+)
          guest: 32Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
              dedicatedIOThread: true
          interfaces:
            - name: default
              masquerade: {}
        ioThreadsPolicy: auto
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: root
          dataVolume:
            name: argo-root
      # No cloud-init disk: the estate image configures users (kylepzak),
      # ssh keys, hostname, qemu-guest-agent and all storage natively via
      # the dotfiles hosts/argo module. cloud-init stays enabled in the
      # image but has no datasource and is a no-op.
