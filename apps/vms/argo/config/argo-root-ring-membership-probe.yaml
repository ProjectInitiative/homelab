# One-shot read-only pre-warm gate. Never expose /disk/.config or the metadata URL in logs.
apiVersion: batch/v1
kind: Job
metadata:
  name: argo-root-ring-config-keys-probe-9cdc4100
  namespace: argo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: capstan2
      containers:
        - name: probe
          image: postgres:17-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -r /disk/.config && test -r /disk/disk.img || { echo "root PVC unreadable"; exit 1; }
              bytes=$(stat -c %s /disk/disk.img)
              test "$bytes" -gt 0 && test "$bytes" -le 34359738368 || { echo "disk.img size outside gate"; exit 1; }
              echo "disk.img size=$bytes"
              echo "config field names only (no values):"
              grep -oE '"[A-Za-z][A-Za-z0-9]*"[[:space:]]*:' /disk/.config | sort -u || true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: argo-root, mountPath: /disk, readOnly: true}
      volumes:
        - name: argo-root
          persistentVolumeClaim: {claimName: argo-root, readOnly: true}
