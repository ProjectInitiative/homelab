defaults:
  repoURL: https://github.com/projectinitiative/homelab.git
  targetRevision: HEAD
  # syncPolicy defaults are now handled in the Pulumi code

catalog:
  # Bootstrap / Infrastructure
  kube-vip-app:
    path: bootstrap/mc/kube-vip/config
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true

  admin-access:
    path: bootstrap/base/admin-access
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true

  local-path-provisioner:
    path: bootstrap/base/local-path-provisioner/config
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - RespectIgnoreDifferences=true

  policies:
    path: bootstrap/base/policies
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false # Policies usually don't need their own namespace
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - RespectIgnoreDifferences=true

  sc-local-path:
    path: bootstrap/base/lpp
    directory:
      include: '*.yaml'
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  coredns-custom:
    path: apps/base/coredns-custom/config
    annotations:
      argocd.argoproj.io/sync-wave: "5"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true

  tpm-device-plugin:
    path: bootstrap/base/tpm-device-plugin/plugin
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    syncPolicy:
      syncOptions: []

  nvidia-device-plugin:
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    sources:
      - repoURL: https://nvidia.github.io/k8s-device-plugin
        chart: nvidia-device-plugin
        targetRevision: 0.19.3
        helm:
          values: |
            # Drivers and NVIDIA Container Toolkit are installed on every DGX Spark.
            # Select the capability pool rather than enumerating hostnames so newly
            # qualified Sparks advertise nvidia.com/gpu automatically.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: gpu
                          operator: In
                          values: [dgx-spark]
                        - key: kubernetes.io/arch
                          operator: In
                          values: [arm64]
            # The plugin must run with the NVIDIA runtime so NVML and driver
            # libraries are injected into the container.
            runtimeClassName: nvidia
            tolerations:
              - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
            gfd:
              enabled: false
            nfd:
              enabled: false
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  rdma-shared-device-plugin:
    path: bootstrap/base/rdma-shared-device-plugin/config
    annotations:
      argocd.argoproj.io/sync-wave: "11"
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  amd-device-plugin:
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    sources:
      - repoURL: https://rocm.github.io/k8s-device-plugin/
        chart: amd-gpu
        targetRevision: 0.22.0
        helm:
          values: |
            node_selector_enabled: true
            node_selector:
              kubernetes.io/hostname: astrolabe
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  cert-manager:
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    sources:
      - repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.18.1
        helm:
          valueFiles:
            - $values/bootstrap/base/cert-manager/cert-manager-values.yaml
      - repoURL: https://github.com/projectinitiative/homelab.git
        targetRevision: HEAD
        ref: values
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - RespectIgnoreDifferences=true

  openbao:
    annotations:
      argocd.argoproj.io/sync-wave: "90"
    sources:
      - repoURL: https://openbao.github.io/openbao-helm
        chart: openbao
        targetRevision: 0.28.6
        helm:
          valueFiles:
            - $values/bootstrap/base/openbao/openbao-values.yaml
      - repoURL: https://github.com/projectinitiative/homelab.git
        targetRevision: HEAD
        ref: values
      - repoURL: https://github.com/projectinitiative/homelab.git
        targetRevision: HEAD
        path: bootstrap/base/openbao/config
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: openbao-snapshot-s3
          mount: k8s
          path: "openbao-snapshot/s3"
          destination: "openbao-snapshot-s3"
        - name: openbao-monitoring
          mount: k8s
          path: "openbao/monitoring"
          destination: "openbao-monitoring"
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        kind: MutatingWebhookConfiguration
        name: openbao-agent-injector-cfg

  openbao-auth-config:
    path: bootstrap/base/openbao-auth-config/config
    syncPolicy:
      syncOptions: []

  openbao-secrets-operator:
    repoURL: https://github.com/hashicorp/vault-secrets-operator.git
    path: chart
    targetRevision: v1.4.0
    helm:
      values: |
        defaultVaultConnection:
          enabled: false

  csi-snapshotter:
    path: bootstrap/base/csi-snapshotter/config
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  cnpg-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "30"
    sources:
      - repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        targetRevision: 0.29.0
        helm:
          values: |
            crds.create: true
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  barman-cloud-plugin:
    annotations:
      argocd.argoproj.io/sync-wave: "35"
    sources:
      - repoURL: https://cloudnative-pg.github.io/charts
        chart: plugin-barman-cloud
        targetRevision: 0.7.0
        helm:
          values: |
            crds.create: true
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  ingress:
    annotations:
      argocd.argoproj.io/sync-wave: "45"
    sources:
      - repoURL: https://haproxytech.github.io/helm-charts
        chart: kubernetes-ingress
        targetRevision: 1.54.2
        helm:
          values: |
            fullnameOverride: ingress
            controller:
              kind: Deployment
              replicaCount: 2
              ingressClass: haproxy
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
              PodDisruptionBudget:
                enable: true
                minAvailable: 1
              service:
                type: ClusterIP
                enablePorts:
                  http: true
                  https: false
                  quic: false
                  stat: true
                  admin: false
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  juicefs-csi-driver:
    annotations:
      argocd.argoproj.io/sync-wave: "30"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: juicefs-creds-cache-kube-system
          mount: k8s
          # kube-system COPY of the cache-tier record, for the CSI mount-pod
          # env injection: mount pods run in kube-system and secretKeyRef
          # cannot cross namespaces, so the mountPodPatch env (JFS_RSA_PASSPHRASE
          # <- passphrase key) needs this copy. Same OpenBao source of truth
          # as juicefs-creds-cache in juicefs-platform.
          path: "juicefs-cache/config"
          destination: "juicefs-creds-cache"
    sources:
      - repoURL: https://juicedata.github.io/charts/
        chart: juicefs-csi-driver
        targetRevision: 0.33.0
        helm:
          values: |
            globalConfig:
              enabled: true
              manageByHelm: true
              enableNodeSelector: true
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  samba-gateway:
    path: apps/base/samba-gateway/config
    annotations:
      argocd.argoproj.io/sync-wave: "60"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: samba-creds
          mount: k8s
          path: "samba/password"
          destination: "samba-credentials"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  juicefs-platform:
    path: bootstrap/base/juicefs-platform
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    vaultSecrets:
      createAuth: true
      namespace: production
      role: openbao-secrets-operator
      audiences:
        - vault
      secrets:
        - name: juicefs-creds
          mount: k8s
          path: "juicefs/config"
          destination: "juicefs-creds"
        - name: juicefs-key
          mount: k8s
          path: "juicefs/pem"
          destination: "juicefs-key"
        - name: juicefs-cache-creds
          mount: k8s
          # Ephemeral-cache tier (juicefs-cache-sc): Garage bucket
          # juicefs-mc-cache, metadata DB juicefs_cache (dedicated CNPG DB,
          # juicefs-cache-database.yaml). Record mirrors juicefs/config schema.
          # Create the OpenBao record BEFORE syncing — see
          # bootstrap/base/juicefs-platform/job-format-cache.yaml and
          # openbao-record-cache.example.md.
          path: "juicefs-cache/config"
          destination: "juicefs-creds-cache"
          # The secret pre-exists from the out-of-band October setup (22d old,
          # no VSO owner labels) — without overwrite VSO refuses to update it
          # ("invalid owner label") and passphrase/other new keys never reach
          # the secret. Adopt and own it.
          overwrite: true
        - name: juicefs-key-cache
          mount: k8s
          # Passphrase-protected RSA pem for the cache tier (RISK-0045: the
          # format job REFUSES to format with a missing or unencrypted pem).
          # Generate: openssl genrsa -aes256 -out juicefs-cache.pem 4096
          path: "juicefs-cache/pem"
          destination: "juicefs-key-cache"
          # Same adoption logic as juicefs-cache-creds: any pre-existing secret
          # (e.g. from manual setup or a retry race) must be owned by VSO or
          # updates silently never land.
          overwrite: true
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  postgres-cluster:
    path: bootstrap/base/cnpg/database
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: postgres-cluster-s3
          mount: k8s
          path: "cnpg/s3"
          destination: "postgres-cluster-s3"
        - name: juicefs-postgres-creds
          mount: k8s
          # Project the same OpenBao source used by JuiceFS into a CNPG
          # basic-auth Secret. OpenBao must provide username and password.
          path: "juicefs/config"
          destination: "juicefs-postgres-creds"
          destinationType: "kubernetes.io/basic-auth"
          destinationIncludes:
            - username
            - password
          overwrite: true
        - name: juicefs-dev-postgres-creds
          mount: k8s
          # Dev JuiceFS record (k8s/juicefs-dev/config) holds bucket creds,
          # metaurl, and the juicefs_dev_user credentials in one place, mirroring
          # juicefs/config. Only the role credentials enter postgres-db; the dev
          # node pulls the full record straight from OpenBao to format/mount
          # (docs/juicefs-dev.md). Put the OpenBao record in place BEFORE the
          # DatabaseRole syncs.
          path: "juicefs-dev/config"
          destination: "juicefs-dev-postgres-creds"
          destinationType: "kubernetes.io/basic-auth"
          destinationIncludes:
            - username
            - password
          overwrite: true
        - name: juicefs-cache-postgres-creds
          mount: k8s
          # Cache-tier JuiceFS DB role credentials (juicefs_cache_user) for the
          # CNPG DatabaseRole. Mirrors the juicefs-dev pair; OpenBao record
          # k8s/juicefs-cache/config holds username+password (and the full
          # bucket/metaurl record consumed by the juicefs-platform app above).
          path: "juicefs-cache/config"
          destination: "juicefs-cache-postgres-creds"
          destinationType: "kubernetes.io/basic-auth"
          destinationIncludes:
            - username
            - password
          overwrite: true
        - name: litellm-postgres-creds
          mount: k8s
          # The same OpenBao record also contains DATABASE_URL and
          # LITELLM_SALT_KEY, but only the role credentials enter postgres-db.
          path: "litellm/postgres"
          destination: "litellm-postgres-creds"
          destinationType: "kubernetes.io/basic-auth"
          destinationIncludes:
            - username
            - password
          overwrite: true
        - name: forgejo-postgres-creds
          mount: k8s
          # Forgejo DB role credentials (forgejo_user) for the CNPG DatabaseRole.
          path: "forgejo/db"
          destination: "forgejo-postgres-creds"
          destinationType: "kubernetes.io/basic-auth"
          destinationIncludes:
            - username
            - password
          overwrite: true
    syncPolicy:
      automated:
        prune: false
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
    
  garage:
    path: bootstrap/base/garage
    critical: true
    plugin:
      name: kustomized-git-helm-v1.0
    annotations:
      argocd.argoproj.io/sync-wave: "100"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: garage-rpc-secret
          mount: k8s
          path: "garage/rpc"
          destination: "garage-rpc-secret"
        # Admin API token for garage v2 (GARAGE_ADMIN_TOKEN env on the pods).
        # Token value lives in OpenBao at k8s/garage/admin-token under key
        # "token" — used by dinghy's prometheus for the admin API (per-bucket
        # size audit) and any future admin operations.
        - name: garage-admin-token
          mount: k8s
          path: "garage/admin-token"
          destination: "garage-admin-token"
          # adopt the pre-seeded secret (created manually while VSO was
          # wedged); without this VSO refuses an un-owned destination
          overwrite: true
    ignoreDifferences:
      - group: ""
        jsonPointers:
        - /data/rpcSecret
        kind: Secret
        name: garage-rpc-secret
      - group: apps
        kind: StatefulSet
        jsonPointers:
        - /spec/volumeClaimTemplates
    syncPolicy:
      automated:
        prune: false
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        # The STS volumeClaimTemplates are immutable; the snapshots template
        # size bump (300Gi) is realized by expanding the existing PVCs, not
        # by rewriting the live STS. RespectIgnoreDifferences keeps Argo from
        # attempting that immutable-field apply.
        - RespectIgnoreDifferences=true

  tailscale-operator:
    sources:
      # Temporary pin to Tailscale main while the ProxyGroup config-refresh fix
      # lands in a release. Main commit: d064d751fb91fa4ffe39dad42c92862320985a0f.
      - repoURL: https://github.com/tailscale/tailscale.git
        path: cmd/k8s-operator/deploy/chart
        targetRevision: d064d751fb91fa4ffe39dad42c92862320985a0f
        helm:
          values: |
            apiServerProxyConfig:
              mode: "true"
              allowImpersonation: "true"
            operatorConfig:
              hostname: mc-tailscale-operator
              image:
                repository: tailscale/k8s-operator
                digest: sha256:5c1043baaba7228edb6c69ee9f9c70b3e1b27e511527364534cf3244cca71d1e
            proxyConfig:
              image:
                repository: tailscale/tailscale
                digest: sha256:08a3e029dc36c797633092deaa5e243ae4687980adfa2299c53c49a7252a4914
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: tailscale-auth
          mount: k8s
          path: "tailscale-operator"
          destination: "operator-oauth"
          overwrite: true

  ts-vip-watchdog:
    path: apps/base/ts-vip-watchdog/config
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  # Agent compute access: jobsmith RBAC (llm-test) + agent-sandbox playbox
  # (broad namespaced RBAC behind PSA restricted + ResourceQuota). Bound to the
  # mcp-agent-sa identity; pairs with the mcp-kubernetes readwrite container.
  agent-access:
    path: apps/base/agent-access/config
    podSecurity: restricted
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  garage-operator:
    path: bootstrap/base/garage-operator
    syncPolicy:
      automated:
        prune: false
        selfHeal: false
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
  garage-mem:
    path: bootstrap/mc/garage-mem

  garage-migrate:
    path: bootstrap/base/garage-migrate
    plugin:
      name: kustomized-git-helm-v1.0
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  prometheus-operator-crds:
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    sources:
      - repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus-operator-crds
        targetRevision: 17.0.2
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  grafana-alloy:
    sources:
      - repoURL: https://grafana.github.io/helm-charts
        chart: alloy
        targetRevision: 0.9.1
        helm:
          values: |
            controller:
              tolerations:
                - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
            alloy:
              clustering:
                enabled: true
                name: "homelab-alloy-cluster"
                portName: "http"
              configMap:
                content: |
                  logging {
                    level = "info"
                    format = "logfmt"
                  }

                  discovery.kubernetes "pods" {
                    role = "pod"
                  }

                  loki.source.kubernetes "pod_logs" {
                    targets    = discovery.kubernetes.pods.targets
                    forward_to = [loki.relabel.cluster.receiver]
                  }

                  loki.relabel "cluster" {
                    forward_to = [loki.write.default.receiver]

                    rule {
                      action        = "replace"
                      target_label  = "cluster"
                      replacement   = sys.env("CLUSTER_NAME")
                    }
                  }

                  loki.write "default" {
                    endpoint {
                      url = "http://100.119.112.42:3100/loki/api/v1/push"
                    }
                  }

                  // Prometheus Operator Support
                  prometheus.operator.servicemonitors "primary_sm" {
                    clustering {
                        enabled = true
                    }
                    forward_to = [prometheus.relabel.cluster.receiver]
                  }

                  prometheus.operator.podmonitors "primary_pm" {
                    clustering {
                        enabled = true
                    }
                    forward_to = [prometheus.relabel.cluster.receiver]
                  }

                  prometheus.relabel "cluster" {
                    forward_to = [prometheus.remote_write.default.receiver]

                    rule {
                      action        = "replace"
                      target_label  = "cluster"
                      replacement   = sys.env("CLUSTER_NAME")
                    }
                  }

                  prometheus.remote_write "default" {
                    endpoint {
                      url = "http://100.119.112.42:9090/api/v1/write"
                    }
                  }

  karmada-member:
    path: bootstrap/base/karmada-member
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true

  karmada-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    sources:
      - repoURL: https://github.com/karmada-io/karmada.git
        targetRevision: v1.16.1
        path: charts/karmada-operator
        helm:
          values: |
            karmadaOperatorImageVersion: "v1.16.1"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  karmada-instance:
    path: bootstrap/base/karmada-instance
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  submariner-k8s-broker:
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    sources:
      - repoURL: https://submariner-io.github.io/submariner-charts/charts
        chart: submariner-k8s-broker
        targetRevision: 0.24.0
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  submariner-globalnet:
    annotations:
      argocd.argoproj.io/sync-wave: "45"
    path: bootstrap/base/submariner-globalnet/config
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  submariner-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    sources:
      - repoURL: https://submariner-io.github.io/submariner-charts/charts
        chart: submariner-operator
        targetRevision: 0.24.0
    helm:
      values: |
        submariner:
          brokerK8sSecret: "submariner-broker-info"
          brokerK8sRemoteNamespace: "submariner-k8s-broker"
          natEnabled: true
          globalnetEnabled: true
        ipsec:
          pskSecret: submariner-ipsec-psk
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: submariner-broker-info
          mount: k8s
          path: "submariner/broker-info"
          destination: "submariner-broker-info"
        - name: submariner-ipsec-psk
          mount: k8s
          path: "submariner/ipsec-psk"
          destination: "submariner-ipsec-psk"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  # Messaging substrate for the systemone distillation pipeline (OQ-0056):
  # capture -> chunker/synthetic-gen/labeler fission functions -> label store.
  # JetStream is PERSISTENT (replay is the point) — 20Gi local-path per pod.
  # mc hosts the JetStream domain; cc joins as a leafnode (see clusters/cc.yaml
  # patch) so capture on either side lands in the same streams. Single-server
  # (not a NATS cluster) until the pipeline proves out.
  nats:
    annotations:
      argocd.argoproj.io/sync-wave: "52"
    sources:
      - repoURL: https://nats-io.github.io/k8s/helm/charts/
        chart: nats
        targetRevision: 2.15.2
        helm:
          values: |
            config:
              cluster:
                enabled: false
              jetstream:
                enabled: true
                fileStore:
                  enabled: true
                  pvc:
                    enabled: true
                    size: 20Gi
                    storageClassName: local-path
            # Leafnode listener for cc to dial in over submariner (enabled via
            # cluster patch on cc only; see clusters/cc.yaml).
            # leafnodes:
            #   enabled: true
            nats:
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  # Fission serverless runtime for the distillation pipeline functions
  # (chunker, synthetic-gen, labeler). Deployed per-cluster alongside the
  # per-cluster NATS; functions are scheduled cluster-locally and talk to
  # their own cluster's NATS — no cross-cluster function traffic.
  fission:
    annotations:
      argocd.argoproj.io/sync-wave: "55"
      # Chronic Degraded (upstream quirk); SkipHealthCheck (sync-option form,
      # unlike ignore-healthcheck) actually skips wave-gating health waits —
      # argoproj/argo-cd#22940: ignore-healthcheck is display-only. Without
      # it the root sync hung on fission (2026-11-20).
      argocd.argoproj.io/sync-options: SkipHealthCheck=true
      argocd.argoproj.io/ignore-healthcheck: "true"
    sources:
      - repoURL: https://fission.github.io/fission-charts/
        chart: fission-all
        targetRevision: 1.27.0
        helm:
          values: |
            serviceType: ClusterIP
            router:
              serviceType: ClusterIP
            # Message-queue trigger uses NATS (not the default Kafka/Streams);
            # broker points at the same-namespace nats service.
            mqTrigger:
              enabled: true
              messageQueue:
                type: nats-streaming
            buildermgr:
              enabled: true
            function_controller:
              enabled: true
            influxdb:
              enabled: false
            prometheus:
              enabled: false
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  # Adopted from manual kubectl management (ownership handoff completed
  # 2026-10-13). Initial sync was deliberately manual + non-pruning for a safe
  # handoff; pruning is now enabled — resources removed from Git are deleted
  # from the cluster (e.g. the old L3 'ai' LB Service replaced by the Ingress).
  ai-proxy:
    path: llm-test/miaai-parity
    annotations:
      argocd.argoproj.io/sync-wave: "120"
      # Perpetually Progressing; SkipHealthCheck skips wave-gating (see fission note)
      # NOTE: Replace=true was NEVER in git — it was live-only drift (added
      # manually during adoption debugging). Declaring it in PR401 made the
      # root sync destructively replace the ai-proxy Application CR
      # (delete+recreate with finalizer cascade, "context deadline exceeded",
      # app Missing). Keep only SkipHealthCheck here.
      argocd.argoproj.io/sync-options: SkipHealthCheck=true
      argocd.argoproj.io/ignore-healthcheck: "true"
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      # Adoption used Argo's default client-side apply; keep that (no SSA
      # conflicts with historical kubectl-client-side-apply ownership).
      syncOptions: []

  memguard-dgx:
    path: llm-test/memguard
    annotations:
      argocd.argoproj.io/sync-wave: "124"
    syncPolicy:
      automated:
        prune: false
        selfHeal: true
      syncOptions:
        - ServerSideApply=true

  # External controller-runtime operator. Pinned to 0182ad8: removes the
  # duplicate ResourcePool/dgx-spark + tensorfold-v14 ownership that kept
  # re-applying managementMode: Observe and desiredState: Resident over the
  # homelab conductor-workloads intents (2026-11-12 dual-ownership incident).
  # Pools/workload intent now live ONLY in llm-test/conductor-workloads.
  conductor:
    repoURL: https://github.com/ProjectInitiative/conductor.git
    # 9973764: occupancy-aware adjacent placement — chooseAdjacentPair skips
    # nodes hosting foreign GPU pods, so two resident lanes coexist on the
    # 4-node fabric; recovery re-enters Placing and re-chooses automatically.
    # Controller image sha256:e0078647e91b8faf857c97a80e21b0a398eb6ca0a9f96d1efa2feac93be1c716.
    targetRevision: 99737640d3b90b44bf912b6846e73fdc8bf0bee6
    path: generator
    plugin:
      name: cdk8s-v1.0
    annotations:
      argocd.argoproj.io/sync-wave: "121"
    syncPolicy:
      automated:
        prune: false
        selfHeal: true
      syncOptions:
        - ServerSideApply=true

  # THE app for Conductor-managed workloads: pools + ManagedWorkload intents
  # AND every lane's serving manifests (llm-test/conductor-workloads/workloads/*).
  # One owner for the whole workload fleet (DEC-0061 lesson: no per-lane apps; per-workload dirs keep files isolated).
  # Prune is ON: removing a lane or MW from Git deletes its live objects.
  conductor-workloads:
    path: llm-test/conductor-workloads
    annotations:
      argocd.argoproj.io/sync-wave: "122"
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        - RespectIgnoreDifferences=true
    # desiredState is Conductor's runtime residency switch; allow manual cutovers
    # without Argo restoring the Git-declared value for any ManagedWorkload.
    # Deployment replicas + nodeSelector are Conductor-owned at runtime
    # (residency + placement pins) — Git declares the template, not the state.
    ignoreDifferences:
      - group: conductor.projectinitiative.io
        kind: ManagedWorkload
        jsonPointers:
          - /spec/desiredState
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
          - /spec/template/spec/nodeSelector

