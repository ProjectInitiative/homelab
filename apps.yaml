  argo:
    path: apps/vms/argo/config
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: argo-s3-creds
          mount: k8s
          path: "argo/s3-creds"
          destination: "argo-s3-creds"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        # Allow virtctl stop/start drift: without this, any sync re-applies
        # spec.runStrategy=Always and boots a VM the operator stopped.
        - RespectIgnoreDifferences=true
    ignoreDifferences:
      - group: kubevirt.io
        kind: VirtualMachine
        jsonPointers:
          - /spec/runStrategy
      # Temporary maintenance control: allow scaling any data keeper down
      # while Argo is halted so a writable CSI probe can own that node's
      # cache path. Restore all keepers before removing these rules.
      - group: apps
        kind: Deployment
        name: argo-data-ring-capstan1
        namespace: argo
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Deployment
        name: argo-data-ring-capstan2
        namespace: argo
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Deployment
        name: argo-data-ring-capstan3
        namespace: argo
        jsonPointers:
          - /spec/replicas

  argo-lite:
    # Dev container supplementing the argo VM (see dotfiles ARGO-LITE-HANDOFF.md
    # + keel dotfiles record). DEDICATED namespace: the juicefs-dev sidecar is
    # privileged (verified kernel requirement — direct mount(2) needs
    # CAP_SYS_ADMIN; Bidirectional propagation is privileged-only), and the
    # argo ns PSA labels are contended by the argo app (baseline) — co-location
    # made pod admission depend on which app synced last (2026-11-12). The
    # namespace.yaml in the app dir carries enforce=privileged; no
    # managedNamespaceMetadata pod-security here.
    # Home PVC on production juicefs-sc via CSI; juicefs-dev sidecar mounts
    # the dev FS out-of-band. Scoped: pod-level automountServiceAccountToken:
    # false + resource caps.
    path: apps/base/argo-lite/config
    annotations:
      argocd.argoproj.io/sync-wave: "45"
    vaultSecrets:
      # Own auth resources in the dedicated namespace (no sharing fight — the
      # argo ns operator-auth/operator-auth-sa belong to the argo app).
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        # Same OpenBao record the juicefs-dev helpers use; key schema matches
        # juicefs-creds (metaurl/access-key/secret-key/passphrase).
        - name: juicefs-dev-creds
          mount: k8s
          path: "juicefs-dev/config"
          destination: "juicefs-dev-creds"
        # Stable sshd host key (ed25519 PEM in the `key` field). Without it
        # the entrypoint generates an ephemeral key each boot and every pod
        # restart trips clients' known_hosts (REMOTE HOST IDENTIFICATION
        # CHANGED). Owner put the key in OpenBao 2026-11-13.
        - name: ssh-host-key
          mount: k8s
          path: "argo-lite/ssh-host-key"
          destination: "argo-lite-ssh-host-key"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  kubevirt-manager-auth:
    path: bootstrap/base/kubevirt-manager-auth/config
    annotations:
      argocd.argoproj.io/sync-wave: "31"
    vaultSecrets:
      createAuth: true
