defaults:
  repoURL: https://github.com/projectinitiative/homelab.git
  targetRevision: HEAD
  # syncPolicy defaults are now handled in the Pulumi code

catalog:
  # Bootstrap / Infrastructure
  kube-vip-app:
    path: bootstrap/mc/kube-vip/config
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
  
  admin-access:
    path: bootstrap/base/admin-access
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
  
  local-path-provisioner:
    path: bootstrap/base/local-path-provisioner/config
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - RespectIgnoreDifferences=true
  
  policies:
    path: bootstrap/base/policies
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false # Policies usually don't need their own namespace
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - RespectIgnoreDifferences=true
  
  sc-local-path:
    path: bootstrap/base/lpp
    directory:
      include: '*.yaml'
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  coredns-custom:
    path: apps/base/coredns-custom/config
    annotations:
      argocd.argoproj.io/sync-wave: "5"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
  
  tpm-device-plugin:
    path: bootstrap/base/tpm-device-plugin/plugin
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    syncPolicy:
      syncOptions: []

  nvidia-device-plugin:
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    sources:
      - repoURL: https://nvidia.github.io/k8s-device-plugin
        chart: nvidia-device-plugin
        targetRevision: 0.19.3
        helm:
          values: |
            # Drivers and NVIDIA Container Toolkit are installed on the GB10 hosts.
            # Limit the plugin to the two GPU nodes for now.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [chronometer, sextant, capstan1]
            # The plugin must run with the NVIDIA runtime so NVML and driver
            # libraries are injected into the container.
            runtimeClassName: nvidia
            tolerations: []
            gfd:
              enabled: false
            nfd:
              enabled: false
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  amd-device-plugin:
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    sources:
      - repoURL: https://rocm.github.io/k8s-device-plugin/
        chart: amd-gpu
        targetRevision: 0.22.0
        helm:
          values: |
            node_selector_enabled: true
            node_selector:
              kubernetes.io/hostname: astrolabe
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  cert-manager:
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    sources:
      - repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.18.1
        helm:
          valueFiles:
            - $values/bootstrap/base/cert-manager/cert-manager-values.yaml
      - repoURL: https://github.com/projectinitiative/homelab.git
        targetRevision: HEAD
        ref: values
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - RespectIgnoreDifferences=true
  
  openbao:
    annotations:
      argocd.argoproj.io/sync-wave: "90"
    sources:
      - repoURL: https://openbao.github.io/openbao-helm
        chart: openbao
        targetRevision: 0.28.6
        helm:
          valueFiles:
            - $values/bootstrap/base/openbao/openbao-values.yaml
      - repoURL: https://github.com/projectinitiative/homelab.git
        targetRevision: HEAD
        ref: values
      - repoURL: https://github.com/projectinitiative/homelab.git
        targetRevision: HEAD
        path: bootstrap/base/openbao/config
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: openbao-snapshot-s3
          mount: k8s
          path: "openbao-snapshot/s3"
          destination: "openbao-snapshot-s3"
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        kind: MutatingWebhookConfiguration
        name: openbao-agent-injector-cfg
  
  openbao-auth-config:
    path: bootstrap/base/openbao-auth-config/config
    syncPolicy:
      syncOptions: []
  
  openbao-secrets-operator:
    repoURL: https://github.com/hashicorp/vault-secrets-operator.git
    path: chart
    targetRevision: v1.4.0
    helm:
      values: |
        defaultVaultConnection:
          enabled: false
  
  csi-snapshotter:
    path: bootstrap/base/csi-snapshotter/config
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  cnpg-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "30"
    sources:
      - repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        targetRevision: 0.29.0
        helm:
          values: |
            crds.create: true
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  barman-cloud-plugin:
    annotations:
      argocd.argoproj.io/sync-wave: "35"
    sources:
      - repoURL: https://cloudnative-pg.github.io/charts
        chart: plugin-barman-cloud
        targetRevision: 0.7.0
        helm:
          values: |
            crds.create: true
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
  
  tidb-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "30"
    sources:
      - repoURL: https://charts.pingcap.com/
        chart: tidb-operator
        targetRevision: v1.6.3
      - repoURL: https://github.com/pingcap/tidb-operator.git
        targetRevision: v1.6.3
        path: manifests
        directory:
            include: 'crd.yaml'
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  tikv-cluster:
    path: bootstrap/base/tikv-cluster
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  juicefs-csi-driver:
    annotations:
      argocd.argoproj.io/sync-wave: "30"
    sources:
      - repoURL: https://juicedata.github.io/charts/
        chart: juicefs-csi-driver
        targetRevision: 0.31.9
        helm:
          values: |
            globalConfig:
              enabled: true
              manageByHelm: true
              enableNodeSelector: true
              mountPodPatch:
                - nodeSelector:
                    kubernetes.io/hostname: astrolabe
                  pvcSelector:
                    matchStorageClassName: juicefs-sc
                  mountOptions:
                    - cache-dir=/mnt/pool/juicefs
                    - cache-size=1500000
                - nodeSelector:
                    kubernetes.io/hostname: chronometer
                  pvcSelector:
                    matchStorageClassName: juicefs-sc
                  mountOptions:
                    - cache-dir=/mnt/pool/juicefs
                    - cache-size=550000
                - nodeSelector:
                    kubernetes.io/hostname: sextant
                  pvcSelector:
                    matchStorageClassName: juicefs-sc
                  mountOptions:
                    - cache-dir=/mnt/pool/juicefs
                    - cache-size=550000
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  juicefs-platform:
    path: bootstrap/base/juicefs-platform
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    vaultSecrets:
      createAuth: true
      namespace: production
      role: openbao-secrets-operator
      audiences:
        - vault
      secrets:
        - name: juicefs-creds
          mount: k8s
          path: "juicefs/config"
          destination: "juicefs-creds"
        - name: juicefs-key
          mount: k8s
          path: "juicefs/pem"
          destination: "juicefs-key"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  postgres-cluster:
    path: bootstrap/base/cnpg/database
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: postgres-cluster-s3
          mount: k8s
          path: "cnpg/s3"
          destination: "postgres-cluster-s3"
        - name: juicefs-postgres-creds
          mount: k8s
          # Project the same OpenBao source used by JuiceFS into a CNPG
          # basic-auth Secret. OpenBao must provide username and password.
          path: "juicefs/config"
          destination: "juicefs-postgres-creds"
          destinationType: "kubernetes.io/basic-auth"
          destinationIncludes:
            - username
            - password
          overwrite: true
    syncPolicy:
      automated:
        prune: false
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
    
  garage:
    path: bootstrap/base/garage
    critical: true
    plugin:
      name: kustomized-git-helm-v1.0
    annotations:
      argocd.argoproj.io/sync-wave: "100"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: garage-rpc-secret
          mount: k8s
          path: "garage/rpc"
          destination: "garage-rpc-secret"
    ignoreDifferences:
      - group: ""
        jsonPointers:
        - /data/rpcSecret
        kind: Secret
        name: garage-rpc-secret
      - group: apps
        kind: StatefulSet
        jsonPointers:
        - /spec/volumeClaimTemplates
    syncPolicy:
      automated:
        prune: false
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
  
  tailscale-operator:
    sources:
      - repoURL: https://pkgs.tailscale.com/helmcharts
        chart: tailscale-operator
        targetRevision: 1.102.3
        helm:
          values: |
            apiServerProxyConfig:
              mode: "true"
              allowImpersonation: "true"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: tailscale-auth
          mount: k8s
          path: "tailscale-operator"
          destination: "operator-oauth"
          overwrite: true
  
  garage-mem:
    path: bootstrap/mc/garage-mem

  garage-migrate:
    path: bootstrap/base/garage-migrate
    plugin:
      name: kustomized-git-helm-v1.0
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  prometheus-operator-crds:
    annotations:
      argocd.argoproj.io/sync-wave: "10"
    sources:
      - repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus-operator-crds
        targetRevision: 17.0.2
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

  grafana-alloy:
    sources:
      - repoURL: https://grafana.github.io/helm-charts
        chart: alloy
        targetRevision: 0.9.1
        helm:
          values: |
            alloy:
              clustering:
                enabled: true
                name: "homelab-alloy-cluster"
                portName: "http"
              configMap:
                content: |
                  logging {
                    level = "info"
                    format = "logfmt"
                  }

                  discovery.kubernetes "pods" {
                    role = "pod"
                  }

                  loki.source.kubernetes "pod_logs" {
                    targets    = discovery.kubernetes.pods.targets
                    forward_to = [loki.relabel.cluster.receiver]
                  }

                  loki.relabel "cluster" {
                    forward_to = [loki.write.default.receiver]

                    rule {
                      action        = "replace"
                      target_label  = "cluster"
                      replacement   = sys.env("CLUSTER_NAME")
                    }
                  }

                  loki.write "default" {
                    endpoint {
                      url = "http://100.119.112.42:3100/loki/api/v1/push"
                    }
                  }

                  // Prometheus Operator Support
                  prometheus.operator.servicemonitors "primary_sm" {
                    clustering {
                        enabled = true
                    }
                    forward_to = [prometheus.relabel.cluster.receiver]
                  }

                  prometheus.operator.podmonitors "primary_pm" {
                    clustering {
                        enabled = true
                    }
                    forward_to = [prometheus.relabel.cluster.receiver]
                  }

                  prometheus.relabel "cluster" {
                    forward_to = [prometheus.remote_write.default.receiver]

                    rule {
                      action        = "replace"
                      target_label  = "cluster"
                      replacement   = sys.env("CLUSTER_NAME")
                    }
                  }

                  prometheus.remote_write "default" {
                    endpoint {
                      url = "http://100.119.112.42:9090/api/v1/write"
                    }
                  }

  karmada-member:
    path: bootstrap/base/karmada-member
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    syncPolicy:
      syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true

  karmada-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    sources:
      - repoURL: https://github.com/karmada-io/karmada.git
        targetRevision: v1.16.1
        path: charts/karmada-operator
        helm:
          values: |
            karmadaOperatorImageVersion: "v1.16.1"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  karmada-instance:
    path: bootstrap/base/karmada-instance
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  submariner-k8s-broker:
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    sources:
      - repoURL: https://submariner-io.github.io/submariner-charts/charts
        chart: submariner-k8s-broker
        targetRevision: 0.7.0
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  submariner-operator:
    annotations:
      argocd.argoproj.io/sync-wave: "50"
    sources:
      - repoURL: https://submariner-io.github.io/submariner-charts/charts
        chart: submariner-operator
        targetRevision: 0.24.0
    helm:
      values: |
        submariner:
          brokerK8sSecret: "submariner-broker-info"
          brokerK8sRemoteNamespace: "submariner-k8s-broker"
          natEnabled: true
          globalnetEnabled: true
        ipsec:
          pskSecret: submariner-ipsec-psk
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      audiences:
        - vault
      secrets:
        - name: submariner-broker-info
          mount: k8s
          path: "submariner/broker-info"
          destination: "submariner-broker-info"
        - name: submariner-ipsec-psk
          mount: k8s
          path: "submariner/ipsec-psk"
          destination: "submariner-ipsec-psk"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  # Apps
  tailscale-proxy-groups:
    path: apps/base/tailscale-proxy-groups/config
    syncPolicy:
      syncOptions: []
  
  temp-egress-mc:
    path: apps/base/temp-egress-mc/config

  temp-egress-cc:
    path: apps/base/temp-egress-cc/config
    syncPolicy:
      syncOptions: []
  
  dnsutils:
    path: apps/base/dnsutils/config
  
  docker-registry:
    path: apps/base/docker-registry/config
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: registry-s3-creds
          mount: k8s
          path: "docker-registry/s3"
          destination: "registry-s3-creds"
          overwrite: true
    syncPolicy:
      automated:
        prune: true
        selfHeal: false

  immich:
    path: apps/base/immich/config
    critical: true
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: immich-postgres
          mount: k8s
          path: "immich/postgres"
          destination: "immich-postgres-creds"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  kubevirt:
    path: bootstrap/base/kubevirt/config
    annotations:
      argocd.argoproj.io/sync-wave: "30"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        name: cdis.cdi.kubevirt.io
        jsonPointers:
          - /spec/versions

  argo:
    path: apps/vms/argo/config
    annotations:
      argocd.argoproj.io/sync-wave: "40"
    vaultSecrets:
      createAuth: true
      role: openbao-secrets-operator
      namespace: production
      audiences:
        - vault
      secrets:
        - name: argo-s3-creds
          mount: k8s
          path: "argo/s3-creds"
          destination: "argo-s3-creds"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
  
  privateer:
    path: apps/base/privateer/config

  mcp-kubernetes:
    path: apps/base/mcp-kubernetes/config
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

  # nixos-remote-builder:
  #   path: apps/base/nixos-remote-builder/config
  #   vaultSecrets:
  #     createAuth: true
  #     role: openbao-secrets-operator
  #     audiences:
  #       - vault
  #     secrets:
  #       - name: nixos-builder-host-key
