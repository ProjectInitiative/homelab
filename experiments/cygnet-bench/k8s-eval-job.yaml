apiVersion: batch/v1
kind: Job
metadata:
  name: gate-eval
  namespace: llm-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: gate-eval }
    spec:
      restartPolicy: Never
      containers:
        - name: eval
          image: python:3.12-slim
          env:
            - name: GATE_BASE
              value: "http://cygnet-classifier-nv.llm-test.svc.cluster.local:8009"
          command: ["sh", "-c", "mkdir -p /results-mnt/cygnet-bench && python3 /app/eval_gate.py --concurrency 6 --out /results-mnt/cygnet-bench/gate-eval-nv.json"]
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: corpus, mountPath: /app/corpus, readOnly: true }
            - { name: results, mountPath: /results-mnt }
      volumes:
        - name: app
          configMap: { name: gate-eval-code }
        - name: corpus
          configMap: { name: gate-eval-corpus }
        # results on the shared RWX PVC so they survive pod completion
        - name: results
          persistentVolumeClaim: { claimName: model-cache }
