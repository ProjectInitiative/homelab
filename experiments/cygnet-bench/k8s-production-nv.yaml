apiVersion: apps/v1
kind: Deployment
metadata:
  name: cygnet-classifier-nv
  namespace: llm-test
  labels:
    app: cygnet-classifier-nv
    tier: ai-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: cygnet-classifier-nv }
  template:
    metadata:
      labels: { app: cygnet-classifier-nv, role: classifier, tier: ai-platform }
    spec:
      # chronometer = NVIDIA DGX Spark (ARM64, GB10)
      nodeSelector:
        kubernetes.io/hostname: chronometer
      runtimeClassName: nvidia
      tolerations:
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: drop-caches
          image: busybox:stable
          command: ["sh", "-c", "sync; echo 3 > /proc/sys/vm/drop_caches || echo 'could not drop caches; continuing'"]
          securityContext: { privileged: true }
        - name: preflight
          image: busybox:stable
          command: ["sh", "-c", "test -f /models/hf/gemma-4-12b-it/.download-complete && test -f /models/hf/gemma-4-12b-it/config.json && echo 'weights preflight OK'"]
          volumeMounts: [{ name: models, mountPath: /models, readOnly: true }]
      containers:
        - name: engine
          image: vllm/vllm-openai:v0.30.0
          # TRITON_LIBCUDA_PATH symlink dance: the Spark's driver layout needs
          # libcuda where triton expects it (pattern from glm53-exl3-head).
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /run/triton-cuda-driver
              ln -sfn /usr/lib/aarch64-linux-gnu/libcuda.so.1 /run/triton-cuda-driver/libcuda.so.1
              ln -sfn /usr/lib/aarch64-linux-gnu/libcuda.so.1 /run/triton-cuda-driver/libcuda.so
              export TRITON_LIBCUDA_PATH=/run/triton-cuda-driver
              exec vllm serve /models/hf/gemma-4-12b-it \
                --served-model-name cygnet \
                --host 0.0.0.0 --port 8890 \
                --max-model-len 16384 \
                --gpu-memory-utilization 0.26
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 40Gi
            requests: { cpu: "8", memory: 24Gi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
          startupProbe:
            httpGet: { path: /health, port: 8890 }
            periodSeconds: 15
            failureThreshold: 80
          readinessProbe:
            httpGet: { path: /health, port: 8890 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8890 }
            periodSeconds: 30
            failureThreshold: 5
        - name: shim
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import shutil, urllib.request, time, os
              shutil.copy("/assets/cygnet_shim.py", "/tmp/shim.py")
              while True:
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8890/health", timeout=5)
                      break
                  except Exception:
                      print("waiting for engine", flush=True); time.sleep(5)
              print("engine up; starting shim", flush=True)
              os.execv("/usr/local/bin/python3", ["python3", "/tmp/shim.py"])
          env:
            - { name: SHIM_VLLM, value: "http://127.0.0.1:8890/v1/chat/completions" }
            - { name: SHIM_MODEL, value: "cygnet" }
            - { name: SHIM_PORT, value: "8009" }
            - { name: SHIM_HOST, value: "0.0.0.0" }
            - { name: SHIM_TEMPERATURE, value: "3.4" }
          ports:
            - { name: systemone, containerPort: 8009 }
          volumeMounts:
            - { name: assets, mountPath: /assets, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: 8009 }
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /healthz, port: 8009 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8009 }
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-cache }
        - name: assets
          configMap: { name: cygnet-prod-config }
---
apiVersion: v1
kind: Service
metadata:
  name: cygnet-classifier-nv
  namespace: llm-test
  labels: { app: cygnet-classifier-nv }
spec:
  selector: { app: cygnet-classifier-nv }
  ports:
    - name: systemone
      port: 8009
      targetPort: 8009
