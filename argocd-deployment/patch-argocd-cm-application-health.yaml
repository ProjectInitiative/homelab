apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: no namespace here — the upstream argocd-cm has none in the raw
  # install.yaml; kustomize adds namespace: argocd AFTER strategic merge
  # patch matching, so a namespaced patch target would never match.
  name: argocd-cm
data:
  # App-of-apps health: a child Application's WORKLOAD health must not gate
  # its parent's sync. The parent may need to sync exactly when the child's
  # workloads are unhealthy — e.g. the 2026-11-17 deadlock where
  # homelab-root waited for glm53-flash-spark-1104 to go Healthy while the
  # lane pods needed the (blocked) controller roll to become healthy.
  # Gate on the child's sync OUTCOME instead: Degraded only when the child's
  # own sync failed (SyncError). Workload health stays visible in the child
  # app itself and still drives its own rollouts.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "child Application health not aggregated; parent gates on sync outcome"
    if obj.status ~= nil and obj.status.operationState ~= nil and obj.status.operationState.phase ~= nil then
      phase = obj.status.operationState.phase
      if phase == "Failed" or phase == "Error" then
        hs.status = "Degraded"
        hs.message = obj.status.operationState.message or "child sync failed"
      end
    end
    return hs
