apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
      - name: cdk8s-cmp
        image: ghcr.io/projectinitiative/cdk8s-cmp-plugin:latest
        command: ["/var/run/argocd/argocd-cmp-server"]
        env:
        - name: HOME
          value: /home/argocd
        - name: USER
          value: argocd
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: cdk8s-plugin-config
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
        - name: cdk8s-cmp-tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/argocd
        - name: cdk8s-cmp-home
          mountPath: /home/argocd/cmp-server/plugins/cdk8s
      volumes:
      - name: cdk8s-plugin-config
        configMap:
          name: cdk8s-cmp-plugin
      - name: cdk8s-cmp-tmp
        emptyDir: {}
      - name: cdk8s-cmp-home
        emptyDir: {}
