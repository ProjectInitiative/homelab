              CGROUP=/sys/fs/cgroup${CGROUP_REL}
              printf 'cgroup_path=%s\n' "$CGROUP" | tee -a /diagnostics/sextant-cgroup.log
              (
                while true; do
                  date -Ins
                  grep -E '^(MemTotal|MemFree|MemAvailable|Cached|Buffers|Active\(file\)|Inactive\(file\)|Active\(anon\)|Inactive\(anon\)|AnonPages|Mapped|Shmem|Slab|SReclaimable|SUnreclaim|KReclaimable|Unevictable|Mlocked|SwapFree):' /proc/meminfo
                  sleep 1
                done
              ) >> /diagnostics/sextant-memory.log 2>&1 &
