                  date -Ins
                  for f in memory.current memory.peak memory.max memory.high memory.events memory.events.local memory.stat; do
                    echo "--- $f ---"
                    cat "$CGROUP/$f" 2>&1 || true
                  done
                  sleep 1
                done
              ) >> /diagnostics/sextant-cgroup.log 2>&1 &
              ulimit -l unlimited || true
              ulimit -s 65536 || true
              rm -f /coordination/rank1-starting
              touch /coordination/rank1-starting
              trap 'rm -f /coordination/rank1-starting' EXIT
              MODEL_ROOT=/local-models/deepseek-v4-flash-vision-exp
              MODEL_REVISION=86f746b36186f0e567729a5c06a8c918caba82a9
              MODEL_DIR="$MODEL_ROOT"
              test -f "$MODEL_DIR/config.json"
              test -f "$MODEL_DIR/encoding/encoding_dsv4.py"
              cp "$MODEL_DIR/encoding/encoding_dsv4.py" /usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py
              mkdir -p /opt/dspark-patches/vision_exp
              cp /vision-runtime/vision-exp-hotfix.py /opt/vision-exp-hotfix.py
              cp /vision-runtime/vision_exp/*.py /opt/dspark-patches/vision_exp/
              bash /vision-runtime/vision-exp-apply.sh
              echo "Loading DeepSeek Vision-Exp from local snapshot $MODEL_DIR"
              echo "Memory before unconditional cache reclamation:"
              grep -E '^(MemFree|MemAvailable|Cached|Buffers|Active\(file\)|Inactive\(file\)|AnonPages|Mapped|SReclaimable):' /proc/meminfo
              sync
              echo 3 > /proc/sys/vm/drop_caches
              echo "Memory after unconditional cache reclamation:"
              grep -E '^(MemFree|MemAvailable|Cached|Buffers|Active\(file\)|Inactive\(file\)|AnonPages|Mapped|SReclaimable):' /proc/meminfo
              python3 - <<'PY'
              import torch
              free, total = torch.cuda.mem_get_info()
              print(
                  f"CUDA immediately before vLLM: "
                  f"free={free/2**30:.2f} GiB "
                  f"total={total/2**30:.2f} GiB"
              )
              PY
              export PATH="/usr/local/cuda/bin:${PATH:-}"
              export CUDA_HOME="${CUDA_HOME:-/usr/local/cuda}"
              export CUDA_PATH="${CUDA_PATH:-$CUDA_HOME}"
              export CUDAToolkit_ROOT="${CUDAToolkit_ROOT:-$CUDA_HOME}"
              export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
              REAL_LIBCUDA=/usr/lib/aarch64-linux-gnu/libcuda.so.1
              test -f "$REAL_LIBCUDA"
              test "$(readlink -f "$REAL_LIBCUDA")" != */stubs/libcuda.so
              mkdir -p /run/triton-cuda-driver
              ln -sfn "$REAL_LIBCUDA" /run/triton-cuda-driver/libcuda.so.1
              ln -sfn "$REAL_LIBCUDA" /run/triton-cuda-driver/libcuda.so
              export TRITON_LIBCUDA_PATH=/run/triton-cuda-driver
              export LD_LIBRARY_PATH="/run/triton-cuda-driver:/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
              {
                echo "CUDA runtime environment before vLLM"; date -Ins
                printf 'PATH=%s\nCUDA_HOME=%s\nCUDA_PATH=%s\nCUDAToolkit_ROOT=%s\nLD_LIBRARY_PATH=%s\nTRITON_LIBCUDA_PATH=%s\n' "$PATH" "$CUDA_HOME" "$CUDA_PATH" "$CUDAToolkit_ROOT" "$LD_LIBRARY_PATH" "$TRITON_LIBCUDA_PATH"
                echo '=== driver links ==='; ls -l /run/triton-cuda-driver
                echo '=== ldconfig ==='; /sbin/ldconfig -p 2>/dev/null | grep -E 'libcuda\\.so' || true
                echo '=== filesystem ==='; find /usr /lib /usr/local -type f -o -type l 2>/dev/null | grep -E '/libcuda\\.so(\\.|$)' | sort -u || true
                python3 - <<'PY'
              import ctypes, pathlib, triton
              for name in ('libcuda.so.1', 'libcuda.so'):
                  try: print(name, 'OK', ctypes.CDLL(name))
                  except Exception as e: print(name, 'FAILED', repr(e)); raise
              print('triton:', triton.__version__)
              root = pathlib.Path(triton.__file__).resolve().parent
              for p in root.rglob('driver.py'):
                  text = p.read_text(errors='ignore')
                  if 'libcuda' in text:
                      print('triton driver:', p)
                      for i, line in enumerate(text.splitlines(), 1):
                          if any(x in line for x in ('libcuda', 'TRITON_LIBCUDA_PATH', 'ldconfig')): print(f'{i}: {line}')
              PY
              } >> /diagnostics/sextant-cuda-libs.log 2>&1
              export TILELANG_CACHE_DIR=/cache/jit/tilelang
              export TRITON_CACHE_DIR=/cache/jit/triton
              export B12X_CUTE_COMPILE_CACHE_DIR=/cache/jit/b12x-cute
              mkdir -p "$TILELANG_CACHE_DIR" "$TRITON_CACHE_DIR" "$B12X_CUTE_COMPILE_CACHE_DIR"
              {
                echo "JIT cache environment before vLLM"; date -Ins
                printf 'TILELANG_CACHE_DIR=%s\nTRITON_CACHE_DIR=%s\nB12X_CUTE_COMPILE_CACHE_DIR=%s\n' "$TILELANG_CACHE_DIR" "$TRITON_CACHE_DIR" "$B12X_CUTE_COMPILE_CACHE_DIR"
                find /cache/jit -maxdepth 2 -type f | head -100 || true
              } >> /diagnostics/sextant-jit-cache.log 2>&1
              exec vllm serve "$MODEL_DIR" \
                --trust-remote-code \
                --tokenizer-mode deepseek_v4 \
                --moe-backend flashinfer_b12x \
                --safetensors-load-strategy lazy \
                --distributed-executor-backend mp \
                --tensor-parallel-size 2 \
                --nnodes 2 \
                --node-rank 1 \
                --master-addr 172.16.5.55 \
                --master-port 25000 \
                --headless \
                --gpu-memory-utilization 0.82 \
                --kv-cache-dtype nvfp4_ds_mla \
                --block-size 256 \
                --max-model-len 1048576 \
                --max-num-seqs 6 \
                --max-num-batched-tokens 8192 \
                --enable-prefix-caching --enable-chunked-prefill \
                --speculative-config '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic"}' \
                --allowed-local-media-path /models
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: local-models
              mountPath: /local-models
            - name: dshm
              mountPath: /dev/shm
            - name: diagnostics
              mountPath: /diagnostics
            - name: vision-runtime
              mountPath: /vision-runtime
            - name: infiniband
              mountPath: /dev/infiniband
            - name: jit-cache
              mountPath: /cache/jit
            - name: coordination
              mountPath: /coordination
        - name: startup-marker
          image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              while test ! -f /coordination/rank1-starting; do sleep 1; done
              python3 -m http.server 9090 --directory /coordination --bind 0.0.0.0 &
              server=$!
              while test -f /coordination/rank1-starting; do sleep 1; done
              kill "$server" 2>/dev/null || true
              wait "$server" 2>/dev/null || true
              exit 1
          ports:
            - name: startup
              containerPort: 9090
          volumeMounts:
            - name: coordination
              mountPath: /coordination
      volumes:
        - name: vision-runtime
          emptyDir: {}
        - name: vision-patch-root
          configMap:
            name: miaai-vision-exp-root
        - name: vision-patch-deps
          configMap:
            name: miaai-vision-exp-deps
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: local-models
          hostPath:
            path: /var/lib/llm-test/deepseek-local
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: diagnostics
          hostPath:
            path: /var/lib/llm-test/diagnostics
            type: DirectoryOrCreate
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
        - name: coordination
          emptyDir: {}
        - name: jit-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache
            type: DirectoryOrCreate

# Do not put the token in this file. VSO reads it from OpenBao and creates
# Secret/huggingface above. Expected OpenBao KV-v2 location/key:
# k8s/llm-test/huggingface, HF_TOKEN.
