                    loader = getattr(param, "weight_loader", None) or default_weight_loader
                    if loader is not None:
                        loader(param, weight)
                    else:
                        param.data.copy_(weight)
                    loaded.add(name)

            loaded |= orig_model_load(self, _filtered())
