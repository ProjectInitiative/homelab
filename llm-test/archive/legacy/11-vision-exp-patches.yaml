                    default_weight_loader,
                )
            except ImportError:
                default_weight_loader = None
            params_dict = dict(self.named_parameters())
            loaded: set[str] = set()

            def _filtered():
                for name, weight in weights:
                    if is_unregistered_router_bias(name, params_dict):
                        continue
