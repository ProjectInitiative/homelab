    def grid_tokens(best_height, best_width, patch_size, downsample_ratio):
        """Number of LLM tokens the aligner grid occupies (N-layout, incl. row/align padding)."""
        n_llm_h = math.ceil((best_height // patch_size) / downsample_ratio)
        n_llm_w = math.ceil((best_width // patch_size) / downsample_ratio)
        num_tokens = n_llm_h * (n_llm_w + 1) + 2
        if n_llm_h % 2 == 1:
            num_tokens += n_llm_w + 1
        num_tokens += (n_llm_h + 1) // 2 * (n_llm_w + 1) % 2 * 2
        return n_llm_h, n_llm_w, num_tokens


    def solve_resize_ratio(height, width, patch_size, downsample_ratio, max_n_token):
        r = height / width
        max_w_float = math.sqrt((max_n_token - 2) / r + 0.25) - 0.5
        max_h_float = max_w_float * r
        if max_w_float < 1.0:
            max_w = 1
            max_h = (max_n_token - 2) // (max_w + 1)
            if max_h % 2 == 1:
                max_h -= 1
            best_width = max_w * patch_size * downsample_ratio
            best_height = max_h * patch_size * downsample_ratio
        elif max_h_float < 2.0:
            max_h = 2
            max_w = ((max_n_token - 2) // max_h) - 1
            assert max_w > 1
            best_width = max_w * patch_size * downsample_ratio
            best_height = max_h * patch_size * downsample_ratio
        else:
            max_w = math.floor(max_w_float)
            max_h = math.floor(max_h_float)
            if max_h % 2 == 1:
                max_h -= 1
            beta = min(
                max_w * patch_size * downsample_ratio / width,
                max_h * patch_size * downsample_ratio / height,
            )
            best_width = math.floor(width * beta / patch_size) * patch_size
            best_height = math.floor(height * beta / patch_size) * patch_size
        n_llm_h, n_llm_w, num_tokens = grid_tokens(
            best_height, best_width, patch_size, downsample_ratio
        )
        return n_llm_h, n_llm_w, best_height, best_width, num_tokens


    def safe_resize(height, width, best_height, best_width, patch_size, downsample_ratio, max_n_token):
        max_n_token -= COMPRESS_PAD_TO - 1
        n_llm_h, n_llm_w, num_tokens = grid_tokens(
            best_height, best_width, patch_size, downsample_ratio
        )
        budget = max_n_token
        while num_tokens > max_n_token:
            n_llm_h, n_llm_w, best_height, best_width, num_tokens = solve_resize_ratio(
                height, width, patch_size, downsample_ratio, budget
            )
            budget -= 1
        return n_llm_h, n_llm_w, best_height, best_width


    def load_image_bytes(record) -> bytes:
        """Load image bytes from raw/base64 data, an Anthropic source, URL, or path."""
        data = record.get("data")
        if isinstance(data, bytes):
            return data
        if isinstance(data, str):
            return base64.b64decode(data)

        source = record.get("source")
        if isinstance(source, dict):
            if source.get("data") is not None:
                return base64.b64decode(source["data"])
            if source.get("url"):
                return load_image_bytes({"url": source["url"]})

        url = record.get("url")
        if isinstance(url, str) and url:
            if url.startswith("data:"):
                header, _, payload = url.partition(",")
                if ";base64" not in header:
                    raise ValueError(f"Unsupported data URL encoding: {header}")
                return base64.b64decode(payload)
            if url.startswith(("http://", "https://")):
                with urlopen(url, timeout=30) as response:
                    return response.read()
            with open(url, "rb") as file:
                return file.read()

        raise ValueError(f"Cannot load image from record: {list(record.keys())}")


    def pil_to_patches(image: PILImage.Image, args) -> tuple[Any, int, int, int, int]:
        """Resize/pad one RGB image and return ViT patches plus LLM grid sizes."""
        import torch

        _Image, ImageOps = _pil()

        p = args.vision_patch_size
        image = image.convert("RGB")
        width, height = image.size
        if args.vision_max_wh_ratio is not None and width > height * args.vision_max_wh_ratio:
            width = height * args.vision_max_wh_ratio
        if 0 < width * height < args.vision_min_pixels:
            ratio = (args.vision_min_pixels / (width * height)) ** 0.5
            width = int(width * ratio)
            height = int(height * ratio)
        best_width = math.ceil(width / p) * p
        best_height = math.ceil(height / p) * p
        n_llm_h, n_llm_w, best_height, best_width = safe_resize(
            height,
            width,
            best_height,
            best_width,
            p,
            args.vision_downsample_ratio,
            args.vision_max_n_token,
        )
        n_vit_h, n_vit_w = best_height // p, best_width // p
        src_w, src_h = image.size
        if args.vision_max_wh_ratio is not None and src_w >= args.vision_max_wh_ratio * src_h:
            image = image.resize((best_width, best_height))
        else:
            image = ImageOps.pad(image, (best_width, best_height), color=(127, 127, 127))
        try:
            import numpy as np

            x = torch.from_numpy(np.asarray(image, dtype=np.float32)).permute(2, 0, 1) / 255
        except ImportError:
            pixels = (
                image.get_flattened_data()
                if hasattr(image, "get_flattened_data")
                else image.getdata()
            )
            x = torch.tensor(pixels, dtype=torch.float32)
            x = x.view(image.height, image.width, 3).permute(2, 0, 1) / 255
        x = ((x - 0.5) / 0.5).to(torch.bfloat16)
        patches = (
            x.reshape(3, n_vit_h, p, n_vit_w, p)
            .permute(1, 3, 0, 2, 4)
            .reshape(n_vit_h * n_vit_w, 3, p, p)
        )
        return patches, n_vit_h, n_vit_w, n_llm_h, n_llm_w


    def load_image(record, args):
        """Load and transform one image record into ViT patches."""
        Image, _ImageOps = _pil()
        with Image.open(io.BytesIO(load_image_bytes(record))) as source:
            image = source.convert("RGB")
            return pil_to_patches(image, args)


    def build_image_block(n_llm_h: int, n_llm_w: int, start_pos: int):
        """Builds the N-layout token types (final order) and the aligner-row order for IMAGE slots."""
        import torch

        compress_pad = compress_pad_tokens(start_pos)
        pad_h = n_llm_h % 2
        rows = n_llm_h + pad_h
        row_len = n_llm_w + 1
        pad_last = rows // 2 * row_len % 2 * 2
        types = torch.tensor(
            ([IMAGE] * n_llm_w + [IMAGE_NEW_LINE]) * n_llm_h + [IMAGE_PAD] * (row_len * pad_h),
            dtype=torch.int64,
        )
        order = torch.arange(rows * row_len).view(rows // 2, 2, row_len).transpose(1, 2).reshape(-1)
        image_idx = torch.full((rows * row_len,), -1, dtype=torch.int64)
        image_idx.view(rows, row_len)[:n_llm_h, :n_llm_w] = torch.arange(n_llm_h * n_llm_w).view(
            n_llm_h, n_llm_w
        )
        perm = image_idx[order]
        perm = perm[perm >= 0]
        types = torch.cat(
            [
                torch.full((compress_pad,), IMAGE_PAD, dtype=torch.int64),
                torch.tensor([IMAGE_START]),
                types[order],
                torch.full((pad_last,), IMAGE_PAD, dtype=torch.int64),
                torch.tensor([IMAGE_END]),
            ]
        )
        return types, perm
  processor.py: |
    """vLLM 0.25 multimodal processor for DeepSeek-V4-Flash-Vision-Exp.

    Images only. The checkpoint has no video encoder; GIF is a still frame via PIL.
    """
    from __future__ import annotations

    from collections.abc import Mapping, Sequence
    from typing import Any

    import torch
    from transformers.feature_extraction_utils import BatchFeature

    from vllm.inputs import MultiModalDataDict
    from vllm.multimodal import MULTIMODAL_REGISTRY
    from vllm.multimodal.inputs import MultiModalFieldConfig
    from vllm.multimodal.processing import (
        BaseDummyInputsBuilder,
        BaseMultiModalProcessor,
        BaseProcessingInfo,
        ProcessorInputs,
        PromptReplacement,
        PromptUpdate,
        TimingContext,
    )

    from .image_processor import (
        IMAGE_PAD,
        IMAGE_PLACEHOLDER,
        IMAGE_TOKEN_ID,
        as_pil,
        build_image_block,
        pil_to_patches,
        salt_mm_image_hash,
        vision_args_from_config,
    )


    def _image_token_id(tokenizer) -> int:
        convert = getattr(tokenizer, "convert_tokens_to_ids", None)
        if convert is not None:
            token_id = convert(IMAGE_PLACEHOLDER)
            if token_id is not None and token_id != getattr(tokenizer, "unk_token_id", None):
                return int(token_id)
        vocab = getattr(tokenizer, "get_vocab", lambda: {})()
        if IMAGE_PLACEHOLDER in vocab:
            return int(vocab[IMAGE_PLACEHOLDER])
        return IMAGE_TOKEN_ID


    def _as_int(value: Any) -> int:
        raw = value.data if hasattr(value, "data") else value
        if hasattr(raw, "reshape"):
            return int(raw.reshape(-1)[0].item())
        return int(raw)


    def _salt_image_mm_hashes(hashes: Any, mm_kwargs: Any) -> Any:
        """vLLM hashes raw image bytes. Block length depends on start_pos % 4."""
        if not hashes or "image" not in hashes:
            return hashes
        try:
            items = mm_kwargs["image"]
        except Exception:
            return hashes
        salted = []
        for i, digest in enumerate(hashes["image"]):
            try:
                ntok = _as_int(items[i]["num_tokens"])
            except Exception:
                salted.append(digest)
                continue
            salted.append(salt_mm_image_hash(str(digest), ntok))
        out = dict(hashes)
        out["image"] = salted
        return out


    def _collect_images(mm_data: Mapping[str, object]) -> list[Any]:
        for key in ("images", "image"):
            value = mm_data.get(key)
            if value is None:
                continue
            if isinstance(value, (list, tuple)):
                return list(value)
            return [value]
        return []


    class DeepseekV4VisionExpProcessingInfo(BaseProcessingInfo):
        def get_supported_mm_limits(self) -> Mapping[str, int | None]:
            return {"image": None}

        def get_hf_processor(self, **kwargs: object):
            raise RuntimeError(
                "DeepSeek-V4-Flash-Vision-Exp has no Hugging Face processor; "
                "the vLLM Vision-Exp processor handles images directly."
            )

        def get_max_image_tokens(self) -> int:
            return int(getattr(self.get_hf_config(), "vision_max_n_token", 384))


    class DeepseekV4VisionExpDummyInputsBuilder(
        BaseDummyInputsBuilder[DeepseekV4VisionExpProcessingInfo]
    ):
        def get_dummy_text(self, mm_counts: Mapping[str, int]) -> str:
            return IMAGE_PLACEHOLDER * mm_counts.get("image", 0)

        def get_dummy_mm_data(
            self,
            seq_len: int,
            mm_counts: Mapping[str, int],
            mm_options: Mapping[str, Any],
        ) -> MultiModalDataDict:
            num_images = mm_counts.get("image", 0)
            image_overrides = mm_options.get("image")
            # Oversized square; official safe_resize caps at vision_max_n_token.
            return {
                "image": self._get_dummy_images(
                    width=2048,
                    height=2048,
                    num_images=num_images,
                    overrides=image_overrides,
                )
            }


    class DeepseekV4VisionExpMultiModalProcessor(
        BaseMultiModalProcessor[DeepseekV4VisionExpProcessingInfo]
    ):
        def _hf_processor_applies_updates(
            self,
            prompt_text: str,
            mm_items,
            hf_processor_mm_kwargs: Mapping[str, object],
            tokenization_kwargs: Mapping[str, object],
        ) -> bool:
            return False

        def _cached_apply_hf_processor(
            self,
            inputs: ProcessorInputs,
            timing_ctx: TimingContext,
        ) -> tuple[list[int], Any, bool]:
            # compress_pad depends on the expanded token position of each image,
            # so a content-only processor cache would reuse the wrong layout.
            # The GPU encoder cache is also keyed by image bytes; salt hashes with
            # num_tokens so a 40×19 grid at start_pos%4==0 (125) cannot reuse a
            # block encoded at %4==1 (124). See issue #172.
            if inputs.mm_data_items.get_count("image", strict=False) > 0:
                prompt_ids, mm_info, applied = self._apply_hf_processor(inputs, timing_ctx)
                salted = _salt_image_mm_hashes(mm_info.hashes, mm_info.kwargs)
                if salted is not mm_info.hashes:
                    mm_info = mm_info._replace(hashes=salted)
                return prompt_ids, mm_info, applied
            return super()._cached_apply_hf_processor(inputs, timing_ctx)

        def _call_hf_processor(
            self,
            prompt: str,
            mm_data: Mapping[str, object],
            mm_kwargs: Mapping[str, object],
            tok_kwargs: Mapping[str, object],
        ) -> BatchFeature:
            tokenizer = self.info.get_tokenizer()
            encode = getattr(tokenizer, "encode", None)
            if encode is None:
                raise RuntimeError("Vision-Exp processor requires tokenizer.encode")
            prompt_ids = list(encode(prompt, add_special_tokens=False))
            images = _collect_images(mm_data)
            if not images:
                return BatchFeature(
                    data={"input_ids": torch.tensor([prompt_ids], dtype=torch.long)}
                )

            args = vision_args_from_config(self.info.get_hf_config())
            image_token_id = _image_token_id(tokenizer)
            max_tokens = args.vision_max_n_token
            pixel_rows: list[torch.Tensor] = []
            n_vit_h_rows: list[int] = []
            n_vit_w_rows: list[int] = []
            types_rows: list[torch.Tensor] = []
            perm_rows: list[torch.Tensor] = []
            num_token_rows: list[int] = []
            max_patches = 1

            expanded_len = 0
            image_iter = iter(images)
            for tok in prompt_ids:
                if tok != image_token_id:
                    expanded_len += 1
                    continue
                pil = as_pil(next(image_iter))
                patches, n_vit_h, n_vit_w, n_llm_h, n_llm_w = pil_to_patches(pil, args)
                types, perm = build_image_block(n_llm_h, n_llm_w, expanded_len)
                if types.numel() > max_tokens:
                    raise ValueError(
                        f"Image token block length {types.numel()} exceeds "
                        f"vision_max_n_token={max_tokens}"
                    )
                pixel_rows.append(patches)
                n_vit_h_rows.append(int(n_vit_h))
                n_vit_w_rows.append(int(n_vit_w))
                types_rows.append(types)
                perm_rows.append(perm)
                num_token_rows.append(int(types.numel()))
                max_patches = max(max_patches, int(patches.shape[0]))
                expanded_len += int(types.numel())

            leftover = list(image_iter)
            if leftover:
                raise ValueError(
                    f"Found {len(images)} images but only "
                    f"{len(images) - len(leftover)} {IMAGE_PLACEHOLDER!r} placeholders"
                )
            if len(pixel_rows) != prompt_ids.count(image_token_id):
                raise ValueError(
                    f"Found {prompt_ids.count(image_token_id)} image placeholders "
                    f"but processed {len(pixel_rows)} images"
                )

            padded_pixels = []
            for patches in pixel_rows:
                if patches.shape[0] < max_patches:
                    pad = patches.new_zeros(
                        max_patches - patches.shape[0], *patches.shape[1:]
                    )
                    patches = torch.cat([patches, pad], dim=0)
                padded_pixels.append(patches.to(torch.bfloat16))

            def _pad_1d(rows: list[torch.Tensor], fill: int, width: int) -> torch.Tensor:
                out = []
                for row in rows:
                    if row.numel() < width:
                        row = torch.cat(
                            [
                                row,
                                torch.full((width - row.numel(),), fill, dtype=row.dtype),
                            ]
                        )
                    out.append(row[:width])
                return torch.stack(out, dim=0)

            return BatchFeature(
                data={
                    "input_ids": torch.tensor([prompt_ids], dtype=torch.long),
                    "pixel_values": torch.stack(padded_pixels, dim=0),
                    "n_vit_h": torch.tensor(n_vit_h_rows, dtype=torch.int32),
                    "n_vit_w": torch.tensor(n_vit_w_rows, dtype=torch.int32),
                    "types": _pad_1d(types_rows, IMAGE_PAD, max_tokens),
                    "perm": _pad_1d(perm_rows, -1, max_tokens),
                    "num_tokens": torch.tensor(num_token_rows, dtype=torch.int32),
                }
            )

        def _get_mm_fields_config(
            self,
            hf_inputs: BatchFeature,
            hf_processor_mm_kwargs: Mapping[str, object],
        ) -> Mapping[str, MultiModalFieldConfig]:
            return dict(
                pixel_values=MultiModalFieldConfig.batched("image"),
                n_vit_h=MultiModalFieldConfig.batched("image"),
                n_vit_w=MultiModalFieldConfig.batched("image"),
                types=MultiModalFieldConfig.batched("image"),
                perm=MultiModalFieldConfig.batched("image"),
                num_tokens=MultiModalFieldConfig.batched("image"),
            )

        def _get_prompt_updates(
            self,
            mm_items,
            hf_processor_mm_kwargs: Mapping[str, object],
            out_mm_kwargs,
        ) -> Sequence[PromptUpdate]:
            image_token_id = _image_token_id(self.info.get_tokenizer())

            def get_replacement(item_idx: int):
                item = out_mm_kwargs["image"][item_idx]
                num_tokens = _as_int(item["num_tokens"])
                if num_tokens <= 0:
                    raise ValueError(f"Image {item_idx} produced 0 vision tokens")
                return [image_token_id] * num_tokens

            return [
                PromptReplacement(
                    modality="image",
                    target=[image_token_id],
                    replacement=get_replacement,
                )
            ]


    def register_vision_exp_processor(model_cls):
        return MULTIMODAL_REGISTRY.register_processor(
            DeepseekV4VisionExpMultiModalProcessor,
            info=DeepseekV4VisionExpProcessingInfo,
            dummy_inputs=DeepseekV4VisionExpDummyInputsBuilder,
        )(model_cls)
  vision.py: |
    """Official DeepSeek-V4-Flash-Vision-Exp ViT + Aligner (pure PyTorch).

    Adapted from deepseek-ai/DeepSeek-V4-Flash-Vision-Exp ``inference/vision.py``
    (MIT) so it can load the checkpoint tensors on Anemll vLLM without the
    official custom kernels. RoPE tables are moved onto the activation device.
    """
    from __future__ import annotations

    from functools import lru_cache
    from typing import Any

    import torch
    import torch.nn.functional as F
    from torch import nn


    @lru_cache(8)
    def get_vision_cos_sin(n_h: int, n_w: int, dim: int, theta: float):
        inv_freq = 1.0 / (theta ** (torch.arange(0, dim, 2, dtype=torch.float32) / dim))
        hpos = torch.arange(n_h).unsqueeze(1).expand(n_h, n_w)
        wpos = torch.arange(n_w).unsqueeze(0).expand(n_h, n_w)
        freqs = torch.stack([hpos, wpos], dim=-1).reshape(-1, 2, 1).float() * inv_freq
        freqs = freqs.flatten(1)
        return freqs.cos().unsqueeze(1), freqs.sin().unsqueeze(1)


    def apply_rotary(x: torch.Tensor, cos: torch.Tensor, sin: torch.Tensor) -> torch.Tensor:
        dtype = x.dtype
        x1, x2 = x.float().chunk(2, dim=-1)
        return torch.cat([x1 * cos - x2 * sin, x2 * cos + x1 * sin], dim=-1).to(dtype)


    class RMSNorm(nn.Module):
        def __init__(self, dim: int, eps: float = 1e-6):
            super().__init__()
            self.eps = eps
            self.weight = nn.Parameter(torch.ones(dim, dtype=torch.float32))

        def forward(self, x: torch.Tensor) -> torch.Tensor:
            dtype = x.dtype
            x = x.float()
            x = x * torch.rsqrt(x.square().mean(-1, keepdim=True) + self.eps)
            return (self.weight * x).to(dtype)


    class PatchEmbed(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.proj = nn.Linear(3 * args.vision_patch_size**2, args.vision_dim)

        def forward(self, x: torch.Tensor) -> torch.Tensor:
            return self.proj(x.flatten(1))


    class Attention(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.n_heads = args.vision_n_heads
            self.head_dim = args.vision_dim // args.vision_n_heads
            self.wqkv = nn.Linear(args.vision_dim, 3 * args.vision_dim)
            self.wo = nn.Linear(args.vision_dim, args.vision_dim)

        def forward(self, x: torch.Tensor, cos: torch.Tensor, sin: torch.Tensor) -> torch.Tensor:
            n = x.size(0)
            q, k, v = (
                t.view(n, self.n_heads, self.head_dim)
                for t in self.wqkv(x).chunk(3, dim=-1)
            )
            q = apply_rotary(q, cos, sin)
            k = apply_rotary(k, cos, sin)
            o = F.scaled_dot_product_attention(
                q.transpose(0, 1), k.transpose(0, 1), v.transpose(0, 1)
            )
            return self.wo(o.transpose(0, 1).reshape(n, -1))


    class MLP(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.w1 = nn.Linear(args.vision_dim, 2 * args.vision_inter_dim, bias=False)
            self.w2 = nn.Linear(args.vision_inter_dim, args.vision_dim, bias=False)

        def forward(self, x: torch.Tensor) -> torch.Tensor:
            gate, up = self.w1(x).chunk(2, dim=-1)
            return self.w2(F.silu(gate) * up)


    class Block(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.norm1 = RMSNorm(args.vision_dim)
            self.attn = Attention(args)
            self.norm2 = RMSNorm(args.vision_dim)
            self.mlp = MLP(args)

        def forward(self, x: torch.Tensor, cos: torch.Tensor, sin: torch.Tensor) -> torch.Tensor:
            x = x + self.attn(self.norm1(x), cos, sin)
            return x + self.mlp(self.norm2(x))


    class ViT(nn.Module):
        """DeepSeek ViT: full bidirectional attention over one image with 2D RoPE."""

        def __init__(self, args: Any):
            super().__init__()
            self.rope_dim = args.vision_dim // args.vision_n_heads // 2
            self.rope_theta = args.vision_rope_theta
            self.patch_embed = PatchEmbed(args)
            self.blocks = nn.ModuleList([Block(args) for _ in range(args.vision_n_layers)])
            self.norm = RMSNorm(args.vision_dim)

        def forward(self, patches: torch.Tensor, n_h: int, n_w: int) -> torch.Tensor:
            x = self.patch_embed(patches)
            cos, sin = get_vision_cos_sin(n_h, n_w, self.rope_dim, self.rope_theta)
            cos = cos.to(device=x.device, dtype=torch.float32)
            sin = sin.to(device=x.device, dtype=torch.float32)
            for block in self.blocks:
                x = block(x, cos, sin)
            return self.norm(x)


    class Aligner(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.downsample_ratio = args.vision_downsample_ratio
            in_dim = args.vision_dim * self.downsample_ratio**2
            hidden = getattr(args, "dim", None) or args.hidden_size
            self.w1 = nn.Linear(in_dim, hidden)
            self.w2 = nn.Linear(hidden, hidden)

        def forward(self, x: torch.Tensor, n_h: int, n_w: int) -> torch.Tensor:
            r = self.downsample_ratio
            x = x.view(n_h, n_w, -1).permute(2, 0, 1)
            x = F.pad(x, (0, -n_w % r, 0, -n_h % r))
            x = F.unfold(x.unsqueeze(0), r, stride=r).squeeze(0).transpose(0, 1)
            return self.w2(F.gelu(self.w1(x)))
