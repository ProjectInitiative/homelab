# Falsification evals: is the 2.6% a domain gap (fine-tuning fixes) or a
# capability wall? Two probes on sextant (shared GPU, no device-plugin request,
# same NVIDIA_VISIBLE_DEVICES pattern as qwen3guard-eval):
#   qwen3guard-8b  — same protocol, 13x bigger: if IT also scores ~0 on the
#                    secret/injection lanes, the gap is definitional.
#   granite-guardian-3.1-2b — user-defined risk definitions (closest a generic
#                    guard gets to our taxonomy without training).
# GPU budget: cygnet-nv 0.26 + qwen3guard 0.10 + 8B 0.20 + granite 0.12 = 0.68
# of the GB10's 128GiB unified — plenty.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3guard-8b
  namespace: llm-test
  labels: { app: qwen3guard-8b, purpose: guard-falsify }
spec:
  replicas: 1
  selector: { matchLabels: { app: qwen3guard-8b } }
  template:
    metadata:
      labels: { app: qwen3guard-8b }
    spec:
      nodeSelector:
        gpu: dgx-spark
        gpu-vendor: nvidia
        kubernetes.io/hostname: sextant
      runtimeClassName: nvidia
      tolerations:
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: engine
          image: vllm/vllm-openai:v0.30.0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /run/triton-cuda-driver
              ln -sfn /usr/lib/aarch64-linux-gnu/libcuda.so.1 /run/triton-cuda-driver/libcuda.so.1
              ln -sfn /usr/lib/aarch64-linux-gnu/libcuda.so.1 /run/triton-cuda-driver/libcuda.so
              export TRITON_LIBCUDA_PATH=/run/triton-cuda-driver
              MARKER="$HF_HOME/hub/models--Qwen--Qwen3Guard-Gen-8B/.download-complete"
              if [ ! -f "$MARKER" ]; then
                echo "downloading Qwen/Qwen3Guard-Gen-8B..."
                python3 - <<'PY'
              from huggingface_hub import snapshot_download
              import os
              snapshot_download(repo_id="Qwen/Qwen3Guard-Gen-8B",
                                cache_dir=os.environ["HF_HOME"],
                                token=os.environ.get("HF_TOKEN") or None)
              PY
                mkdir -p "$(dirname "$MARKER")"; touch "$MARKER"
              fi
              exec vllm serve Qwen/Qwen3Guard-Gen-8B \
                --served-model-name Qwen/Qwen3Guard-Gen-8B \
                --host 0.0.0.0 --port 8892 \
                --max-model-len 32768 \
                --gpu-memory-utilization 0.20
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: HF_HOME, value: /models-rw/.cache/huggingface }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
          envFrom:
            - secretRef: { name: huggingface }
          resources:
            limits: { memory: 48Gi }
            requests: { cpu: "1", memory: 12Gi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: models, mountPath: /models-rw }
          startupProbe:
            httpGet: { path: /health, port: 8892 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8892 }
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-cache }
---
apiVersion: v1
kind: Service
metadata: { name: qwen3guard-8b, namespace: llm-test, labels: { app: qwen3guard-8b } }
spec:
  selector: { app: qwen3guard-8b }
  ports: [{ name: http, port: 80, targetPort: 8892 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-guardian
  namespace: llm-test
  labels: { app: granite-guardian, purpose: guard-falsify }
spec:
  replicas: 1
  selector: { matchLabels: { app: granite-guardian } }
  template:
    metadata:
      labels: { app: granite-guardian }
    spec:
      nodeSelector:
        gpu: dgx-spark
        gpu-vendor: nvidia
        kubernetes.io/hostname: sextant
      runtimeClassName: nvidia
      tolerations:
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: engine
          image: vllm/vllm-openai:v0.30.0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /run/triton-cuda-driver
              ln -sfn /usr/lib/aarch64-linux-gnu/libcuda.so.1 /run/triton-cuda-driver/libcuda.so.1
              ln -sfn /usr/lib/aarch64-linux-gnu/libcuda.so.1 /run/triton-cuda-driver/libcuda.so
              export TRITON_LIBCUDA_PATH=/run/triton-cuda-driver
              MARKER="$HF_HOME/hub/models--ibm-granite--granite-guardian-3.1-2b/.download-complete"
              if [ ! -f "$MARKER" ]; then
                echo "downloading ibm-granite/granite-guardian-3.1-2b..."
                python3 - <<'PY'
              from huggingface_hub import snapshot_download
              import os
              snapshot_download(repo_id="ibm-granite/granite-guardian-3.1-2b",
                                cache_dir=os.environ["HF_HOME"],
                                token=os.environ.get("HF_TOKEN") or None)
              PY
                mkdir -p "$(dirname "$MARKER")"; touch "$MARKER"
              fi
              exec vllm serve ibm-granite/granite-guardian-3.1-2b \
                --served-model-name ibm-granite/granite-guardian-3.1-2b \
                --host 0.0.0.0 --port 8893 \
                --max-model-len 8192 \
                --gpu-memory-utilization 0.12
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: HF_HOME, value: /models-rw/.cache/huggingface }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
          envFrom:
            - secretRef: { name: huggingface }
          resources:
            limits: { memory: 32Gi }
            requests: { cpu: "1", memory: 8Gi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: models, mountPath: /models-rw }
          startupProbe:
            httpGet: { path: /health, port: 8893 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8893 }
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-cache }
---
apiVersion: v1
kind: Service
metadata: { name: granite-guardian, namespace: llm-test, labels: { app: granite-guardian } }
spec:
  selector: { app: granite-guardian }
  ports: [{ name: http, port: 80, targetPort: 8893 }]
