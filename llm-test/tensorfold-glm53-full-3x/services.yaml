# GLM-5.3 EXL3 full-model lane (3x DGX Spark) — internal in-cluster API Service.
#
# Selects whichever DGX Spark receives the rank-0 head pod (host network, port
# 8888 — the recipe's default, deliberately not the flash lanes' 8000). Safe
# to stage with the lane: with the Deployments at replicas 0 it has no
# endpoints and touches nothing. There is deliberately NO
# serving.homelab.io/alias on this lane's head template; client/LiteLLM
# cutover is an explicit operator step (see README.md), and the resident
# TensorFold flash pair keeps the alias until this lane is qualified.
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-full-head
  namespace: llm-test
  labels:
    lane: glm53-full-3x
spec:
  selector:
    app: glm53-full-head
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
