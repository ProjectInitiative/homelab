apiVersion: v1
kind: ServiceAccount
metadata:
  name: glm53-full-head-gate
  namespace: llm-test
  labels:
    lane: glm53-full-3x
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glm53-full-head-gate
  namespace: llm-test
  labels:
    lane: glm53-full-3x
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glm53-full-head-gate
  namespace: llm-test
  labels:
    lane: glm53-full-3x
subjects:
  - kind: ServiceAccount
    name: glm53-full-head-gate
    namespace: llm-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: glm53-full-head-gate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm53-full-worker1
  namespace: llm-test
  labels:
    app: glm53-full-worker1
    lane: glm53-full-3x
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glm53-full-worker1
  template:
    metadata:
      labels:
        app: glm53-full-worker1
        lane: glm53-full-3x
        app.kubernetes.io/name: glm53-full-exl3
    spec:
      priorityClassName: llm-serving-critical
      automountServiceAccountToken: false
      runtimeClassName: nvidia-rdma
      terminationGracePeriodSeconds: 120
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: lane
                    operator: In
                    values: [glm53-full-3x]
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: stage-model-cache
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          env:
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          securityContext: {privileged: true}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              # GB10 unified memory: reclaim host page cache before TensorFold's
              # free-memory budgeting (it sizes the KV pool from MemAvailable).
              echo "Memory before cache reclamation:"
              grep -E '^(MemFree|MemAvailable|Cached|Buffers|Active\(file\)|Inactive\(file\)|SReclaimable):' /proc/meminfo || true
              sync
              echo 3 > /proc/sys/vm/drop_caches
              echo "Memory after cache reclamation:"
              grep -E '^(MemFree|MemAvailable|Cached|Buffers|Active\(file\)|Inactive\(file\)|SReclaimable):' /proc/meminfo || true
              # The hub/ layout alias already exists in the shared PVC
              # (created by the earlier flash-lane pulls); mount is read-only.
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
        - name: checkpoint-check
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          env:
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          command: ["python3", "/launch/verify-checkpoint.py"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: launch
              mountPath: /launch
              readOnly: true
        # Must be the final init step: these Sparks retain VM cache after a
        # large model exits, and TensorFold sizes its pool from MemAvailable.
        - name: reclaim-vm-cache
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          env:
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          securityContext: {privileged: true}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              threshold_kib=115343360 # 110 GiB
              for attempt in $(seq 1 12); do
                before=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
                echo "cache reclaim attempt ${attempt}/12: MemAvailable=${before} KiB before"
                sync
                echo 3 > /proc/sys/vm/drop_caches
                after=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
                grep -E '^(MemFree|MemAvailable|Cached|Buffers|Active\(file\)|Inactive\(file\)|SReclaimable):' /proc/meminfo || true
                if (( after >= threshold_kib )); then
                  echo "cache reclaim passed: MemAvailable=${after} KiB (required ${threshold_kib} KiB)"
                  exit 0
                fi
                sleep 5
              done
              echo "FATAL: MemAvailable remained below ${threshold_kib} KiB after cache reclamation" >&2
              exit 1
      containers:
        - name: tensorfold
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          command: ["bash", "/launch/launch-rank1.sh"]
          securityContext:
            capabilities:
              add: [IPC_LOCK]
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
              rdma/hca_shared_devices: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
              rdma/hca_shared_devices: "1"
          env:
            - name: HF_HOME
              value: /models/.cache/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TENSORFOLD_NO_UPDATE_CHECK
              value: "1"
            # Recipe defaults (scripts/config.sh): long-context mode. The
            # memory reserve is FLOOR_GIB(4) + OVERHEAD_GIB(10); the KV pool
            # caps at 1 GiB of kept states and 8 entries.
            - name: TENSORFOLD_MEMORY_RESERVE_GIB
              value: "14"
            - name: TF_GLM_CP
              value: "1"
            - name: TF_GLM_CP_GRAPHS
              value: "1"
            - name: TF_GLM_KV
              value: fp4
            - name: TF_GLM_DENSE
              value: q4
            - name: TF_GLM_MTP
              value: "0"
            - name: TF_GLM_PREFILL_ROWS
