              done
              echo "FATAL: MemAvailable remained below ${threshold_kib} KiB after cache reclamation" >&2
              exit 1
      containers:
        - name: tensorfold
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          command: ["bash", "/launch/launch-rank0.sh"]
