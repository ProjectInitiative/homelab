              # (created by the earlier flash-lane pulls); mount is read-only.
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
        - name: checkpoint-check
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          env:
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          command: ["python3", "/launch/verify-checkpoint.py"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: launch
              mountPath: /launch
              readOnly: true
        - name: wait-for-ranks
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          env:
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          command: ["python3", "-c"]
          args:
            - |
              import json, pathlib, ssl, sys, time, urllib.parse, urllib.request
              root = pathlib.Path("/var/run/secrets/kubernetes.io/serviceaccount")
              token = (root / "token").read_text().strip()
              tls = ssl.create_default_context(cafile=str(root / "ca.crt"))
              headers = {"Authorization": "Bearer " + token}
              base = "https://kubernetes.default.svc/api/v1/namespaces/llm-test/pods"
              targets = {"glm53-full-worker1": "rank 1 launching", "glm53-full-worker2": "rank 2 launching"}
              deadline = time.monotonic() + 3600
              pending = dict(targets)
              while time.monotonic() < deadline and pending:
                  query = urllib.parse.urlencode({"labelSelector": "lane=glm53-full-3x"})
                  request = urllib.request.Request(base + "?" + query, headers=headers)
                  try:
                      with urllib.request.urlopen(request, context=tls, timeout=10) as response:
                          pods = json.load(response)["items"]
                  except Exception as error:
                      print(f"waiting for Kubernetes API: {error}", flush=True)
                      time.sleep(3)
                      continue
                  for app, marker in list(pending.items()):
                      for pod in pods:
                          if pod.get("metadata", {}).get("labels", {}).get("app") != app:
                              continue
                          running = any(
                              container.get("name") == "tensorfold" and container.get("state", {}).get("running")
                              for container in pod.get("status", {}).get("containerStatuses", [])
                          )
                          if not running:
                              continue
                          name = urllib.parse.quote(pod["metadata"]["name"], safe="")
                          log_query = urllib.parse.urlencode({"container": "tensorfold", "tailLines": 100})
                          log_url = f"{base}/{name}/log?{log_query}"
                          try:
                              with urllib.request.urlopen(urllib.request.Request(log_url, headers=headers), context=tls, timeout=10) as response:
                                  logs = response.read().decode("utf-8", errors="replace")
                          except Exception as error:
                              print(f"waiting for rank logs ({app}): {error}", flush=True)
                              continue
                          if marker in logs:
                              print(f"{app} completed fabric/peer setup in {pod['metadata']['name']}", flush=True)
                              del pending[app]
                              break
                  if pending:
                      time.sleep(2)
              if pending:
                  sys.exit(f"timed out waiting for rank startup: {sorted(pending)}")
              print("both workers completed fabric/peer setup; launching rank 0", flush=True)
          volumeMounts:
            - name: kubernetes-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        # Keep this after the rank gates so cache reclamation is immediately
        # adjacent to TensorFold rank 0 startup.
        - name: reclaim-vm-cache
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          env:
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
