        # take the dgx-spark serving route from the resident flash pair. Move
        # a qualified alias here only at explicit cutover (README.md).
    spec:
      priorityClassName: llm-serving-critical
      serviceAccountName: glm53-full-head-gate
      automountServiceAccountToken: false
      runtimeClassName: nvidia-rdma
      terminationGracePeriodSeconds: 120
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
