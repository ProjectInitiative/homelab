                matchExpressions:
                  - key: lane
                    operator: In
                    values: [glm53-full-3x]
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: stage-model-cache
          image: registry.taildeab2.ts.net/homelab/glm53-full-exl3:4f3223245926
          imagePullPolicy: IfNotPresent
          env:
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          securityContext: {privileged: true}
          command: ["/bin/bash", "-lc"]
