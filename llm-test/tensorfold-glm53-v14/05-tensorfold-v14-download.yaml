# MiaAI TensorFold v1.4 purpose-calibrated EXL3 checkpoint preload.
#
# Recipe release marker:
#   MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks-TensorFold
#   @ fcc33211887c79e11654faed717e892d9e1449cd
# Checkpoint:
#   Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold
#   @ 078455ffe6472f9a52fbc1139f58b9db2881b25c
#
# The shared RWX model-cache PVC is expanded to 3 TiB before this pull. The Job
# is suspended in Git and explicitly unsuspended for the one-shot download.
# It never deletes the active v1.2/TR3 snapshot or any other rollback asset.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tensorfold-v14-quant-pull-v1
  namespace: llm-test
  labels:
    app: tensorfold-v14-quant-pull
    lane: tensorfold-v14
    purpose: model-cache-preload
spec:
  ttlSecondsAfterFinished: 259200
  suspend: true
  backoffLimit: 2147483647
  template:
    metadata:
      labels:
        app: tensorfold-v14-quant-pull
        lane: tensorfold-v14
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: puller
          image: registry.taildeab2.ts.net/homelab/glm53-cache-puller:v5@sha256:4ac2072503bd68a509e556c1e1970ba498c4c7d632205879be623126b53e49ec
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_HOME
              value: /staging/huggingface
            # Keep Hugging Face locks/Xet state on chronometer's local disk;
            # JuiceFS receives only the completed, dereferenced snapshot.
            - name: HF_XET_CHUNK_CACHE_SIZE_BYTES
              value: "0"
            # The image includes current `hf` and `hf_xet`; use the Hub's
            # resumable Xet path rather than the much slower direct-HTTP puller.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface
                  key: HF_TOKEN
                  optional: true
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              marker=/models/.tensorfold-v14-quant-download-complete
              repo=Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold
              rev=078455ffe6472f9a52fbc1139f58b9db2881b25c
              local_snap=$HF_HOME/hub/models--Mia-AiLab--GLM-5.3-Flash-EXL3-4bpw-TensorFold/snapshots/$rev
              snap=/models/.cache/huggingface/hub/models--Mia-AiLab--GLM-5.3-Flash-EXL3-4bpw-TensorFold/snapshots/$rev
              rm -f "$marker"
              # A prior interrupted pod may leave lock filenames; no downloader
              # is alive when this Job starts, so remove only this repo's locks.
              python3 -c 'import os,pathlib,shutil; shutil.rmtree(pathlib.Path(os.environ["HF_HOME"])/".locks/models--Mia-AiLab--GLM-5.3-Flash-EXL3-4bpw-TensorFold", ignore_errors=True)'
              hf download "$repo" --revision "$rev" --cache-dir "$HF_HOME/hub"

              # Materialize local cache symlinks as regular files in a temporary
              # JuiceFS tree, then publish the complete snapshot in one rename.
              python3 - "$local_snap" "$snap" <<'PY'
              import concurrent.futures, pathlib, shutil, sys
              src, dst = map(pathlib.Path, sys.argv[1:])
              if not src.is_dir():
                  raise SystemExit(f"local snapshot missing: {src}")
              tmp = dst.with_name(dst.name + ".staging")
              shutil.rmtree(tmp, ignore_errors=True)
              tmp.mkdir(parents=True)
              files = []
              for path in src.rglob("*"):
                  target = tmp / path.relative_to(src)
                  if path.is_dir() and not path.is_symlink():
                      target.mkdir(parents=True, exist_ok=True)
                  elif path.is_file():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      files.append((path, target))
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  futures = [pool.submit(shutil.copy2, source, target, follow_symlinks=True)
                             for source, target in files]
                  for i, future in enumerate(concurrent.futures.as_completed(futures), 1):
                      future.result()
                      print(f"copy {i}/{len(files)}", flush=True)
              shutil.rmtree(dst, ignore_errors=True)
              tmp.replace(dst)
              print(f"published complete snapshot to {dst}")
              PY

              python3 - "$snap" "$marker" <<'PY'
              import hashlib, json, pathlib, sys
              root, marker = map(pathlib.Path, sys.argv[1:])
              expected = json.loads(pathlib.Path("/checksums/sha256.json").read_text())
              canonical = json.dumps(expected, sort_keys=True, separators=(",", ":")) + "\n"
              manifest_sha = hashlib.sha256(canonical.encode()).hexdigest()
              if manifest_sha != "bc00138336dd68d28e56de779fe3db174c3aaed20d30fdfc453bc8ac5b6a074a":
                  raise SystemExit(f"checksum inventory drift: {manifest_sha}")

              for i, (name, wanted) in enumerate(sorted(expected.items()), 1):
                  path = root / name
                  if not path.is_file():
                      raise SystemExit(f"missing {path}")
                  digest = hashlib.sha256()
                  with path.open("rb") as fh:
                      for chunk in iter(lambda: fh.read(8 * 1024 * 1024), b""):
                          digest.update(chunk)
                  got = digest.hexdigest()
                  if got != wanted:
                      raise SystemExit(f"sha256 mismatch for {name}: {got} != {wanted}")
                  print(f"sha256 {i}/{len(expected)} OK {name}", flush=True)

              shards = {f"model-{i:05d}-of-00083.safetensors" for i in range(1, 84)}
              indexed = set(json.loads((root / "model.safetensors.index.json").read_text())["weight_map"].values())
              if indexed != shards:
                  raise SystemExit(f"index shard set mismatch: indexed={len(indexed)} expected=83")
              total = sum((root / name).stat().st_size for name in shards)
              if total != 175_642_267_944:
                  raise SystemExit(f"weight bytes {total}, expected 175642267944")
              receipt = {
                  "files": len(expected),
                  "manifest_sha256": manifest_sha,
                  "revision": "078455ffe6472f9a52fbc1139f58b9db2881b25c",
                  "weight_bytes": total,
              }
              tmp = marker.with_suffix(".tmp")
              tmp.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
              tmp.replace(marker)
              print(f"verified {len(shards)} shards, {total} bytes; receipt {marker}")
              PY
              python3 -c 'import shutil; shutil.rmtree("/staging/huggingface", ignore_errors=True)'
              echo "TensorFold v1.4 quant complete"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              ephemeral-storage: 220Gi
            limits:
              ephemeral-storage: 300Gi
          volumeMounts:
            - name: staging
              mountPath: /staging
            - name: models
              mountPath: /models
            - name: checksums
              mountPath: /checksums
              readOnly: true
      volumes:
        - name: staging
          hostPath:
            path: /var/lib/llm-test/tensorfold-v14-staging
            type: Directory
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: checksums
          configMap:
            name: tensorfold-v14-checksums
