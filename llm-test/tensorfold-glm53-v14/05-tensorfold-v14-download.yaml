# MiaAI TensorFold v1.4 purpose-calibrated EXL3 checkpoint preload.
#
# Recipe release marker:
#   MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks-TensorFold
#   @ fcc33211887c79e11654faed717e892d9e1449cd
# Checkpoint:
#   Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold
#   @ 078455ffe6472f9a52fbc1139f58b9db2881b25c
#
# The shared RWX model-cache PVC is expanded to 3 TiB before this pull. The Job
# is suspended in Git and explicitly unsuspended for the one-shot download.
# It never deletes the active v1.2/TR3 snapshot or any other rollback asset.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tensorfold-v14-quant-pull-v1
  namespace: llm-test
  labels:
    app: tensorfold-v14-quant-pull
    lane: tensorfold-v14
    purpose: model-cache-preload
spec:
  ttlSecondsAfterFinished: 259200
  suspend: true
  backoffLimit: 2147483647
  template:
    metadata:
      labels:
        app: tensorfold-v14-quant-pull
        lane: tensorfold-v14
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: puller
          image: registry.taildeab2.ts.net/homelab/glm53-cache-puller:v6@sha256:7c832f622f68fd03cf4eb6a5705451a223be90e45d1b8a5396f77a43c2672062
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_HOME
              value: /models/.cache/huggingface
            # Cap aggregate traffic below the gigabit site link.
            - name: RATE
              value: "62500000"
            - name: PULL_MODELS
              value: Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold@078455ffe6472f9a52fbc1139f58b9db2881b25c
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: PROGRESS_INTERVAL
              value: "30"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface
                  key: HF_TOKEN
                  optional: true
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              marker=/models/.tensorfold-v14-quant-download-complete
              snap=/models/.cache/huggingface/hub/models--Mia-AiLab--GLM-5.3-Flash-EXL3-4bpw-TensorFold/snapshots/078455ffe6472f9a52fbc1139f58b9db2881b25c
              rm -f "$marker"
              # Remove only the abandoned temporary tree from the superseded
              # local-stage/copy attempt; preserve puller .part files for resume.
              python3 -c 'import pathlib,shutil; shutil.rmtree(pathlib.Path("'$snap'.staging"), ignore_errors=True)'
              python3 /opt/puller/puller.py

              python3 - "$snap" "$marker" <<'PY'
              import hashlib, json, pathlib, sys
              root, marker = map(pathlib.Path, sys.argv[1:])
              expected = json.loads(pathlib.Path("/checksums/sha256.json").read_text())
              canonical = json.dumps(expected, sort_keys=True, separators=(",", ":")) + "\n"
              manifest_sha = hashlib.sha256(canonical.encode()).hexdigest()
              if manifest_sha != "bc00138336dd68d28e56de779fe3db174c3aaed20d30fdfc453bc8ac5b6a074a":
                  raise SystemExit(f"checksum inventory drift: {manifest_sha}")

              for i, (name, wanted) in enumerate(sorted(expected.items()), 1):
                  path = root / name
                  if not path.is_file():
                      raise SystemExit(f"missing {path}")
                  digest = hashlib.sha256()
                  with path.open("rb") as fh:
                      for chunk in iter(lambda: fh.read(8 * 1024 * 1024), b""):
                          digest.update(chunk)
                  got = digest.hexdigest()
                  if got != wanted:
                      raise SystemExit(f"sha256 mismatch for {name}: {got} != {wanted}")
                  print(f"sha256 {i}/{len(expected)} OK {name}", flush=True)

              shards = {f"model-{i:05d}-of-00083.safetensors" for i in range(1, 84)}
              indexed = set(json.loads((root / "model.safetensors.index.json").read_text())["weight_map"].values())
              if indexed != shards:
                  raise SystemExit(f"index shard set mismatch: indexed={len(indexed)} expected=83")
              total = sum((root / name).stat().st_size for name in shards)
              if total != 175_642_267_944:
                  raise SystemExit(f"weight bytes {total}, expected 175642267944")
              receipt = {
                  "files": len(expected),
                  "manifest_sha256": manifest_sha,
                  "revision": "078455ffe6472f9a52fbc1139f58b9db2881b25c",
                  "weight_bytes": total,
              }
              tmp = marker.with_suffix(".tmp")
              tmp.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
              tmp.replace(marker)
              print(f"verified {len(shards)} shards, {total} bytes; receipt {marker}")
              PY
              echo "TensorFold v1.4 quant complete"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: checksums
              mountPath: /checksums
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: checksums
          configMap:
            name: tensorfold-v14-checksums
