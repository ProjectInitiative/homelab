apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-parity-head
  namespace: llm-test
  labels: {app: deepseek-parity-head}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: deepseek-parity-head}
  template:
    metadata:
      labels: {app: deepseek-parity-head}
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile: {type: Unconfined}
      nodeSelector:
        kubernetes.io/hostname: chronometer
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: stage-upstream-runtime-files
          image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /runtime-opt/dspark-patches/vision_exp /runtime-opt/dsv4-tp3 /runtime-opt/vllm-gb10-hybrid-nvfp4
              cp -a /patches/. /runtime-opt/
              cp -a /patches/. /runtime-opt/dspark-patches/
              cp -a /vision-exp/. /runtime-opt/dspark-patches/vision_exp/
              cp /tp3/apply_tp3_patch.py /runtime-opt/dsv4-tp3/apply_tp3_patch.py
              mkdir -p /cache/huggingface
              ln -sfn . /cache/huggingface/hub
              test -f /cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-Vision-Exp/snapshots/86f746b36186f0e567729a5c06a8c918caba82a9/config.json
              test -f /cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-Vision-Exp/snapshots/86f746b36186f0e567729a5c06a8c918caba82a9/encoding/encoding_dsv4.py
          volumeMounts:
            - name: opt-runtime
              mountPath: /runtime-opt
            - name: patches
              mountPath: /patches
            - name: vision-exp
              mountPath: /vision-exp
            - name: tp3
              mountPath: /tp3
            - name: models
              mountPath: /cache/huggingface
              subPath: .cache/huggingface
        - name: wait-for-worker
          image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["until curl -fsS http://172.16.5.56:9090/ >/dev/null; do sleep 2; done"]
      containers:
        - name: vllm
          image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
          imagePullPolicy: IfNotPresent
          securityContext: {privileged: true}
          resources:
            requests: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "32", memory: 128Gi, nvidia.com/gpu: "1"}
          command: ["/bin/bash", "-lc"]
          args:
            - >-
              set -a; source /etc/miaai-profile/.env.dspark; set +a;
              export MASTER_ADDR=172.16.5.55 MASTER_PORT=25000 NNODES=2 NODE_RANK=0 HEADLESS= VLLM_HOST_IP=172.16.5.55 WORKER_VLLM_HOST_IP=172.16.5.56 VLLM_HOST=0.0.0.0 VLLM_PORT=8000;
              export TRITON_LIBCUDA_PATH=/run/triton-cuda-driver;
              REAL_LIBCUDA=/usr/lib/aarch64-linux-gnu/libcuda.so.1; test -f "$REAL_LIBCUDA"; test "$(readlink -f "$REAL_LIBCUDA")" != */stubs/libcuda.so;
              mkdir -p /run/triton-cuda-driver; ln -sfn "$REAL_LIBCUDA" /run/triton-cuda-driver/libcuda.so.1; ln -sfn "$REAL_LIBCUDA" /run/triton-cuda-driver/libcuda.so;
              
              export PATH="/usr/local/cuda/bin:/usr/local/bin:${PATH:-}";
              export CUDA_HOME="${CUDA_HOME:-/usr/local/cuda}";
              export CUDA_PATH="${CUDA_PATH:-${CUDA_HOME}}";
              export CUDAToolkit_ROOT="${CUDAToolkit_ROOT:-${CUDA_HOME}}";
              export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}";
              API_KEY_ARGS=(); case "${DSPARK_API_KEYS:-}" in *[$'\r\n\v\f']*) echo "error: DSPARK_API_KEYS must be a single-line space-separated list" >&2; exit 2 ;; *\\*) echo "error: DSPARK_API_KEYS must not contain backslashes" >&2; exit 2 ;; esac; _dspark_keys_set=0; case "${DSPARK_API_KEYS:-}" in *[!$' \t']*) _dspark_keys_set=1 ;; esac; if [ -n "${VLLM_API_KEY:-}" ] && [ "${_dspark_keys_set}" = "1" ]; then echo "error: VLLM_API_KEY and DSPARK_API_KEYS are both set; set exactly one of them" >&2; exit 2; fi; if [ "${_dspark_keys_set}" = "1" ]; then read -r -a _dspark_keys <<< "${DSPARK_API_KEYS}"; for _dspark_key in "${_dspark_keys[@]}"; do case "${_dspark_key}" in -*) echo "error: DSPARK_API_KEYS contains a token beginning with '-'" >&2; exit 2 ;; esac; done; API_KEY_ARGS=(--api-key "${_dspark_keys[@]}"); fi;
              if [ -z "${NCCL_IB_MERGE_NICS:-}" ]; then unset NCCL_IB_MERGE_NICS; fi;
              if [ -z "${NCCL_IB_SUBNET_AWARE_ROUTING:-}" ]; then unset NCCL_IB_SUBNET_AWARE_ROUTING; fi;
              if [ -z "${NCCL_IB_SUBNET_PREFIX_LEN:-}" ]; then unset NCCL_IB_SUBNET_PREFIX_LEN; fi;
              if [ -z "${NCCL_NET_GDR_LEVEL:-}" ]; then unset NCCL_NET_GDR_LEVEL; fi;
              if [ -z "${NCCL_NET_GDR_READ:-}" ]; then unset NCCL_NET_GDR_READ; fi;
              if [ -z "${NCCL_DMABUF_ENABLE:-}" ]; then unset NCCL_DMABUF_ENABLE; fi;
              if [ -z "${NCCL_GIN_ENABLE:-}" ]; then unset NCCL_GIN_ENABLE; fi;
              if [ -z "${NCCL_IB_GID_INDEX:-}" ]; then unset NCCL_IB_GID_INDEX; fi;
              if [ -n "${TORCH_FR_DUMP_TEMP_FILE:-}" ]; then mkdir -p "$(dirname "${TORCH_FR_DUMP_TEMP_FILE}")" || echo "warn: cannot create flight-recorder dump dir; dumps will be lost (boot continues)" >&2; fi;
              ENCODING_SOURCE="${DSPARK_ENCODING_FILE:-}";
              if [ -z "${ENCODING_SOURCE}" ]; then
                MODEL_HUB_DIR=$(printf '%s' "${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}" | sed 's|/|--|g');
                if [ -n "${DSPARK_REVISION:-}" ] && [ -f "/cache/huggingface/hub/models--${MODEL_HUB_DIR}/snapshots/${DSPARK_REVISION}/encoding/encoding_dsv4.py" ]; then
                  ENCODING_SOURCE="/cache/huggingface/hub/models--${MODEL_HUB_DIR}/snapshots/${DSPARK_REVISION}/encoding/encoding_dsv4.py";
                fi;
                if [ -z "${ENCODING_SOURCE}" ]; then
                  for candidate in /cache/huggingface/hub/models--${MODEL_HUB_DIR}/snapshots/*/encoding/encoding_dsv4.py; do
                    if [ -f "${candidate}" ]; then ENCODING_SOURCE="${candidate}"; break; fi;
                  done;
                fi;
              fi;
              if [ -z "${ENCODING_SOURCE}" ]; then for candidate in /cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/*/encoding/encoding_dsv4.py; do if [ -f "${candidate}" ]; then ENCODING_SOURCE="${candidate}"; break; fi; done; fi;
              if [ -z "${ENCODING_SOURCE}" ] && [ -f /models/deepseek-ai/DeepSeek-V4-Flash-0731/encoding/encoding_dsv4.py ]; then ENCODING_SOURCE=/models/deepseek-ai/DeepSeek-V4-Flash-0731/encoding/encoding_dsv4.py; fi;
              if [ -n "${ENCODING_SOURCE}" ] && [ -f "${ENCODING_SOURCE}" ]; then cp "${ENCODING_SOURCE}" /usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py || exit 1; python3 -c 'from pathlib import Path; p=Path("/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4.py"); s=p.read_text(); old="elif reasoning_effort in (\"max\", \"xhigh\"):\n                reasoning_effort = \"max\"\n            else:\n                reasoning_effort = \"high\""; new="elif reasoning_effort in (\"max\", \"xhigh\"):\n                reasoning_effort = \"max\"\n            elif reasoning_effort == \"high\":\n                reasoning_effort = \"high\"\n            else:\n                reasoning_effort = \"low\""; updated=s.replace(old,new); assert new in updated; p.write_text(updated)' || exit 1; python3 /opt/hotfix-encoding-dsv4-issue21.py || exit 1; else echo "WARN: encoding_dsv4.py not found (set DSPARK_ENCODING_FILE or check the model snapshot) - encoder copy, reasoning-effort mapping and issue21 skipped" >&2; fi; if [ "${DSPARK_ENABLE_ISSUE31_GPU_HOTFIX:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-issue31-v2-thinking-budget-gpu.py || exit 1; fi; python3 /opt/hotfix-dsv4-issue55-tool-truncation.py || exit 1;
              if [ "${DSPARK_SKIP_ISSUE22_HOTFIX:-0}" != "1" ]; then if [ ! -f /opt/dspark-patches/hotfix-nvfp4-ds-mla-issue22.sh ]; then echo "FATAL: /opt/dspark-patches/hotfix-nvfp4-ds-mla-issue22.sh missing" >&2; exit 1; fi; bash /opt/dspark-patches/hotfix-nvfp4-ds-mla-issue22.sh || exit 1; fi;
              if [ "${DSPARK_SKIP_SPIN_WAIT_HOTFIX:-0}" != "1" ]; then if [ ! -f /opt/dspark-patches/hotfix-gb10-spin-wait.sh ]; then echo "FATAL: /opt/dspark-patches/hotfix-gb10-spin-wait.sh missing" >&2; exit 1; fi; bash /opt/dspark-patches/hotfix-gb10-spin-wait.sh || exit 1; fi;
              if [ "${DSPARK_SKIP_ISSUE117_RECHECK_HOTFIX:-0}" != "1" ]; then if [ ! -f /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py ]; then echo "FATAL: /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py missing" >&2; exit 1; fi; python3 /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py || exit 1; python3 /opt/dspark-patches/hotfix-vllm-issue117-shm-ring-buffer.py --status || exit 1; fi;
              if [ "${DSPARK_SKIP_HOTFIX:-0}" != "1" ]; then for _hf in hotfix-dsv4-mtp-buffer-50312.sh hotfix-dsv4-skip-topk-49486.sh hotfix-dsv4-dense-prefill-indexer-48407.sh hotfix-dsv4-skip-empty-c128-48957.sh hotfix-dsv4-flashmla-workspace-50298.sh hotfix-dsv4-grammar-advance.sh; do if [ ! -f /opt/dspark-patches/${_hf} ]; then echo "FATAL: /opt/dspark-patches/${_hf} missing" >&2; exit 1; fi; bash /opt/dspark-patches/${_hf} || exit 1; done; fi;
              if [ "${_dspark_keys_set}" = "1" ] || [ -n "${VLLM_API_KEY:-}" ]; then bash /opt/dspark-patches/hotfix-vllm-redact-api-key-log.sh || exit 1; bash /opt/dspark-patches/hotfix-vllm-redact-api-key-log.sh --status || exit 1; fi;
              if [ "${VLLM_ENABLE_RESPONSES_API_STORE:-0}" != "1" ]; then export VLLM_ENABLE_RESPONSES_API_STORE=0; fi; if [ "${VLLM_ENABLE_RESPONSES_API_STORE}" = "1" ]; then python3 /opt/hotfix-dsv4-responses-store.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_ISSUE138_RESPONSES_HISTORY_COMPAT:-0}" = "1" ]; then python3 /opt/hotfix-vllm-issue138-responses-history.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_CODEX_AGENT_MESSAGE_COMPAT:-0}" = "1" ]; then python3 /opt/hotfix-vllm-codex-agent-message.py || exit 1; fi;
              python3 /opt/hotfix-dsv4-vision-exp.py || exit 1; if [ "${DSPARK_ENABLE_ISSUE141_SPARSE_MLA_CHUNK:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-issue141-sparse-mla-decode-chunk.py || exit 1; fi; if [ "${DSPARK_ENABLE_SP_INDEXER:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-sp-indexer-prefill.py || exit 1; fi; if [ "${DSPARK_ENABLE_DEEPGEMM_SM121_ALIAS:-0}" = "1" ]; then bash /opt/dspark-patches/hotfix-deepgemm-sm121-mqa-header-alias.sh || exit 1; fi; python3 /opt/hotfix-vllm-empty-encoder-output.py || exit 1; python3 /opt/hotfix-dsv4-issue27-partial-prefill-concurrency.py || exit 1; if [ "${DSPARK_ENABLE_ADAPTIVE_CHUNK:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-adaptive-prefill-chunk.py || exit 1; fi; if [ "${DSPARK_ENABLE_REPLICATE_MARKOV:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-replicate-markov-head.py || exit 1; fi; python3 /opt/hotfix-dsv4-issue43-decode-fairness-and-diag.py || exit 1; python3 /opt/hotfix-dsv4-issue26-hybrid-swa-min.py || exit 1; python3 /opt/hotfix-dsv4-issue133-triton-specialization.py || exit 1; if [ "${DSPARK_SKIP_SUPPRESS_STOPS_HOTFIX:-0}" != "1" ]; then python3 /opt/hotfix-dsv4-suppress-stops-in-reasoning.py || exit 1; fi; VLLM_QUANTIZATION_ARGS="";
              if [ "${DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-assistant-final-continuation.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_ISSUE144_EFFORT_ALIGN:-0}" = "1" ]; then python3 /opt/hotfix-dsv4-issue144-effort-align.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_ISSUE136_XGRAMMAR_HOTFIX:-0}" = "1" ]; then python3 /opt/hotfix-vllm-issue136-xgrammar-termination.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_ISSUE191_TOOLCALL_FAILCLOSED:-0}" = "1" ]; then python3 /opt/hotfix-vllm-issue191-toolcall-failclosed.py || exit 1; fi;
              case "${DSPARK_ASYNC_SCHEDULING:-1}" in 1) ASYNC_SCHEDULING_ARGS="--async-scheduling" ;; 0) ASYNC_SCHEDULING_ARGS="" ;; *) echo "DSPARK_ASYNC_SCHEDULING must be 0 or 1 (got ${DSPARK_ASYNC_SCHEDULING})" >&2; exit 1 ;; esac;
              case "${DSPARK_ENABLE_MXFP4_INDEXER_CACHE:-0}" in 1) MXFP4_INDEXER_ARGS="--attention-config {\"use_fp4_indexer_cache\":true}" ;; 0) MXFP4_INDEXER_ARGS="" ;; *) echo "DSPARK_ENABLE_MXFP4_INDEXER_CACHE must be 0 or 1 (got ${DSPARK_ENABLE_MXFP4_INDEXER_CACHE})" >&2; exit 1 ;; esac;
              if [ "${DSPARK_ENABLE_DSPARK_BLOCK_K:-0}" = "1" ]; then python3 /opt/hotfix-vllm-dspark-block-k.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_ROPE_SWA_FIX:-0}" = "1" ]; then python3 /opt/hotfix-vllm-rope-swa-fix.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_DSPARK_SWA_PREFIX:-0}" = "1" ]; then python3 /opt/hotfix-vllm-dspark-swa-prefix.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_DSML_RECOVERY:-0}" = "1" ]; then python3 /opt/hotfix-vllm-dsml-recovery.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_MXFP4_INDEXER_CACHE:-0}" = "1" ]; then python3 /opt/hotfix-vllm-mxfp4-indexer-cache.py || exit 1; fi;
              if [ "${DSPARK_ENABLE_C128A_PREFILL_CACHE:-0}" = "1" ]; then python3 /opt/hotfix-vllm-c128a-prefill-cache.py || exit 1; fi;
              if [ "${ENABLE_VLLM_GB10_PATCH:-0}" = "1" ]; then
                python3 -m pip install -e /opt/vllm-gb10-hybrid-nvfp4 --no-deps;
                export VLLM_PLUGINS="${VLLM_PLUGINS:-gb10_hybrid_nvfp4}";
                VLLM_QUANTIZATION_ARGS="--quantization modelopt_gb10_hybrid";
              fi;
              if [ "${TP_SIZE:-2}" = "3" ]; then
                if [ ! -f /opt/dsv4-tp3/apply_tp3_patch.py ]; then echo "FATAL: TP_SIZE=3 but /opt/dsv4-tp3/apply_tp3_patch.py is missing" >&2; exit 1; fi;
                python3 /opt/dsv4-tp3/apply_tp3_patch.py || exit 1;
              fi;
              case "${DRAFT_SAMPLE_METHOD:-probabilistic}" in
                probabilistic|greedy) DRAFT_SAMPLE_METHOD="${DRAFT_SAMPLE_METHOD:-probabilistic}" ;;
                *) echo "DRAFT_SAMPLE_METHOD must be one of: probabilistic, greedy (got: ${DRAFT_SAMPLE_METHOD})" >&2; exit 2 ;;
              esac;
              SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"num_speculative_tokens\":${MTP_NUM_TOKENS:-6},\"draft_sample_method\":\"${DRAFT_SAMPLE_METHOD}\"}";
              case "${DEFAULT_THINKING:-low}" in
                off) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":false}' ;;
                low) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":true,"reasoning_effort":"low"}' ;;
                high) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":true,"reasoning_effort":"high"}' ;;
                max) DEFAULT_CHAT_TEMPLATE_KWARGS='{"thinking":true,"reasoning_effort":"max"}' ;;
                *) echo "DEFAULT_THINKING must be one of: off, low, high, max (got: ${DEFAULT_THINKING})" >&2; exit 2 ;;
              esac;
              REVISION_ARGS="";
              if [ -n "${DSPARK_REVISION:-}" ]; then REVISION_ARGS="--revision ${DSPARK_REVISION}"; fi;
              LIMIT_MM_RAW="${LIMIT_MM_PER_PROMPT:-image=8}"; case "${LIMIT_MM_RAW}" in image=*) _lim_n="${LIMIT_MM_RAW#image=}"; case "${_lim_n}" in ''|*[!0-9]*) echo "error: LIMIT_MM_PER_PROMPT image=N needs an integer (Anemll --limit-mm-per-prompt requires JSON)" >&2; exit 2 ;; esac; LIMIT_MM_JSON="{\"image\":${_lim_n}}" ;; *) LIMIT_MM_JSON="${LIMIT_MM_RAW}" ;; esac; LIMIT_MM_ARGS=(--limit-mm-per-prompt "${LIMIT_MM_JSON}");
              echo "NODE_RANK=${NODE_RANK:-}";
              echo "HEADLESS=${HEADLESS:-}";
              if [ "${NODE_RANK}" = "1" ]; then
                [ -n "${HEADLESS:-}" ] || { echo "FATAL: rank 1 must have HEADLESS set" >&2; exit 2; };
              fi;
              if [ "${NODE_RANK}" = "0" ] && [ -n "${HEADLESS:-}" ]; then
                echo "FATAL: rank 0 must not be HEADLESS" >&2;
                exit 2;
              fi;
              set -x;
              exec /usr/local/bin/vllm serve ${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}
              ${REVISION_ARGS}
              --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash-vision-exp}
              --host ${VLLM_HOST:-127.0.0.1}
              --port ${VLLM_PORT:-8888}
              --trust-remote-code
              "${API_KEY_ARGS[@]}"
              ${VLLM_QUANTIZATION_ARGS}
              --tensor-parallel-size ${TP_SIZE:-2}
              --pipeline-parallel-size 1
              --kv-cache-dtype nvfp4_ds_mla
              --block-size 256
              --max-model-len ${MAX_MODEL_LEN:-1048576}
              --max-num-seqs ${MAX_NUM_SEQS:-6}
              --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
              --long-prefill-token-threshold ${LONG_PREFILL_TOKEN_THRESHOLD:-1024}
              --max-cudagraph-capture-size $(( ( ${MAX_NUM_SEQS:-6} * (${MTP_NUM_TOKENS:-6} + 1) + 7 ) / 8 * 8 ))
              --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
              --enable-prefix-caching
              --enable-prompt-tokens-details
              ${ASYNC_SCHEDULING_ARGS}
              ${MXFP4_INDEXER_ARGS}
              --enable-chunked-prefill
              --speculative-config "${SPECULATIVE_CONFIG}"
              --tokenizer-mode deepseek_v4
              "${LIMIT_MM_ARGS[@]}"
              --distributed-executor-backend mp
              --moe-backend flashinfer_b12x
              --tool-call-parser deepseek_v4
              --enable-auto-tool-choice
              --reasoning-parser deepseek_v4
              --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
              --default-chat-template-kwargs "${DEFAULT_CHAT_TEMPLATE_KWARGS}"
              --generation-config vllm
              --enable-flashinfer-autotune
              --nnodes ${NNODES:-2}
              --node-rank ${NODE_RANK}
              --master-addr ${MASTER_ADDR}
              --master-port ${MASTER_PORT:-25000}
              ${HEADLESS:+--headless}
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: models
              mountPath: /cache/huggingface
              subPath: .cache/huggingface
            - name: opt-runtime
              mountPath: /opt
            - name: profile
              mountPath: /etc/miaai-profile
              readOnly: true
            - name: jit-tilelang
              mountPath: /cache/huggingface/tilelang-cache
            - name: jit-triton
              mountPath: /cache/huggingface/triton-cache
            - name: jit-b12x
              mountPath: /cache/huggingface/b12x-cute-cache
            - name: vllm-cache
              mountPath: /cache/huggingface/vllm-cache
            - name: flashinfer-cache
              mountPath: /cache/huggingface/flashinfer
            - name: nccl-fr
              mountPath: /cache/huggingface/nccl-fr
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
            - name: diagnostics
              mountPath: /diagnostics
            - name: infiniband
              mountPath: /dev/infiniband
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: opt-runtime
          emptyDir: {}
        - name: profile
          configMap:
            name: miaai-parity-profile
        - name: patches
          configMap:
            name: miaai-parity-patches
        - name: vision-exp
          configMap:
            name: miaai-parity-vision-exp
        - name: tp3
          configMap:
            name: miaai-parity-tp3
        - name: jit-tilelang
          hostPath:
            path: /var/lib/llm-test/jit-cache/tilelang
            type: DirectoryOrCreate
        - name: jit-triton
          hostPath:
            path: /var/lib/llm-test/jit-cache/triton
            type: DirectoryOrCreate
        - name: jit-b12x
          hostPath:
            path: /var/lib/llm-test/jit-cache/b12x-cute
            type: DirectoryOrCreate
        - name: vllm-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/vllm-cache
            type: DirectoryOrCreate
        - name: flashinfer-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/flashinfer
            type: DirectoryOrCreate
        - name: nccl-fr
          hostPath:
            path: /var/lib/llm-test/jit-cache/nccl-fr
            type: DirectoryOrCreate
        - name: tmp
          hostPath:
            path: /var/lib/llm-test/jit-cache/miaai-tmp
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: diagnostics
          hostPath:
            path: /var/lib/llm-test/diagnostics
            type: DirectoryOrCreate
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-parity-worker
  namespace: llm-test
  labels: {app: deepseek-parity-worker}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: deepseek-parity-worker}
  template:
    metadata:
      labels: {app: deepseek-parity-worker}
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      hostIPC: true
