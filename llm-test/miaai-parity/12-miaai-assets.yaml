        if outputs_status in {"applied", "skipped"} and scheduler_status in {
            "applied",
            "skipped",
        }:
            print(
                "[empty-encoder-output] "
                f"outputs={outputs_status}, scheduler={scheduler_status}"
            )
            return 0
        print(
            "[empty-encoder-output] source drift; refusing to patch "
            f"(outputs={outputs_status}, scheduler={scheduler_status})",
            file=sys.stderr,
        )
        return 1


