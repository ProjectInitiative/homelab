apiVersion: v1
data:
  dsv4_tp_pad.py: "# SPDX-License-Identifier: Apache-2.0\n\"\"\"DeepSeek-V4 TP padding
    for non-divisible tensor-parallel sizes (TP=3 on 3 Sparks).\n\nWHY THIS EXISTS\n---------------\nDeepSeek-V4-Flash
    has num_attention_heads=64 and o_groups=8. Neither divides by 3,\nso vLLM refuses
    to start at TP=3 (`attention.py:183`) -- and, worse, silently\nmis-shards the
    group axis (`attention.py:191`, `8 // 3 == 2`, no assert).\n\nThis module supplies
    the padding so a 3-node tensor-parallel deployment is legal\nAND numerically identical
    to TP=1.\n\nTHE GROUP SEMANTICS (measured, not assumed)\n-------------------------------------------\nV4's
    o_proj is a per-group BMM:\n\n    z = einsum(\"bhr,hdr->bhd\", o, wo_a)     #
    h=group, r=hpg*head_dim, d=o_lora_rank\n    out = wo_b(z.flatten(1))\n\nTwo candidate
    resolutions were tested against the REAL fp8 checkpoint weights\n(`layers.3.attn.wo_a.weight`,
    [8192, 4096]):\n\n  R2  pad groups 8 -> 24 (24 % 3 == 0), heads -> 72, hpg = 3.\n
    \     *** REJECTED -- arithmetically impossible. ***\n      With G=24, each group
    slab needs width hpg*head_dim = 3*512 = 1536, but the\n      checkpoint's slabs
    are 4096 wide. You cannot pad to a NARROWER tensor.\n      Independently: a real
    8-head group cannot split 3 ways (8/3 = 2.67).\n\n  R1  replicate groups (n_local_groups
    = n_groups = 8), shard heads WITHIN each\n      group. Pad heads-per-group 8 ->
    9, so total heads = 8 * 9 = 72, and each\n      rank takes 3 heads per group.\n
    \     *** CORRECT -- reproduces TP=1 at rel 2.3e-06 (fp8 e4m3 quantization noise).
    ***\n\nThe critical consequence of R1: wo_a's out-features stay G*o_lora_rank
    (they are\nNOT divided by tp_size), so wo_b's input dim is unchanged and the all-reduce
    sums\nexact per-rank partials. The padded 9th head in each group is zero and therefore\ncontributes
    exactly nothing.\n\nNote the head count 72 also satisfies the naive rule `heads
    % (tp * o_groups) == 0`,\nbut for a DIFFERENT structural reason (9 heads per replicated
    group, not 24 padded\ngroups). Same number, different mechanism -- do not conflate
    them.\n\nWHAT NOT TO DO\n--------------\n* Do NOT reuse GLM's `glm_wrapper_pad_backend_ok()`.
    It resolves against\n  FLASHINFER_MLA_SPARSE_SM120, a backend DSv4 explicitly
    REJECTS\n  (`nvidia/model.py:769-777`). Setting the correct backend env var would
    silently\n  flip the pad value.\n* Do NOT route `attn_sink` through GLM's `copy_tp_shard_with_pad()`.
    That helper\n  calls `dest.zero_()` first; a zeroed sink lane means exp(0)=1,
    which adds a\n  phantom unit to the softmax denominator and ATTENUATES REAL HEADS.
    Sink pad\n  lanes must stay -inf. See `pad_fill_value()` below.\n\nEnabled by
    env VLLM_DSV4_TP_PAD (default \"1\").\n\nRedmine: \n\"\"\"\nfrom __future__ import
    annotations\n\nimport os\n\nimport torch\n\n__all__ = [\n    \"dsv4_tp_pad_enabled\",\n
    \   \"pad_heads_for_groups\",\n    \"local_heads_per_group\",\n    \"pad_fill_value\",\n
    \   \"describe_geometry\",\n    \"copy_head_shard_within_groups\",\n]\n\n\ndef
    dsv4_tp_pad_enabled() -> bool:\n    return os.environ.get(\"VLLM_DSV4_TP_PAD\",
    \"1\") not in (\"\", \"0\", \"false\", \"False\")\n\n\n# FlashInfer DSv4 SM120
    decode dispatch head counts. The backend zero-pads a\n# smaller local head count
    up to the next entry around the kernel call, so any\n# local <= 128 is runnable.
    (nvidia/flashinfer_sparse.py:592-603)\n#\n# NOTE: this is vLLM's CLAIM about the
    kernel, not the kernel itself. A decode\n# smoke test at the chosen local head
    count is the only way to confirm it.\n_DISPATCH_LOCAL_HEADS = (8, 16, 32, 64,
    128)\n_MAX_LOCAL_HEADS = 128\n\n\ndef pad_heads_for_groups(num_heads: int, tp_size:
    int, o_groups: int) -> int:\n    \"\"\"Smallest head count >= num_heads that is
    TP-legal under R1 group semantics.\n\n    R1 keeps all `o_groups` groups on every
    rank and shards heads within each\n    group, so the binding constraint is on
    heads-per-group:\n\n        heads_per_group % tp_size == 0\n\n    i.e. num_heads
    must be a multiple of `tp_size * o_groups`.\n\n    For V4-Flash at TP=3: 64 ->
    72 (8 groups x 9 heads, 3 heads/group/rank).\n\n    Raises if the resulting local
    head count exceeds what the decode kernel can\n    dispatch -- better a loud failure
    here than a silent mis-dispatch later.\n    \"\"\"\n    if tp_size <= 1:\n        return
    num_heads\n    if o_groups <= 0:\n        raise ValueError(f\"o_groups must be
    positive, got {o_groups}\")\n\n    step = tp_size * o_groups\n    padded = ((num_heads
    + step - 1) // step) * step\n\n    local = padded // tp_size\n    if local > _MAX_LOCAL_HEADS:\n
    \       raise ValueError(\n            f\"padded local head count {local} exceeds
    the max dispatchable \"\n            f\"{_MAX_LOCAL_HEADS} (heads={num_heads}
    -> {padded}, tp={tp_size}, \"\n            f\"o_groups={o_groups})\"\n        )\n
    \   return padded\n\n\ndef local_heads_per_group(padded_heads: int, tp_size: int,
    o_groups: int) -> int:\n    \"\"\"Heads per group held by ONE rank under R1.\n\n
    \   V4-Flash at TP=3: 72 / (3 * 8) = 3.\n\n    This is the value that must satisfy
    the hard invariant at\n    `fused_inv_rope_fp8_quant.py:183`:  num_heads == n_groups
    * heads_per_group\n    where num_heads there is the rank-local head count.\n    \"\"\"\n
    \   step = tp_size * o_groups\n    if padded_heads % step != 0:\n        raise
    ValueError(\n            f\"padded_heads={padded_heads} is not a multiple of \"\n
    \           f\"tp_size*o_groups={step}; R1 sharding would be non-integral\"\n
    \       )\n    return padded_heads // step\n\n\ndef pad_fill_value(param_name:
    str) -> float:\n    \"\"\"The value a padded lane of `param_name` must be filled
    with.\n\n    *** THE WHOLE POINT OF THIS FUNCTION IS THAT IT IS NOT ALWAYS ZERO.
    ***\n\n    attn_sink is an extra logit appended to the softmax denominator:\n
    \       denom = sum_j exp(s_j) + exp(sink)\n\n      sink = -inf  =>  exp(-inf)
    = 0  =>  denominator unchanged, sink DISABLED.\n                       This is
    the identity element and the correct pad value.\n      sink = 0     =>  exp(0)
    = 1     =>  adds 1.0 to the denominator, shrinking\n                       every
    attention weight for that head. Silently wrong --\n                       plausible
    output, wrong attention temperature.\n\n    Every other padded tensor (wq_b rows,
    wo_a slices, wo_b rows) takes 0.0,\n    which annihilates exactly through the
    fp8 einsum and the all-reduce.\n\n    wo_b's pad rows do not strictly need zeroing
    (a zero `z` slice annihilates\n    them), but they MUST NOT be left as uninitialized
    `torch.empty` memory:\n    0 * NaN = NaN would poison every rank through the all-reduce.\n
    \   \"\"\"\n    if param_name.endswith(\"attn_sink\") or \".attn_sink\" in param_name:\n
    \       return -float(\"inf\")\n    return 0.0\n\n\ndef describe_geometry(num_heads:
    int, tp_size: int, o_groups: int) -> str:\n    \"\"\"One-line INFO log so a wrong
    shard is visible at startup, not at eval time.\"\"\"\n    padded = pad_heads_for_groups(num_heads,
    tp_size, o_groups)\n    local = padded // tp_size\n    hpg = local_heads_per_group(padded,
    tp_size, o_groups)\n    return (\n        f\"DSv4 TP pad: heads {num_heads}->{padded}
    (tp={tp_size}), \"\n        f\"local_heads={local}, o_groups={o_groups} (REPLICATED,
    not divided), \"\n        f\"heads_per_group_per_rank={hpg}, real_heads={num_heads}\"\n
    \   )\n\n\ndef copy_head_shard_within_groups(\n    dest: torch.Tensor,\n    src:
    torch.Tensor,\n    tp_rank: int,\n    tp_size: int,\n    o_groups: int,\n    real_heads:
    int,\n    head_dim: int,\n    fill: float = 0.0,\n) -> None:\n    \"\"\"Load a
    rank's head-shard under R1 group-replicated sharding.\n\n    Unlike a flat column
    shard, R1 takes a contiguous slice of heads FROM EACH\n    GROUP, not a contiguous
    slice of the whole head axis. Rank k holds heads\n    [k*hpg, (k+1)*hpg) within
    every one of the `o_groups` groups.\n\n    src is the full checkpoint tensor whose
    leading axis is real_heads*head_dim.\n    dest is this rank's parameter, sized
    o_groups*hpg*head_dim.\n\n    Padded lanes (group slots >= real heads-per-group)
    get `fill`.\n    \"\"\"\n    dest.fill_(fill)\n\n    real_hpg = real_heads //
    o_groups                # 8\n    hpg_local = dest.shape[0] // (o_groups * head_dim)\n
    \   start = tp_rank * hpg_local\n\n    for g in range(o_groups):\n        for
    j in range(hpg_local):\n            h_in_group = start + j\n            if h_in_group
    >= real_hpg:\n                continue  # padded head: leave at `fill`\n            src_head
    = g * real_hpg + h_in_group\n            dst_off = (g * hpg_local + j) * head_dim\n
    \           src_off = src_head * head_dim\n            dest[dst_off : dst_off
    + head_dim].copy_(\n                src[src_off : src_off + head_dim]\n            )\n"
  fix-nvfp4-ds-mla-long-context.patch: |
    # Fix nvfp4_ds_mla long-context decode regression (Issue #22)
    #
    # ACTUAL ROOT CAUSE: flashmla_sparse.py dispatches nvfp4_ds_mla to the slow
    # _forward_bf16_kv path instead of the fast _forward_fp8_kv path.  The584-byte
    # KV layout is identical for both dtypes on DSV4; only the kernel dispatch differs.
    #
    # Line 880 in flashmla_sparse.py:
    #   use_fp8_cache = self.kv_cache_dtype == "fp8_ds_mla"
    # For nvfp4_ds_mla → False → slow _forward_bf16_kv
    # For fp8_ds_mla   → True  → fast _forward_fp8_kv
    #
    # FIX: Change to:
    #   use_fp8_cache = self.kv_cache_dtype in ("fp8_ds_mla", "nvfp4_ds_mla")
    #
    # This routes nvfp4_ds_mla to the same optimized FP8 kernel path, which is
    # ~16x faster at long context (600K+ tokens).

    --- a/v1/attention/backends/mla/flashmla_sparse.py
    +++ b/v1/attention/backends/mla/flashmla_sparse.py
    @@ forward_mqa @@
    -        use_fp8_cache = self.kv_cache_dtype == "fp8_ds_mla"
    +        use_fp8_cache = self.kv_cache_dtype in ("fp8_ds_mla", "nvfp4_ds_mla")
  hotfix-deepgemm-sm121-mqa-header-alias.sh: |
    #!/usr/bin/env bash
    # Hotfix: DeepGEMM SM121 indexer-logits header alias (default OFF, opt-in).
    #
    # The vendored DeepGEMM in ghcr.io/anemll/dspark-vllm-gx10:0.1.1 names the
    # Lightning-indexer logits kernels by the *exact* compute capability
    # (GB10 = 12.1 -> "sm121_fp8_mqa_logits<...>" and
    # "impls/sm121_fp8_mqa_logits.cuh") but ships only the sm120_* headers.
    # Production works today only because the persisted JIT cache
    # (VLLM_CACHE_ROOT/deep_gemm) holds cubins compiled from sm120_* by an earlier
    # build; on any cache MISS (fresh volume, new cache root, a new head count, the
    # fp4 indexer cache path) the compile fails:
    #   "Failed to open .../impls/sm121_fp8_mqa_logits.cuh"
    #   "identifier sm121_fp8_mqa_logits is undefined"
    # and the engine dies on the first request that needs the kernel.
    #
    # This script writes four one-line alias headers that include the sm120_*
    # implementation and #define the sm121_* symbol to it. SM120 and SM121 share
    # the Blackwell consumer ISA; the code path is byte-identical to what the
    # working cache entries were compiled from. Idempotent; --status reports.
    set -euo pipefail

    IMPLS="${DEEP_GEMM_IMPLS_DIR:-/usr/local/lib/python3.12/dist-packages/vllm/third_party/deep_gemm/include/deep_gemm/impls}"
    KERNELS=(fp8_mqa_logits fp8_paged_mqa_logits fp4_mqa_logits fp4_paged_mqa_logits)
    MARK="// [dspark-deepgemm-sm121-alias]"

    status() {
      local rc=0
      for k in "${KERNELS[@]}"; do
        if [ -f "$IMPLS/sm121_$k.cuh" ] && grep -qF "$MARK" "$IMPLS/sm121_$k.cuh"; then
          printf 'deepgemm sm121 alias %-24s: APPLIED\n' "$k"
        elif [ -f "$IMPLS/sm121_$k.cuh" ]; then
          printf 'deepgemm sm121 alias %-24s: PRESENT (not ours; left alone)\n' "$k"
        else
          printf 'deepgemm sm121 alias %-24s: NOT APPLIED\n' "$k"; rc=1
        fi
      done
      return $rc
    }

    if [ "${1:-}" = "--status" ]; then status; exit $?; fi

    [ -d "$IMPLS" ] || { echo "FATAL: DeepGEMM impls dir missing: $IMPLS" >&2; exit 1; }
    for k in "${KERNELS[@]}"; do
      src="$IMPLS/sm120_$k.cuh"; dst="$IMPLS/sm121_$k.cuh"
      [ -f "$src" ] || { echo "FATAL: $src missing; refusing to alias" >&2; exit 1; }
      if [ -f "$dst" ]; then
        grep -qF "$MARK" "$dst" && { echo "  [skip] $dst already applied"; continue; }
        echo "  [keep] $dst exists and is not ours; leaving it"; continue
      fi
      tmp="$(mktemp "$IMPLS/.sm121_$k.XXXXXX")"
      # DeepGEMM's include parser accepts only its own <deep_gemm/...> spelling.
      printf '%s\n#pragma once\n#include <deep_gemm/impls/sm120_%s.cuh>\n#define sm121_%s sm120_%s\n' "$MARK" "$k" "$k" "$k" > "$tmp"
      chmod 0644 "$tmp"; mv -f "$tmp" "$dst"
      echo "  [OK]   $dst -> sm120_$k.cuh"
    done
    echo "=== Verification ==="; status
  hotfix-dsv4-adaptive-prefill-chunk.py: |
    #!/usr/bin/env python3
    """Adaptive long-prefill chunk cap: 1024 only while decode lanes are active.

    ``--long-prefill-token-threshold 1024`` (issue #27/#43) keeps mixed-load
    decode from starving, but a cold c=1 prefill still pays the per-chunk fixed
    cost (collectives, indexer/compressor setup, launches) once per 1024 tokens.
    When no running request is decode-active, raise the cap to
    ``max_num_batched_tokens`` so an 8K prompt is one chunk. Mixed load is
    unchanged: any decode-active member of ``self.running`` restores the
    configured 1024-token cap. Independent of the #27/#43 injection sites.

    Idempotent. Patches ``vllm/v1/core/sched/scheduler.py``.
    """
    from pathlib import Path
    import sys

    P = Path("/usr/local/lib/python3.12/dist-packages/vllm/v1/core/sched/scheduler.py")
    MARK = "# [dspark-adaptive-chunk]"
    if len(sys.argv) > 1 and sys.argv[1] == "--status":
        status_src = P.read_text() if P.is_file() else ""
        print("dspark adaptive prefill chunk      :",
              "APPLIED" if MARK in status_src else "NOT APPLIED")
        raise SystemExit(0)
    src = P.read_text()
    if MARK in src:
        print(f"[dspark-adaptive-chunk] already applied to {P}")
        raise SystemExit(0)

    RUNNING_OLD = (
        "            if 0 < self.scheduler_config.long_prefill_token_threshold < num_new_tokens:\n"
        "                num_new_tokens = self.scheduler_config.long_prefill_token_threshold\n"
    )
    WAITING_OLD = (
        "                    threshold = self.scheduler_config.long_prefill_token_threshold\n"
        "                    if 0 < threshold < num_new_tokens:\n"
        "                        num_new_tokens = threshold\n"
    )
    assert RUNNING_OLD in src, "dspark-adaptive-chunk: running-loop anchor not found; refusing to patch"
    assert WAITING_OLD in src, "dspark-adaptive-chunk: waiting-loop anchor not found; refusing to patch"

    RUNNING_NEW = (
        "            # [dspark-adaptive-chunk] keep the 1024 mixed-load floor only when\n"
        "            # a decode-active request is already running; otherwise one chunk\n"
        "            # can take the full max_num_batched_tokens (c=1 TTFT).\n"
        "            _chunk_cap = self.scheduler_config.long_prefill_token_threshold\n"
        "            if _chunk_cap > 0 and not any(\n"
        "                not r.is_prefill_chunk for r in self.running\n"
        "            ):\n"
        "                _chunk_cap = self.scheduler_config.max_num_batched_tokens\n"
        "            if 0 < _chunk_cap < num_new_tokens:\n"
        "                num_new_tokens = _chunk_cap\n"
    )
    WAITING_NEW = (
        "                    # [dspark-adaptive-chunk] same cap as the running loop.\n"
        "                    threshold = self.scheduler_config.long_prefill_token_threshold\n"
        "                    if threshold > 0 and not any(\n"
        "                        not r.is_prefill_chunk for r in self.running\n"
        "                    ):\n"
        "                        threshold = self.scheduler_config.max_num_batched_tokens\n"
        "                    if 0 < threshold < num_new_tokens:\n"
        "                        num_new_tokens = threshold\n"
    )
    src = src.replace(RUNNING_OLD, RUNNING_NEW, 1)
    src = src.replace(WAITING_OLD, WAITING_NEW, 1)
    compile(src, "scheduler.py", "exec")
    P.write_text(src)
    print(f"[dspark-adaptive-chunk] patched {P}")
  hotfix-dsv4-assistant-final-continuation.py: |
    #!/usr/bin/env python3
    """Hotfix: emit a generation header when a request effectively ends with a closed assistant turn, including when a trailing latest_reminder annotation follows it.

    Symptom
    -------
    An agent harness gets stuck emitting empty turns: 1-2 generated tokens with
    `finish_reason: "stop"`, no tool call, and fragments of hallucinated markup
    (`<result observation="no-op"></content>`, stray `</parameter>` / `</name>` /
    `<value>`), or a sentence fragment that continues the previous turn instead of
    answering. Server metrics during a live incident: 6 of 37 requests generated
    <= 10 tokens, all `stop`, zero `length` — the model chose to stop rather than
    being truncated.

    Cause
    -----
    `render_message()` appends the generation header (`ASSISTANT_SP_TOKEN` plus the
    thinking token) only when the trailing message is `user` or `developer`:

        elif messages[index].get("role") in ["user", "developer"]:

    When the request's `messages` array ends with an **assistant** message, that
    branch is skipped, the turn is closed with EOS, and the prompt ends on a bare
    EOS with no header. The model is asked to generate from a closed, turnless
    state. Measured on this recipe:

        assistant-final: '...to the reviewer for a fresh verdict:<|end of sentence|>'
        user-final:      '...verdict:<EOS><|User|>continue<|Assistant|><think>'

    It is self-sustaining: the harness records the resulting empty turn, so the next
    request also ends with an assistant message. One bad turn locks the loop;
    inserting any user-role message breaks it instantly. Requests reach this shape
    whenever a harness retries after a mid-stream error and re-sends the partial
    assistant turn, which is why the same prompt works for a long time and then
    does not.

    The same retry shape can carry a trailing `latest_reminder` annotation after
    the re-sent partial assistant turn (the harness appends fresh context as a
    reminder message). The reminder defeats the fix twice over: stock closes the
    assistant turn with EOS, renders the bare reminder after it, and the prompt
    still ends with no generation header — the model reads the reminder from the
    same dead state.

    Why a header and not `wo_eos`
    -----------------------------
    `encoding_dsv4.py` also has `assistant_msg_wo_eos_template`, and reopening the
    trailing turn looks like a tempting one-line fix. It is wrong. Measured on one
    prompt via /v1/completions, generated tokens:

        trailing turn   | stock (EOS) | wo_eos (reopen) | EOS + header
        partial         | 32          | 208             | 260
        complete        | 16 (fragment)| 1 (EMPTY, dead)| 140 (healthy)

    Reopening a *complete* assistant turn just moves the dead state: the model has
    nothing left to add and emits EOS immediately. Appending a fresh generation
    header after the closed assistant turn is correct for both shapes and matches
    the checkpoint encoder's existing generation transition.

    Scope
    -----
    Only the final message of a request is affected, and only when it is an
    assistant turn, or a `latest_reminder` whose immediate predecessor is an
    assistant turn. Every other rendering path is untouched, including:
    consecutive assistant messages mid-transcript; reminders mid-transcript; and
    reminder tails directly after a `user`/`developer` message — those already
    end inside the pending generation slot (the checkpoint emits
    `ASSISTANT_SP_TOKEN` + thinking token *before* such a reminder) and must stay
    byte-identical.

    Gating and fail-closed operation
    --------------------------------
    The compose entrypoint invokes this script only when
    `DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX` is exactly `1` (default `0` = stock
    renderer, this script never runs), and chains it with `|| exit 1`. Because an
    invocation means the operator asked for the fix, everything fails nonzero:

    - encoder file missing (the prerequisite `encoding_dsv4.py` copy did not
      happen) — a gated-ON boot must not silently serve the buggy stock renderer;
    - anchor text missing (upstream encoder drifted) — nothing is written;
    - post-write self-check failure (patched module does not import, a fixed
      shape still renders without a generation header — assistant-final, or
      assistant-final plus trailing `latest_reminder` — or a
      user->latest_reminder tail gains a second header) — the original file
      bytes are restored first, then exit 1.

    Idempotent: an already-patched encoder is not rewritten, but it must still pass
    the self-check. Patches the encoding module the server actually loads, so it
    must run AFTER the compose entrypoint copies `encoding_dsv4.py` into place.

    Usage (inside container, after encoder copy):
      python3 hotfix-dsv4-assistant-final-continuation.py
      python3 hotfix-dsv4-assistant-final-continuation.py /path/to/deepseek_v4_encoding.py
    """
    from __future__ import annotations

    import importlib.util
    import sys
    from pathlib import Path

    DEFAULT_TARGET = Path(
        "/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py"
    )
    MARK = "[assistant-final-hotfix]"

    OLD = (
        "    elif messages[index].get(\"role\") in [\"user\", \"developer\"]:\n"
        "        # Normal generation: append Assistant + thinking token\n"
    )
    NEW = (
        "    elif messages[index].get(\"role\") in [\"user\", \"developer\"] or (\n"
        f"        # {MARK} A request may legitimately end with an assistant turn\n"
        "        # (harness retry, continuation), optionally annotated by a\n"
        "        # trailing latest_reminder harness message. Without a generation\n"
        "        # header the prompt ends on a bare EOS (or a bare reminder after\n"
        "        # the closed turn) and the model generates from a dead state:\n"
        "        # immediate EOS, or raw DSML markup emitted as text. A reminder\n"
        "        # tail directly after user/developer already ends inside the\n"
        "        # pending generation slot and must stay byte-identical.\n"
        "        messages[index].get(\"role\") == \"assistant\"\n"
        "        and index == len(messages) - 1\n"
        "    ) or (\n"
        "        messages[index].get(\"role\") == \"latest_reminder\"\n"
        "        and index == len(messages) - 1\n"
        "        and index > 0\n"
        "        and messages[index - 1].get(\"role\") == \"assistant\"\n"
        "    ):\n"
        "        # Normal generation: append Assistant + thinking token\n"
    )


    def _self_check(target: Path) -> tuple[bool, str]:
        """Import the patched encoder and confirm the fix actually renders.

        A trailing-assistant transcript must end with the generation header
        (assistant speaker token + thinking token) instead of a bare EOS, the
        same shape annotated by a trailing latest_reminder must regain that
        fresh header after the reminder, and a user->latest_reminder tail must
        keep its stock single in-slot header (no second header appended).
        """
        spec = importlib.util.spec_from_file_location("enc_check", target)
        if spec is None or spec.loader is None:
            return False, f"cannot load module spec from {target}"
        enc = importlib.util.module_from_spec(spec)
        try:
            spec.loader.exec_module(enc)
            base = [
                {"role": "system", "content": "s"},
                {"role": "user", "content": "u"},
                {"role": "assistant", "content": "A finished answer."},
            ]
