        _vllm_version(provider)
        try:
            st = target.lstat()
        except FileNotFoundError:
            raise HotfixError("target is missing")
        if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode):
            raise HotfixError("target is not a regular file")
