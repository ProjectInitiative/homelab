    """Official DeepSeek-V4-Flash-Vision-Exp ViT + Aligner (pure PyTorch).

    Adapted from deepseek-ai/DeepSeek-V4-Flash-Vision-Exp ``inference/vision.py``
    (MIT) so it can load the checkpoint tensors on Anemll vLLM without the
    official custom kernels. RoPE tables are moved onto the activation device.
    """
    from __future__ import annotations

    from functools import lru_cache
    from typing import Any

    import torch
    import torch.nn.functional as F
    from torch import nn


    @lru_cache(8)
    def get_vision_cos_sin(n_h: int, n_w: int, dim: int, theta: float):
        inv_freq = 1.0 / (theta ** (torch.arange(0, dim, 2, dtype=torch.float32) / dim))
        hpos = torch.arange(n_h).unsqueeze(1).expand(n_h, n_w)
        wpos = torch.arange(n_w).unsqueeze(0).expand(n_h, n_w)
        freqs = torch.stack([hpos, wpos], dim=-1).reshape(-1, 2, 1).float() * inv_freq
        freqs = freqs.flatten(1)
        return freqs.cos().unsqueeze(1), freqs.sin().unsqueeze(1)


    def apply_rotary(x: torch.Tensor, cos: torch.Tensor, sin: torch.Tensor) -> torch.Tensor:
        dtype = x.dtype
        x1, x2 = x.float().chunk(2, dim=-1)
        return torch.cat([x1 * cos - x2 * sin, x2 * cos + x1 * sin], dim=-1).to(dtype)


    class RMSNorm(nn.Module):
        def __init__(self, dim: int, eps: float = 1e-6):
            super().__init__()
            self.eps = eps
            self.weight = nn.Parameter(torch.ones(dim, dtype=torch.float32))

        def forward(self, x: torch.Tensor) -> torch.Tensor:
            dtype = x.dtype
            x = x.float()
            x = x * torch.rsqrt(x.square().mean(-1, keepdim=True) + self.eps)
            return (self.weight * x).to(dtype)


    class PatchEmbed(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.proj = nn.Linear(3 * args.vision_patch_size**2, args.vision_dim)

        def forward(self, x: torch.Tensor) -> torch.Tensor:
            return self.proj(x.flatten(1))


    class Attention(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.n_heads = args.vision_n_heads
            self.head_dim = args.vision_dim // args.vision_n_heads
            self.wqkv = nn.Linear(args.vision_dim, 3 * args.vision_dim)
            self.wo = nn.Linear(args.vision_dim, args.vision_dim)

        def forward(self, x: torch.Tensor, cos: torch.Tensor, sin: torch.Tensor) -> torch.Tensor:
            n = x.size(0)
            q, k, v = (
                t.view(n, self.n_heads, self.head_dim)
                for t in self.wqkv(x).chunk(3, dim=-1)
            )
            q = apply_rotary(q, cos, sin)
            k = apply_rotary(k, cos, sin)
            o = F.scaled_dot_product_attention(
                q.transpose(0, 1), k.transpose(0, 1), v.transpose(0, 1)
            )
            return self.wo(o.transpose(0, 1).reshape(n, -1))


    class MLP(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.w1 = nn.Linear(args.vision_dim, 2 * args.vision_inter_dim, bias=False)
            self.w2 = nn.Linear(args.vision_inter_dim, args.vision_dim, bias=False)

        def forward(self, x: torch.Tensor) -> torch.Tensor:
            gate, up = self.w1(x).chunk(2, dim=-1)
            return self.w2(F.silu(gate) * up)


    class Block(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.norm1 = RMSNorm(args.vision_dim)
            self.attn = Attention(args)
            self.norm2 = RMSNorm(args.vision_dim)
            self.mlp = MLP(args)

        def forward(self, x: torch.Tensor, cos: torch.Tensor, sin: torch.Tensor) -> torch.Tensor:
            x = x + self.attn(self.norm1(x), cos, sin)
            return x + self.mlp(self.norm2(x))


    class ViT(nn.Module):
        """DeepSeek ViT: full bidirectional attention over one image with 2D RoPE."""

        def __init__(self, args: Any):
            super().__init__()
            self.rope_dim = args.vision_dim // args.vision_n_heads // 2
            self.rope_theta = args.vision_rope_theta
            self.patch_embed = PatchEmbed(args)
            self.blocks = nn.ModuleList([Block(args) for _ in range(args.vision_n_layers)])
            self.norm = RMSNorm(args.vision_dim)

        def forward(self, patches: torch.Tensor, n_h: int, n_w: int) -> torch.Tensor:
            x = self.patch_embed(patches)
            cos, sin = get_vision_cos_sin(n_h, n_w, self.rope_dim, self.rope_theta)
            cos = cos.to(device=x.device, dtype=torch.float32)
            sin = sin.to(device=x.device, dtype=torch.float32)
            for block in self.blocks:
                x = block(x, cos, sin)
            return self.norm(x)


    class Aligner(nn.Module):
        def __init__(self, args: Any):
            super().__init__()
            self.downsample_ratio = args.vision_downsample_ratio
            in_dim = args.vision_dim * self.downsample_ratio**2
            hidden = getattr(args, "dim", None) or args.hidden_size
            self.w1 = nn.Linear(in_dim, hidden)
            self.w2 = nn.Linear(hidden, hidden)

        def forward(self, x: torch.Tensor, n_h: int, n_w: int) -> torch.Tensor:
            r = self.downsample_ratio
            x = x.view(n_h, n_w, -1).permute(2, 0, 1)
            x = F.pad(x, (0, -n_w % r, 0, -n_h % r))
            x = F.unfold(x.unsqueeze(0), r, stride=r).squeeze(0).transpose(0, 1)
            return self.w2(F.gelu(self.w1(x)))
kind: ConfigMap
metadata:
  name: miaai-parity-vision-exp
  namespace: llm-test

---
apiVersion: v1
data:
  .env.dspark: |
    # DeepSeek V4 Flash DSpark C12 NVFP4 profile for 2x DGX Spark TP=2.
    # Copy to .env.dspark on each node and adjust node-specific values.
    #
    # Env matrix (Anemll 0.1.1 vs Stage-C overlay): see docs/ENVS.md
    # Default image is Anemll — keep Stage-C-only VLLM_* keys commented unless
    # you build/run the Stage-C image and merge docker-compose.stage-c.override.yml.

    # Cluster
    WORKER_HOST=172.16.5.56
    # Third Spark for optional ./start-tp3.sh (ignored by the 2-node start).
    # On a QSFP ring this node is a different CX /24 than WORKER_HOST — set
    # WORKER2_NCCL_* to spark3's facing port toward the head, and
    # WORKER2_NFS_SERVER_IP to the head CX IP on that link (not 10.0.22.1).
    # ./start-tp3.sh --max-num-seqs overrides TP3_MAX_NUM_SEQS; 2-node keeps MAX_NUM_SEQS.
    # WORKER2_HOST=worker2-host-or-roce-ip
    # WORKER2_VLLM_HOST_IP=
    # WORKER2_DIR=
    # WORKER2_HF_CACHE=
    # WORKER2_NCCL_IB_HCA=
    # WORKER2_NCCL_SOCKET_IFNAME=
    # WORKER2_TP_SOCKET_IFNAME=
    # WORKER2_GLOO_SOCKET_IFNAME=
    # WORKER2_NFS_SERVER_IP=10.0.23.1
    # TP3_MAX_NUM_SEQS=16
    # Prerequisites the launcher checks but does not do: passwordless SSH to
    # WORKER2_HOST and the pinned DSPARK_VLLM_IMAGE already pulled there.
    # Everything else (dir, compose/env/patches sync, NFS mount) is automatic.
    # See docs/TP3.md.
    # Worker-local checkout/deployment path. Leave blank to mirror the head path.
    WORKER_DIR=
    # Optional explicit worker checkout path. This is useful when the worker clone
    # lives somewhere different from the head checkout; it takes precedence over
    # WORKER_DIR when set.
    WORKER_SCRIPT_DIR=
    MASTER_ADDR=172.16.5.55
    MASTER_PORT=25000
    NODE_RANK=0
    HEADLESS=
    # Issue #38: compose restart policy / stop grace (head mid-load must not SIGKILL
    # under a live worker TCPStore handshake).
    # Issue #72: unless-stopped restores ranks on reboot; start then exits 3 (already
    # up). systemd: SuccessExitStatus=3 RemainAfterExit=yes — or set =no if the unit
    # owns start/stop. Exit 3 is not a health check.
    # DSPARK_RESTART_POLICY=unless-stopped
    # DSPARK_STOP_GRACE=10s

    # Worker node should use:
    # NODE_RANK=1
    # HEADLESS=1

    # RoCE / InfiniBand (head node). On a QSFP ring, the worker's facing port
    # name often differs — set WORKER_NCCL_* below; start-*.sh passes them remotely.
    NCCL_IB_HCA==mlx5_1:1
    NCCL_SOCKET_IFNAME=enp1s0f1np1
    TP_SOCKET_IFNAME=enp1s0f1np1
    GLOO_SOCKET_IFNAME=enp1s0f1np1
    # Optional worker overrides (defaults to the head values if unset).
    # Set these on the HEAD .env; start-deepseek-v4-flash-dspark.sh injects them on
    # remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in
    # docker-compose — that substitution is not rank-aware.
    # WORKER_NCCL_IB_HCA=rocep1s0f0
    # WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0
    # WORKER_TP_SOCKET_IFNAME=enp1s0f0np0
    # WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0
    # NCCL_IB_HCA accepts NCCL's full selector grammar and start-*.sh mirrors it
    # for the sysfs GID lookup: optional leading "^" (exclude), then optional "="
    # (exact name match instead of prefix match), comma-separated name[:port]
    # tokens. NCCL stores only the first 32 non-empty entries and truncates each
    # stored name to 63 bytes before matching; the resolver does the same. Omitted
    # port = every port of the device. An exact list like "=devA,devB" is
    # recommended filtering for deterministic member selection on a multi-HCA
    # node — it is not something NCCL_IB_MERGE_NICS itself requires.
    # RoCEv2 GID index: start-*.sh validates every selected HCA/port from sysfs
    # by default (NCCL_IB_GID_AUTO=1) and then leaves NCCL_IB_GID_INDEX unset on
    # both ranks. The usable index differs per node/HCA and drifts after reboot,
    # and one global pin cannot serve several HCAs — NCCL selects the RoCEv2/IPv4
    # GID per HCA when the variable is absent. The launcher fails closed (with
    # per-member diagnostics) when a member has no usable RoCE v2 GID; disjoint
    # per-member index sets are fine because nothing is pinned. NCCL_IB_GID_INDEX
    # / WORKER_NCCL_IB_GID_INDEX values left in this file are reported and
    # ignored while auto mode is on.
    # Selector grammar follows NCCL: name[:port[:rail[:plane]]], where an absent or
    # empty port means any port ("devA:" == "devA") and a non-empty port uses
    # one atoi-style conversion after optional whitespace/sign, stopping at the
    # first non-digit even across embedded newlines (":08" is decimal port 8); a
    # port outside the conservative nine-digit bound is rejected rather than
    # treated as "any port".
    # Independently of the 32-entry selector limit, matching is applied to at most
    # MAX_IB_DEVS=32 ports NCCL itself would consider: ACTIVE only, with link layer
    # Ethernet or InfiniBand. A DOWN second port on a dual-port card is therefore ignored instead of failing the
    # resolve, so a plain prefix like "roce" works even when half the ports are
    # unused.
    # Pin only when you disable auto:
    # NCCL_IB_GID_AUTO=0
    # NCCL_IB_GID_INDEX=3
    # WORKER_NCCL_IB_GID_INDEX=6
    # Optional match IPs if the RoCE address is not the ifname primary IPv4:
    # NCCL_IB_GID_MATCH_IP=10.0.22.1
    # WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2
    NCCL_CROSS_NIC=1

    # Caches / model
    HF_CACHE=/cache/huggingface
    # Optional worker-local Hugging Face cache (checkpoint + Triton/TileLang/vLLM/…).
    # Default DSPARK_WORKER_HF_NFS=0: prepare copies hub weights onto the worker.
    # Set DSPARK_WORKER_HF_NFS=1 to skip that copy — the worker mounts the head
    # HF_CACHE over NFSv4 on the ConnectX link (same as Qwen3.8-Flash-vLLM); this
    # path is then JIT overlays only.
    WORKER_HF_CACHE=
    DSPARK_WORKER_HF_NFS=0
    # Head ConnectX address that exports the HF cache. Unset = IPv4 on
    # NCCL_SOCKET_IFNAME (do not use the 10.0.0.1 loopback alias).
    # NFS_SERVER_IP=10.0.22.1
    # Prefer offline when the hub cache is complete.
    HF_HUB_OFFLINE=1
    TRANSFORMERS_OFFLINE=1
    HF_HUB_DISABLE_XET=1
    # Hub HTTP timeouts used by prepare-dspark-model-cache.sh. hf_hub defaults to
    # 10s/10s, which aborts multi-GB shard downloads on a slow or proxied link.
    # HF_HUB_DOWNLOAD_TIMEOUT=120
    # HF_HUB_ETAG_TIMEOUT=30
    # Optional Hub token for prepare. An exported shell HF_TOKEN /
    # HUGGING_FACE_HUB_TOKEN is picked up automatically and wins over this file.
    # Putting a live token here is scp'd to the worker — prefer the shell.
    # HF_TOKEN=
    # Parallel Hub shard fetches (prepare default is 1, disk-safe but slow).
    # HF_DOWNLOAD_WORKERS=4
    # Checkpoint flag: 0 = official Vision-Exp, 1 = abliterated (Keys).
    # start- / prepare- resolve DSPARK_MODEL from this — do not set DSPARK_MODEL by hand.
    # Abliterated Hub id is gated (auto-approve after RESPONSIBLE_USE.md); prepare
    # needs HF_TOKEN in the shell or huggingface-cli login.
    ABLITERATED=0
    DSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
    DSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4Flash-Vision-EXP-ablit
    # Pin official HF revision. Default when unset: Vision-Exp 86f746b3…
    # Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses
    # DSPARK_REVISION_ABLITERATED (empty = tip of that repo).
    DSPARK_REVISION=86f746b36186f0e567729a5c06a8c918caba82a9
    # DSPARK_REVISION_ABLITERATED=
    # Optional pin for the encoder inside the container. Leave empty to auto-find
    # encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers
    # DSPARK_REVISION when set).
    DSPARK_ENCODING_FILE=
    SERVED_MODEL_NAME=deepseek-v4-flash-vision-exp
    # Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.
    # For a head-node-only test, set this back to 127.0.0.1.
    VLLM_HOST=0.0.0.0
    # API listen port. The launcher also accepts a temporary --port override.
    VLLM_PORT=8000
    # --- API auth (optional) -------------------------------------------------
    # vLLM itself (not the reverse proxy) enforces `Authorization: Bearer <key>`
    # on its OpenAI-compatible endpoints. Two mutually exclusive variables:
    #
    #   VLLM_API_KEY     — one key (vLLM's native single-key env var)
    #   DSPARK_API_KEYS  — many independently revocable keys (one flag, N keys)
    #
    # If both are non-empty the container entrypoint AND the start- / smoke- /
    # status-*.sh scripts exit 2 naming both variables; the server never silently
    # chooses one. Leave both empty (default) for stock unauthenticated behavior.
    #
    # Every route outside the guarded prefixes `/v1`, `/v2`, `/inference` is
    # keyless. On the pinned runtime that includes `POST /invocations` and `POST
    # /generative_scoring` (both run inference unauthenticated) and the `/tokenize`
    # / `/detokenize` utility routes, besides `/health`, `/metrics`, `/version`,
    # `/ping`; a keyed deployment still needs network-level access control on the
    # server port.
    #
    # DSPARK_API_KEYS must be a single line and uses literal space/tab separators
    # only. Parsing trims and collapses separators, preserves order, allows
    # duplicates, and rejects CR/LF/VT/FF, backslashes, or a token starting with
    # `-` (which would be mistaken for a vLLM flag), all with exit 2. Set it only
    # in `.env.dspark`; the launcher rejects a process-only or mismatched shell value.
    # Quote the value: the launcher sources .env.dspark, so an unquoted
    # space-separated value would run the second key as a command.
    #
    # Keys are process arguments and container environment: argv/env visibility —
    # host `ps` and `docker inspect` can read them — is by design. Rotation means
    # editing this line and doing ./stop-deepseek-v4-flash-dspark.sh && ./start-deepseek-v4-flash-dspark.sh
    # (no hot reload). vLLM does not attribute requests to a key, so this provides
    # revocation and blast-radius control, not per-user logging.
    #
    # When either key variable is set, the entrypoint requires
    # patches/hotfix-vllm-redact-api-key-log.sh to apply and verify (`--status`) and
    # fails the container before exec vllm on any error — no DSPARK_SKIP_HOTFIX
    # bypass. It keeps key bytes out of the startup Docker log: the `non-default
    # args` line then shows 'api_key': ['<redacted:N value(s)>'] (N = number of
    # keys) instead of the key values. argv/env exposure via docker inspect / host
    # `ps` is unchanged.
    #
    # VLLM_API_KEY=sk-single-key
    # DSPARK_API_KEYS="sk-dspark-alice sk-dspark-bob"
    # Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the
    # worker to the head node's fabric address. Set these to each node's RoCE IP.
    VLLM_HOST_IP=172.16.5.55
    WORKER_VLLM_HOST_IP=172.16.5.56

    # Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).
    # Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging
    # cannot silently change what you run. Bump deliberately:
    #   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1
    #   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')
    #   3) update the @sha256: below.
    DSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
    # Alternative: build locally with ./build-dspark-vllm-runtime.sh. A digest pin
    # cannot be docker build -t (issue #173); the script tags
    # vllm-dspark-runtime:dspark-nvfp4-stage-c and does not retag this Anemll image.
    # Serve Stage-C by pointing DSPARK_VLLM_IMAGE at that tag and merging
    # docker-compose.stage-c.override.yml (see docs/ENVS.md).

    # Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);
    # k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).
    # Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1), but the engine clamps it
    # to 24 ("Truncating max_cudagraph_capture_size to 24"), so the 36 requested at
    # k=5 / seqs=6 was never actually in effect. If graph capture OOMs, lower
    # GPU_MEMORY_UTILIZATION_TEXT toward ~0.78.
    MAX_MODEL_LEN=1048576
    MAX_NUM_SEQS=6
    MAX_NUM_BATCHED_TOKENS=8192
    # Cap each chunked-prefill chunk (issue #27). stock vLLM 0.25.2 defines but
    # never enforces max_num_partial_prefills, so without this cap multiple
    # already-admitted-but-still-prefilling requests at the front of the scheduler's
    # running list each consume up to max_num_batched_tokens per step; decode-active
    # requests behind them get num_new_tokens==0 and are skipped via `continue`
    # (NOT preempted) -> zero-preemption decode lane starvation that grows with
    # prompt length. 1024 keeps one prefill chunk well under the 8192 budget so
    # decode lanes always receive step budget; paired with the #27 partial-prefill
    # hotfix (max_num_partial_prefills actually enforced) it collapses x8 spread
    # from ~46x to ~1.05x. Safe across MAX_NUM_SEQS and prompt lengths.
    LONG_PREFILL_TOKEN_THRESHOLD=1024

    # Issue #27: max concurrent in-flight partial prefills. The hotfix reads this
    # once during Scheduler construction because Anemll 0.1.1 rejects
    # --max-num-partial-prefills before engine init. Values 1-3 are accepted;
    # values above 3 clamp to 3. Blank, whitespace-only, nonpositive, or malformed
    # values fall back to SchedulerConfig.max_num_partial_prefills (stock 1);
    # malformed values warn once instead of crashing admission.
    #
    # Shipped value is 1 (strictly serialized prefills). The post-r3 gate
    # (#211) counts in-flight partial prefills exactly from self.running and is
    # live-qualified at 1: repeated fresh-boot gate26 runs on the 2x GB10 TP=2
    # lane held decode-fairness spreads of 1.60-1.76x with zero preemptions.
    # Cap 2 is an evidence-backed opt-in: operator-qualified post-r3 on TP=2 with
    # LONG_PREFILL_TOKEN_THRESHOLD=1024 (issue #217: ABA over three fresh boots,
    # 4x8K gate26 spread 1.50-1.57x at 2 vs 1.53x at 1, zero preemptions at both,
    # TTFT spread 2.1-2.4x vs 4.1x at 1). It trades admission serialization for
    # TTFT/equity on admission-limited shapes; on 4x32K bursts it widens the
    # gate26 spread (3.0-3.3x vs 2.1x) without starving any lane. The pre-r3 A/B
    # that first favored 2 (docs/CLAUDE/ab-results-2026-09-03.md) ran on the
    # undercounting scheduler. Cap 3 remains an explicit opt-in: a separate,
    # limited #217 sample improved 4x8K spread but worsened median TTFT on
    # 8-wide bursts; it is not the same qualification as 2. Set 2 or 3 explicitly
    # if your traffic prefers overlap.
    DSPARK_MAX_INFLIGHT_PREFILLS=1

    # Issue #43: bounded decode service during mixed prefill steps + scheduler
    # diagnostics. The hotfix layers on #27 and guarantees no decode-active lane
    # is skipped (num_new_tokens==0) while a prefill chunk runs in the same step,
    # regardless of LONG_PREFILL_TOKEN_THRESHOLD tuning. Set SCHED_DIAG=1 to emit
    # one compact per-step line (scheduled prefill/decode tokens per request +
    # zero-token decode skips) to vLLM logs; 0 = silent (zero overhead).
    DSPARK_ISSUE43_SCHED_DIAG=0

    # Issue #26: sparsify sliding-window (DSpark draft/indexer) prefix-cache
    # checkpoints to one tail per 4096-token segment plus the replay boundary.
    # Must be a multiple of 256 (scheduler block size). Complements the in-image
    # hybrid-coordinator hotfix v2 (patches/hotfix-dsv4-issue26-hybrid-swa-min.py):
    # this interval is what keeps warm long-prefix hits (sparse SWA tails).
    # v1 also ignored a short SWA length, which skipped prefill with null SWA
    # KV on shared Hermes prefixes (issue #36). v2 lets SWA shrink the hit.
    # Unset/empty is not supported via compose default.
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL=4096

    # DSpark draft SWA prefix fix (port of Anemll/dspark-vllm-gx10#2): on a
    # prefix-cache hit the target skips the cached prefix, so the DSpark draft's
    # 128-token sliding-window cache is never populated and repeated identical
    # prompts degenerate to a truncated response. Exact 1 applies
    # patches/hotfix-vllm-dspark-swa-prefix.py at boot (fail-closed): prefix-cache
    # hits are capped so the target always recomputes the last draft window.
    DSPARK_ENABLE_DSPARK_SWA_PREFIX=0

    # Stateful Responses API continuation is disabled by default. Enable it when
    # clients use `store=true` plus `previous_response_id`. The pinned vLLM build's
    # native stores are otherwise unbounded; the exact-source backport keeps this
    # many terminal entries and removes matching message/event state. Active work
    # can temporarily exceed the entry cap; this is not a retained-byte limit.
    # Stored state is lost on any process restart. Recreate every rank when changing
    # either value; a Docker restart preserves patched writable-layer bytes.
    VLLM_ENABLE_RESPONSES_API_STORE=0
    DSPARK_RESPONSES_STORE_MAX_ENTRIES=256

    # Keep client `stop` strings dormant until </think> (Anemll port of Tony /
    # Capicua25x Patch 5). Default on. Set 0 if a harness must bound reasoning
    # with a stop string. DSPARK_SKIP_SUPPRESS_STOPS_HOTFIX=1 skips the patch.
    # DSPARK_SUPPRESS_STOPS_IN_REASONING=1
    # VLLM_SUPPRESS_STOPS_IN_REASONING=0

    # Issue #52 / PR #53 (assistant-final continuation hotfix): when a request's
    # messages array ends with an assistant message — or with a trailing
    # `latest_reminder` annotation directly after that closed assistant turn — the
    # stock renderer leaves the prompt without a generation header, so the model
    # generates from a dead state — empty no-op turns / hallucinated DSML markup
    # loops in agent harnesses. Default 0 = stock renderer (patch is present on
    # the worker but never invoked). Set exactly 1 to apply the patch at container
    # boot; the boot then fails (exit 1) if the patch cannot be applied or
    # verified, and an already-patched encoder is re-verified instead of rewritten.
    # See docs/PATCHES.md ("Issue #52") for evidence status and fail-closed details.
    DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX=0

    # Issue #138 Responses full-history replay compatibility. Default 0 keeps the
    # pinned vLLM request validator byte-identical and preserves its HTTP 400 for
    # the reported hybrid item. Set exactly 1 to accept only a missing-top-level-
    # type assistant item whose content is a one-element list containing
    # {type: output_text, text: <string>}; stock coercion then supplies message
    # type/id/status/annotations. Explicit type values, multipart or malformed
    # content, other roles, canonical items, tools, and reasoning are unchanged.
    # Enabled apply/verification failure aborts each rank before vLLM exec when the
    # pinned protocol.py source has drifted. Recreate both containers after changing
    # this flag in either direction: restart does not undo a patch in a container's
    # writable layer. Canonical clients should continue replaying the complete
    # type=message/id/status/output_text+annotations output object.
    DSPARK_ENABLE_ISSUE138_RESPONSES_HISTORY_COMPAT=0

    # Codex Responses history compatibility. Default 0 preserves stock validation.
    # Exact 1 converts only the evidenced agent_message shape with exactly one
    # input_text {type,text} content part. id/author/recipient and internal routing
    # metadata are intentionally dropped; malformed, extended, multipart, or
    # unknown item shapes retain stock rejection. The source-locked patch runs
    # after issue #138 when both flags are enabled. Recreate both containers after
    # changing this flag because restart does not restore writable-layer bytes.
    DSPARK_ENABLE_CODEX_AGENT_MESSAGE_COMPAT=0
    # Issue #136 +#210 XGrammar chain (vLLM #52805 termination + #53046
    # post-reasoning draft validation backports, one transaction across
    # backend_xgrammar.py and structured_output/__init__.py): default 0 means this chain patcher is never invoked
    # (the default #44993 grammar-advance train may still modify
    # structured_output/__init__.py independently of this flag). Set exactly 1 only with the
    # pinned image above: vLLM 0.25.2.dev0+g752a3a504.d20260714 and xgrammar 0.2.3.
    # Enabled starts check the exact stock/post source identity (both files, post-#44993 or pristine) on worker then head
    # before either rank starts; each rank then applies and verifies fail-closed,
    # rolling the first file back if the second cannot publish.
    # After changing this flag, run ./stop-deepseek-v4-flash-dspark.sh successfully
    # on both nodes and then ./start-deepseek-v4-flash-dspark.sh. A process or Docker
    # restart reuses the writable container layer and is not rollback. To roll back,
    # set 0 and stop/remove/recreate both service containers. See docs/PATCHES.md.
    DSPARK_ENABLE_ISSUE136_XGRAMMAR_HOTFIX=0
    # Issue #191: fail-closed named/required tool_choice contract (serving layer).
    # 0 (default) = stock bytes. 1 = source-exact hotfix: a non-streaming Chat
    # response for a named/required tool_choice must carry exactly one call
    # (parallel_tool_calls=false), the right name, JSON-object arguments and (strict)
    # schema-valid arguments; violations are regenerated up to RETRIES times and
    # then answer HTTP 500 instead of a wrong 200 (MODE=log only records).
    DSPARK_ENABLE_ISSUE191_TOOLCALL_FAILCLOSED=0
    DSPARK_ISSUE191_TOOLCALL_RETRIES=2
    DSPARK_ISSUE191_TOOLCALL_MODE=failclosed
    # 1 (default): the last failclosed retry regenerates with thinking off (prompt
    # <think> -> </think>, thinking-off parser), so reasoning that outran max_tokens
    # (finish_reason=length: zero or a salvaged partial call — the measured residual
    # gate failure) still answers a grammar-constrained call. 0 = identical retries.
    DSPARK_ISSUE191_TOOLCALL_THINKOFF_FALLBACK=1
    # Issue #191 A/B: 1 (default) keeps --async-scheduling on both ranks, 0 removes
    # it (grammar bitmask rows then come from real drafts, ~4 % single-stream cost).
    DSPARK_ASYNC_SCHEDULING=1

    # Issue #66 / #31 GPU thinking_token_budget hotfix: default 0 = stock V2
    # sampler (clients that omit the field; sending thinking_token_budget is HTTP
    # 400). Set exactly 1 to apply patches/hotfix-dsv4-issue31-v2-thinking-budget-gpu.py
    # at boot (fail-closed). Only needed if clients send thinking_token_budget.
    # Recreate containers after changing; a healthy systemctl restart can skip rebuild.
    DSPARK_ENABLE_ISSUE31_GPU_HOTFIX=0

    # Issue #141 opt-in workaround for stochastic TP=2 sparse-MLA stalls in the
    # pinned Anemll SM120 adapter. Default 0 leaves installed runtime bytes stock.
    # Set exactly 1 to source-lock and chunk only oversized decode calls into fixed
    # <=64-row views before vLLM imports; incompatible source fails boot before exec.
    # The 64/65 workaround evidence is from one reporting pair; the second failing
    # pair has not repeated that A/B, and the underlying defect is still unknown.
    # There is no chunk-size knob. After changing this flag, stop then start to
    # recreate both containers; `docker compose restart` retains patched layer bytes.
    DSPARK_ENABLE_ISSUE141_SPARSE_MLA_CHUNK=0
    # Report item 6 (docs/CLAUDE/fable5-1-report.md): sequence-parallel Lightning
    # indexer for long prefills. Exact 1 patches sparse_attn_indexer.py at boot
    # (fail-closed): TP ranks each gather+score a page-aligned slice of every
    # request's compressed keys and merge (score, id) candidates exactly with the
    # DCP stable-topk selector. Chunks below DSPARK_SP_INDEXER_MIN_KEYS compressed
    # keys (default 8192 = 32K tokens at compress ratio 4) and all decode steps
    # keep the stock replicated path. Recreate both ranks when flipping.
    DSPARK_ENABLE_SP_INDEXER=0
    # Replicated DSpark Markov head (patches/hotfix-dsv4-replicate-markov-head.py).
    # 0 (default) = stock sharded head; 1 = apply. A/B 2026-09-02
    # (docs/CLAUDE/ab-results-2026-09-02.md): draft acceptance unchanged (the patch
    # is numerically correct) but no c=1 gain and c=6 aggregate 122 vs 148, so off.
    DSPARK_ENABLE_REPLICATE_MARKOV=0
    # Adaptive prefill chunk cap (patches/hotfix-dsv4-adaptive-prefill-chunk.py).
    # 0 (default) = stock; 1 = apply. A/B 2026-09-02: boots clean but head-node
    # MemAvailable fell to 2.3 GB (3.8-5.2 GB otherwise) because the larger chunk
    # workspace lands in host RAM on DGX Spark. Off until that owner is found.
    DSPARK_ENABLE_ADAPTIVE_CHUNK=0
    # DSPARK_SP_INDEXER_MIN_KEYS=8192
    # DeepGEMM SM121 indexer-logits header alias (docs/CLAUDE/item8-fp4-kv-design.md
    # §5). The image's vendored DeepGEMM emits sm121_* kernel names on GB10 but
    # ships only sm120_* headers, so a JIT-cache miss (fresh volume / new
    # VLLM_CACHE_ROOT / new indexer variant) fails at first use. Exact 1 writes
    # four alias headers at boot (fail-closed). Default 0 = stock bytes.
    DSPARK_ENABLE_DEEPGEMM_SM121_ALIAS=0

    # Do not set GPU_MEMORY_UTILIZATION here — start-deepseek-v4-flash-dspark.sh
    # exports it from GPU_MEMORY_UTILIZATION_TEXT.
    GPU_MEMORY_UTILIZATION_TEXT=0.835
    # Native Vision-Exp images per request (OpenAI image_url). No video modality.
    # Use `image=N` (converted to {"image":N} inside the container). A bare
    # `{"image":8}` loses its quotes when the start script `source`s this file
    # (`{image:8}`) and Anemll's json.loads argparse rejects it.
    # LIMIT_MM_PER_PROMPT=image=8
    MTP_NUM_TOKENS=6
    # Vision-Exp: num_nextn_predict_layers=3, so Anemll rejects k=5
    # (must be >= dspark_block_size 5 AND divisible by 3 → 6, 9, …).
    # 0731 had n_predict=1, which is why k=5 booted there.
    # DSPARK_ENABLE_DSPARK_BLOCK_K=1 (patches/hotfix-vllm-dspark-block-k.py) drops
    # that divisibility rule for method=dspark — the 3 stages are stacked into one
    # parallel block pass, never re-used per step — so k can follow the trained
    # dspark_block_size=5 (pair with MTP_NUM_TOKENS=5; capture 6x6 -> 40).
    DSPARK_ENABLE_DSPARK_BLOCK_K=0
    # Upstream vllm#54815 port: the pinned rope builder promotes the checkpoint's
    # yarn config to deepseek_yarn for every layer, but YaRN belongs only to
    # compressor (CSA/HCA) layers; sparse-SWA layers (compress_ratio<=1: layers
    # 0-1 plus the 3 DSpark drafter layers, window=128) must use plain RoPE.
    # DSPARK_ENABLE_ROPE_SWA_FIX=1 (patches/hotfix-vllm-rope-swa-fix.py) applies
    # the upstream fix at boot (fail-closed): SWA layers get identity scaling
    # (factor=1.0 over max_position_embeddings, theta=10000); compressor layers
    # are byte-identical to stock. Recreate both ranks when flipping. Gate a
    # 128K+ long-context quality A/B vs control before defaulting on.
    DSPARK_ENABLE_ROPE_SWA_FIX=0
    # Upstream vllm#52645 port (open PR): DeepSeek V4 sometimes emits a complete
    # DSML invoke while the outer tool_calls opener is missing or corrupted (an
    # observed 0731 variant emits "toolcalls"), so the stock parser leaks the
    # whole invoke into user-visible content and the agent lane loses the tool
    # call. DSPARK_ENABLE_DSML_RECOVERY=1 (patches/hotfix-vllm-dsml-recovery.py)
    # applies the recovery at boot (fail-closed, 6 parser files pinned by
    # whole-file identity): a bare declared-tool invoke is buffered, validated
    # against the live request's tools, committed only on </invoke>, and rolled
    # back verbatim otherwise (undeclared tool, truncation, tool_choice=none).
    # Correctly wrapped DSML is byte-identical to stock. Recreate both ranks when
    # flipping. Gate agent tool-call acceptance parity vs the 42.3% C1 baseline
    # before defaulting on.
    DSPARK_ENABLE_DSML_RECOVERY=0
    # MXFP4 indexer K cache (item8 design §3): the pinned vLLM ships a complete
    # MXFP4 Lightning-indexer K cache (packed FP4 writes, DeepGEMM fp8_fp4 logits
    # kernels, sm120 fp4 headers) but gates it to datacenter Blackwell.
    # DSPARK_ENABLE_MXFP4_INDEXER_CACHE=1 (patches/hotfix-vllm-mxfp4-indexer-cache.py)
    # relaxes that one gate to sm_12x and passes
    # --attention-config {"use_fp4_indexer_cache":true} on both ranks: the logits
    # kernels then read half the bytes per scored key (allocation stays 132 B/row).
    # Requires DSPARK_ENABLE_DEEPGEMM_SM121_ALIAS=1 (fp4 kernels are not in the
    # persisted JIT cache; first enabled boot JIT-compiles for some minutes). Gate
    # ruler-lite 32K/131K, garble to 900K and the 128K TTFT A/B before defaulting on.
    DSPARK_ENABLE_MXFP4_INDEXER_CACHE=0
    # Reuse C128A prefill index conversion across layers sharing current metadata.
    # Anemll 0.1.1 SM120 path only; C4A/decode unchanged, no persistent buffers added.
    # Default 0 preserves stock. Exact 1 enables the fail-closed boot hotfix.
    DSPARK_ENABLE_C128A_PREFILL_CACHE=0
    # Issue #144 effort-directive prefix-cache alignment. The checkpoint encoder
    # front-inserts the reasoning-effort directive right after BOS (93 tokens for
    # max/xhigh, 80 for high, 0 for low/off/medium), so requests differing only in
    # effort share zero 256-token prefix-cache blocks (chained block hashes
    # diverge at block 0): the cache partitions into {low,off,medium} /
    # {high,DEFAULT} / {max,xhigh} with cross-bucket hits exactly 0.
    # DSPARK_ENABLE_ISSUE144_EFFORT_ALIGN=1
    # (patches/hotfix-dsv4-issue144-effort-align.py) relocates the directive to
    # the END of the leading system region at boot (fail-closed, anchored
    # source-exact, after the issue21/vision-exp/assistant-final encoder
    # co-patchers): BOS + system prompt + tools render byte-identically for every
    # effort and all their full blocks hash identically across buckets; only the
    # 0/~80/~93-token directive tail diverges. low/off/medium renders and
    # conversations without a leading system message stay byte-identical to
    # stock. Recreate both ranks when flipping. Gate a live cross-bucket
    # cache-hit measurement plus high/max output-quality parity vs stock before
    # defaulting on (the directive moves from before to after the system prompt).
    DSPARK_ENABLE_ISSUE144_EFFORT_ALIGN=0
    # Official 0731 cards pair k=7 + greedy; that also fails the Vision-Exp
    # divisibility check. Capture size is MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1) rounded
    # up to a multiple of 8 (48 at 6x6; plain 42 truncates to 40 and costs ~12 % at c=6).
    # DSpark draft sampling: probabilistic (default) or greedy.
    # DRAFT_SAMPLE_METHOD=probabilistic
    # Default reasoning mode: off, low, high, or max. "max" enables full
    # thinking/reasoning effort by default and costs ~3x per-request latency on
    # identical hardware vs "low" (measured on 2x DGX Spark, Vision-Exp). "low"
    # matches the docker-compose default. Request-level overrides still win.
    DEFAULT_THINKING=low

    # Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode
    # regression on every start.  Set to 1 to skip (e.g. if you've already
    # applied the hotfix manually or are using a patched image).
    # DSPARK_SKIP_HOTFIX=0

    # Issue #79: vLLM shm SpinCondition busy_loop_s 1s -> 2ms (TP>=2 CPU/heat).
    # Default on. Set 1 to leave upstream 1s spin.
    # DSPARK_SKIP_SPIN_WAIT_HOTFIX=0

    # Issue #117: upstream vLLM #45224 bounds lost-notify reader recovery at 5s
    # and releases SHM read slots on consumer exceptions. Default on. Set 1 only
    # for paired stop/remove/recreate rollback; the Issue #79 setting is unchanged.
    # DSPARK_SKIP_ISSUE117_RECHECK_HOTFIX=0

    # No sampling override. The launcher keeps --generation-config vllm only.
    # Explicit client request parameters still win.

    # Raised-admission throughput data, measured on 2x DGX Spark TP=2 @ 70a7cc4.
    # This is PERFORMANCE data, not a safety recommendation -- read the STABILITY
    # block below before raising MAX_NUM_SEQS on anything you care about:
    # MAX_MODEL_LEN=1048576
    # MAX_NUM_SEQS=32
    # MAX_NUM_BATCHED_TOKENS=12288
    #
    # The two knobs move together: at k=6, raised admission consumes the 8192
    # token budget with draft slots (the engine warns "max_num_scheduled_tokens is
    # set to ..."), costing single-stream decode; 12288 recovers it fully.
    # Measured on bursts that completed (short-prompt, thinking=low, 500-token
    # generations):
    #   c=1 47-54 tok/s | c=8 154 | c=16 213 | c=32 325 aggregate
    # compared with the N=4 measurement baseline, where c=8 queued above N (~108).
    # Raising admission does not require dropping MAX_MODEL_LEN: the KV pool is
    # nearly MAX_NUM_SEQS-invariant (~2.1x concurrent full-1M requests at N=32 vs
    # ~2.6x at N=4), so the older "drop to 200K to get concurrency" suggestion
    # overstated the context cost. Simultaneous full-context requests can still
    # queue depending on the live KV pool.
    #
    # STABILITY -- issue #141 stalls are STOCHASTIC PER BURST, so throughput
    # numbers above say nothing about whether a profile survives. The pair wedges
    # inside sparse-MLA decode (shm_broadcast.py acquire_read ->
    # RuntimeError("cancelled"), no NCCL error, no JIT warning, no OOM, ~706-899 s
    # wall). What the repeated-burst evidence in #141 actually shows:
    #   - N=32 / c=32 (224 verify rows at k=6) ran clean for three bursts and DIED
    #     on burst 4 on one pair; on another pair it died on burst 2 and again on
    #     a fresh-boot first burst. A single clean burst cannot distinguish a safe
    #     configuration from a lucky one.
    #   - The 96-verify-row bracket that survived 3x393K tokens on one pair DIED
    #     at ~237K tokens (16/32 completed) on the other.
    #   - The #143 "MAX_NUM_SEQS=16 bad / 32 safe" admission-cap mechanism is
    #     RETRACTED. Every cell in that matrix was n=1; per-burst failure
    #     probability explains the whole table without an admission-cap effect.
    # NO TESTED MAX_NUM_SEQS VALUE IS ESTABLISHED AS GENERALLY SAFE. Changing it
    # may change INCIDENCE; it is not a fix. Failure probability appears to rise
    # with verify rows (MAX_NUM_SEQS * (k+1)) x stream lifetime x possibly
    # admission-cap saturation -- same row count with short generations has come
    # back clean where long generations faulted. Everything tested above ~91-96
    # rows has died somewhere, and nothing above 64 rows is established clean; the
    # only clean kernel-path localizer is chunk-64 (survives 3,145,728 tokens) vs
    # chunk-65 (dies in round 1). The shipped default sits at 36 rows (N=6, k=5),
    # below that boundary, which is consistent with the hypothesis but is not a
    # verified safety property. Severity is a spectrum, and the mild end is
    # invisible: short stall -> cancelled batch -> SILENT stream truncation
    # (finish_reason absent, zero preemptions, zero queue depth, no existing
    # metric fires) -> watchdog kill and pair loss. If you raise admission, watch
    # for missing finish_reason, not just restarts.
    # One reporter runs MAX_NUM_SEQS=13 (91 rows) in production as an interim,
    # with no claim that it is proven safe. Merged PR #151 provides the opt-in,
    # default-off DSPARK_ENABLE_ISSUE141_SPARSE_MLA_CHUNK hotpatch, which bounds
    # sparse-MLA decode calls to 64 rows. It is explicitly a mitigation rather
    # than a root-cause fix. Track #141 before treating any of this as settled.
    #
    # Conservative prior agent lane:
    # MAX_MODEL_LEN=1048576
    # MAX_NUM_SEQS=6
    # GPU_MEMORY_UTILIZATION=0.80
    #
    # Concurrent HEAVY PREFILLS remain scheduler-bound regardless of these knobs
    # (issues #80/#140): admission tuning raises decode throughput; it does not
    # fix TTFT contention when multiple large cold prompts arrive together.

    # ---------------------------------------------------------------------------
    # Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)
    # ---------------------------------------------------------------------------
    VLLM_USE_FLASHINFER_SAMPLER=1
    VLLM_USE_BREAKABLE_CUDAGRAPH=0
    VLLM_USE_B12X_MOE=1
    VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM=0
    VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M=16
    VLLM_B12X_W4A16_FORCE_TILE_CONFIG=
    # b12x small-M packed decode (M<=8). Compose passes this through; default off.
    # B12X_W4A16_TC_DECODE=0

    VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256
    VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0

    # CuTeDSL / b12x compile target for GB10 (not a VLLM_* registry key).
    CUTE_DSL_ARCH=sm_121a
    TORCH_CUDA_ARCH_LIST=12.1a
    FLASHINFER_CUDA_ARCH_LIST=12.1a
    FLASHINFER_DISABLE_VERSION_CHECK=1
    TILELANG_CLEANUP_TEMP_FILES=1
    # Issue #65/#87: keep sample_tokens RPC alive through a mid-serve JIT
    # (stock 300s). TileLang cache lives on the HF volume, not the container layer.
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=1800
    TILELANG_CACHE_DIR=/cache/huggingface/tilelang-cache
    # Issue #117: persist Triton's JIT cache too — the in-image ~/.triton/cache
    # dies on container recreate, so every restart re-JITs known shapes mid-serve,
    # and a compiling rank can stall its TP peer past torch's 600s NCCL watchdog
    # (a deadline VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS does not extend).
    TRITON_CACHE_DIR=/cache/huggingface/triton-cache
    # Issue #117 disposition: PyTorch ProcessGroupNCCL flight recorder. Ring
    # buffer + dump-on-timeout pinned on (DUMP_ON_TIMEOUT requires MONITORING=1
    # and BUFFER_SIZE>0 per the torch header); dumps persist on the HF volume so
    # a watchdog-killed pair still leaves per-rank evidence for torchfrtrace.
    # The pipe stem lives on /tmp because torch TORCH_CHECKs the mkfifo at PG
    # init — the stem must never depend on a directory that might not exist, or
    # the boot fails. In this compose stack /tmp is NOT container-local: it is
    # the DSPARK_TMP_HOST bind mount (host default ~/.cache/dspark-tmp), so the
    # FIFO is also host-visible there (root-owned — host-side pokes need root,
    # or use docker exec; torch unlinks/recreates a stale FIFO from a previous
    # container). Write anything to /tmp/fr_dump_pipe_<rank>.pipe in the
    # container to trigger an on-demand dump (external-watchdog hook for
    # frozen-but-not-timed-out ranks). Two operational rules: (1) dump
    # filenames are static per rank and torch truncates on every dump — archive
    # both ranks' comm_lib_trace_rank_* together after each dump, before the
    # next poke/timeout overwrites them (torchfrtrace needs the complete rank
    # set in one directory); (2) a poke only requests a dump — torch writes it
    # async, best-effort — so wait for the "Finished writing Flight Recorder
    # debug info" log line or a bounded file-size-settle check before killing
    # or restarting the pair, or the dump can be lost or truncated.
    TORCH_FR_BUFFER_SIZE=2000
    TORCH_NCCL_DUMP_ON_TIMEOUT=1
    TORCH_NCCL_ENABLE_MONITORING=1
    TORCH_FR_DUMP_TEMP_FILE=/cache/huggingface/nccl-fr/comm_lib_trace_rank_
    TORCH_NCCL_DEBUG_INFO_PIPE_FILE=/tmp/fr_dump_pipe_
    # Issue #117 family, third JIT cache: the B12X MoE backend's CuTeDSL compile
    # cache defaults to in-image ~/.cache/b12x/cute_compile and dies on container
    # recreate, so W4A16FusedMoeKernel re-JITs after every restart.
    B12X_CUTE_COMPILE_CACHE_DIR=/cache/huggingface/b12x-cute-cache
    # Issue #117: post-ready boot sweep that burns the spec-decode/prefill Triton
    # shape buckets before real traffic can JIT them mid-serve. The target kernel
    # (_prepare_dflash_inputs_kernel) keys on next_pow2(scheduled_tokens + 6) only
    # — concurrency is irrelevant — so a deterministic ladder of exact-token plain
    # completions (s = 1/6/20/45/100/200, each verified via authenticated /tokenize
    # before firing) covers every live BLOCK key {8,16,32,64,128,256}; bounded and
    # ordinary-client-default short chat arms run at C=1/2/4/6 up to the resolved
    # MAX_NUM_SEQS; medium/long prefill + thinking-off cover other batch kernels.
    # Non-fatal: warmup failure degrades to the mid-serve-JIT status quo, never a failed boot. Closure signal:
    # jit_monitor warnings during serve = a shape the sweep missed. Set 0 to skip.
    # DSPARK_BOOT_SHAPE_WARMUP=1
    # Per-request timeout for the boot shape sweep above (curl --max-time,
    # seconds). Sequential worst case is material: 35 requests at the shipped
    # MAX_NUM_SEQS=6 default (23 at MAX_NUM_SEQS=4), each bounded by this timeout.
    # First-ever boots pay real Triton compiles inside it. Default 240.
    # DSPARK_WARMUP_REQ_TIMEOUT=240
    DG_JIT_USE_NVRTC=0
    DG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc
    NCCL_NET=IB
    NCCL_IB_DISABLE=0
    NCCL_CUMEM_ENABLE=0
    NCCL_IGNORE_CPU_AFFINITY=1
    NCCL_DEBUG=WARN
    NCCL_NVLS_ENABLE=0
    # NCCL fabric passthrough (all five default to unset). An unconfigured knob
    # stays truly absent in the serving process: compose necessarily defines the
    # key, but the entrypoint unsets empty ones before exec, so NCCL's built-in
    # defaults and config-file values (/etc/nccl.conf, NCCL_CONF_FILE — loaded
    # with overwrite=0, which a defined-empty variable would mask) still apply.
    # Configured non-empty values pass through unchanged on head and worker; an
    # empty value is normalized to absent, so it cannot force an empty setting.
    #
    # NCCL_IB_MERGE_NICS already defaults to 1 inside NCCL: it *permits* merging
    # of compatible dual-port NICs into one logical device. It does not select
    # HCAs and does not force arbitrary links together — NCCL_NET_MERGE_LEVEL /
    # NCCL_NET_FORCE_MERGE participate in that topology decision, and HCA
    # selection stays with NCCL_IB_HCA. The meaningful override here is 0, to
    # disable merging.
    # NCCL_IB_MERGE_NICS=0
    #
    # NCCL_GIN_ENABLE (GPU-initiated networking): unset = NCCL default (enabled).
    # Exact 0 uses the CPU-driven comm-init path — measured 2026-09-05 on the
    # 2-node lane at ~97% GPU memory pressure: comm-init ~2 min -> ~13 s, with
    # bandwidth unchanged at serving message sizes. Bootstrap-speed knob only.
    # NCCL_GIN_ENABLE=0
    #
    # MEASURED (2026-08-21, two independent 2x GB10 TP=2 pairs, direct QSFP):
    # the GB10 QSFP port enumerates as TWO virtual NICs (2x PCIe Gen5 x4
    # controllers, ~100G each). With only one HCA in NCCL_IB_HCA the link runs
    # at half the port. List both controllers with the deterministic exact-selector
    # form (merging is NCCL's default):
    #
    #   NCCL_IB_HCA==rocep1s0f0,roceP2p1s0f0       # map names: ibdev2netdev
    #
    # On the measured direct-QSFP path, MTU 9000 was configured on both controller
    # interfaces at both endpoints. On switched or shared paths, use jumbo frames
    # only when every endpoint and intervening L2 hop is verified at the same MTU;
    # otherwise retain the existing path MTU. RoCE derives its IB MTU from the
    # netdev MTU, so the stock 1500 caps frame size.
    #
    # Pair 1 measured 1311 tok/s at MTU 1500 with one HCA, 1343 at MTU 9000
    # with one HCA, and 1410 with both HCAs: +7.6% end-to-end from its baseline.
    # Pair 2 reproduced a 1422 tok/s dual-HCA final rate but has no same-pair
    # single-HCA baseline, so it is not used to claim an uplift percentage.
    # Separate engine-counter probes found no material decode change on the
    # measured stack (code 76.0 tok/s at 73.3% acceptance; prose 37.3 at 25.7%;
    # 14-15 steps/s), and the KV pool was unchanged. That result is consistent
    # with latency-bound all-reduces; no GDR was observed on this measured stack.
    # Merged controllers are one logical NIC, unlike unmerged dual-HCA channel
    # splitting, which cost KV buffer memory for ~nothing (+3%, measured
    # 2026-08-06). Do not apply the nccl-tests busbw delta (+64% here) directly to
    # end-to-end throughput: the all-reduce is only a slice of prefill step time.
    #
    # Prerequisites: both interfaces UP with IPs in distinct subnets and
    # per-controller PCIe width x4 (check current_link_width in sysfs — early
    # BIOS wires the second controller x2). Current main validates every selected
    # HCA/port from sysfs (PR #95 lineage): leave NCCL_IB_GID_AUTO=1 (the default)
    # and verify startup logs audit every selected member's usable RoCE v2
    # indexes; NCCL then picks the GID per HCA with NCCL_IB_GID_INDEX unset.
    # Pinning is only a fallback for stacks where auto validation is unavailable
    # and every selected HCA/port shares one index:
    #   NCCL_IB_GID_AUTO=0
    #   NCCL_IB_GID_INDEX=3
    #   WORKER_NCCL_IB_GID_INDEX=3
    #
    # GPUDirect RDMA controls, passed through as upstream overrides. No effect was
    # demonstrated on the stack this was submitted from. Contributor-reported
    # observation, that stack only: on GB10 driver 580.173.02 the container
    # reported CU_DEVICE_ATTRIBUTE_DMA_BUF_SUPPORTED=0 and boot logs showed
    # host-staged transport (`via NET/IB/x`, no `/GDRDMA`). This says nothing
    # about GDR availability in general; other stacks may differ. NCCL_DMABUF_ENABLE=0 is the meaningful workaround control
    # (disable DMA-BUF probing where it misbehaves).
    # NCCL_NET_GDR_LEVEL=SYS
    # NCCL_NET_GDR_READ=1
    # NCCL_DMABUF_ENABLE=0
    PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    # ---------------------------------------------------------------------------
    # Stage-C overlay only — DO NOT enable on Anemll 0.1.1
    # Uncomment when DSPARK_VLLM_IMAGE is the Stage-C build AND you merge
    # docker-compose.stage-c.override.yml. On Anemll these VLLM_* keys warn:
    #   "Unknown vLLM environment variable detected: …"
    # and are ignored. Full matrix: docs/ENVS.md
    # ---------------------------------------------------------------------------
    # VLLM_USE_B12X_WO_PROJECTION=1
    # VLLM_DSPARK_CONFIDENCE_THRESHOLD=0.0
    # VLLM_DSPARK_CONFIDENCE_SCHEDULER=off
    # VLLM_DSPARK_LOCAL_ARGMAX=1
    # VLLM_DSPARK_REPLICATE_MARKOV_W1=1
    # VLLM_DSPARK_FUSED_MARKOV_ARGMAX=0
    # VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK=1
    # VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT=0
    # DSPARK_SLOT_CLAMP=1
    # VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP=1
    # B12X_W4A16_TC_DECODE=0
    # VLLM_DSV4_B12X_COMPRESSED_MLA=0
    # VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE=0
    # VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT=0
    # VLLM_TRITON_MLA_SPARSE=1
    # VLLM_SKIP_INIT_MEMORY_CHECK=1

    # Vision-Exp is served natively through the startup hotfix
    # (patches/hotfix-dsv4-vision-exp.py): OpenAI image_url is supported for
    # still images. Video is not wired — the official weights ship no video
    # encoder (GIF is decoded as a still frame). The Qwen3-VL sidecar and the
    # ds4f-vision MCP path are removed.
    HF_HOME=/cache/huggingface
    DSPARK_MODEL=deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
    GPU_MEMORY_UTILIZATION=0.835
    TP_SIZE=2
    NNODES=2
    DRAFT_SAMPLE_METHOD=probabilistic
    LIMIT_MM_PER_PROMPT=image=8
kind: ConfigMap
metadata:
  name: miaai-parity-profile
  namespace: llm-test

---
apiVersion: v1
data:
  apply_tp3_patch.py: |
    #!/usr/bin/env python3
    """Apply the DeepSeek-V4 TP=3 padding patch to an installed vLLM tree.

    Idempotent: each edit is guarded by a marker, so re-running is a no-op.
    Every edit is a NO-OP at TP=1 and TP=2 -- pad_heads_for_groups(64,2,8) == 64 --
    so applying this to a 2-node deployment changes nothing.

    Vendored from https://github.com/localaiguyy/DeepSeek-V4-Flash-DSpark-3x-DGX-Spark (MIT).

    Usage:
        python3 apply_tp3_patch.py [--vllm-root /usr/local/lib/python3.12/dist-packages/vllm]
                                   [--check]     # report status, change nothing
                                   [--revert]    # restore from .tp3bak
    """
    from __future__ import annotations

