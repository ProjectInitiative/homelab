    +# SPDX-License-Identifier: Apache-2.0
    +# SPDX-FileCopyrightText: Copyright contributors to the vLLM project
    +"""B12X modular fused-MoE backend for DeepSeek V4 native MXFP4 weights."""
    +
    +from collections.abc import Callable
    +from typing import Any, cast
    +
    +import torch
    +
    +import vllm.envs as envs
    +import vllm.model_executor.layers.fused_moe.modular_kernel as mk
    +from vllm.logger import init_logger
    +from vllm.model_executor.layers.fused_moe.activation import MoEActivation
    +from vllm.model_executor.layers.fused_moe.config import (
    +    FusedMoEParallelConfig,
    +    FusedMoEQuantConfig,
    +    RoutingMethodType,
    +)
    +from vllm.model_executor.layers.fused_moe.topk_weight_and_reduce import (
    +    TopKWeightAndReduceNoOP,
    +)
    +from vllm.model_executor.layers.quantization.utils.quant_utils import (
    +    QuantKey,
    +    kMxfp4Static,
    +)
    +from vllm.model_executor.utils import replace_parameter
    +from vllm.platforms import current_platform
    +
    +logger = init_logger(__name__)
    +
    +
    +def _dtype_element_size(dtype: torch.dtype) -> int:
    +    return torch.empty((), dtype=dtype).element_size()
    +
    +
    +def _ceil_div(a: int, b: int) -> int:
    +    return (int(a) + int(b) - 1) // int(b)
    +
    +
    +def _plan_b12x_moe_fp4_scratch(
    +    *,
    +    tokens: int,
    +    weight_E: int,
    +    k: int,
    +    n: int,
    +    topk: int,
    +    device: torch.device,
    +    dtype: torch.dtype,
    +    activation: str,
    +    quant_mode: str,
    +    source_format: str,
    +    w13_layout: str,
    +    apply_router_weight_on_input: bool = False,
    +    swiglu_limit: float | None = None,
    +):
    +    from b12x.integration.tp_moe import TPMoEScratchCaps, plan_tp_moe_scratch
    +
    +    return plan_tp_moe_scratch(
    +        TPMoEScratchCaps(
    +            max_tokens=max(int(tokens), 1),
    +            weight_E=int(weight_E),
    +            k=int(k),
    +            n=int(n),
    +            num_topk=int(topk),
    +            device=device,
    +            dtype=dtype,
    +            core_token_counts=(max(int(tokens), 1),),
    +            route_num_experts=0,
    +            quant_mode=quant_mode,
    +            activation=activation,
    +            apply_router_weight_on_input=apply_router_weight_on_input,
    +            swiglu_limit=swiglu_limit,
    +            source_format=source_format,
    +            w13_layout=w13_layout,
    +            frozen=True,
    +        )
    +    )
    +
    +
    +def _b12x_scratch_nbytes(plan: Any) -> int:
    +    specs = plan.scratch_specs()
    +    if len(specs) != 1:
    +        raise RuntimeError(f"expected one b12x MoE scratch buffer, got {len(specs)}")
    +    spec = specs[0]
    +    if spec.dtype != torch.uint8:
    +        raise TypeError(f"expected b12x MoE scratch dtype uint8, got {spec.dtype}")
    +    return int(spec.shape[0])
    +
    +
    +def _workspace2_as_b12x_scratch(
    +    workspace2: torch.Tensor | None,
    +    plan: Any,
    +) -> torch.Tensor:
    +    if workspace2 is None:
    +        raise RuntimeError("B12X MoE requires vLLM workspace2 scratch")
    +    if not workspace2.is_contiguous():
    +        raise ValueError("B12X MoE workspace2 must be contiguous")
    +    scratch = workspace2.view(-1).view(torch.uint8)
    +    required_nbytes = _b12x_scratch_nbytes(plan)
    +    if int(scratch.numel()) < required_nbytes:
    +        raise ValueError(
    +            "B12X MoE workspace2 is too small for planned scratch: "
    +            f"have={int(scratch.numel())} bytes, need={required_nbytes} bytes"
    +        )
    +    return scratch
    +
    +
    +def _run_b12x_moe_fp4(
    +    *,
    +    a: torch.Tensor,
    +    a1_gscale: torch.Tensor,
    +    w1_fp4: torch.Tensor,
    +    w1_blockscale: torch.Tensor,
    +    w1_alphas: torch.Tensor,
    +    a2_gscale: torch.Tensor,
    +    w2_fp4: torch.Tensor,
    +    w2_blockscale: torch.Tensor,
    +    w2_alphas: torch.Tensor,
    +    output: torch.Tensor,
    +    topk_weights: torch.Tensor,
    +    topk_ids: torch.Tensor,
    +    apply_router_weight_on_input: bool,
    +    input_scales_are_reciprocal: bool,
    +    input_scales_static: bool,
    +    activation: str,
    +    quant_mode: str,
    +    unit_scale_contract: bool,
    +    source_format: str,
    +    w13_layout: str,
    +    prepared_w4a16: Any,
    +    swiglu_limit: float | None,
    +    plan: Any,
    +    scratch: torch.Tensor,
    +) -> None:
    +    """Call b12x MoE with caller-owned live scratch."""
    +    from b12x.integration.tp_moe import b12x_moe_fp4
    +
    +    binding = plan.bind(
    +        scratch=scratch,
    +        a=a,
    +        a1_gscale=a1_gscale,
    +        w1_fp4=w1_fp4,
    +        w1_blockscale=w1_blockscale,
    +        w1_alphas=w1_alphas,
    +        a2_gscale=a2_gscale,
    +        w2_fp4=w2_fp4,
    +        w2_blockscale=w2_blockscale,
    +        w2_alphas=w2_alphas,
    +        topk_weights=topk_weights,
    +        topk_ids=topk_ids,
    +        apply_router_weight_on_input=apply_router_weight_on_input,
    +        output=output,
    +        input_scales_are_reciprocal=input_scales_are_reciprocal,
    +        input_scales_static=input_scales_static,
    +        activation=activation,
    +        quant_mode=quant_mode,
    +        unit_scale_contract=unit_scale_contract,
    +        source_format=source_format,
    +        w13_layout=w13_layout,
    +        prepared_w4a16=prepared_w4a16,
    +        swiglu_limit=swiglu_limit,
    +    )
    +    b12x_moe_fp4(binding=binding)
    +
    +
    +def _b12x_activation_name(activation: MoEActivation) -> str:
    +    if activation in (MoEActivation.SILU, MoEActivation.SWIGLUOAI):
    +        return "silu"
    +    if activation == MoEActivation.RELU2:
    +        return "relu2"
    +    return activation.value
    +
    +
    +def _parse_b12x_w4a16_tile_config() -> tuple[int, int, int] | None:
    +    raw_config = str(envs.VLLM_B12X_W4A16_FORCE_TILE_CONFIG).strip()
    +    if not raw_config:
    +        return None
    +    parts = [part.strip() for part in raw_config.split(",")]
    +    if len(parts) != 3:
    +        raise ValueError(
    +            "VLLM_B12X_W4A16_FORCE_TILE_CONFIG must be "
    +            "TILE_K,TILE_N,CTA_THREADS, got "
    +            f"{raw_config!r}"
    +        )
    +    return tuple(int(part) for part in parts)
    +
    +
    +def _forced_b12x_w4a16_tile_blocks_per_sm(
    +    w4a16_kernel: Any,
    +    kwargs: dict[str, Any],
    +    tile_config: tuple[int, int, int],
    +) -> int | None:
    +    required_names = (
    +        "problem_m",
    +        "problem_n",
    +        "problem_k",
    +        "top_k",
    +        "moe_block_size",
    +        "sms",
    +        "max_shared_mem",
    +    )
    +    if any(name not in kwargs for name in required_names):
    +        return None
    +
    +    tile_k, tile_n, cta_threads = tile_config
    +    try:
    +        cta_m_blocks = w4a16_kernel._covering_count(int(kwargs["moe_block_size"]), 16)
    +        tile_fits = w4a16_kernel._candidate_tile_fits(
    +            problem_n=int(kwargs["problem_n"]),
    +            problem_k=int(kwargs["problem_k"]),
    +            cta_m_blocks=cta_m_blocks,
    +            tile_n=tile_n,
    +            tile_k=tile_k,
    +            cta_threads=cta_threads,
    +            max_shared_mem=int(kwargs["max_shared_mem"]) - 512,
    +            scale_format=kwargs.get("scale_format", "e4m3_k16"),
    +        )
    +    except Exception:
    +        return None
    +    if not tile_fits:
    +        return None
    +
    +    try:
    +        return int(
    +            w4a16_kernel._determine_blocks_per_sm(
    +                problem_m=int(kwargs["problem_m"]),
    +                problem_n=int(kwargs["problem_n"]),
    +                top_k=int(kwargs["top_k"]),
    +                cta_threads=cta_threads,
    +                cta_m_blocks=cta_m_blocks,
    +                tile_n=tile_n,
    +                tile_k=tile_k,
    +                uses_m_block_8=int(kwargs["moe_block_size"]) == 8,
    +                sms=int(kwargs["sms"]),
    +                max_shared_mem=int(kwargs["max_shared_mem"]),
    +                scale_format=kwargs.get("scale_format", "e4m3_k16"),
    +            )
    +        )
    +    except Exception:
    +        return None
    +
    +
    +def _maybe_apply_b12x_w4a16_selector_override() -> None:
    +    forced_blocks_per_sm = int(envs.VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM)
    +    forced_tile_config = _parse_b12x_w4a16_tile_config()
    +    max_problem_m = int(envs.VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M)
    +    if forced_blocks_per_sm < 0:
    +        raise ValueError(
    +            "VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM must be >= 0, got "
    +            f"{forced_blocks_per_sm}"
    +        )
    +    if max_problem_m < 0:
    +        raise ValueError(
    +            f"VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M must be >= 0, got {max_problem_m}"
    +        )
    +    if forced_blocks_per_sm == 0 and forced_tile_config is None:
    +        return
    +
    +    try:
    +        from b12x.moe.fused.w4a16 import kernel as w4a16_kernel
    +    except Exception:
    +        logger.warning(
    +            "Could not install B12X W4A16 MoE selector override; b12x "
    +            "kernel module is unavailable.",
    +            exc_info=True,
    +        )
    +        return
    +
    +    original_attr = "_vllm_original_select_tile_config"
    +    if hasattr(w4a16_kernel, original_attr):
    +        return
    +
    +    original_select_tile_config = getattr(w4a16_kernel, "_select_tile_config", None)
    +    if not callable(original_select_tile_config):
    +        logger.warning(
    +            "Could not install B12X W4A16 MoE selector override; "
    +            "_select_tile_config is missing."
    +        )
    +        return
    +    setattr(w4a16_kernel, original_attr, original_select_tile_config)
    +
    +    def _vllm_select_tile_config(
    +        *args: Any, **kwargs: Any
    +    ) -> tuple[int, int, int, int]:
    +        selected = original_select_tile_config(*args, **kwargs)
    +        if len(selected) != 4:
    +            return selected
    +        tile_k, tile_n, cta_threads, _blocks_per_sm = selected
    +        problem_m = kwargs.get("problem_m")
    +        if problem_m is None:
    +            return selected
    +        active_max_problem_m = int(envs.VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M)
    +        if active_max_problem_m > 0 and int(problem_m) > active_max_problem_m:
    +            return selected
    +        active_tile_config = _parse_b12x_w4a16_tile_config()
    +        if active_tile_config is not None:
    +            forced_tile_blocks_per_sm = _forced_b12x_w4a16_tile_blocks_per_sm(
    +                w4a16_kernel,
    +                kwargs,
    +                active_tile_config,
    +            )
    +            if forced_tile_blocks_per_sm is not None:
    +                tile_k, tile_n, cta_threads = active_tile_config
    +                selected = (
    +                    tile_k,
    +                    tile_n,
    +                    cta_threads,
    +                    forced_tile_blocks_per_sm,
    +                )
    +        active_forced_blocks_per_sm = int(envs.VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM)
    +        if active_forced_blocks_per_sm <= 0:
    +            return selected
    +        tile_k, tile_n, cta_threads, _blocks_per_sm = selected
    +        return tile_k, tile_n, cta_threads, active_forced_blocks_per_sm
    +
    +    w4a16_kernel._select_tile_config = cast(
    +        Callable[..., tuple[int, int, int, int]], _vllm_select_tile_config
    +    )
    +    logger.info(
    +        "Enabled B12X W4A16 MoE selector override: preserving selected tile "
    +        "unless a tile is forced, tile_config=%s, blocks_per_sm=%d, "
    +        "problem_m<=%d",
    +        forced_tile_config,
    +        forced_blocks_per_sm,
    +        max_problem_m,
    +    )
    +
    +
    +_maybe_apply_b12x_w4a16_selector_override()
    +
    +
    +def _prepare_b12x_fp4_moe_weights(**kwargs):
    +    _maybe_apply_b12x_w4a16_selector_override()
    +    from b12x.integration import prepare_b12x_fp4_moe_weights
    +
    +    return prepare_b12x_fp4_moe_weights(**kwargs)
    +
    +
    +def _replace_parameter_with_empty(
    +    layer: torch.nn.Module,
    +    param_name: str,
    +) -> torch.Tensor | None:
    +    param = getattr(layer, param_name, None)
    +    if not isinstance(param, torch.Tensor):
    +        return None
    +    empty = torch.empty((0,), dtype=param.dtype, device=param.device)
    +    replace_parameter(layer, param_name, empty)
    +    return getattr(layer, param_name)
    +
    +
    +def _set_quant_config_weight_scale(
    +    quant_config: FusedMoEQuantConfig,
    +    weight_name: str,
    +    scale: torch.Tensor,
    +) -> None:
    +    desc = getattr(quant_config, weight_name, None)
    +    if desc is not None and hasattr(desc, "scale"):
    +        desc.scale = scale
    +        return
    +
    +    public_name = "w1_scale" if weight_name == "_w1" else "w2_scale"
    +    if hasattr(quant_config, public_name):
    +        setattr(quant_config, public_name, scale)
    +
    +
    +def _maybe_release_cuda_cache(device: torch.device) -> None:
    +    if device.type != "cuda" or _is_current_stream_capturing():
    +        return
    +    accelerator = getattr(torch, "accelerator", None)
    +    if accelerator is not None:
    +        accelerator.empty_cache()
    +    else:
    +        torch.cuda.empty_cache()
    +
    +
    +def _raise_if_capture_copy_required(tensor: torch.Tensor, description: str) -> None:
    +    if tensor.device.type != "cuda" or not _is_current_stream_capturing():
    +        return
    +    raise RuntimeError(
    +        f"B12X MoE {description} would allocate during CUDA graph capture"
    +    )
    +
    +
    +def _is_current_stream_capturing() -> bool:
    +    cuda = getattr(torch, "cuda", None)
    +    if cuda is None:
    +        return False
    +    is_capturing = getattr(cuda, "is_current_stream_capturing", None)
    +    return bool(is_capturing is not None and is_capturing())
    +
    +
    +def _normalize_b12x_moe_topk_ids(topk_ids: torch.Tensor) -> torch.Tensor:
    +    if topk_ids.dtype != torch.int32:
    +        _raise_if_capture_copy_required(topk_ids, "topk_ids dtype normalization")
    +        topk_ids = topk_ids.to(torch.int32)
    +    if not topk_ids.is_contiguous():
    +        _raise_if_capture_copy_required(topk_ids, "topk_ids contiguity normalization")
    +        topk_ids = topk_ids.contiguous()
    +    return topk_ids
    +
    +
    +def _normalize_b12x_moe_topk_weights(topk_weights: torch.Tensor) -> torch.Tensor:
    +    if topk_weights.dtype != torch.float32:
    +        _raise_if_capture_copy_required(
    +            topk_weights,
    +            "topk_weights dtype normalization",
    +        )
    +        topk_weights = topk_weights.to(torch.float32)
    +    if not topk_weights.is_contiguous():
    +        _raise_if_capture_copy_required(
    +            topk_weights,
    +            "topk_weights contiguity normalization",
    +        )
    +        topk_weights = topk_weights.contiguous()
    +    return topk_weights
    +
    +
    +def _has_b12x() -> bool:
    +    try:
    +        from b12x.integration.tp_moe import b12x_moe_fp4  # noqa: F401
    +
    +        return True
    +    except ImportError:
    +        return False
    +
    +
    +class B12xExperts(mk.FusedMoEExpertsModular):
    +    """Native DeepSeek V4 MXFP4 MoE backend powered by b12x kernels."""
    +
    +    def __init__(
    +        self,
    +        moe_config: mk.FusedMoEConfig,
    +        quant_config: FusedMoEQuantConfig,
    +    ):
    +        super().__init__(moe_config, quant_config)
    +
    +        assert quant_config.weight_quant_dtype == "mxfp4", (
    +            "B12xExperts only supports native MXFP4 weights, got "
    +            f"{quant_config.weight_quant_dtype}"
    +        )
    +
    +        self._prepared_fp4_moe_by_dtype: dict[torch.dtype, Any] = {}
    +        self._released_w4a16_source_scales = False
    +        self._unit_scale_by_device: dict[torch.device, torch.Tensor] = {}
    +
    +    def _source_format(self) -> str:
    +        return "fp4_e8m0_k32"
    +
    +    def _w13_layout(self) -> str:
    +        # vLLM DSV4 loading stores fused W13 as [w1/gate, w3/up], which is the
    +        # row order consumed by b12x for the runtime SwiGLU path.
    +        return "w31"
    +
    +    def _unit_expert_scale(
    +        self, device: torch.device, num_experts: int
    +    ) -> torch.Tensor:
    +        scale = self._unit_scale_by_device.get(device)
    +        if scale is None or scale.numel() != num_experts:
    +            scale = torch.ones(num_experts, dtype=torch.float32, device=device)
    +            self._unit_scale_by_device[device] = scale
    +        return scale
    +
    +    def process_weights_after_loading(self, layer: torch.nn.Module) -> None:
    +        """Prepare b12x-owned W4A16 weights and release one-way sources."""
    +        device = layer.w13_weight.device
    +        moe_config = getattr(self, "moe_config", None)
    +        params_dtype = getattr(moe_config, "in_dtype", torch.bfloat16)
    +        activation = getattr(layer, "activation", None)
    +        if activation is None:
    +            activation = getattr(moe_config, "activation", MoEActivation.SILU)
    +        activation = cast(MoEActivation, activation)
    +
    +        self._get_or_prepare_fp4_moe_weights(
    +            w1=layer.w13_weight,
    +            w2=layer.w2_weight,
    +            activation=activation,
    +            params_dtype=params_dtype,
    +        )
    +        self._release_w4a16_source_scales(layer)
    +        self._release_w4a16_source_weights(layer)
    +        _maybe_release_cuda_cache(device)
    +
    +    @staticmethod
    +    def _supports_current_device() -> bool:
    +        p = current_platform
    +        return p.is_cuda() and p.is_device_capability_family(120) and _has_b12x()
    +
    +    @staticmethod
    +    def _supports_no_act_and_mul() -> bool:
    +        return True
    +
    +    @staticmethod
    +    def _supports_quant_scheme(
    +        weight_key: QuantKey | None,
    +        activation_key: QuantKey | None,
    +    ) -> bool:
    +        return (weight_key, activation_key) == (kMxfp4Static, None)
    +
    +    @staticmethod
    +    def _supports_activation(activation: MoEActivation) -> bool:
    +        return activation in (MoEActivation.SILU, MoEActivation.SWIGLUOAI)
    +
    +    @staticmethod
    +    def _supports_parallel_config(
    +        moe_parallel_config: FusedMoEParallelConfig,
    +    ) -> bool:
    +        return (
    +            not moe_parallel_config.use_ep
    +            and moe_parallel_config.ep_size <= 1
    +            and not moe_parallel_config.use_all2all_kernels
    +            and not moe_parallel_config.enable_eplb
    +        )
    +
    +    @staticmethod
    +    def _supports_routing_method(
    +        routing_method: RoutingMethodType,
    +        weight_key: QuantKey | None,
    +        activation_key: QuantKey | None,
    +    ) -> bool:
    +        return routing_method == RoutingMethodType.DeepseekV4
    +
    +    @staticmethod
    +    def activation_format() -> mk.FusedMoEActivationFormat:
    +        return mk.FusedMoEActivationFormat.Standard
    +
    +    @property
    +    def expects_unquantized_inputs(self) -> bool:
    +        return True
    +
    +    def supports_expert_map(self) -> bool:
    +        return False
    +
    +    def finalize_weight_and_reduce_impl(self) -> mk.TopKWeightAndReduce:
    +        return TopKWeightAndReduceNoOP()
    +
    +    def _get_or_prepare_fp4_moe_weights(
    +        self,
    +        *,
    +        w1: torch.Tensor,
    +        w2: torch.Tensor,
    +        activation: MoEActivation,
    +        params_dtype: torch.dtype,
    +    ):
    +        prepared = self._prepared_fp4_moe_by_dtype.get(params_dtype)
    +        if prepared is not None and getattr(prepared, "w4a16", None) is not None:
    +            return prepared
    +
    +        if self._released_w4a16_source_scales:
    +            prepared_dtypes = ", ".join(
    +                str(dtype) for dtype in self._prepared_fp4_moe_by_dtype
    +            )
    +            raise RuntimeError(
    +                "B12X W4A16 source block scales were already released; "
    +                f"cannot prepare FP4 MoE weights for dtype {params_dtype}. "
    +                f"Prepared dtypes: {prepared_dtypes or 'none'}."
    +            )
    +
    +        if w1.device.type == "cuda" and _is_current_stream_capturing():
    +            raise RuntimeError(
    +                "B12X FP4 MoE weights were not prepared before CUDA "
    +                f"graph capture for dtype {params_dtype}."
    +            )
    +        assert self.w1_scale is not None and self.w2_scale is not None, (
    +            "w1_scale and w2_scale must not be None for B12xExperts"
    +        )
    +
    +        unit_scale = self._unit_expert_scale(w1.device, int(w1.shape[0]))
    +        prepared = _prepare_b12x_fp4_moe_weights(
    +            source_format=self._source_format(),
    +            w13_layout=self._w13_layout(),
    +            w1_fp4=w1,
    +            w1_blockscale=self.w1_scale,
    +            w1_global_scale=unit_scale,
    +            a1_gscale=unit_scale,
    +            w2_fp4=w2,
    +            w2_blockscale=self.w2_scale,
    +            w2_global_scale=unit_scale,
    +            a2_gscale=unit_scale,
    +            activation=_b12x_activation_name(activation),
    +            params_dtype=params_dtype,
    +            prepare_runtime_alphas=False,
    +            prepare_w4a16=True,
    +            reuse_input_storage=True,
    +        )
    +        self._prepared_fp4_moe_by_dtype[params_dtype] = prepared
    +        return prepared
    +
    +    def _lookup_prepared_w4a16(self) -> Any | None:
    +        for prepared in self._prepared_fp4_moe_by_dtype.values():
    +            w4a16 = getattr(prepared, "w4a16", None)
    +            if w4a16 is not None:
    +                return w4a16
    +        return None
    +
    +    def _release_w4a16_source_scales(self, layer: torch.nn.Module) -> None:
    +        if self._released_w4a16_source_scales:
    +            return
    +
    +        w1_scale = _replace_parameter_with_empty(layer, "w13_weight_scale")
    +        w2_scale = _replace_parameter_with_empty(layer, "w2_weight_scale")
    +        if w1_scale is not None:
    +            _set_quant_config_weight_scale(self.quant_config, "_w1", w1_scale)
    +        if w2_scale is not None:
    +            _set_quant_config_weight_scale(self.quant_config, "_w2", w2_scale)
    +
    +        self._released_w4a16_source_scales = True
    +
    +    def _release_w4a16_source_weights(self, layer: torch.nn.Module) -> None:
    +        _replace_parameter_with_empty(layer, "w13_weight")
    +        _replace_parameter_with_empty(layer, "w2_weight")
    +
    +    def moe_problem_size(
    +        self,
    +        a1: torch.Tensor,
    +        w1: torch.Tensor,
    +        w2: torch.Tensor,
    +        topk_ids: torch.Tensor,
    +    ) -> tuple[int, int, int, int, int]:
    +        if w1.numel() != 0 and w2.numel() != 0:
    +            return super().moe_problem_size(a1, w1, w2, topk_ids)
    +
    +        prepared_w4a16 = self._lookup_prepared_w4a16()
    +        if prepared_w4a16 is None:
    +            return super().moe_problem_size(a1, w1, w2, topk_ids)
    +
    +        if a1.dim() == 2:
    +            assert topk_ids.size(0) == a1.size(0), f"{topk_ids.size(0)} != {a1.size(0)}"
    +            m = a1.size(0)
    +        else:
    +            assert a1.dim() == 3
    +            m = a1.size(1)
    +
    +        intermediate_size = int(prepared_w4a16.intermediate_size)
    +        n = intermediate_size * 2
    +        return (
    +            int(prepared_w4a16.num_experts),
    +            m,
    +            n,
    +            a1.size(-1),
    +            topk_ids.size(1),
    +        )
    +
    +    def workspace_shapes(
    +        self,
    +        M: int,
    +        N: int,
    +        K: int,
    +        topk: int,
    +        global_num_experts: int,
    +        local_num_experts: int,
    +        expert_tokens_meta: mk.ExpertTokensMetadata | None,
    +        activation: MoEActivation,
    +    ) -> tuple[tuple[int, ...], tuple[int, ...], tuple[int, ...]]:
    +        prepared_w4a16 = self._lookup_prepared_w4a16()
    +        if prepared_w4a16 is None:
    +            weight_E = int(local_num_experts)
    +            n = max(int(N) // 2, 1)
    +            device = (
    +                torch.device("cuda", torch.cuda.current_device())
    +                if torch.cuda.is_available()
    +                else torch.device("cpu")
    +            )
    +        else:
    +            weight_E = int(prepared_w4a16.num_experts)
    +            n = int(prepared_w4a16.intermediate_size)
    +            w13 = getattr(prepared_w4a16, "w13", None)
    +            device = (
    +                w13.device
    +                if isinstance(w13, torch.Tensor)
    +                else torch.device("cuda", torch.cuda.current_device())
    +            )
    +        workspace_dtype = getattr(self.moe_config, "in_dtype", torch.bfloat16)
    +        plan = _plan_b12x_moe_fp4_scratch(
    +            tokens=max(int(M), 1),
    +            weight_E=weight_E,
    +            k=int(K),
    +            n=n,
    +            topk=int(topk),
    +            device=device,
    +            dtype=workspace_dtype,
    +            activation=_b12x_activation_name(activation),
    +            quant_mode="w4a16",
    +            source_format=self._source_format(),
    +            w13_layout=self._w13_layout(),
    +            swiglu_limit=getattr(self.quant_config, "gemm1_clamp_limit", None),
    +        )
    +        scratch_elements = max(
    +            1,
    +            _ceil_div(_b12x_scratch_nbytes(plan), _dtype_element_size(workspace_dtype)),
    +        )
    +        return (0,), (scratch_elements,), (M, K)
    +
    +    def apply(
    +        self,
    +        output: torch.Tensor,
    +        hidden_states: torch.Tensor,
    +        w1: torch.Tensor,
    +        w2: torch.Tensor,
    +        topk_weights: torch.Tensor,
    +        topk_ids: torch.Tensor,
    +        activation: MoEActivation,
    +        global_num_experts: int,
    +        expert_map: torch.Tensor | None,
    +        a1q_scale: torch.Tensor | None,
    +        a2_scale: torch.Tensor | None,
    +        workspace13: torch.Tensor | None,
    +        workspace2: torch.Tensor | None,
    +        expert_tokens_meta: mk.ExpertTokensMetadata | None,
    +        apply_router_weight_on_input: bool | None,
    +    ) -> None:
    +        prepared = self._get_or_prepare_fp4_moe_weights(
    +            w1=w1,
    +            w2=w2,
    +            activation=activation,
    +            params_dtype=hidden_states.dtype,
    +        )
    +        prepared_w4a16 = prepared.w4a16
    +        assert prepared_w4a16 is not None
    +        assert self.w1_scale is not None and self.w2_scale is not None, (
    +            "w1_scale and w2_scale must not be None for B12xExperts"
    +        )
    +
    +        if expert_map is not None:
    +            raise RuntimeError(
    +                "B12X MoE does not support expert_map with the current b12x_moe_fp4 API"
    +            )
    +
    +        num_experts = int(prepared_w4a16.num_experts)
    +        unit_scale = self._unit_expert_scale(hidden_states.device, num_experts)
    +        topk_ids = _normalize_b12x_moe_topk_ids(topk_ids)
    +        topk_weights = _normalize_b12x_moe_topk_weights(topk_weights)
    +        plan = _plan_b12x_moe_fp4_scratch(
    +            tokens=int(hidden_states.shape[0]),
    +            weight_E=num_experts,
    +            k=int(hidden_states.shape[1]),
    +            n=int(prepared_w4a16.intermediate_size),
    +            topk=int(topk_ids.shape[1]),
    +            device=hidden_states.device,
    +            dtype=hidden_states.dtype,
    +            activation=_b12x_activation_name(activation),
    +            quant_mode="w4a16",
    +            source_format=self._source_format(),
    +            w13_layout=self._w13_layout(),
    +            apply_router_weight_on_input=(
    +                apply_router_weight_on_input
    +                if apply_router_weight_on_input is not None
    +                else False
    +            ),
    +            swiglu_limit=getattr(self.quant_config, "gemm1_clamp_limit", None),
    +        )
    +        scratch = _workspace2_as_b12x_scratch(workspace2, plan)
    +
    +        _run_b12x_moe_fp4(
    +            a=hidden_states,
    +            a1_gscale=unit_scale,
    +            w1_fp4=w1,
    +            w1_blockscale=self.w1_scale,
    +            w1_alphas=unit_scale,
    +            a2_gscale=unit_scale,
    +            w2_fp4=w2,
    +            w2_blockscale=self.w2_scale,
    +            w2_alphas=unit_scale,
    +            topk_weights=topk_weights,
    +            topk_ids=topk_ids,
    +            apply_router_weight_on_input=(
    +                apply_router_weight_on_input
    +                if apply_router_weight_on_input is not None
    +                else False
    +            ),
    +            output=output,
    +            input_scales_are_reciprocal=True,
    +            input_scales_static=True,
    +            activation=_b12x_activation_name(activation),
    +            quant_mode="w4a16",
    +            unit_scale_contract=True,
    +            source_format=self._source_format(),
    +            w13_layout=self._w13_layout(),
    +            prepared_w4a16=prepared_w4a16,
    +            swiglu_limit=getattr(self.quant_config, "gemm1_clamp_limit", None),
    +            plan=plan,
    +            scratch=scratch,
    +        )
    +
    +    def moe_sum(self, input: torch.Tensor, output: torch.Tensor) -> None:
    +        raise NotImplementedError("LoRA is not supported for B12xExperts")
kind: ConfigMap
metadata:
  name: miaai-parity-patches
  namespace: llm-test

---
apiVersion: v1
data:
  __init__.py: |
    """DeepSeek-V4-Flash-Vision-Exp tower + vLLM processor (Anemll 0.1.1 hotfix)."""
  apply.py: |
    """Monkey-patch Anemll DeepseekV4ForCausalLM for Vision-Exp images.

    Called at the end of ``vllm/models/deepseek_v4/nvidia/model.py`` after the
    stock classes are defined. Video is not registered: the checkpoint has no
    video tower.
    """
    from __future__ import annotations

    from typing import Any

    import torch
    from torch import nn

    from .image_processor import (
        IMAGE,
        IMAGE_TOKEN_ID,
        current_routing_kind,
        is_unregistered_router_bias,
        is_vision_exp_weight_name,
        routing_kind_from_mm,
        vision_args_from_config,
    )
    from .processor import IMAGE_PLACEHOLDER, register_vision_exp_processor
    from .vision import Aligner, ViT

    VISION_MAPPER_PREFIXES = {
        "vision.": "model.vision.",
        "aligner.": "model.aligner.",
        "image_start": "model.image_start",
        "image_end": "model.image_end",
        "image_newline": "model.image_newline",
        "image_pad": "model.image_pad",
    }
    VISION_MAPPER_SUFFIXES = {
        ".ffn.gate.bias_vl": ".ffn.gate.e_score_correction_bias_vl",
    }


    def _as_rows(value: Any) -> list[Any]:
        if value is None:
            return []
        if isinstance(value, (list, tuple)):
            return list(value)
        if isinstance(value, torch.Tensor):
            if value.ndim == 0:
                return [value]
            return [value[i] for i in range(value.shape[0])]
        return [value]


    def _scalar(value: Any) -> int:
        if hasattr(value, "reshape"):
            return int(value.reshape(-1)[0].item())
        return int(value)


    def _extend_weights_mapper(mapper):
        from vllm.model_executor.models.utils import WeightsMapper

        extra = WeightsMapper(
            orig_to_new_prefix=dict(VISION_MAPPER_PREFIXES),
            orig_to_new_suffix=dict(VISION_MAPPER_SUFFIXES),
        )
        return mapper | extra


    def _install_vision_tower(model: nn.Module, config) -> None:
        if getattr(model, "vision", None) is not None:
            return
        args = vision_args_from_config(config)
        if args.vision_n_layers <= 0:
            model.vision = None
            model.aligner = None
            return
        model.vision = ViT(args)
        model.aligner = Aligner(args)
        hidden = args.dim
        model.image_start = nn.Parameter(torch.empty(hidden))
        model.image_end = nn.Parameter(torch.empty(hidden))
        model.image_newline = nn.Parameter(torch.empty(hidden))
        model.image_pad = nn.Parameter(torch.empty(hidden))


    @torch.inference_mode()
    def encode_image(model: nn.Module, patches: torch.Tensor, n_vit_h: int, n_vit_w: int):
        return model.aligner(model.vision(patches, n_vit_h, n_vit_w), n_vit_h, n_vit_w)


    def merge_one_image(
        model: nn.Module,
        patches: torch.Tensor,
        n_vit_h: int,
        n_vit_w: int,
        types: torch.Tensor,
        perm: torch.Tensor,
        num_tokens: int,
    ) -> torch.Tensor:
        types = types[:num_tokens].to(dtype=torch.long)
        perm = perm.to(dtype=torch.long)
        perm = perm[perm >= 0]
        n_patches = int(n_vit_h) * int(n_vit_w)
        patches = patches[:n_patches]
        device = next(model.vision.parameters()).device
        dtype = next(model.aligner.parameters()).dtype
        patches = patches.to(device=device, dtype=dtype)
        embeds = encode_image(model, patches, int(n_vit_h), int(n_vit_w))[perm.to(device)]
        params = torch.stack(
            [
                model.image_start,
                model.image_pad,
                model.image_pad,
                model.image_newline,
                model.image_end,
            ]
        ).to(device=device, dtype=embeds.dtype)
        block = params[types.to(device)]
        image_mask = types.to(device) == IMAGE
        if int(image_mask.sum()) != int(embeds.shape[0]):
            raise RuntimeError(
                f"Vision-Exp layout mismatch: {int(image_mask.sum())} IMAGE slots, "
                f"{int(embeds.shape[0])} aligner tokens"
            )
        block = block.clone()
        block[image_mask] = embeds.to(block.dtype)
        return block


    def _mm_embed_rows(multimodal_embeddings: Any) -> int:
        if hasattr(multimodal_embeddings, "shape"):
            return int(multimodal_embeddings.shape[0])
        total = 0
        for part in multimodal_embeddings:
            total += _mm_embed_rows(part)
        return total


    def _bias_data(param: Any) -> Any:
        if param is None:
            return None
        return param.data if hasattr(param, "data") else param


    def fused_topk_bias_split_vl(
        *,
        hidden_states: Any,
        gating_output: Any,
        scoring_func: str,
        e_score_correction_bias: Any,
        e_score_correction_bias_vl: Any,
        topk: int,
        renormalize: bool,
        indices_type: Any,
        input_tokens: Any,
        hash_indices_table: Any,
        routed_scaling_factor: float,
        kind: Any = None,
        kind_cell: Any = None,
    ) -> tuple[Any, Any]:
        """Route image placeholder rows with bias_vl and no hash table (issue #175)."""
        from vllm.model_executor.layers.fused_moe.router.fused_topk_bias_router import (
            fused_topk_bias,
        )

        def _call(hs, go, bias, tokens, hash_tab):
            return fused_topk_bias(
                hidden_states=hs,
                gating_output=go,
                scoring_func=scoring_func,
                e_score_correction_bias=bias,
                topk=topk,
                renormalize=renormalize,
                indices_type=indices_type,
                input_tokens=tokens,
                hash_indices_table=hash_tab,
                routed_scaling_factor=routed_scaling_factor,
            )

        vl = _bias_data(e_score_correction_bias_vl)
        if kind is None:
            kind = current_routing_kind(input_tokens, kind_cell=kind_cell)
        if vl is None or kind == "text":
            return _call(
                hidden_states,
                gating_output,
                e_score_correction_bias,
                input_tokens,
                hash_indices_table,
            )
        if kind == "image":
            return _call(hidden_states, gating_output, vl, None, None)

        tokens = input_tokens.reshape(-1)
        n_rows = int(hidden_states.size(0))
        if int(tokens.numel()) != n_rows:
            return _call(
                hidden_states,
                gating_output,
                e_score_correction_bias,
                input_tokens,
                hash_indices_table,
            )
        image_mask = tokens == IMAGE_TOKEN_ID
        text_mask = ~image_mask
        w_text, id_text = _call(
            hidden_states[text_mask],
            gating_output[text_mask],
            e_score_correction_bias,
            tokens[text_mask],
            hash_indices_table,
        )
        w_img, id_img = _call(
            hidden_states[image_mask],
            gating_output[image_mask],
            vl,
            None,
            None,
        )
        topk_w = w_text.new_empty((n_rows, w_text.shape[1]))
        topk_id = id_text.new_empty((n_rows, id_text.shape[1]))
        topk_w[text_mask] = w_text
        topk_w[image_mask] = w_img
        topk_id[text_mask] = id_text
        topk_id[image_mask] = id_img
        return topk_w, topk_id


    def _append_fused_shared_experts(router: Any, topk_weights: Any, topk_ids: Any):
        n = int(getattr(router, "num_fused_shared_experts", 0) or 0)
        if n <= 0:
            return topk_weights, topk_ids
        m = topk_ids.shape[0]
        base = router.global_num_experts
        shared_ids = torch.arange(
            base, base + n, dtype=topk_ids.dtype, device=topk_ids.device
        ).expand(m, n)
        shared_w = torch.full(
            (m, n),
            router.shared_expert_weight,
            dtype=topk_weights.dtype,
            device=topk_weights.device,
        )
        return (
            torch.cat([topk_weights, shared_w], dim=-1),
            torch.cat([topk_ids, shared_ids], dim=-1),
        )


    def _wrap_router_compute_routing(router: Any, gate: Any) -> None:
        if getattr(router, "_dspark_bias_vl_wrapped", False):
            return
        if not hasattr(router, "_compute_routing"):
            return
        orig = router._compute_routing

        def _compute_routing(
            hidden_states,
            router_logits,
            indices_type,
            *,
            input_ids=None,
        ):
            vl = getattr(gate, "e_score_correction_bias_vl", None)
            # Graph capture cannot .item() / host-branch on token ids (issue #175).
            # Decode graphs only replay text tokens; image prefill stays eager.
            capturing = False
            try:
                capturing = bool(torch.cuda.is_current_stream_capturing())
            except Exception:
                capturing = False
            # Order matters: capture must never resolve a kind (no host sync,
            # no .item()) -- decode graphs only ever replay text tokens.
            if vl is None or capturing:
                return orig(
                    hidden_states, router_logits, indices_type, input_ids=input_ids
                )
            kind = current_routing_kind(
                input_ids, kind_cell=getattr(router, "_dspark_routing_kind_cell", None)
            )
            if kind == "text":
                return orig(
                    hidden_states, router_logits, indices_type, input_ids=input_ids
                )
            topk_weights, topk_ids = fused_topk_bias_split_vl(
                hidden_states=hidden_states,
                gating_output=router_logits,
                scoring_func=router.scoring_func,
                e_score_correction_bias=_bias_data(getattr(router, "e_score_correction_bias", None)),
                e_score_correction_bias_vl=vl,
                topk=router.top_k,
                renormalize=router.renormalize,
                indices_type=indices_type,
                input_tokens=input_ids,
                hash_indices_table=getattr(router, "_hash_indices_table", None),
                routed_scaling_factor=getattr(router, "routed_scaling_factor", 1.0),
                kind=kind,
            )
            return _append_fused_shared_experts(router, topk_weights, topk_ids)

        router._compute_routing = _compute_routing
        router._dspark_bias_vl_wrapped = True


    def embed_multimodal(self, **kwargs: object):
        pixel_values = kwargs.get("pixel_values")
        if pixel_values is None:
            return []
        pixels = _as_rows(pixel_values)
        n_vit_h = _as_rows(kwargs.get("n_vit_h"))
        n_vit_w = _as_rows(kwargs.get("n_vit_w"))
        types = _as_rows(kwargs.get("types"))
        perm = _as_rows(kwargs.get("perm"))
        num_tokens = _as_rows(kwargs.get("num_tokens"))
        inner = self.model
        if getattr(inner, "vision", None) is None:
            raise RuntimeError("Vision-Exp tower was not constructed on DeepseekV4Model")
        out = []
        for i, patches in enumerate(pixels):
            out.append(
                merge_one_image(
                    inner,
                    patches,
                    _scalar(n_vit_h[i]),
                    _scalar(n_vit_w[i]),
                    types[i],
                    perm[i],
                    _scalar(num_tokens[i]),
                )
            )
        return out


    def attach_routing_kind_cell(root: nn.Module, kind_cell: list[Any]) -> int:
        """Share one model-local publication cell with its Vision-Exp MoE gates."""
        attached = 0
        for mod in root.modules():
            gate = getattr(mod, "gate", None)
            if gate is None or getattr(gate, "e_score_correction_bias_vl", None) is None:
                continue
            mod._dspark_routing_kind_cell = kind_cell
            router = getattr(getattr(mod, "experts", None), "router", None)
            if router is not None:
                router._dspark_routing_kind_cell = kind_cell
            attached += 1
        return attached


    def _num_tokens(input_ids: Any) -> int:
        """Row count of a token tensor. ``numel`` is metadata: no host sync.

        Never guesses: a 0 here would make any non-empty placeholder count look
        like a full-image batch.
        """
        if hasattr(input_ids, "numel"):
            return int(input_ids.numel())
        try:
            return len(input_ids)
        except TypeError as exc:
            raise TypeError(
                f"Vision-Exp cannot size input_ids of type {type(input_ids).__name__}"
            ) from exc


    def make_embed_input_ids(orig_lm_embed):
        """Wrap the stock ``embed_input_ids`` and classify the batch once (#175).

        This runs once per forward, ahead of every MoE layer, and already knows
        whether the step carries multimodal embeddings -- so a text-only step is
        classified with zero device->host syncs.
        """

        def embed_input_ids(
            self,
            input_ids: torch.Tensor,
            multimodal_embeddings: Any = None,
            *,
            is_multimodal: Any = None,
        ):
            # Default for every early return below: no mm embeddings == text.
            self._dspark_routing_kind_cell[0] = "text"
            text_embeds = orig_lm_embed(self, input_ids)
            if multimodal_embeddings is None:
                return text_embeds
            try:
                empty = len(multimodal_embeddings) == 0
            except TypeError:
                empty = False
            if empty:
                return text_embeds
            from vllm.model_executor.models.interfaces import _require_is_multimodal
            from vllm.model_executor.models.utils import _merge_multimodal_embeddings

            is_mm = _require_is_multimodal(is_multimodal)
            n_placeholders = (
                int(is_mm.sum().item()) if hasattr(is_mm, "sum") else int(is_mm)
            )
            n_embeds = _mm_embed_rows(multimodal_embeddings)
            if n_placeholders != n_embeds:
                raise ValueError(
                    "Vision-Exp placeholder/embedding mismatch: "
                    f"{n_embeds} multimodal tokens vs {n_placeholders} placeholders. "
                    "Image block length depends on start_pos%4; a content-only encoder "
                    "cache hit can reuse the wrong compress_pad (issue #172)."
                )
            # Reuses the sum above: the image path stays at one sync per forward.
            self._dspark_routing_kind_cell[0] = routing_kind_from_mm(
                n_placeholders, _num_tokens(input_ids)
            )
            return _merge_multimodal_embeddings(
                inputs_embeds=text_embeds,
                multimodal_embeddings=multimodal_embeddings,
                is_multimodal=is_mm,
            )

        return embed_input_ids


    @classmethod
    def get_placeholder_str(cls, modality: str, i: int) -> str | None:
        if modality.startswith("image"):
            return IMAGE_PLACEHOLDER
        raise ValueError(
            f"DeepSeek-V4-Flash-Vision-Exp supports images only, got {modality!r}"
        )


