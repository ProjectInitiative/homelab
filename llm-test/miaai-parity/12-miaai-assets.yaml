    )

    V2_BLOCK = (
        "                _new_hit_length = len(hit_blocks[0]) * spec.block_size\n"
        "                # [issue26-hotfix-v2] SWA may shrink the common hit (#36).\n"
        "                # v1 skipped this assign for SlidingWindowSpec so a long MLA\n"
