# Lane-local Services for the dormant DeepSeek parity pair. Apply only when
# activating that lane; keep them absent while another DGX model is resident.
---
apiVersion: v1
kind: Service
metadata:
  name: llm-head
  namespace: llm-test
spec:
  selector:
    app: deepseek-parity-head
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: llm-worker
  namespace: llm-test
spec:
  selector:
    app: deepseek-parity-worker
  ports:
    - name: startup
      protocol: TCP
      port: 9090
      targetPort: 9090
