# Manual/experimental VSO projection for the LiteLLM proxy. The VaultAuth and
# VaultConnection are created by llm-test/00-environment.yaml.
# OpenBao source: k8s/litellm/postgres (KV-v2, production namespace).
# Only the application DSN and stable LiteLLM salt key are copied into llm-test;
# CNPG receives only username/password through the GitOps postgres-cluster app.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm-database
  namespace: llm-test
spec:
  type: kv-v2
  mount: k8s
  namespace: production
  path: litellm/postgres
  vaultAuthRef: llm-test-auth
  destination:
    name: litellm-database
    create: true
    overwrite: true
    transformation:
      includes:
        - DATABASE_URL
        - LITELLM_SALT_KEY
