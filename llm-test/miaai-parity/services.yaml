apiVersion: v1
kind: Service
metadata:
  name: llm-head
  namespace: llm-test
spec:
  selector:
    app: deepseek-parity-head # 👈 Kept target app selector intact
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: llm-worker
  namespace: llm-test
spec:
  selector:
    app: deepseek-parity-worker # 👈 Kept target app selector intact
  ports:
    - name: startup
      protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-proxy-config
  namespace: llm-test
data:
  config.yaml: |
    model_list:
      # The DGX backend is the currently active model on chronometer:8000.
      # Keep this gateway alias stable while swapping DGX serving lanes.
      - model_name: dgx-spark
        litellm_params:
          model: openai/deepseek-v4-flash-vision-exp
          api_base: http://172.16.4.55:8000/v1
          api_key: sk-local
      - model_name: qwen3.8-flash-next-halogen
        litellm_params:
          model: openai/qwen3.8-flash-next-halogen
          api_base: http://qwen38-halogen-astrolabe.llm-test.svc.cluster.local:8000/v1
          api_key: sk-local
    general_settings:
      background_health_checks: true
      health_check_interval: 30
      enable_health_check_routing: true
      health_check_ignore_transient_errors: true
    router_settings:
      routing_strategy: simple-shuffle
      cooldown_time: 90
      allowed_fails_policy:
        AuthenticationErrorAllowedFails: 0
        TimeoutErrorAllowedFails: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-proxy
  namespace: llm-test
  labels:
    app: ai-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-proxy
  template:
    metadata:
      labels:
        app: ai-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config.yaml", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ai-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-proxy
  namespace: llm-test
spec:
  selector:
    app: ai-proxy
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: llm-test
  annotations:
    tailscale.com/hostname: "ai"
    tailscale.com/proxy-group: mc-ingress-proxy
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: ai-proxy
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
