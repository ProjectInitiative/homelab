# Full-cache migration: model-cache (old, backed-up tier, Retained PV) ->
# model-cache-ephemeral (new cache tier, fresh juicefs-cache volume).
#
# Copies EVERYTHING on the old volume (all HF snapshots, lane prep artifacts,
# dsv41 rank-caches and lane receipts) so old-model-cache can be decommissioned
# immediately. rsync is restartable: on re-run it skips already-copied files.
#
# AFTER THIS JOB: the CURRENT 1104 lane's ranks live on hostPath
# (/var/lib/llm-test/glm53-flash-1104-state), NOT on this volume — its only
# PVC dependency is the lane-state subdir + HF snapshot. The DSV41 lane keeps
# its rank-cache bins under dsv41-1017/data/rank-cache (copied here verbatim);
# a lane re-activation wanting FRESH rank files re-runs its prepare job
# (06-deepseek-v41-prepare.yaml / 05-prepare-model-tree.yaml), which detects
# existing rank bins by checksum and regenerates if the model revision moved.
#
# Operator steps:
#   1. model-cache-ephemeral-v2 must exist and bind to the NEW juicefs-cache
#      volume (llm-test/model-cache-ephemeral-v2.yaml; the old PVC bound the
#      dead PV and was deleted).
#   2. Un-suspend: kubectl -n llm-test patch job model-cache-migrate \
#        --type=merge -p '{"spec":{"suspend":false}}'
#   3. Watch:     kubectl -n llm-test logs -f job/model-cache-migrate
#   4. Receipt:   /eph/.migration-complete.json (bytes + file counts).
#   5. Old PVC/PV retirement is a separate, explicit step after validation.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-cache-migrate
  namespace: llm-test
  labels:
    app: model-cache-migrate
    purpose: cache-tier-cutover
spec:
  suspend: true
  ttlSecondsAfterFinished: 604800
  backoffLimit: 2147483647
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels:
        app: model-cache-migrate
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: sextant
      tolerations:
        - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: migrate
          image: restic/restic:0.17.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # FULL-CACHE copy: everything under the HF cache root (snapshots,
              # blobs, refs) plus the top-level lane artifact dirs. Excludes
              # nothing: old-model-cache is going away entirely.
              SRC=/models
              DST=/eph
              marker=/eph/.migration-complete.json
              rm -f "$marker"
              echo "=== volume census BEFORE ==="
              du -sh /models/.cache/huggingface 2>/dev/null || true
              ls -la /models/ | head -20
              echo "=== rsync full cache ==="
              mkdir -p "$DST"
              # -H hardlink-preserving (HF cache uses de-duped blob links)
              # --info=progress2 for a single rolling progress line
              rsync -aH --info=progress2,stats2 \
                --exclude '.migration-complete.json' \
                "$SRC/" "$DST/"
              echo "=== post-copy verification ==="
              python3 - "$DST" "$marker" <<'PY'
              import hashlib, json, pathlib, sys
              root = pathlib.Path(sys.argv[1])
              marker = pathlib.Path(sys.argv[2])
              # Verify every .sha256 sidecar we can find (exlr8-style releases
              # ship hashes/<file>.sha256 trees).
              hs = list(root.rglob("hashes/*.sha256"))
              verified = 0
              for h in sorted(hs):
                  rel = h.relative_to(h.parent.parent)
                  target = h.parent.parent / rel.with_suffix("")
                  if not target.is_file():
                      continue
                  want = h.read_text().split()[0]
                  got = hashlib.sha256(target.read_bytes()).hexdigest()
                  if got != want:
                      raise SystemExit(f"HASH MISMATCH after copy: {rel}")
                  verified += 1
              # File-count + byte census of the whole copied tree.
              files = [f for f in root.rglob("*") if f.is_file()]
              total = sum(f.stat().st_size for f in files)
              # Key artifacts presence check (the currently-live 1104 snapshot
              # and the dsv41 rank-cache dir with both rank bins).
              hub = root / ".cache/huggingface/hub"
              k4 = hub / "models--kindlingai--glm-5.3-exlr8-k2-k3-k4"
              dsv = root / "dsv41-1017/data/rank-cache"
              checks = {
                  "glm53-exlr8-k4-snapshot": k4.is_dir(),
                  "dsv41-rank-cache-dir": dsv.is_dir(),
              }
              receipt = {
                  "source": "model-cache",
                  "dest": "model-cache-ephemeral-v2",
                  "files": len(files),
                  "bytes": total,
                  "sha256_files_verified": verified,
                  "checks": checks,
              }
              marker.write_text(json.dumps(receipt, indent=2) + "\n")
              print(json.dumps(receipt, indent=2), flush=True)
              missing = [k for k, v in checks.items() if not v]
              if missing:
                  raise SystemExit(f"MISSING key artifacts after copy: {missing}")
              print(f"migration complete: {len(files)} files, {total/2**30:.1f} GiB, {verified} sha256 verified", flush=True)
              PY
              echo "migration receipt: $marker"
          volumeMounts:
            - {name: src, mountPath: /models, readOnly: true}
            - {name: dst, mountPath: /eph}
          resources:
            requests: {cpu: "2", memory: "1Gi"}
            limits: {cpu: "4", memory: "4Gi"}
      volumes:
        - name: src
          persistentVolumeClaim:
            claimName: model-cache
        - name: dst
          persistentVolumeClaim:
            claimName: model-cache-ephemeral-v2
