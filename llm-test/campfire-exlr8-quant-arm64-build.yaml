# One-off native ARM64 BuildKit job for the official Campfire exlr8-quant
# launcher. The launcher downloads the latest checksummed GB10 build at
# runtime; GHCR access is not needed. Pushes to the in-cluster registry v2.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: campfire-exlr8-quant-build-context-20261127
  namespace: llm-test
  labels:
    app.kubernetes.io/part-of: campfire-kimi-k31
    app.kubernetes.io/component: image-build
immutable: true
data:
  buildkitd.toml: |
    [registry."local-registry.registry.svc.cluster.local:5000"]
      http = true
  Dockerfile: |
    FROM debian:trixie-slim
    ARG EXLR8_QUANT_SCRIPT_SHA256=89de834b9060fe3af5b2fbf16080b65ecd457ffb84728c7bffb9be597d3bba5d
    RUN apt-get update \
        && apt-get install -y --no-install-recommends ca-certificates coreutils curl sed \
        && rm -rf /var/lib/apt/lists/* \
        && curl -fsSL --max-time 30 https://campfire.kindlingai.dev/exlr8-quant.sh -o /usr/local/bin/exlr8-quant \
        && echo "$EXLR8_QUANT_SCRIPT_SHA256  /usr/local/bin/exlr8-quant" | sha256sum -c - \
        && chmod 0755 /usr/local/bin/exlr8-quant \
        && ldd --version | head -n 1
    ENV XDG_CACHE_HOME=/tmp
    ENTRYPOINT ["/usr/local/bin/exlr8-quant"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: campfire-exlr8-quant-arm64-build-20261127
  namespace: llm-test
  labels:
    app.kubernetes.io/part-of: campfire-kimi-k31
    app.kubernetes.io/component: image-build
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: campfire-kimi-k31
        app.kubernetes.io/component: image-build
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: chronometer
        kubernetes.io/arch: arm64
      tolerations:
        - key: dgx-spark-dedicated
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: buildkit
          image: moby/buildkit:v0.26.2-rootless
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              image=local-registry.registry.svc.cluster.local:5000/homelab/campfire-exlr8-quant:arm64-20261127
              echo "building native linux/arm64 launcher image $image on chronometer"
              exec buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/build \
                --local dockerfile=/build \
                --opt filename=Dockerfile \
                --opt platform=linux/arm64 \
                --output "type=image,name=$image,push=true,oci-mediatypes=false" \
                --progress=plain
          env:
            - name: BUILDKITD_FLAGS
              value: "--oci-worker-no-process-sandbox --config=/build/buildkitd.toml"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 20Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: build-context
              mountPath: /build
              readOnly: true
            - name: buildkit-state
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: build-context
          configMap:
            name: campfire-exlr8-quant-build-context-20261127
            defaultMode: 0444
        - name: buildkit-state
          emptyDir:
            sizeLimit: 20Gi
