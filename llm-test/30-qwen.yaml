# Qwen3.8-Flash-Next on the single-node AMD Strix Halo host (astrolabe).
#
# STATUS: SCAFFOLD ONLY. The download Job is suspended and the Deployment has
# replicas: 0. Applying this file allocates metadata/PVC only; it does not pull
# weights or start the server until explicitly activated.
#
# Runtime: https://github.com/peonist-ai/halogen-flash-server (0.9.0),
#          distributed under the Peonist EULA in that repository.
# Weights: peonist-ai/halogen-qwen3.8-flash-next
#          @ 9895fa812160059103a5e6043c1f8bf38b1e3a34; derivative model terms
#          are linked from its Hugging Face model card.
#
# The AMD device plugin currently advertises amd.com/gpu=0 on astrolabe, so the
# pod uses explicit /dev/kfd and /dev/dri mounts instead of a resource claim.
# Halogen is built specifically for gfx1151; do not set HSA_OVERRIDE_GFX_VERSION
# unless a future image explicitly requires it.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-halogen-models
  namespace: llm-test
  labels:
    app: qwen38-halogen
    lane: qwen38-astrolabe
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-nvme-sticky
  resources:
    requests:
      storage: 150Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-halogen-download-v1
  namespace: llm-test
  labels:
    app: qwen38-halogen-download
    lane: qwen38-astrolabe
    purpose: model-cache-preload
spec:
  ttlSecondsAfterFinished: 259200
  suspend: true
  backoffLimit: 2147483647
  template:
    metadata:
      labels:
        app: qwen38-halogen-download
        lane: qwen38-astrolabe
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: astrolabe
        kubernetes.io/arch: amd64
        gpu-vendor: amd
        gpu: strix-halo
      containers:
        - name: download
          image: ghcr.io/peonist-ai/halogen-flash-server:0.9.0@sha256:ca5c5e75555472f0234b889b639333b9c8e83823e8b2705259dc5965e448e07b
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface
                  key: HF_TOKEN
                  optional: true
            - name: HF_HUB_DISABLE_XET
              value: "1"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              rm -f /models/.download-complete
              HF_HUB_OFFLINE=0 hf download \
                peonist-ai/halogen-qwen3.8-flash-next \
                --revision 9895fa812160059103a5e6043c1f8bf38b1e3a34 \
                --local-dir /models

              check_size() {
                got=$(stat -c%s "$1")
                [ "$got" -eq "$2" ] || {
                  echo "FAIL: $1 is $got bytes, expected $2"
                  exit 1
                }
              }
              check_size /models/qwen38-flash-next-w4b.hgn 124068083904
              check_size /models/qwen38-flash-next-w4b.overlay.hgn 2572466560
              test -f /models/tokenizer/tokenizer.json
              test -f /models/tokenizer/chat_template.jinja
              touch /models/.download-complete
              echo "Halogen Qwen3.8-Flash-Next model tree complete"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen38-halogen-models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-halogen-astrolabe
  namespace: llm-test
  labels:
    app: qwen38-halogen
    lane: qwen38-astrolabe
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-halogen
      lane: qwen38-astrolabe
  template:
    metadata:
      labels:
        app: qwen38-halogen
        lane: qwen38-astrolabe
    spec:
      nodeSelector:
        kubernetes.io/hostname: astrolabe
        kubernetes.io/arch: amd64
        gpu-vendor: amd
        gpu: strix-halo
      hostIPC: true
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: preflight
          image: ghcr.io/peonist-ai/halogen-flash-server:0.9.0@sha256:ca5c5e75555472f0234b889b639333b9c8e83823e8b2705259dc5965e448e07b
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              test -f /models/.download-complete
              test -f /models/qwen38-flash-next-w4b.hgn
              test -f /models/qwen38-flash-next-w4b.overlay.hgn
              test -f /models/tokenizer/tokenizer.json
              test -c /dev/kfd
              test -d /dev/dri
              echo "astrolabe Halogen preflight complete"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: kfd
              mountPath: /dev/kfd
            - name: dri
              mountPath: /dev/dri
      containers:
        - name: halogen
          image: ghcr.io/peonist-ai/halogen-flash-server:0.9.0@sha256:ca5c5e75555472f0234b889b639333b9c8e83823e8b2705259dc5965e448e07b
          imagePullPolicy: IfNotPresent
          args: ["all"]
          env:
            - name: HALOGEN_CHECKPOINT
              value: /models/qwen38-flash-next-w4b.hgn
            - name: HALOGEN_TOKENIZER
              value: /models/tokenizer
            - name: HALOGEN_MODEL_ID
              value: qwen3.8-flash-next-halogen
            - name: HALOGEN_API_PORT
              value: "8731"
            - name: HALOGEN_PORT
              value: "8730"
            - name: HALOGEN_CTX
              value: "262144"
            - name: HALOGEN_KV_SLOTS
              value: "4"
            - name: HALOGEN_KV_POOL_POSITIONS
              value: "524288"
            - name: HALOGEN_MAX_TOK
              value: "32768"
            - name: HALOGEN_PROMPT_CACHE
              value: "2"
            - name: HALOGEN_CACHE_ENTRIES
              value: "8"
            - name: HALOGEN_NGRAM_GATHER_THREADS
              value: "64"
            - name: HALOGEN_ENGINE_WAIT_S
              value: "0"
            - name: HALOGEN_ENGINE_WATCHDOG_S
              value: "300"
            - name: HALOGEN_VERBOSE
              value: "0"
          # Direct-device fallback because amd.com/gpu is currently zero on
          # astrolabe. Privilege should be removed once plugin/CDI allocation
          # provides an enforceable exclusive GPU claim.
          securityContext:
            privileged: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              add: [SYS_NICE, IPC_LOCK]
          resources:
            requests:
              cpu: "16"
              memory: 110Gi
            limits:
              cpu: "32"
              memory: 122Gi
          ports:
            - name: http
              containerPort: 8731
            - name: engine
              containerPort: 8730
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 35
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 35
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: kfd
              mountPath: /dev/kfd
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen38-halogen-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-halogen-astrolabe
  namespace: llm-test
  labels:
    app: qwen38-halogen
    lane: qwen38-astrolabe
spec:
  type: ClusterIP
  selector:
    app: qwen38-halogen
    lane: qwen38-astrolabe
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
