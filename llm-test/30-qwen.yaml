# Qwen3.8-Flash-Next-NVFP4 weight puller.
# Intentionally suspended until the DeepSeek experiment is complete.
#
# Apply once:
#   kubectl apply -f qwen38-flash-download.yaml
# Start overnight:
#   kubectl patch job qwen38-flash-download -n llm-test \
#     --type=merge -p '{"spec":{"suspend":false}}'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-flash-download
  namespace: llm-test
  labels:
    app: qwen38-flash-download
    purpose: model-cache-preload
spec:
  suspend: true
  backoffLimit: 2147483647
  template:
    metadata:
      labels:
        app: qwen38-flash-download
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: download
          image: vllm/vllm-openai:qwen38-flash-next
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_HOME
              value: /models/.cache/huggingface
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              MODEL_ROOT="$HF_HOME/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4"
              (
                while true; do
                  size=$(du -sh "$MODEL_ROOT" 2>/dev/null | awk '{print $1}')
                  shards=$(find "$MODEL_ROOT/snapshots" -name '*.safetensors' 2>/dev/null | wc -l)
                  echo "[$(date -u +%H:%M:%S)Z] Qwen cache=${size:-unknown} safetensor_shards=${shards}"
                  sleep 60
                done
              ) &
              PROGRESS_PID=$!
              trap 'kill "$PROGRESS_PID" 2>/dev/null || true' EXIT
              python3 -u - <<'PY'
              import os
              from huggingface_hub import snapshot_download

              snapshot_download(
                  repo_id="RadixArk/Qwen3.8-Flash-Next-NVFP4",
                  cache_dir=os.environ["HF_HOME"],
                  token=os.environ.get("HF_TOKEN") or None,
                  max_workers=1,
                  resume_download=True,
              )
              print("Qwen3.8-Flash-Next-NVFP4 download complete", flush=True)
              PY
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
