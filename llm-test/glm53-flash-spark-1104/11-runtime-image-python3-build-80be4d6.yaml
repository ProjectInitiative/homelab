# Staged one-shot Python3 derivative of native recipe 80be4d6 / tag 4835fc852d34.
# Deliberately not listed in the lane kustomization; Argo must never run this build.
# The Job is suspended by default and also has the Skip hook annotation.
# First replace the digest placeholder in docker/Dockerfile.runtime-80be4d6
# with the verified native manifest digest, then create the immutable Dockerfile
# ConfigMap from that file; see README.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: glm53-flash-1104-image-py3-80be4d6
  namespace: llm-test
  annotations:
    argocd.argoproj.io/hook: Skip
  labels:
    app: glm53-flash-1104-image-build
    lane: glm53-flash-1104
    purpose: runtime-image
    recipe-commit: 80be4d6882837d8e0840827ae2aab6124fd48da3
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: glm53-flash-1104-image-build
        lane: glm53-flash-1104
        purpose: runtime-image
        recipe-commit: 80be4d6882837d8e0840827ae2aab6124fd48da3
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      dnsConfig:
        nameservers: [172.16.1.1, 1.1.1.1]
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/arch: arm64
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [octant]}
      containers:
        - name: buildkit
          image: moby/buildkit:v0.26.2-rootless
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              dockerfile=/workspace/dockerfile/Dockerfile.runtime-80be4d6
              test -s "$dockerfile" || { echo "Dockerfile ConfigMap input missing" >&2; exit 1; }
              expected_prefix=local-registry.registry.svc.cluster.local:5000/homelab/tensorfold-glm53-flash-1104:4835fc852d34@sha256:
              base_ref=$(awk '
                /^[[:space:]]*FROM[[:space:]]/ {
                  count++
                  if (NF != 2) exit 1
                  ref=$2
                }
                END { if (count != 1) exit 1; print ref }
              ' "$dockerfile") || { echo "expected exactly one simple FROM instruction" >&2; exit 1; }
              case "$base_ref" in
                "$expected_prefix"*) ;;
                *) echo "FROM must pin the 4835fc852d34 image by immutable digest" >&2; exit 1 ;;
              esac
              base_digest=${base_ref#"$expected_prefix"}
              test "${#base_digest}" -eq 64 || { echo "base digest must contain exactly 64 hex characters" >&2; exit 1; }
              case "$base_digest" in
                *[!0-9a-f]*|'') echo "base digest is not lowercase SHA-256 hex" >&2; exit 1 ;;
              esac
              image=local-registry.registry.svc.cluster.local:5000/homelab/tensorfold-glm53-flash-1104:4835fc852d34-py3-v1
              echo "building derived runtime $image from $base_ref"
              exec buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/workspace/context \
                --local dockerfile=/workspace/dockerfile \
                --opt filename=Dockerfile.runtime-80be4d6 \
                --output "type=image,name=$image,push=true,oci-mediatypes=false" \
                --progress=plain
          env:
            - name: BUILDKITD_FLAGS
              value: "--oci-worker-no-process-sandbox --config=/build/buildkitd.toml"
          resources:
            requests: {cpu: "2", memory: 4Gi, ephemeral-storage: 10Gi}
            limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 15Gi}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
          volumeMounts:
            - {name: context, mountPath: /workspace/context, readOnly: true}
            - {name: dockerfile, mountPath: /workspace/dockerfile, readOnly: true}
            - {name: buildkit-state, mountPath: /home/user/.local/share/buildkit}
            - {name: build-config, mountPath: /build, readOnly: true}
      volumes:
        - name: context
          emptyDir: {sizeLimit: 1Gi}
        - name: dockerfile
          configMap: {name: glm53-flash-1104-runtime-dockerfile-80be4d6, defaultMode: 0444}
        - name: buildkit-state
          emptyDir: {sizeLimit: 15Gi}
        - name: build-config
          configMap: {name: glm53-flash-1104-buildkit-config, defaultMode: 0555}
