# Activated by coordinated cutover; v14 is moved to Standby in conductor-workloads.
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ManagedWorkload
metadata:
  name: glm53-flash-1104
  namespace: llm-test
spec:
  poolRef: dgx-spark
  desiredState: Resident
  # Lower priority than v14 so it cannot steal capacity before v14 is Standby.
  priority: 90
  driver:
    type: DeploymentSet
    deploymentSet:
      recoveryPolicy: RecreateTogether
      startupGracePeriod: 60m
      members:
        - name: glm53-flash-1104-worker
          role: worker
          startOrder: 10
          stopOrder: 20
          replicas: 1
          readyGate: ContainersRunning
        - name: glm53-flash-1104-head
          role: head
          startOrder: 20
          stopOrder: 10
          replicas: 1
          readyGate: DeploymentAvailable
  qualification:
    serviceName: dgx-spark-backend
    path: /health
    port: 8000
    timeout: 60m
  routing:
    serviceName: dgx-spark-backend
    selector:
      serving.homelab.io/alias: dgx-spark
