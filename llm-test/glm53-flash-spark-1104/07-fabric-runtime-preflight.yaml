apiVersion: batch/v1
kind: Job
metadata:
  name: glm53-flash-1104-fabric-preflight-v1
  namespace: llm-test
  labels:
    app: glm53-flash-1104-preflight
    lane: glm53-flash-1104
    purpose: fabric-runtime-preflight
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: glm53-flash-1104-preflight
        lane: glm53-flash-1104
        purpose: fabric-runtime-preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      runtimeClassName: nvidia-rdma
      nodeSelector:
        kubernetes.io/hostname: octant
        gpu: dgx-spark
        gpu-vendor: nvidia
        kubernetes.io/arch: arm64
      containers:
        - name: fabric-preflight
          image: local-registry.registry.svc.cluster.local:5000/homelab/tensorfold-glm53-flash-1104:74e19a63a9a5-py3-v2@sha256:437559d301f371227a06d32be6fa9800e9d092543d774f694b7e532ac44110a1
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              source /opt/rdma/configure-rdma-fabric.sh
              echo "GLM 1104 runtime fabric preflight passed: peer=$RDMA_PEER_NODE rails=$RDMA_PEER_NETDEVS hcas=$NCCL_IB_HCA gid=$NCCL_IB_GID_INDEX"
          env:
            - {name: PEER_SERVICE, value: glm53-flash-1104-head-rendezvous.llm-test.svc.cluster.local}
            - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          resources:
            requests: {cpu: 100m, memory: 128Mi, rdma/hca_shared_devices: "1"}
            limits: {cpu: 500m, memory: 512Mi, rdma/hca_shared_devices: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: fabric-config, mountPath: /opt/rdma/configure-rdma-fabric.sh, subPath: configure-rdma-fabric.sh, readOnly: true}
            - {name: fabric-inventory, mountPath: /etc/dgx-spark/rdma-fabric.json, readOnly: true}
      volumes:
        - name: fabric-config
          configMap: {name: glm53-flash-1104-rdma-fabric, defaultMode: 0555}
        - name: fabric-inventory
          hostPath: {path: /var/lib/dgx-spark/rdma-fabric.json, type: File}
