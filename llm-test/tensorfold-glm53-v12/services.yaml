# TensorFold v1.2 GLM-5.3-Flash lane — internal in-cluster API Service.
#
# Selects whichever DGX Spark receives the head pod (host network, port 8880).
# Safe to stage with the lane: with the Deployments at replicas 0 it has no
# endpoints and touches nothing. Client/LiteLLM cutover happens only at
# activation (see README.md step 5).
---
apiVersion: v1
kind: Service
metadata:
  name: tensorfold-v12-head
  namespace: llm-test
  labels:
    lane: tensorfold-v12
spec:
  selector:
    app: tensorfold-v12-head
  ports:
    - name: http
      protocol: TCP
      port: 8880
      targetPort: 8880
