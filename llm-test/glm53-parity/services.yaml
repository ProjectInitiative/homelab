# GLM-5.3-Flash EXL3 parity — stable in-cluster API Service.
#
# The Service selects whichever DGX Spark receives the head pod. LiteLLM uses
# this DNS name as its backend and remains the only Tailscale-facing API.
#
# NOTE: this file is NOT applied during the pre-deploy stage. Apply it only when
# you actually start the GLM lane and want client access through LiteLLM.
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-head
  namespace: llm-test
spec:
  selector:
    app: glm53-exl3-head
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
