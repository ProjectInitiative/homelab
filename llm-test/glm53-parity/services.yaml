# GLM-5.3-Flash EXL3 parity — internal Services, an HAProxy relay, and the
# Tailscale LoadBalancer endpoint.
#
# These are NEW, GLM-specific endpoints (no overlap with the running
# deepseek-parity `ai`/`ai-proxy`/`llm-*`). The GLM API is served on the head
# node's host network at port 8888 (node IP 172.16.4.55); the API itself is on
# the ConnectX backplane hostNetwork (0.0.0.0:8888), and the HAProxy relay keeps
# it out of Kubernetes/Tailscale routing, mirroring the deepseek lane.
#
# NOTE: this file is NOT applied during the pre-deploy stage. Apply it only when
# you actually start the GLM lane and want client access.
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-head
  namespace: llm-test
spec:
  selector:
    app: glm53-exl3-head
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-worker
  namespace: llm-test
spec:
  selector:
    app: glm53-exl3-worker
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glm-ai-proxy-config
  namespace: llm-test
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
    defaults
      mode tcp
      timeout connect 5s
      timeout client 1h
      timeout server 1h
    frontend vllm_api
      bind :8888
      default_backend vllm_head
    backend vllm_head
      server chronometer 172.16.4.55:8888 check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-ai-proxy
  namespace: llm-test
  labels:
    app: glm-ai-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glm-ai-proxy
  template:
    metadata:
      labels:
        app: glm-ai-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: chronometer
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine
          ports:
            - name: http
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
      volumes:
        - name: config
          configMap:
            name: glm-ai-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: glm-ai-proxy
  namespace: llm-test
spec:
  selector:
    app: glm-ai-proxy
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: glm
  namespace: llm-test
  annotations:
    tailscale.com/hostname: "glm"
    tailscale.com/proxy-group: mc-ingress-proxy
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: glm-ai-proxy
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8888
