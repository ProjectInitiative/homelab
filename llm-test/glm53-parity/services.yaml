# GLM-5.3-Flash EXL3 parity — stable in-cluster and Tailscale Services.
#
# The GLM API is served on whichever DGX Spark receives the head pod. Both
# Services select that pod directly; Kubernetes tracks its host-network endpoint
# as placement changes, so no node-specific relay is required.
#
# NOTE: this file is NOT applied during the pre-deploy stage. Apply it only when
# you actually start the GLM lane and want client access.
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-head
  namespace: llm-test
spec:
  selector:
    app: glm53-exl3-head
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: glm
  namespace: llm-test
  annotations:
    tailscale.com/hostname: "glm"
    tailscale.com/proxy-group: mc-ingress-proxy
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: glm53-exl3-head
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
