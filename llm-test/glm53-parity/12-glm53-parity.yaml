            - {name: NCCL_DEBUG, value: WARN}
            - {name: NCCL_SOCKET_IFNAME, value: enp1s0f1np1}
            - {name: GLOO_SOCKET_IFNAME, value: enp1s0f1np1}
            # NCCL_IB_HCA names the RDMA device, not the Linux netdev.
            - {name: NCCL_IB_HCA, value: "mlx5_1:1"}
            - {name: NCCL_IB_GID_INDEX, value: "2"}
            - {name: VLLM_HOST_IP, value: 172.16.5.56}
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: models
              mountPath: /cache/huggingface
              subPath: .cache/huggingface
            - name: overlay
              mountPath: /opt/glm53/patch_adaptive_k.py
              subPath: patch_adaptive_k.py
            - name: overlay
              mountPath: /opt/glm53/patch_dense_fp8.py
              subPath: patch_dense_fp8.py
            - name: overlay
              mountPath: /opt/glm53/exl3.py
              subPath: exl3.py
            - name: triton-cache
              mountPath: /root/.triton/cache
            - name: tilelang-cache
              mountPath: /root/.tilelang/cache
            - name: vllm-cache
              mountPath: /root/.cache/vllm
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
            - name: diagnostics
              mountPath: /diagnostics
            - name: infiniband
              mountPath: /dev/infiniband
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: overlay
          configMap:
            name: glm53-parity-overlay
        - name: triton-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/triton
            type: DirectoryOrCreate
        - name: tilelang-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/tilelang
            type: DirectoryOrCreate
        - name: vllm-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/vllm-cache
