            - {name: GLM53_ADAPTIVE_K_ALPHA, value: "0.25"}
            - {name: GLM53_ADAPTIVE_K_MARGIN, value: "1.0"}
            - {name: GLM53_ADAPTIVE_K_MIN_STEPS, value: "4"}
            - {name: GLM53_ADAPTIVE_K_SATURATE, value: max}
            - {name: GLM53_ADAPTIVE_K_HIST, value: "200"}
            - {name: GLM53_DENSE_FP8, value: "off"}
            - {name: GLM53_SUPPRESS_STOPS_IN_REASONING, value: "1"}
            - {name: GLM53_MIXED_PREFILL_CHUNK, value: skip}
            - {name: GLM53_DEFAULT_REASONING_EFFORT, value: ""}
            - {name: GLM53_INDEXER_WORKSPACE, value: rightsize}
            - {name: GLM53_SPINWAIT_MS, value: stock}
            - {name: NCCL_IB_DISABLE, value: "0"}
