                || test -f /cache/huggingface/models--Mia-AiLab--GLM-5.3-Flash-EXL3-TR3-4bpw/snapshots/25a44fdbf16862a46b7cc9921142c6c81350af2f/config.json
              test -f /cache/huggingface/hub/models--incoai--GLM-5.3-Flash-DFlash2/snapshots/dc77ff1c99eeb2df044ee3d4f0094eb033fee410/model.safetensors \
                || test -f /cache/huggingface/models--incoai--GLM-5.3-Flash-DFlash2/snapshots/dc77ff1c99eeb2df044ee3d4f0094eb033fee410/model.safetensors
              echo "GLM-5.3-Flash-EXL3 + DFlash2 snapshots verified in cache"
          volumeMounts:
