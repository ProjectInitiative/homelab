                for base in /cache/huggingface/hub /cache/huggingface; do
                  if [ -f "$base/$1/snapshots/$2/config.json" ]; then
                    printf '%s/%s/snapshots/%s' "$base" "$1" "$2"; return 0
                  fi
                done
                return 1
              }
              MODEL_DIR="$(find_snap "$MODEL_CACHE" "$MODEL_REV")" || { say "FATAL: $MODEL_CACHE snapshot $MODEL_REV missing"; ls -la /cache/huggingface/hub 2>/dev/null || true; exit 1; }
              export MODEL_DIR
              DFLASH_MODEL_DIR="$(find_snap "$DFLASH_CACHE" "$DFLASH_REV")" || { say "FATAL: DFlash2 snapshot $DFLASH_REV missing"; exit 1; }
              export DFLASH_MODEL_DIR
              # The image's Triton registry must resolve the real NVIDIA driver,
              # not a stub. This is part of upstream start.sh's container setup.
              export TRITON_LIBCUDA_PATH=/run/triton-cuda-driver
              REAL_LIBCUDA=/usr/lib/aarch64-linux-gnu/libcuda.so.1
              test -f "$REAL_LIBCUDA"
              test "$(readlink -f "$REAL_LIBCUDA")" != */stubs/libcuda.so
              mkdir -p /run/triton-cuda-driver
              ln -sfn "$REAL_LIBCUDA" /run/triton-cuda-driver/libcuda.so.1
              ln -sfn "$REAL_LIBCUDA" /run/triton-cuda-driver/libcuda.so

              ARGS=(
                --served-model-name "${SERVED_MODEL_NAME}"
                --host 0.0.0.0
                --port "${PORT}"
                --tensor-parallel-size "${TP}"
                --nnodes "${NNODES}"
                --node-rank 1
                --master-addr "${HEAD_IP}"
                --master-port "${MASTER_PORT}"
                --distributed-executor-backend mp
                --headless
                --tool-call-parser glm47
                --enable-auto-tool-choice
                --reasoning-parser glm45
                --enable-prefix-caching
                --no-enable-flashinfer-autotune
              )
              [ "${ENFORCE_EAGER:-1}" = "1" ] && ARGS+=(--enforce-eager)
              [ -n "${QUANTIZATION:-}" ] && [ "${QUANTIZATION}" != "none" ] && ARGS+=(--quantization "${QUANTIZATION}")
              [ -n "${MAX_MODEL_LEN:-}" ] && ARGS+=(--max-model-len "${MAX_MODEL_LEN}")
              [ -n "${GPU_MEM_UTIL:-}" ] && ARGS+=(--gpu-memory-utilization "${GPU_MEM_UTIL}")
              [ -n "${MAX_NUM_SEQS:-}" ] && ARGS+=(--max-num-seqs "${MAX_NUM_SEQS}")
              [ -n "${MAX_NUM_BATCHED_TOKENS:-}" ] && ARGS+=(--max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}")
              [ -n "${LONG_PREFILL_TOKEN_THRESHOLD:-}" ] && ARGS+=(--long-prefill-token-threshold "${LONG_PREFILL_TOKEN_THRESHOLD}")
              [ -n "${KV_CACHE_DTYPE:-}" ] && ARGS+=(--kv-cache-dtype "${KV_CACHE_DTYPE}")
              if [ -n "${GLM53_DEFAULT_REASONING_EFFORT:-}" ]; then
                ARGS+=(--default-chat-template-kwargs "{\"reasoning_effort\":\"${GLM53_DEFAULT_REASONING_EFFORT}\"}")
              fi
              if [ "${SPEC_METHOD:-mtp}" = "dflash" ]; then
                SPEC_JSON=$(printf '{"method":"dflash","model":"%s","num_speculative_tokens":%s,"kv_cache_dtype":"auto","draft_sample_method":"probabilistic","rejection_sample_method":"standard","draft_tensor_parallel_size":%s}' "${DFLASH_MODEL_DIR}" "${DFLASH_TOKENS:-7}" "${DFLASH_DRAFT_TP:-2}")
                ARGS+=(--speculative-config "$SPEC_JSON")
              elif [ "${SPEC_METHOD:-mtp}" = "none" ]; then
                :
              elif [ "${MTP_TOKENS:-0}" != "0" ]; then
                ARGS+=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${MTP_TOKENS}}")
              fi
              if [ -n "${CHAT_TEMPLATE:-}" ] && [ -f "${CHAT_TEMPLATE}" ]; then
                ARGS+=(--chat-template "${CHAT_TEMPLATE}")
              fi
              if [ "${LANGUAGE_MODEL_ONLY:-0}" = "1" ]; then
                ARGS+=(--language-model-only)
              else
                [ -n "${LIMIT_MM:-}" ] && ARGS+=(--limit-mm-per-prompt "${LIMIT_MM}")
                [ "${SKIP_MM_PROFILING:-1}" = "1" ] && ARGS+=(--skip-mm-profiling)
              fi
              if [ -n "${EXTRA_ARGS:-}" ]; then
                # shellcheck disable=SC2206
                EXTRA=(${EXTRA_ARGS})
                ARGS+=("${EXTRA[@]}")
              fi
              for p in patch_glm_video_placeholders.py patch_suppress_stops_in_reasoning.py \
                       patch_scheduler_decode_floor.py patch_glm5_drafter_group.py \
                       patch_hybrid_prefix_hit.py patch_apc_per_group_retention.py \
                       patch_xgrammar_termination.py patch_kpool_tail_slotmap.py \
                       patch_spinwait.py patch_adaptive_k.py patch_dense_fp8.py \
                       patch_indexer_workspace.py patch_ablit.py; do
                if [ -f /opt/glm53/$p ]; then
                  say "applying overlay patch $p"
                  python3 /opt/glm53/$p
                fi
              done
              if [ "${ABLIT:-0}" = "1" ]; then
                say "ablit: o_proj orthogonalization ON"
              else
                say "ablit: off — stock o_proj weights"
              fi
              say "joining TP2 at ${HEAD_IP}:${MASTER_PORT} as rank 1"
              exec vllm serve "${MODEL_DIR}" "${ARGS[@]}"
          env:
            - {name: HF_HOME, value: /cache/huggingface}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: VLLM_CACHE_ROOT, value: /root/.cache/vllm}
            - {name: TRITON_CACHE_DIR, value: /root/.triton/cache}
            - {name: TILELANG_CACHE_DIR, value: /root/.tilelang/cache}
            - {name: TORCH_CUDA_ARCH_LIST, value: 12.1a}
            - {name: FLASHINFER_CUDA_ARCH_LIST, value: 12.1a}
            - {name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
            - {name: VLLM_ENGINE_READY_TIMEOUT_S, value: "3600"}
            - {name: VLLM_NO_USAGE_STATS, value: "1"}
            - {name: DO_NOT_TRACK, value: "1"}
            - {name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS, value: "1"}
            - {name: SERVED_MODEL_NAME, value: GLM-5.3-Flash-EXL3}
            - {name: PORT, value: "8000"}
            - {name: TP, value: "2"}
            - {name: NNODES, value: "2"}
            - {name: HEAD_IP, value: 172.16.5.55}
            - {name: MASTER_PORT, value: "29521"}
            - {name: QUANTIZATION, value: exl3}
            - {name: MAX_MODEL_LEN, value: "512000"}
            - {name: GPU_MEM_UTIL, value: "0.88"}
            - {name: MAX_NUM_SEQS, value: "4"}
            - {name: MAX_NUM_BATCHED_TOKENS, value: "7168"}
            - {name: LONG_PREFILL_TOKEN_THRESHOLD, value: ""}
            - {name: KV_CACHE_DTYPE, value: fp8}
            - {name: MTP_TOKENS, value: "0"}
            - {name: SPEC_METHOD, value: dflash}
            - {name: DFLASH_TOKENS, value: "7"}
            - {name: DFLASH_DRAFT_TP, value: "2"}
            - {name: LANGUAGE_MODEL_ONLY, value: "0"}
            - {name: SKIP_MM_PROFILING, value: "1"}
            - {name: LIMIT_MM, value: '{"image":100,"video":1}'}
            - {name: CHAT_TEMPLATE, value: /opt/glm53/chat_template.jinja}
            - {name: ENFORCE_EAGER, value: "0"}
            - {name: EXTRA_ARGS, value: "--cudagraph-capture-sizes 1 2 4 8 16 24 32 --kv-cache-memory-bytes 12884901888"}
            - {name: EXL3_FUSED_MOE, value: "1"}
            - {name: EXL3_MOE_ROW_TILE, value: "0"}
