---
# Worker: rank 1, --headless, sextant. No probes (lane convention); scale
# worker BEFORE head on deploy, scale head DOWN first on teardown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv41-exl3-worker
  namespace: llm-test
  labels:
    app: dsv41-exl3-worker
    lane: dsv41-exl3
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dsv41-exl3-worker
  template:
    metadata:
      labels:
        app: dsv41-exl3-worker
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: Unconfined
      nodeSelector:
        kubernetes.io/hostname: sextant
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: preflight
          image: ghcr.io/miaai-lab/deepseek-v4.1-flash-exl3-2x-dgx-sparks:2.9bpw@sha256:2f0cf3adc0f989c1d446be274df864eb799630175f604c3b22b71b7205971dce
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || echo "WARN: drop_caches failed"
              avail_kib=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
              required_kib=$((12 * 1024 * 1024))
              echo "MemAvailable=$((avail_kib / 1024)) MiB; required=12288 MiB"
              [ "$avail_kib" -ge "$required_kib" ] || { echo "FATAL: insufficient GB10 boot margin"; exit 1; }
              test -f /model/config.json
              test -f /model/quantization_config.json
              test -f /model/model.safetensors.index.json
              test -f /model/tokenizer.json
              shards=$(find /model -maxdepth 1 -name 'model-*.safetensors' | wc -l)
              echo "model shards: $shards/39"
              [ "$shards" -eq 39 ]
              test -f /engram-src/model-00047-of-00048.safetensors
              test -f /engram-src/model-00048-of-00048.safetensors
              test -f /engram-src/config.json
              grep -q '"engram_layer_ids"' /engram-src/config.json
              grep -q '"dsv41_engram_src": "embed-only"' /engram-src/model.safetensors.index.json
              echo "preflight ok"
          volumeMounts:
            - name: models
              mountPath: /model
              subPath: dsv41-exl3/model
              readOnly: true
            - name: models
              mountPath: /engram-src
              subPath: dsv41-exl3/engram-src
              readOnly: true
      containers:
        - name: vllm
          image: ghcr.io/miaai-lab/deepseek-v4.1-flash-exl3-2x-dgx-sparks:2.9bpw@sha256:2f0cf3adc0f989c1d446be274df864eb799630175f604c3b22b71b7205971dce
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command: ["/bin/bash", "-lc"]
          args: ["/opt/dsv41/launch/worker.sh"]
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: models
              mountPath: /model
              subPath: dsv41-exl3/model
              readOnly: true
            - name: models
              mountPath: /engram-src
              subPath: dsv41-exl3/engram-src
              readOnly: true
            - name: packed-engram
              mountPath: /engram-packed
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: vllm-cache
              mountPath: /root/.cache/vllm
            - name: triton-cache
              mountPath: /root/.triton/cache
            - name: tilelang-cache
              mountPath: /root/.tilelang/cache
            - name: lane-tmp
              mountPath: /tmp
            - name: infiniband
              mountPath: /dev/infiniband
            - name: profile
              mountPath: /etc/dsv41-profile
              readOnly: true
            - name: launch
              mountPath: /opt/dsv41/launch
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: vllm-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/vllm-cache
            type: DirectoryOrCreate
        - name: triton-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/triton
            type: DirectoryOrCreate
        - name: tilelang-cache
          hostPath:
            path: /var/lib/llm-test/jit-cache/tilelang
            type: DirectoryOrCreate
        - name: lane-tmp
          hostPath:
            path: /var/lib/llm-test/dsv41-tmp
            type: DirectoryOrCreate
        - name: packed-engram
          persistentVolumeClaim:
            claimName: dsv41-engram-packed-sextant
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
        - name: profile
          configMap:
            name: dsv41-exl3-profile
        - name: launch
          configMap:
            name: dsv41-exl3-launch
            defaultMode: 0555
