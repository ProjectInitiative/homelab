# DeepSeek-V4.1-Flash-1017 lane — internal API Service.
#
# Selects whichever DGX Spark receives the head pod (host network, port 8888).
# Safe to stage with the lane: replicas 0 means no endpoints. LiteLLM/router
# cutover happens only at activation. Port 8888 is the recipe default and
# dsv41-lane-unique (old lanes sit on 8000), so this lane CAN coexist at
# staging time — but the Sparks' GPUs/memory cannot: it is still an exclusive
# 2-Spark swap at activation.
---
apiVersion: v1
kind: Service
metadata:
  name: dsv41-1017-head
  namespace: llm-test
  labels:
    lane: dsv41-1017
    serving.homelab.io/alias: deepseek-v41-1017
spec:
  selector:
    app: dsv41-1017-head
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
