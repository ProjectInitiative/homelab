            - {name: runtime-overlays, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/quantization/modelopt.py, subPath: modelopt.py, readOnly: true}
            - {name: runtime-overlays, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/models/qwen3_8_flash_next/nvidia/ops/qsa.py, subPath: qsa_ops.py, readOnly: true}
            - {name: runtime-overlays, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/models/qwen3_8_flash_next/nvidia/qsa.py, subPath: qsa_nvidia.py, readOnly: true}
            - {name: dshm, mountPath: /dev/shm}
            - {name: vllm-cache, mountPath: /root/.cache/vllm}
            - {name: triton-cache, mountPath: /root/.triton/cache}
            - {name: lane-tmp, mountPath: /tmp}
            - {name: infiniband, mountPath: /dev/infiniband}
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-cache}}
        - {name: upstream-patches, configMap: {name: qwen38-upstream-patches, defaultMode: 0444}}
        - {name: launch, configMap: {name: qwen38-dual-launch, defaultMode: 0555}}
        - {name: runtime-build, emptyDir: {}}
        - {name: runtime-overlays, emptyDir: {}}
        - {name: model-view, emptyDir: {}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
        - {name: vllm-cache, hostPath: {path: /var/lib/llm-test/qwen38-vllm-cache, type: DirectoryOrCreate}}
        - {name: triton-cache, hostPath: {path: /var/lib/llm-test/qwen38-triton-cache, type: DirectoryOrCreate}}
        - {name: lane-tmp, hostPath: {path: /var/lib/llm-test/qwen38-tmp, type: DirectoryOrCreate}}
        - {name: infiniband, hostPath: {path: /dev/infiniband, type: Directory}}
