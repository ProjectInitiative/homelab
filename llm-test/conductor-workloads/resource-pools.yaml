apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ResourcePool
metadata:
  name: dgx-spark
  namespace: llm-test
spec:
  # GLM 1104 cutover smoke passed 2026-11-09; Conductor resumes ownership of
  # residency and RecreateTogether recovery on this pool. Capacity is spark
  # units (one spark = one DGX node): residents admitted in priority order
  # while demand fits (DEC-0063). A (1104, prio 90) + B (1104-b, prio 80)
  # each demand 2 -> both co-resident on the 4-node ring.
  managementMode: Manage
  capacity:
    slots: 4
  nodeSelector:
    gpu: dgx-spark
    gpu-vendor: nvidia
  routing:
    serviceName: dgx-spark-backend
    selector:
      serving.homelab.io/alias: dgx-spark
  policy:
    notReadyGracePeriod: 2m
    requireFencing: true
    defaultMinDwell: 15m
    cooldown: 5m
---
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ResourcePool
metadata:
  name: cygnet-amd
  namespace: llm-test
spec:
  managementMode: Observe
  capacity:
    slots: 1
  nodeSelector:
    kubernetes.io/hostname: astrolabe
  routing:
    serviceName: cygnet-classifier
    selector:
      app: cygnet-classifier
  policy:
    notReadyGracePeriod: 2m
    requireFencing: true
    defaultMinDwell: 15m
    cooldown: 5m
---
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ResourcePool
metadata:
  name: cygnet-nvidia
  namespace: llm-test
spec:
  managementMode: Observe
  capacity:
    slots: 1
  nodeSelector:
    gpu: dgx-spark
    gpu-vendor: nvidia
  routing:
    serviceName: cygnet-classifier-nv
    selector:
      app: cygnet-classifier-nv
  policy:
    notReadyGracePeriod: 2m
    requireFencing: true
    defaultMinDwell: 15m
    cooldown: 5m
