# desiredState is RUNTIME-ONLY (operator policy 2026-11-11): it is the
# Conductor residency switch and must never be declared in Git. Argo syncs
# this app but the field is absent from every rendered manifest, so Argo has
# nothing to enforce and runtime patches/API calls (cutover.sh, revert.sh,
# ops-intent SSA) are never reverted. Current live intents are owned by the
# ops-intent field manager: v14=Standby (p0, unqualified rollback), 1104=Resident
# (p90, live), cygnets=Resident. Register new workloads without desiredState
# and set it once at apply time.
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ManagedWorkload
metadata:
  name: tensorfold-v14
  namespace: llm-test
spec:
  poolRef: dgx-spark
  priority: 0
  driver:
    type: DeploymentSet
    deploymentSet:
      recoveryPolicy: RecreateTogether
      startupGracePeriod: 30m
      members:
        - name: tensorfold-v14-worker
          role: worker
          startOrder: 10
          stopOrder: 20
          replicas: 1
          readyGate: ContainersRunning
        - name: tensorfold-v14-head
          role: head
          startOrder: 20
          stopOrder: 10
          replicas: 1
          readyGate: DeploymentAvailable
  qualification:
    serviceName: dgx-spark-backend
    path: /health
    timeout: 45m
  routing:
    serviceName: dgx-spark-backend
    selector:
      serving.homelab.io/alias: dgx-spark
---
