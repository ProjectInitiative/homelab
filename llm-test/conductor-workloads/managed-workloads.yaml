---
# Live GLM-5.3-Flash serving lane (recipe 1104, d4226a1 engine). Proven live
# 2026-11-09: manual cutover smoke passed (health/models/completion), full 1M
# window, TF_ROCE=0. Registered Resident so Conductor owns recovery and
# RecreateTogether once the pool returns to Manage mode.
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ManagedWorkload
metadata:
  name: glm53-flash-1104
  namespace: llm-test
spec:
  poolRef: dgx-spark
  priority: 90
  driver:
    type: DeploymentSet
    deploymentSet:
      recoveryPolicy: RecreateTogether
      startupGracePeriod: 60m
      # bestRoute (OQ-0055): pin the pair onto ring-adjacent nodes (direct
      # RoCE rails) when one is Ready; otherwise place freely — the routed-
      # RoCE lane script serves non-adjacent pairs through a ring neighbour.
      # Ring order comes from the fabric.homelab.io/ring-position node
      # labels (dotfiles); consumed by Conductor >= 477b87d.
      placement:
        mode: bestRoute
      members:
        - name: glm53-flash-1104-worker
          role: worker
          startOrder: 10
          stopOrder: 20
          replicas: 1
          readyGate: DeploymentAvailable
        - name: glm53-flash-1104-head
          role: head
          startOrder: 20
          stopOrder: 10
          replicas: 1
          readyGate: DeploymentAvailable
  qualification:
    serviceName: dgx-spark-backend
    path: /health
    port: 8000
    timeout: 60m
  routing:
    serviceName: dgx-spark-backend
    selector:
      serving.homelab.io/alias: dgx-spark
---
# RISK-0047 A/B workload (2026-11-17): byte-for-byte copy of the 1104 lane
# pinned in Git to astrolabe(worker)+octant(head) — direct rails .5/.6, no
# placement block (mode "any" would CLEAR the pins; absent block leaves them
# alone). Observe pool: no desiredState (runtime-only per policy), priority
# below prod so nothing here can preempt the live pair. Verdict prompt hits
# glm53-flash-1104-astro-api directly.
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ManagedWorkload
metadata:
  name: glm53-flash-1104-astro
  namespace: llm-test
spec:
  poolRef: dgx-spark-astro
  priority: 10
  driver:
    type: DeploymentSet
    deploymentSet:
      recoveryPolicy: RecreateTogether
      startupGracePeriod: 60m
      members:
        - name: glm53-flash-1104-astro-worker
          role: worker
          startOrder: 10
          stopOrder: 20
          replicas: 1
          readyGate: ContainersRunning
        - name: glm53-flash-1104-astro-head
          role: head
          startOrder: 20
          stopOrder: 10
          replicas: 1
          readyGate: DeploymentAvailable
  qualification:
    serviceName: glm53-flash-1104-astro-api
    path: /health
    port: 8000
    timeout: 60m
  routing:
    serviceName: glm53-flash-1104-astro-api
    selector:
      serving.homelab.io/alias: dgx-spark-astro
