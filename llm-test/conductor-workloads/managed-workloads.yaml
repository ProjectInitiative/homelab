apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ManagedWorkload
metadata:
  name: tensorfold-v14
  namespace: llm-test
spec:
  poolRef: dgx-spark
  # Live serving is recipe 1104 (priority 90). v14 is the qualified rollback
  # target: keep Standby in Git; flip to Resident only via revert.sh after the
  # 1104 lane degrades. Its own current manifests still refuse 512k context
  # (RISK: unqualified until the fit/gate fix lands), so do not let the
  # scheduler promote it while 1104 is Resident.
  desiredState: Standby
  priority: 0
  driver:
    type: DeploymentSet
    deploymentSet:
      recoveryPolicy: RecreateTogether
      startupGracePeriod: 30m
      members:
        - name: tensorfold-v14-worker
          role: worker
          startOrder: 10
          stopOrder: 20
          replicas: 1
          readyGate: ContainersRunning
        - name: tensorfold-v14-head
          role: head
          startOrder: 20
          stopOrder: 10
          replicas: 1
          readyGate: DeploymentAvailable
  qualification:
    serviceName: dgx-spark-backend
    path: /health
    timeout: 45m
  routing:
    serviceName: dgx-spark-backend
    selector:
      serving.homelab.io/alias: dgx-spark
---
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ManagedWorkload
metadata:
  name: cygnet-classifier-amd
  namespace: llm-test
spec:
  poolRef: cygnet-amd
  desiredState: Resident
  priority: 50
  driver:
    type: DeploymentSet
    deploymentSet:
      members:
        - name: cygnet-classifier
          role: classifier
          startOrder: 10
          stopOrder: 10
          replicas: 1
          readyGate: DeploymentAvailable
  qualification:
    serviceName: cygnet-classifier
    path: /health
    port: 8009
    timeout: 10m
  routing:
    serviceName: cygnet-classifier
    selector:
      app: cygnet-classifier
