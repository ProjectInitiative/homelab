# Resident classifier on the cygnet-amd pool (astrolabe).
# desiredState is RUNTIME-ONLY (operator policy 2026-11-11): the Conductor
# residency switch is never declared in Git. Set it once at apply time via
# SSA with the ops-intent field manager (cutover.sh / revert.sh do this).
apiVersion: conductor.projectinitiative.io/v1alpha1
kind: ManagedWorkload
metadata:
  name: cygnet-classifier-amd
  namespace: llm-test
spec:
  poolRef: cygnet-amd
  priority: 50
  driver:
    type: DeploymentSet
    deploymentSet:
      members:
        - name: cygnet-classifier
          role: classifier
          startOrder: 10
          stopOrder: 10
          replicas: 1
          readyGate: DeploymentAvailable
  qualification:
    serviceName: cygnet-classifier
    path: /health
    port: 8009
    timeout: 10m
  routing:
    serviceName: cygnet-classifier
    selector:
      app: cygnet-classifier
