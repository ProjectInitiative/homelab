name: Manifest Diff

on:
  pull_request:
    paths:
      - 'generator/**'
      - 'apps.yaml'
      - 'clusters/**'
      - 'argocd-deployment/**'
      - 'parent-apps/**'
      - 'bootstrap/**'
      - 'apps/**'
      - '.github/workflows/**'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr-branch

      - name: Generate Main Manifests
        working-directory: main-branch
        run: |
          nix run ../pr-branch#generate-manifests
          mkdir -p ../manifests-main
          cp -r .direnv/manifests/* ../manifests-main/

      - name: Generate PR Manifests
        working-directory: pr-branch
        run: |
          nix run .#generate-manifests
          mkdir -p ../manifests-pr
          cp -r .direnv/manifests/* ../manifests-pr/

      - name: Generate Diff
        id: diff
        shell: bash
        run: |
          # Pre-build dyff to suppress Nix build log
          nix build nixpkgs#dyff --no-link 2>/dev/null

          # 1. cdk8s-generated manifest diff
          nix run nixpkgs#dyff -- between -b --ignore-order-changes \
            manifests-main/ manifests-pr/ > manifest-diff.txt 2>/dev/null

          if grep -q "returned no differences" manifest-diff.txt; then
            CUSTOM_DIFF="No changes to generated manifests."
          elif [ -s manifest-diff.txt ]; then
            CUSTOM_DIFF="$(cat manifest-diff.txt)"
          else
            CUSTOM_DIFF="No changes to generated manifests."
          fi

          # 2. Git diff for static deployment configs
          cd pr-branch
          git diff ../main-branch HEAD -- \
            'bootstrap/' 'apps/' 'argocd-deployment/' 'parent-apps/' \
            '.github/workflows/' \
            > ../git-diff.txt 2>/dev/null || true
          cd ..

          # Build combined diff output
          {
            echo '# Generated Manifests'
            echo "$CUSTOM_DIFF"
            echo ''
            echo '# Static Config Changes'
            if [ -s git-diff.txt ]; then
              cat git-diff.txt
            else
              echo "No changes to static configs."
            fi
          } > diff.txt

          # Check if there's real content
          if echo "$CUSTOM_DIFF" | grep -qv "No changes" || [ -s git-diff.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        if: steps.diff.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const diff = fs.readFileSync('diff.txt', 'utf8');

              const maxLen = 60000;
              let displayDiff = diff;
              if (diff.length > maxLen) {
                displayDiff = diff.substring(0, maxLen) + "\n... (Diff truncated)";
              }

              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '### Manifest Changes Detected\n\n<details>\n<summary>Click to expand diff</summary>\n\n```diff\n' + displayDiff + '\n```\n</details>'
              });
            } catch (error) {
              console.error("Error reading diff file or posting comment:", error);
            }
