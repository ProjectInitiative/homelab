name: Manifest Diff

on:
  pull_request:
    paths:
      - 'generator/**'
      - 'apps.yaml'
      - 'clusters/**'
      - 'argocd-deployment/**'
      - 'parent-apps/**'
      - 'bootstrap/**'
      - 'apps/**'
      - '.github/workflows/**'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr-branch

      - name: Generate Main Manifests
        working-directory: main-branch
        run: |
          nix run ../pr-branch#generate-manifests
          mkdir -p ../manifests-main
          cp -r .direnv/manifests/* ../manifests-main/

      - name: Generate PR Manifests
        working-directory: pr-branch
        run: |
          nix run .#generate-manifests
          mkdir -p ../manifests-pr
          cp -r .direnv/manifests/* ../manifests-pr/

      - name: Compare Manifests
        id: diff
        shell: bash
        run: |
          echo "Generating Diff..."

          # Pre-build dyff to suppress build log from output
          nix build nixpkgs#dyff --no-link 2>/dev/null

          nix run nixpkgs#dyff -- between -b --ignore-order-changes \
            manifests-main/ manifests-pr/ > diff.txt 2>/dev/null

          if grep -q "returned no differences" diff.txt; then
            echo "No changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ -s diff.txt ]; then
            # Strip blank/whitespace-only lines then check if anything remains
            if sed '/^[[:space:]]*$/d' diff.txt | grep -q .; then
              echo "Changes detected!"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes detected."
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        if: steps.diff.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const diff = fs.readFileSync('diff.txt', 'utf8');

              const maxLen = 60000;
              let displayDiff = diff;
              if (diff.length > maxLen) {
                displayDiff = diff.substring(0, maxLen) + "\n... (Diff truncated)";
              }

              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                 body: '### Manifest Changes Detected\n\n<details>\n<summary>Click to expand diff</summary>\n\n```\n' + displayDiff + '\n```\n</details>'
              });
            } catch (error) {
              console.error("Error reading diff file or posting comment:", error);
            }
