name: Manifest Diff

on:
  pull_request:
    paths:
      - 'generator/**'
      - 'apps.yaml'
      - 'clusters/**'
      - 'argocd-deployment/**'
      - 'parent-apps/**'
      - 'bootstrap/**'
      - 'apps/**'
      - '.github/workflows/**'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr-branch

      - name: Generate Main Manifests
        working-directory: main-branch
        run: |
          nix run ../pr-branch#generate-manifests
          mkdir -p ../manifests-main
          cp -r .direnv/manifests/* ../manifests-main/

      - name: Generate PR Manifests
        working-directory: pr-branch
        run: |
          nix run .#generate-manifests
          mkdir -p ../manifests-pr
          cp -r .direnv/manifests/* ../manifests-pr/

      - name: Generate Diff
        id: diff
        shell: bash
        run: |
          {
            echo '# Generated Manifests'
            echo '```diff'
            diff -ruN manifests-main/ manifests-pr/ 2>/dev/null || true
            echo '```'
            echo ''
            echo '# Static Config Changes'
            echo '```diff'
            MAIN_SHA=$(git -C main-branch rev-parse HEAD)
            git -C pr-branch diff "$MAIN_SHA" HEAD -- \
              'bootstrap/' 'apps/' 'argocd-deployment/' 'parent-apps/' \
              '.github/workflows/' 2>/dev/null || true
            echo '```'
          } > diff.txt

          # Check for real content (non-empty diff blocks)
          HAS_MANIFEST=false
          HAS_STATIC=false

          # Check if manifest diff has actual changes (not just headers)
          if diff -ruN manifests-main/ manifests-pr/ 2>/dev/null | grep -q '^[+-]'; then
            HAS_MANIFEST=true
          fi

          # Check if git diff has actual changes
          MAIN_SHA=$(git -C main-branch rev-parse HEAD)
          if git -C pr-branch diff "$MAIN_SHA" HEAD -- \
            'bootstrap/' 'apps/' 'argocd-deployment/' 'parent-apps/' \
            '.github/workflows/' 2>/dev/null | grep -q '^[+-]'; then
            HAS_STATIC=true
          fi

          if $HAS_MANIFEST || $HAS_STATIC; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        if: steps.diff.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const diff = fs.readFileSync('diff.txt', 'utf8');

              const maxLen = 60000;
              let displayDiff = diff;
              if (diff.length > maxLen) {
                displayDiff = diff.substring(0, maxLen) + "\n... (Diff truncated)";
              }

              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '### Manifest Changes Detected\n\n<details>\n<summary>Click to expand diff</summary>\n\n' + displayDiff + '\n</details>'
              });
            } catch (error) {
              console.error("Error reading diff file or posting comment:", error);
            }
