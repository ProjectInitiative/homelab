name: Build and Push Flare Ignition Preparation Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/build-push-flare-ignition-prep.yaml'
      - 'llm-test/flare-glm53/preparer/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./llm-test/flare-glm53/preparer
          file: ./llm-test/flare-glm53/preparer/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/projectinitiative/flare-ignition-prep:5f37bd1
            ghcr.io/projectinitiative/flare-ignition-prep:sha-${{ github.sha }}
          build-args: |
            FLARE_REV=5f37bd14062334f7687d168d58ea00567b9aa7fe
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
