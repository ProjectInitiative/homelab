name: Build and Push Flare Runtime Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/build-push-flare-runtime.yaml'
      - 'llm-test/flare-glm53/runtime/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout pinned upstream revision
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/flare-local-inference
          ref: 5f37bd14062334f7687d168d58ea00567b9aa7fe
          path: upstream

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/projectinitiative/flare-runtime:5f37bd1
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
