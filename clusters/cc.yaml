# clusters/cc.yaml
name: cc
server: https://kubernetes.default.svc
project: cc-bootstrap
argoNamespace: argocd-cc
vaultMount: kubernetes_cluster_cc
apps:
  - name: local-path-provisioner
    namespace: local-path-storage
    patch: ""
    patchTarget: {}
  - name: admin-access
    namespace: kube-system
  - name: coredns-custom
    namespace: kube-system
  - name: tailscale-operator
    namespace: tailscale
    # Keep cluster-specific operator settings in Helm values; patching the chart
    # source adds Kustomize to a Helm source and breaks Argo manifest generation.
    helm_values: |
      operatorConfig:
        hostname: cc-tailscale-operator
  - name: cert-manager
    namespace: cert-manager
  - name: openbao-auth-config
    namespace: kube-system
    patch: |-
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultAuth
      metadata:
        name: operator-auth
      spec:
        mount: kubernetes_cluster_cc
        kubernetes:
          role: openbao-secrets-operator
    patchTarget:
      kind: VaultAuth
      name: operator-auth
  - name: openbao-secrets-operator
    namespace: openbao-secrets-operator
    helm_values: |
      vault:
        address: http://openbao.openbao:8200
        auth:
          method: kubernetes
          path: kubernetes_cluster_cc
          role: openbao-secrets-operator
  - name: tailscale-proxy-groups
    namespace: tailscale
    patch: |-
      - op: replace
        path: /metadata/name
        value: control-cluster-proxy
      - op: replace
        path: /spec/tags/0
        value: tag:k8s
    patchTarget:
      kind: ProxyGroup
      name: placeholder-name
    patches:
      - patch: |-
          - op: replace
            path: /metadata/name
            value: cc-ingress-proxy
        target:
          kind: ProxyGroup
          name: ingress-proxy
  - name: dnsutils
    namespace: dnsutils
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: cc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: prometheus-operator-crds
    namespace: monitoring
  - name: grafana-alloy
    namespace: monitoring
    helm_values: |
      alloy:
        extraEnv:
          - name: CLUSTER_NAME
            value: cc
  - name: karmada-operator
    namespace: karmada-system
  - name: karmada-instance
    namespace: karmada-system
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: cc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
    patch: |-
      apiVersion: operator.karmada.io/v1alpha1
      kind: Karmada
      metadata:
        name: karmada
      spec:
        components:
          etcd:
            local:
              replicas: 5
              volumeData:
                volumeClaim:
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    storageClassName: local-path-sticky
                    resources:
                      requests:
                        storage: 5Gi
          karmadaAPIServer:
            replicas: 2
          karmadaAggregatedAPIServer:
            replicas: 2
          karmadaControllerManager:
            replicas: 2
          karmadaScheduler:
            replicas: 2
          karmadaWebhook:
            replicas: 2
          karmadaSearch:
            replicas: 2
    patchTarget:
      kind: Karmada
      name: karmada
  - name: karmada-member
    namespace: kube-system
  - name: submariner-k8s-broker
    namespace: submariner-k8s-broker
  - name: submariner-globalnet
    namespace: submariner-k8s-broker
  - name: submariner-operator
    namespace: submariner-operator
    helm_values: |
      broker:
        server: kubernetes.default.svc:443
        namespace: submariner-k8s-broker
        globalnet: true
        insecure: true
      ipsec:
        pskSecret: submariner-ipsec-psk
        debug: false
      submariner:
        clusterId: "cc"
        clusterCidr: "10.42.0.0/16"
        serviceCidr: "10.43.0.0/16"
        brokerK8sSecret: "submariner-broker-info"
        natEnabled: true
        globalCidr: "242.1.0.0/16"

  - name: mcp-kubernetes
    namespace: mcp-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: mcp-lb-cc
    patchTarget:
      kind: Service
      name: mcp-ts-placeholder
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: cc-ingress-proxy
        target:
          kind: Service
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
      - patch: |-
          - op: replace
            path: /metadata/name
            value: mcp-lb-cc-jobs
        target:
          kind: Service
          name: mcp-ts-jobs-placeholder
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: cc-ingress-proxy
        target:
          kind: Service
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: mcp-vip-watchdog
    namespace: tailscale
  - name: agent-access
    namespace: agent-sandbox

  - name: temp-egress-cc
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: cc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
    namespace: default
