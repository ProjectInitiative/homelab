# clusters/mc.yaml
name: mc
server: https://172.16.1.50:6443
project: mc-bootstrap
argoNamespace: argocd-mc
vaultMount: kubernetes_cluster_mc
apps:
  - name: kube-vip-app
    namespace: kube-system
  - name: admin-access
    namespace: kube-system
  - name: karmada-member
    namespace: kube-system
  - name: local-path-provisioner
    namespace: local-path-storage
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
      data:
        config.json: |
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": [
                  "/mnt/local-provisioner",
                  "/mnt/local-provisioner/nvme-cache",
                  "/mnt/local-provisioner/host",
                  "/mnt/local-provisioner/hdd"
                ]
              }
            ]
          }
    patchTarget:
      kind: ConfigMap
      name: local-path-config
  - name: policies
    namespace: kube-system # VAPs are cluster-wide, but resource lives in a namespace

  - name: coredns-custom
    namespace: kube-system
  - name: tpm-device-plugin
    namespace: kube-system
  - name: nvidia-device-plugin
    namespace: kube-system
  - name: rdma-shared-device-plugin
    namespace: kube-system
  - name: amd-device-plugin
    namespace: kube-system
  - name: kubevirt
    namespace: kubevirt
  - name: kubevirt-manager-auth
    namespace: kubevirt-manager
  - name: tailscale-operator
    namespace: tailscale
    # OPERATOR_HOSTNAME moved to helm values (apps.yaml): a kustomize patch on
    # a chart source makes the CMP fail ("Kustomize,Helm").
  - name: openbao
    namespace: openbao
  - name: openbao-auth-config
    namespace: kube-system
    patch: |-
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultAuth
      metadata:
        name: operator-auth
      spec:
        mount: kubernetes_cluster_mc
        kubernetes:
          role: openbao-secrets-operator
    patchTarget:
      kind: VaultAuth
      name: operator-auth
    patches:
      - patch: |-
          apiVersion: secrets.hashicorp.com/v1beta1
          kind: VaultConnection
          metadata:
            name: default
          spec:
            address: http://openbao.openbao.svc.cluster.local:8200
        target:
          kind: VaultConnection
          name: default
  - name: openbao-secrets-operator
    namespace: openbao-secrets-operator
    helm_values: |
      vault:
        address: http://openbao.openbao:8200
        auth:
          method: kubernetes
          path: kubernetes_cluster_mc
          role: openbao-secrets-operator
  - name: cnpg-operator
    namespace: cnpg-system
  - name: barman-cloud-plugin
    namespace: cnpg-system
  - name: juicefs-csi-driver
    namespace: kube-system
    helm_values: |
      snapshot:
        enabled: true
      # Keep this chart setting here too: cluster helm_values replace the
      # catalog values, and the CSIDriver must not be emitted as a Helm hook.
      csidriver:
        disableHooks: true
      node:
        tolerations:
          - {key: CriticalAddonsOnly, operator: Exists}
          - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
      globalConfig:
        enabled: true
        manageByHelm: true
        enableNodeSelector: true
        mountPodPatch:
          - nodeSelector:
              kubernetes.io/hostname: astrolabe
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=1500000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: chronometer
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=550000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: sextant
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=550000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          # Capstan cache directories must exist before mount Pods use them;
          # the runbook documents the host partition and rollout sequence.
          # These node defaults apply to juicefs-sc PVCs; Argo's later PVC-
          # scoped patches override their cache path for those two volumes.
          - nodeSelector:
              kubernetes.io/hostname: capstan1
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: capstan2
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: capstan3
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          # Argo VM disks use a bounded cache in a dedicated subdirectory,
          # overriding the capstan node default for these two PVCs. Mount Pods
          # must be recreated for option changes to take effect. Root disk is
          # only 30.2G, so 60G cache is ample (also evicts stale pre-split
          # data blocks in the shared old dir); data gets 250G for the nix
          # store with ~360-440G free on the dedicated 499G cache partition.
          - pvcSelector:
              matchName: argo-root
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache/argo
              - cache-size=61440
              - max-readahead=256M
              - prefetch=8
              - buffer-size=1G
          - pvcSelector:
              matchName: argo-data
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache/argo
              - cache-size=256000
              - max-readahead=256M
              - prefetch=8
              - buffer-size=1G
          # Argo root gets its own ring, separate from dgx-model-cache and
          # argo-data. Capstans are amd64; guarded a9f6b9c2 build with
          # group-advertise=auto (fork commit 9cdc4100: per-node fixed
          # advertisements are NOT selectable via mountPodPatch on CSI
          # v0.33.0 — all matching argo-root patches merged and the last
          # one won, advertising capstan3's IP from every node). auto
          # derives the default-route/bond IPv4 per node. Verify three
          # distinct advertised endpoints before warming disk.img.
          # Keep /mnt/jfs-cache/argo: existing root/data caches preserved.
          - pvcSelector:
              matchName: argo-root
              matchStorageClassName: juicefs-sc
            ceMountImage: 172.16.1.50:31872/homelab/juicefs-gcache-csi:fe43899a-amd64@sha256:229954ee01903b5b99ef3b90a2a341ead54faf25071bdaec6c2c7ee668f66c66
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            mountOptions:
              - cache-dir=/mnt/jfs-cache/argo
              - cache-size=61440
              - max-readahead=256M
              - prefetch=8
              - buffer-size=1G
              - cache-group=capstan-argo-root
              - group-listen=:13911
              - group-advertise=auto
              - group-heartbeat=5s
              - peer-range-read
              - remote-timeout=60s
          # Argo data is a separate volume-scoped ring on the same capstans.
          # Keep its disk cache directory separate from argo-root: concurrent
          # mounts must not manage the same local cache tree. Stage with zero
          # data keepers until peer-only TCP/13912 and the directory are live
          # on all three hosts; do not warm the ~900GB data disk.
          - pvcSelector:
              matchName: argo-data
              matchStorageClassName: juicefs-sc
            ceMountImage: 172.16.1.50:31872/homelab/juicefs-gcache-csi:fe43899a-amd64@sha256:229954ee01903b5b99ef3b90a2a341ead54faf25071bdaec6c2c7ee668f66c66
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            mountOptions:
              - cache-dir=/mnt/jfs-cache/argo-data
              - cache-size=256000
              - max-readahead=256M
              - prefetch=8
              - buffer-size=1G
              - cache-group=capstan-argo-data
              - group-listen=:13912
              - group-advertise=auto
              - group-heartbeat=5s
              - peer-range-read
              - remote-timeout=60s
          # Keep the model-cache target PVC last: CSI v0.33.0 merges matching
          # patches in order and replaces mountOptions with the last list.
          # This PVC-scoped ring patch applies on EVERY node that mounts the
          # claim. The ring group is intended to be DGX-only: consumers must
          # be DGX-pinned, since an unpinned CPU consumer would join the same
          # peer group on Capstan. Cache-dir may share /mnt/jfs-cache with
          # ordinary mounts; JuiceFS keeps cache blocks under each FS UUID.
          # model-cache-ephemeral uses its own filesystem and cache group.
          - pvcSelector:
              matchName: model-cache
              matchStorageClassName: juicefs-sc
            ceMountImage: local-registry.registry.svc.cluster.local:5000/homelab/juicefs-gcache-csi:6aaf22da@sha256:6be0d28b164dd51fec49b9a36877dbc34e604fdfecc86d8c03a34c5a5abdeb19
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            # 2026-11-11 05:07Z: chronometer's juicefs/mount.juicefs was
            # memcg OOM-killed; mount pods had no headroom during model-cache
            # read storms.
            # Memory only (operator 2026-11-11): the nodes are not CPU bound
            # and the FUSE daemon is not a CPU risk — no CPU request/limit.
            # The 05:07Z kill class was a memcg OOM inside the mount pod.
            resources:
              requests: {memory: 2Gi}
              limits: {memory: 6Gi}
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=550000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
              - cache-group=dgx-model-cache
              - group-listen=:13910
              - group-advertise=auto-c7
              - peer-range-read
              - group-heartbeat=5s
              # Raise the peer per-op deadline: the fixed 2s per-chunk write
              # deadline aborted whole-block serves under GPU-load read
              # storms (TLS GPU firehose), stripping cache-ring block
              # payloads mid-stream and turning them into client EIO that
              # crash-looped TensorFold (2026-11-08). 60s keeps parity with
              # the enterprise default while still bounding stuck peers.
              - remote-timeout=60s
          # --- REBUILT cache tier ring (2026-11-19) ---
          # model-cache-ephemeral-v2: the fresh juicefs-mc-cache volume
          # (dedicated juicefs_cache DB, RSA-encrypted format). Its OWN cache
          # group + port: a cache group must never mix two DIFFERENT JuiceFS
          # filesystems, and the old juicefs-mc ring (:13910) stays live
          # during the dual-run scream test (old 1104 lane vs new TF pair).
          # FOUR nodes — astrolabe joins the ring for the first time
          # (max sharding; operator call). Rename dance: this selector
          # targets -v2 until old model-cache is torn down, then the PVC
          # renames back to model-cache-ephemeral and this selector follows.
          # Both ring mounts use the shared local cache root /mnt/jfs-cache.
          # JuiceFS scopes local cache blocks by filesystem UUID; cache-group
          # names independently control distributed peer sharing.
          #
          # SPLIT BY PVC NAME, NOT NODE SELECTOR: CSI v0.33.0 mountPodPatch
          # matching is PVC-scoped in practice — nodeSelector/hostname
          # selectors do NOT filter (known trap: matching patches merge, last
          # mountOptions list wins, first non-empty image wins; the 1104 ring
          # retrospective hit the same behavior). All consumers of these ring
          # PVCs must therefore be DGX-pinned; a nodeSelector in this patch
          # cannot constrain placement. All local cache paths stay under
          # /mnt/jfs-cache, and capstan ring membership is not intended.
          # The arch-split attempt produced hybrid mounts: amd64 options on
          # DGX (ring silently lost) and the arm64 image on capstans (exec
          # format crash).
          #
          # Patch 1 — the model cache volume: DGX ring member, gcache image
          # (multi-arch index digest 6aaf22da, resolves per-node arch
          # naturally), hostNetwork, passphrase env.
          - pvcSelector:
              matchName: model-cache-ephemeral-v2
              matchStorageClassName: juicefs-cache-sc
            ceMountImage: local-registry.registry.svc.cluster.local:5000/homelab/juicefs-gcache-csi:6aaf22da@sha256:6be0d28b164dd51fec49b9a36877dbc34e604fdfecc86d8c03a34c5a5abdeb19
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            resources:
              requests: {memory: 2Gi}
              limits: {memory: 6Gi}
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=550000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
              - cache-group=dgx-model-cache-ephemeral
              - group-listen=:13913
              - group-advertise=auto-c7
              - peer-range-read
              - group-heartbeat=5s
              - remote-timeout=60s
            env:
              - name: JFS_RSA_PASSPHRASE
                valueFrom:
                  secretKeyRef:
                    name: juicefs-creds-cache
                    key: passphrase
          # Patch 2 — mcp-staging: plain mount, NO custom image (CSI default
          # is multi-arch upstream), NO ring membership. Only the passphrase
          # env is required (same encrypted filesystem). Name-scoped so it
          # can never merge with the ring patch above.
          - pvcSelector:
              matchName: mcp-staging
              matchStorageClassName: juicefs-cache-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
            env:
              - name: JFS_RSA_PASSPHRASE
                valueFrom:
                  secretKeyRef:
                    name: juicefs-creds-cache
                    key: passphrase
          # (Rename dance: when model-cache-ephemeral-v2 renames back to
          # model-cache-ephemeral after old-model-cache teardown, patch 1's
          # matchName follows.)
          # Temporary plain mount for Campfire's separately allocated model PVC.
          # The downloader is pinned to capstan1 while Spark GPUs are busy; no
          # peer-cache ring is used during the multi-TB ingest. After download
          # completes and its pod is gone, replace this PVC-scoped patch with
          # the DGX cache-ring options before allowing worker Jobs to mount it.
          - pvcSelector:
              matchName: campfire-kimi-k31-models
              matchStorageClassName: juicefs-cache-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
            env:
              - name: JFS_RSA_PASSPHRASE
                valueFrom:
                  secretKeyRef:
                    name: juicefs-creds-cache
                    key: passphrase
  - name: csi-snapshotter
    namespace: kube-system
  - name: juicefs-platform
    namespace: juicefs-platform
  - name: ingress
    namespace: haproxy
  # MVP network share over JuiceFS. Single user + password until wired to Keycloak.
  # A tailscale LoadBalancer exposes \\<host>\data on the tailnet.
  - name: samba-gateway
    namespace: samba
  - name: postgres-cluster
    namespace: postgres-db
  - name: garage
    namespace: garage
    plugin:
      name: kustomized-git-helm-v1.0
      env:
        - name: VALUES_FILE
          value: garage-values.yaml
        # NOTE on rollout behavior: updateStrategy stays the chart default
        # (RollingUpdate). A previous attempt pinned OnDelete via this patch,
        # but the live STS carries a rollingUpdate:{partition:0} block from
        # its creation — adding /spec/updateStrategy type:OnDelete left that
        # block in place and the API rejected the apply (rollingUpdate only
        # allowed with RollingUpdate). RollingUpdate is fine here anyway:
        # StatefulSet rolls pods one at a time (highest ordinal first) with a
        # readiness gate between, so a chart bump + sync upgrades garage
        # pod-by-pod automatically and safely.
        # The CMP consumes a single ARGOCD_ENV_KUSTOMIZE_PATCH, so this also
        # carries the snapshots VCT patch.
        - name: KUSTOMIZE_PATCH
          value: |
            - op: add
              path: /spec/volumeClaimTemplates/-
              value:
                metadata:
                  name: snapshots
                spec:
                  accessModes: [ "ReadWriteOnce" ]
                  # 2026-11-11: size bump only (operator direction — same
                  # backend): 20Gi -> 300Gi on local-path-hdd-sticky. The
                  # metadata LMDB (104GB/node) outgrew the PVC and metadata
                  # auto-snapshots have been silently failing since July
                  # (RISK-0046); snapshots are a full copy of the LMDB and
                  # need ~3x the current meta size.
                  storageClassName: "local-path-hdd-sticky"
                  resources:
                    requests:
                      storage: "300Gi"
        - name: HELM_VALUES
          value: |
            garage:
              metadataAutoSnapshotInterval: "2 hours"
              metadataSnapshotsDir: "/snapshots"
            persistence:
              meta:
                storageClass: "host-local-path-nvme-sticky"
            extraVolumeMounts:
              - name: snapshots
                mountPath: /snapshots
# 2026-11-12: snapshots VCT patch merged into the KUSTOMIZE_PATCH above
# (the CMP consumes a single KUSTOMIZE_PATCH env); updateStrategy OnDelete
# added for the v2.6.0 manual rollout.
# DISABLED 2026-11-12: compactor image is a PRIVATE ghcr package
# (anonymous pull = 403 DENIED) — garage-2 cannot pull it on a node without a
# content cache. Re-enable only after adding an imagePullSecret (read:packages
# PAT) or making the package public.
#             # 2026-11-12: LMDB compaction init container (RISK-0046). The chart
#             # (pinned ref) has no extraInitContainers value, so it is injected
#             # here instead. Fail-open gates: bloat ratio 2x, snapshot age
#             # 5min..6h, >=2 ready peers each serving tokenless /health 200 —
#             # any doubt -> no swap, garage boots on its existing DB.
#             # DRY_RUN=1 until the first real swap is verified; then flip to
#             # "0". Image built from generator/compactor-image (nix-build),
#             # push: ghcr.io/projectinitiative/garage-lmdb-compactor:latest
#             - op: add
#               path: /spec/template/spec/initContainers/-
#               value:
#                 name: lmdb-compactor
#                 image: ghcr.io/projectinitiative/garage-lmdb-compactor:latest
#                 imagePullPolicy: IfNotPresent
#                 env:
#                   - name: DRY_RUN
#                     value: "1"
#                 volumeMounts:
#                   - name: meta
#                     mountPath: /mnt/meta
#                   - name: snapshots
#                     mountPath: /snapshots
  - name: garage-migrate
    plugin:
      name: kustomized-git-helm-v1.0
      env:
        - name: VALUES_FILE
          value: garage-values.yaml
        - name: HELM_VALUES
          value: |
            persistence:
              meta:
                storageClass: "local-path"
                size: 1Gi
              data:
                storageClass: "local-path"
                size: 5Gi
  - name: sc-local-path
    namespace: default
  - name: tailscale-proxy-groups
    namespace: tailscale
    patch: |-
      - op: replace
        path: /metadata/name
        value: main-cluster-proxy
      - op: replace
        path: /spec/tags/0
        value: tag:k8s
    patchTarget:
      kind: ProxyGroup
      name: placeholder-name
    patches:
      - patch: |-
          - op: replace
            path: /metadata/name
            value: mc-ingress-proxy
        target:
          kind: ProxyGroup
          name: ingress-proxy
  - name: temp-egress-mc
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
    namespace: default
  - name: dnsutils
    namespace: dnsutils
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: docker-registry
    namespace: registry
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  # Zot OCI registry (staged — see apps/base/zot/config/README.md).
  # The tailscale-lb Service follows the same proxy-group rewrite pattern
  # as docker-registry/temp-egress-mc.
  - name: zot
    namespace: zot
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: prometheus-operator-crds
    namespace: monitoring
  - name: grafana-alloy
    namespace: monitoring
    helm_values: |
      controller:
        tolerations:
          - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
      alloy:
        extraEnv:
          - name: CLUSTER_NAME
            value: mc
  - name: nixos-remote-builder
    namespace: nixos-builder
  # Forgejo + nix build runners (see keel/projects/forgejo-ci.md).
  # Tailscale LB placeholder renamed to forgejo-lb-mc; HTTP+SSH on one svc.
  - name: forgejo
    namespace: forgejo
    patches:
      - patch: |-
          - op: replace
            path: /metadata/name
            value: forgejo-lb-mc
        target:
          kind: Service
          name: forgejo-ts-placeholder
  - name: forgejo-runner
    namespace: forgejo
    patches:
      # x86_64 runner on capstan1 (nvme cache + nix store PVCs are local-path,
      # so pin the pod; Retain-class volumes keep state across restarts).
      - patch: |-
          - op: add
            path: /spec/template/spec/nodeSelector
            value:
              kubernetes.io/hostname: capstan1
        target:
          kind: Deployment
          name: forgejo-runner
  - name: forgejo-runner-arm
    namespace: forgejo
    # Unpinned (2026-11-11): schedules on whichever DGX Spark is free; only
    # arm64 nodes. Volumes are disposable local-path-nvme.
  - name: cert-manager-issuers
    namespace: cert-manager
  - name: submariner-operator
    namespace: submariner-operator
    helm_values: |
      broker:
        server: control-cluster-proxy.taildeab2.ts.net
        namespace: submariner-k8s-broker
        globalnet: true
        # Proxy serves a Let's Encrypt cert; broker secret ca.crt is cc's k3s CA.
        # Skip validation (tailnet-encrypted path) — same rationale as the OpenBao cc mount.
        insecure: true
      ipsec:
        pskSecret: submariner-ipsec-psk
        debug: false
      submariner:
        clusterId: "mc"
        clusterCidr: "10.42.0.0/16"
        serviceCidr: "10.43.0.0/16"
        brokerK8sSecret: "submariner-broker-info"
        natEnabled: true
        globalCidr: "242.0.0.0/16"

  - name: argo
    namespace: argo
  # argo-lite dev container (argo VM replacement). Tailscale LB placeholder
  # renamed to argo-lite-lb-mc; ssh only.
  - name: argo-lite
    namespace: argo-lite
    patches:
      - patch: |-
          - op: replace
            path: /metadata/name
            value: argo-lite-lb-mc
        target:
          kind: Service
          name: argo-lite-ts-placeholder
  - name: mcp-kubernetes
    namespace: mcp-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: mcp-lb-mc
    patchTarget:
      kind: Service
      name: mcp-ts-placeholder
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          kind: Service
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
      # TEMPORARY: keep MC MCP reachable from the astrolabe dev node while
      # MCP access is migrated to the Argo VM. Restore policy selection after migration.
      - patch: |-
          - op: add
            path: /spec/podSelector/matchLabels/mcp-policy-test
            value: no-pods-match
        target:
          kind: NetworkPolicy
          name: mcp-allow-tailscale-only
  - name: ts-vip-watchdog
    namespace: tailscale
  - name: agent-access
    namespace: agent-sandbox

  # AI control plane adoption. Both Applications initially require an explicit
  # Argo sync; ai-proxy adopts live objects with prune off, while Conductor is
  # Observe-only and does not own the shared llm-test Namespace.
  - name: ai-proxy
    namespace: llm-test
  - name: memguard-dgx
    namespace: llm-test
  - name: conductor
    namespace: llm-test
  - name: conductor-workloads
    namespace: llm-test

  # Messaging/function substrate for the systemone distillation pipeline
  # (OQ-0056). Pin NATS and the Fission controller plane to the capstan
  # pool — the Sparks are reserved for LLM serving (dgx-spark-workload-policy).
  - name: nats
    namespace: nats
    # NOTE: cluster helm_values REPLACE the catalog values (generator
    # behavior), so this carries the full merged set: catalog base +
    # capstan-pool affinity.
    helm_values: |
      config:
        cluster:
          enabled: false
        jetstream:
          enabled: true
          fileStore:
            enabled: true
            pvc:
              enabled: true
              size: 20Gi
              storageClassName: local-path
      nats:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [capstan1, capstan2, capstan3]
  - name: fission
    namespace: fission
  - name: campfire-kimi-k31
    namespace: llm-test

  # Hermes is intentionally disabled until its PostgreSQL/JuiceFS storage
  # design is finalized. Catalog/manifests remain available for later.
