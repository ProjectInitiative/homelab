# clusters/mc.yaml
name: mc
server: https://172.16.1.50:6443
project: mc-bootstrap
argoNamespace: argocd-mc
vaultMount: kubernetes_cluster_mc
apps:
  - name: kube-vip-app
    namespace: kube-system
  - name: admin-access
    namespace: kube-system
  - name: karmada-member
    namespace: kube-system
  - name: local-path-provisioner
    namespace: local-path-storage
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
      data:
        config.json: |
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": [
                  "/mnt/local-provisioner",
                  "/mnt/local-provisioner/nvme-cache",
                  "/mnt/local-provisioner/host",
                  "/mnt/local-provisioner/hdd"
                ]
              }
            ]
          }
    patchTarget:
      kind: ConfigMap
      name: local-path-config
  - name: policies
    namespace: kube-system # VAPs are cluster-wide, but resource lives in a namespace

  - name: coredns-custom
    namespace: kube-system
  - name: tpm-device-plugin
    namespace: kube-system
  - name: nvidia-device-plugin
    namespace: kube-system
  - name: amd-device-plugin
    namespace: kube-system
  - name: kubevirt
    namespace: kubevirt
  - name: tailscale-operator
    namespace: tailscale
    patches:
      - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: operator
          spec:
            template:
              spec:
                containers:
                  - name: operator
                    env:
                      - name: OPERATOR_HOSTNAME
                        value: mc-tailscale-operator
        target:
          kind: Deployment
          name: operator
  - name: openbao
    namespace: openbao
  - name: openbao-auth-config
    namespace: kube-system
    patch: |-
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultAuth
      metadata:
        name: operator-auth
      spec:
        mount: kubernetes_cluster_mc
        kubernetes:
          role: openbao-secrets-operator
    patchTarget:
      kind: VaultAuth
      name: operator-auth
    patches:
      - patch: |-
          apiVersion: secrets.hashicorp.com/v1beta1
          kind: VaultConnection
          metadata:
            name: default
          spec:
            address: http://openbao.openbao.svc.cluster.local:8200
        target:
          kind: VaultConnection
          name: default
  - name: openbao-secrets-operator
    namespace: openbao-secrets-operator
    helm_values: |
      vault:
        address: http://openbao.openbao:8200
        auth:
          method: kubernetes
          path: kubernetes_cluster_mc
          role: openbao-secrets-operator
  - name: cnpg-operator
    namespace: cnpg-system
  - name: barman-cloud-plugin
    namespace: cnpg-system
  - name: juicefs-csi-driver
    namespace: kube-system
    helm_values: |
      snapshot:
        enabled: true
      globalConfig:
        enabled: true
        manageByHelm: true
        enableNodeSelector: true
        mountPodPatch:
          - nodeSelector:
              kubernetes.io/hostname: astrolabe
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/pool/juicefs
              - cache-size=1500000
          - nodeSelector:
              kubernetes.io/hostname: chronometer
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/pool/juicefs
              - cache-size=550000
          - nodeSelector:
              kubernetes.io/hostname: sextant
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/pool/juicefs
              - cache-size=550000
  - name: csi-snapshotter
    namespace: kube-system
  - name: juicefs-platform
    namespace: juicefs-platform
  - name: postgres-cluster
    namespace: postgres-db
  - name: garage
    namespace: garage
    plugin:
      name: kustomized-git-helm-v1.0
      env:
        - name: VALUES_FILE
          value: garage-values.yaml
        - name: HELM_VALUES
          value: |
            garage:
              metadataAutoSnapshotInterval: "2 hours"
              metadataSnapshotsDir: "/snapshots"
            persistence:
              meta:
                storageClass: "host-local-path-nvme-sticky"
            extraVolumeMounts:
              - name: snapshots
                mountPath: /snapshots
        - name: KUSTOMIZE_PATCH
          value: |
            - op: add
              path: /spec/volumeClaimTemplates/-
              value:
                metadata:
                  name: snapshots
                spec:
                  accessModes: [ "ReadWriteOnce" ]
                  storageClassName: "local-path-hdd-sticky"
                  resources:
                    requests:
                      storage: "20Gi"
  - name: garage-migrate
    namespace: garage-migrate
    plugin:
      name: kustomized-git-helm-v1.0
      env:
        - name: VALUES_FILE
          value: garage-values.yaml
        - name: HELM_VALUES
          value: |
            persistence:
              meta:
                storageClass: "local-path"
                size: 1Gi
              data:
                storageClass: "local-path"
                size: 5Gi
  - name: sc-local-path
    namespace: default
  - name: tailscale-proxy-groups
    namespace: tailscale
    patch: |-
      - op: replace
        path: /metadata/name
        value: main-cluster-proxy
      - op: replace
        path: /spec/tags/0
        value: tag:k8s
    patchTarget:
      kind: ProxyGroup
      name: placeholder-name
    patches:
      - patch: |-
          - op: replace
            path: /metadata/name
            value: mc-ingress-proxy
        target:
          kind: ProxyGroup
          name: ingress-proxy
  - name: temp-egress-mc
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
    namespace: default
  - name: dnsutils
    namespace: dnsutils
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: docker-registry
    namespace: registry
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: prometheus-operator-crds
    namespace: monitoring
  - name: grafana-alloy
    namespace: monitoring
    helm_values: |
      alloy:
        extraEnv:
          - name: CLUSTER_NAME
            value: mc
  - name: nixos-remote-builder
    namespace: nixos-builder
  - name: submariner-operator
    namespace: submariner-operator
    helm_values: |
      ipsec:
        pskSecret: submariner-ipsec-psk
      submariner:
        clusterId: "mc"
        clusterCidr: "10.42.0.0/16"
        serviceCidr: "10.43.0.0/16"
        brokerK8sSecret: "submariner-broker-info"
        brokerK8sApiServer: "https://100.95.205.21:443"

  - name: argo
    namespace: argo
  - name: mcp-kubernetes
    namespace: mcp-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: mcp-lb-mc
    patchTarget:
      kind: Service
      name: mcp-ts-placeholder
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          kind: Service
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
