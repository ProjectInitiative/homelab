# clusters/mc.yaml
name: mc
server: https://172.16.1.50:6443
project: mc-bootstrap
argoNamespace: argocd-mc
vaultMount: kubernetes_cluster_mc
apps:
  - name: kube-vip-app
    namespace: kube-system
  - name: admin-access
    namespace: kube-system
  - name: karmada-member
    namespace: kube-system
  - name: local-path-provisioner
    namespace: local-path-storage
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
      data:
        config.json: |
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": [
                  "/mnt/local-provisioner",
                  "/mnt/local-provisioner/nvme-cache",
                  "/mnt/local-provisioner/host",
                  "/mnt/local-provisioner/hdd"
                ]
              }
            ]
          }
    patchTarget:
      kind: ConfigMap
      name: local-path-config
  - name: policies
    namespace: kube-system # VAPs are cluster-wide, but resource lives in a namespace

  - name: coredns-custom
    namespace: kube-system
  - name: tpm-device-plugin
    namespace: kube-system
  - name: nvidia-device-plugin
    namespace: kube-system
  - name: rdma-shared-device-plugin
    namespace: kube-system
  - name: amd-device-plugin
    namespace: kube-system
  - name: kubevirt
    namespace: kubevirt
  - name: kubevirt-manager-auth
    namespace: kubevirt-manager
  - name: tailscale-operator
    namespace: tailscale
    # OPERATOR_HOSTNAME moved to helm values (apps.yaml): a kustomize patch on
    # a chart source makes the CMP fail ("Kustomize,Helm").
  - name: openbao
    namespace: openbao
  - name: openbao-auth-config
    namespace: kube-system
    patch: |-
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultAuth
      metadata:
        name: operator-auth
      spec:
        mount: kubernetes_cluster_mc
        kubernetes:
          role: openbao-secrets-operator
    patchTarget:
      kind: VaultAuth
      name: operator-auth
    patches:
      - patch: |-
          apiVersion: secrets.hashicorp.com/v1beta1
          kind: VaultConnection
          metadata:
            name: default
          spec:
            address: http://openbao.openbao.svc.cluster.local:8200
        target:
          kind: VaultConnection
          name: default
  - name: openbao-secrets-operator
    namespace: openbao-secrets-operator
    helm_values: |
      vault:
        address: http://openbao.openbao:8200
        auth:
          method: kubernetes
          path: kubernetes_cluster_mc
          role: openbao-secrets-operator
  - name: cnpg-operator
    namespace: cnpg-system
  - name: barman-cloud-plugin
    namespace: cnpg-system
  - name: juicefs-csi-driver
    namespace: kube-system
    helm_values: |
      snapshot:
        enabled: true
      # Keep this chart setting here too: cluster helm_values replace the
      # catalog values, and the CSIDriver must not be emitted as a Helm hook.
      csidriver:
        disableHooks: true
      node:
        tolerations:
          - {key: CriticalAddonsOnly, operator: Exists}
          - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
      globalConfig:
        enabled: true
        manageByHelm: true
        enableNodeSelector: true
        mountPodPatch:
          - nodeSelector:
              kubernetes.io/hostname: astrolabe
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/pool/juicefs
              - cache-size=1500000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: chronometer
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/pool/juicefs
              - cache-size=550000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: sextant
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/pool/juicefs
              - cache-size=550000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          # Capstan cache directories must exist before mount Pods use them;
          # the runbook documents the host partition and rollout sequence.
          # These node defaults apply to juicefs-sc PVCs; Argo's later PVC-
          # scoped patches override their cache path for those two volumes.
          - nodeSelector:
              kubernetes.io/hostname: capstan1
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: capstan2
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          - nodeSelector:
              kubernetes.io/hostname: capstan3
            pvcSelector:
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache
              - cache-size=102400
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
          # Argo VM disks use a bounded cache in a dedicated subdirectory,
          # overriding the capstan node default for these two PVCs. Mount Pods
          # must be recreated for option changes to take effect.
          - pvcSelector:
              matchName: argo-root
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache/argo
              - cache-size=102400
              - prefetch=8
              - buffer-size=1G
          - pvcSelector:
              matchName: argo-data
              matchStorageClassName: juicefs-sc
            mountOptions:
              - cache-dir=/mnt/jfs-cache/argo
              - cache-size=102400
              - prefetch=8
              - buffer-size=1G
          # Keep the target PVC last: CSI v0.33.0 merges matching patches in
          # order and replaces the entire mountOptions list with the last one.
          # This overrides node-local defaults on any node for model-cache only;
          # model-cache-ephemeral uses a separate StorageClass and backing store.
          - pvcSelector:
              matchName: model-cache
              matchStorageClassName: juicefs-sc
            ceMountImage: local-registry.registry.svc.cluster.local:5000/homelab/juicefs-gcache-csi:6aaf22da-arm64@sha256:50848ee986438b756a842ce7f2250a42f1954159ff9d153181a646bd283bb5bf
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            # 2026-11-11 05:07Z: chronometer's juicefs/mount.juicefs was
            # memcg OOM-killed; mount pods had no headroom during model-cache
            # read storms.
            # Memory only (operator 2026-11-11): the nodes are not CPU bound
            # and the FUSE daemon is not a CPU risk — no CPU request/limit.
            # The 05:07Z kill class was a memcg OOM inside the mount pod.
            resources:
              requests: {memory: 2Gi}
              limits: {memory: 6Gi}
            mountOptions:
              - cache-dir=/mnt/pool/juicefs-ring
              - cache-size=550000
              - prefetch=8
              - max-readahead=256M
              - buffer-size=1G
              - max-downloads=200
              - cache-eviction=lru
              - cache-group=dgx-model-cache
              - group-listen=:13910
              - group-advertise=auto-c7
              - peer-range-read
              - group-heartbeat=5s
              # Raise the peer per-op deadline: the fixed 2s per-chunk write
              # deadline aborted whole-block serves under GPU-load read
              # storms (TLS GPU firehose), stripping cache-ring block
              # payloads mid-stream and turning them into client EIO that
              # crash-looped TensorFold (2026-11-08). 60s keeps parity with
              # the enterprise default while still bounding stuck peers.
              - remote-timeout=60s
  - name: csi-snapshotter
    namespace: kube-system
  - name: juicefs-platform
    namespace: juicefs-platform
  - name: ingress
    namespace: haproxy
  # MVP network share over JuiceFS. Single user + password until wired to Keycloak.
  # A tailscale LoadBalancer exposes \\<host>\data on the tailnet.
  - name: samba-gateway
    namespace: samba
  - name: postgres-cluster
    namespace: postgres-db
  - name: garage
    namespace: garage
    plugin:
      name: kustomized-git-helm-v1.0
      env:
        - name: VALUES_FILE
          value: garage-values.yaml
        - name: HELM_VALUES
          value: |
            garage:
              metadataAutoSnapshotInterval: "2 hours"
              metadataSnapshotsDir: "/snapshots"
            persistence:
              meta:
                storageClass: "host-local-path-nvme-sticky"
            extraVolumeMounts:
              - name: snapshots
                mountPath: /snapshots
        - name: KUSTOMIZE_PATCH
          value: |
            - op: add
              path: /spec/volumeClaimTemplates/-
              value:
                metadata:
                  name: snapshots
                spec:
                  accessModes: [ "ReadWriteOnce" ]
                  # 2026-11-11: size bump only (operator direction — same
                  # backend): 20Gi -> 300Gi on local-path-hdd-sticky. The
                  # metadata LMDB (104GB/node) outgrew the PVC and metadata
                  # auto-snapshots have been silently failing since July
                  # (RISK-0046); snapshots are a full copy of the LMDB and
                  # need ~3x the current meta size.
                  storageClassName: "local-path-hdd-sticky"
                  resources:
                    requests:
                      storage: "300Gi"
  - name: garage-migrate
    namespace: garage-migrate
    plugin:
      name: kustomized-git-helm-v1.0
      env:
        - name: VALUES_FILE
          value: garage-values.yaml
        - name: HELM_VALUES
          value: |
            persistence:
              meta:
                storageClass: "local-path"
                size: 1Gi
              data:
                storageClass: "local-path"
                size: 5Gi
  - name: sc-local-path
    namespace: default
  - name: tailscale-proxy-groups
    namespace: tailscale
    patch: |-
      - op: replace
        path: /metadata/name
        value: main-cluster-proxy
      - op: replace
        path: /spec/tags/0
        value: tag:k8s
    patchTarget:
      kind: ProxyGroup
      name: placeholder-name
    patches:
      - patch: |-
          - op: replace
            path: /metadata/name
            value: mc-ingress-proxy
        target:
          kind: ProxyGroup
          name: ingress-proxy
  - name: temp-egress-mc
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
    namespace: default
  - name: dnsutils
    namespace: dnsutils
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: docker-registry
    namespace: registry
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
  - name: prometheus-operator-crds
    namespace: monitoring
  - name: grafana-alloy
    namespace: monitoring
    helm_values: |
      controller:
        tolerations:
          - {key: dgx-spark-dedicated, operator: Equal, value: "true", effect: NoSchedule}
      alloy:
        extraEnv:
          - name: CLUSTER_NAME
            value: mc
  - name: nixos-remote-builder
    namespace: nixos-builder
  # Forgejo + nix build runners (see keel/projects/forgejo-ci.md).
  # Tailscale LB placeholder renamed to forgejo-lb-mc; HTTP+SSH on one svc.
  - name: forgejo
    namespace: forgejo
    patches:
      - patch: |-
          - op: replace
            path: /metadata/name
            value: forgejo-lb-mc
        target:
          kind: Service
          name: forgejo-ts-placeholder
  - name: forgejo-runner
    namespace: forgejo
    patches:
      # x86_64 runner on capstan1 (nvme cache + nix store PVCs are local-path,
      # so pin the pod; Retain-class volumes keep state across restarts).
      - patch: |-
          - op: add
            path: /spec/template/spec/nodeSelector
            value:
              kubernetes.io/hostname: capstan1
        target:
          kind: Deployment
          name: forgejo-runner
  - name: forgejo-runner-arm
    namespace: forgejo
    # Unpinned (2026-11-11): schedules on whichever DGX Spark is free; only
    # arm64 nodes. Volumes are disposable local-path-nvme.
  - name: cert-manager-issuers
    namespace: cert-manager
  - name: submariner-operator
    namespace: submariner-operator
    helm_values: |
      broker:
        server: control-cluster-proxy.taildeab2.ts.net
        namespace: submariner-k8s-broker
        globalnet: true
        # Proxy serves a Let's Encrypt cert; broker secret ca.crt is cc's k3s CA.
        # Skip validation (tailnet-encrypted path) — same rationale as the OpenBao cc mount.
        insecure: true
      ipsec:
        pskSecret: submariner-ipsec-psk
        debug: false
      submariner:
        clusterId: "mc"
        clusterCidr: "10.42.0.0/16"
        serviceCidr: "10.43.0.0/16"
        brokerK8sSecret: "submariner-broker-info"
        natEnabled: true
        globalCidr: "242.0.0.0/16"

  - name: argo
    namespace: argo
  - name: mcp-kubernetes
    namespace: mcp-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: mcp-lb-mc
    patchTarget:
      kind: Service
      name: mcp-ts-placeholder
    patches:
      - patch: |-
          - op: replace
            path: /metadata/annotations/tailscale.com~1proxy-group
            value: mc-ingress-proxy
        target:
          kind: Service
          annotationSelector: tailscale.com/proxy-group=ingress-proxy
      # TEMPORARY: keep MC MCP reachable from the astrolabe dev node while
      # MCP access is migrated to the Argo VM. Restore policy selection after migration.
      - patch: |-
          - op: add
            path: /spec/podSelector/matchLabels/mcp-policy-test
            value: no-pods-match
        target:
          kind: NetworkPolicy
          name: mcp-allow-tailscale-only
  - name: ts-vip-watchdog
    namespace: tailscale
  - name: agent-access
    namespace: agent-sandbox

  # AI control plane adoption. Both Applications initially require an explicit
  # Argo sync; ai-proxy adopts live objects with prune off, while Conductor is
  # Observe-only and does not own the shared llm-test Namespace.
  - name: ai-proxy
    namespace: llm-test
  - name: flare-glm53
    namespace: llm-test
  - name: tensorfold-deepseek-v41
    namespace: llm-test
  - name: glm53-flash-spark-1104
    namespace: llm-test
  - name: memguard-dgx
    namespace: llm-test
  - name: conductor
    namespace: llm-test
  - name: conductor-workloads
    namespace: llm-test

  # Hermes is intentionally disabled until its PostgreSQL/JuiceFS storage
  # design is finalized. Catalog/manifests remain available for later.
